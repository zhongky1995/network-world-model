行在你的电脑或手机上，负责接收输入、发送请求、解释页面内容和显示结果。网站服务器是提供服务的计算机及其运行程序，负责接收请求、找出内容、核对资料并回复。\u003c/p>\n\u003cp>它们通过HTTP这样的规则交换需求与结果。浏览器发出的说明叫请求，服务器针对它发回的内容叫响应。响应可以是商品页面，也可以只是一张图片、一份库存数据，或一条拒绝说明。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">网页请求与响应\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>“服务器”不一定只是一台机器。你接触的是统一网址，后面可以由多台设备、多个程序共同提供服务；一个接收入口也可以先把请求交给另一个程序处理。\u003c/p>\n\u003ch2 id=\"section-2\">打开42号商品页，第一份内容是什么\u003c/h2>\n\u003cp>以一个\u003cstrong>虚构商品站\u003c/strong>为例。浏览器联系网站后，请求42号商品页面。网站返回的可以先是一份HTML文档：它说明哪里是商品标题，哪里是价格，哪里需要图片，哪里有按钮。HTML可以先理解为页面的结构与内容说明。\u003c/p>\n\u003cp>文档还可能告诉浏览器：“去这个地址取商品图片，去那个地址取排版规则，再下载负责按钮功能的程序。”浏览器读取这些说明，继续请求所需文件。CSS常用来描述外观和排版，JavaScript常用来处理点击、更新页面和继续取数据。\u003c/p>\n\u003cp>文件可以并行下载，也可以陆续发现、陆续取得。因此，标题先到就先显示，图片晚到才补上，按钮相关程序尚未完成时还可能暂时不能用。网页不是从远处电脑传来的一整张可点击截图。\u003c/p>\n\u003cp>你不需要学写这三种代码。先区分：页面需要显示什么，怎样摆放，以及用户点击后怎样响应。这些由浏览器取得的内容和本地程序共同决定。\u003c/p>\n\u003ch2 id=\"section-3\">点击“查看运费”，页面为什么不用重新打开\u003c/h2>\n\u003cp>假设你选择配送城市，点“查看运费”。页面程序读取城市和商品信息，向运费服务发一个新请求。运费服务按配送规则计算，把结果发回来；页面程序收到以后，把原先“待查询”的位置替换成金额。\u003c/p>\n\u003cp>此时地址栏可以完全不变，因为并没有要求浏览器重新进入一整张新页面。相反，点评价区可以只在本地滚动，不需要发新请求。两个动作都表现为“点了按钮”，但一个需要服务回答，一个只操作已有内容。\u003c/p>\n\u003cp>如果本地展开说明正常，运费一直转圈，说明浏览器仍能执行某些界面动作，却没有取得这项查询所需的结果。不能由“按钮还能点”推断网络与服务都正常，也不能由“一个按钮失败”推断整张页面从未下载成功。\u003c/p>\n\u003ch2 id=\"section-4\">图片、库存与下单，可能由谁提供\u003c/h2>\n\u003cp>这个虚构站可以把页面放在shop.example.com，图片放在img.example.com，把库存查询放在api.example.com。浏览器显示一张页面时，就可能同时联系几个名称。\u003c/p>\n\u003cp>管理员也可以只用一个主机名，再按不同路径分给商品、库存和订单程序。名称怎样划分是部署选择，不是每项功能必须另买一个域名。\u003c/p>\n\u003cp>所以，页面正常而图片失败，可能与图片那次下载有关；图片正常而下单被拒，可能是订单规则给出结果。观察时说清具体缺哪部分，比“网站坏了”更有用。\u003ca href=\"#/domains\">子域名\u003c/a>和\u003ca href=\"#/url-pages\">路径参数\u003c/a>解释这些入口怎样表达。\u003c/p>\n\u003ch2 id=\"section-5\">第二次打开很快，是不是内容没经过网络\u003c/h2>\n\u003cp>浏览器可以把取得的图片、程序等保留副本，规则允许时重复使用。这叫缓存。再次访问时，有的资源可以直接使用本地副本，有的需要先问服务有没有更新，有的必须重新取得。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9111.html\" target=\"_blank\" rel=\"noopener noreferrer\">缓存如何复用与核对响应\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>网站还可以借CDN在不同地点安排接收和分发服务器。某个节点保存着可用副本时，可以就近提供图片等内容；需要实时处理的请求，也可能由它继续交给网站后台。CDN不是把所有业务都变成永远有效的旧文件。\u003c/p>\n\u003cp>因此，第二次变快可能是少下载了一些内容、少建立了一些连接，不必是宽带突然变快。刷新也不保证各层副本全部丢弃，更不能保证购物站的旧价格仍适用于最终订单。\u003c/p>\n\u003ch2 id=\"section-6\">断网以后页面还在，为什么库存又查不到\u003c/h2>\n\u003cp>假设页面已经下载并显示，此时网络中断。屏幕上现有的标题、图片不必立即消失，你还可能滚动、展开本地说明。可“查看最新库存”需要再次向服务器请求，结果就可能取不到。\u003c/p>\n\u003cp>页面可见，只说明已有内容仍能显示。库存、登录和提交需要各自完成相应通信与处理。完整浏览顺序见\u003ca href=\"#/browsing\">从点击到看到页面\u003c/a>，点击提交后怎样区分显示反馈与真实记录，见\u003ca href=\"#/transactions\">操作何时成功\u003c/a>。\u003c/p>\n","text":"打开一个网页，背后是谁在回答？ 商品页先出现标题，过一会儿才出现图片；点“查看运费”，页面又转了一次圈。 浏览器通常分几次取得页面所需的内容，再在你的设备上组合显示。按钮也可以在页面打开后继续向网站请求新结果。 你看到的一张网页，背后可能有许多次通信。 浏览器下载页面结构、图片等内容，再按排版规则显示。它可能向不同服务器下载这些文件。 浏览器和网站服务器，分别在哪里工作 浏览器运行在你的电脑或手机上，负责接收输入、发送请求、解释页面内容和显示结果。网站服务器是提供服务的计算机及其运行程序，负责接收请求、找出内容、核对资料并回复。 它们通过HTTP这样的规则交换需求与结果。浏览器发出的说明叫请求，服务器针对它发回的内容叫响应。响应可以是商品页面，也可以只是一张图片、一份库存数据，或一条拒绝说明。网页请求与响应 “服务器”不一定只是一台机器。你接触的是统一网址，后面可以由多台设备、多个程序共同提供服务；一个接收入口也可以先把请求交给另一个程序处理。 打开42号商品页，第一份内容是什么 以一个 虚构商品站 为例。浏览器联系网站后，请求42号商品页面。网站返回的可以先是一份HTML文档：它说明哪里是商品标题，哪里是价格，哪里需要图片，哪里有按钮。HTML可以先理解为页面的结构与内容说明。 文档还可能告诉浏览器：“去这个地址取商品图片，去那个地址取排版规则，再下载负责按钮功能的程序。”浏览器读取这些说明，继续请求所需文件。CSS常用来描述外观和排版，JavaScript常用来处理点击、更新页面和继续取数据。 文件可以并行下载，也可以陆续发现、陆续取得。因此，标题先到就先显示，图片晚到才补上，按钮相关程序尚未完成时还可能暂时不能用。网页不是从远处电脑传来的一整张可点击截图。 你不需要学写这三种代码。先区分：页面需要显示什么，怎样摆放，以及用户点击后怎样响应。这些由浏览器取得的内容和本地程序共同决定。 点击“查看运费”，页面为什么不用重新打开 假设你选择配送城市，点“查看运费”。页面程序读取城市和商品信息，向运费服务发一个新请求。运费服务按配送规则计算，把结果发回来；页面程序收到以后，把原先“待查询”的位置替换成金额。 此时地址栏可以完全不变，因为并没有要求浏览器重新进入一整张新页面。相反，点评价区可以只在本地滚动，不需要发新请求。两个动作都表现为“点了按钮”，但一个需要服务回答，一个只操作已有内容。 如果本地展开说明正常，运费一直转圈，说明浏览器仍能执行某些界面动作，却没有取得这项查询所需的结果。不能由“按钮还能点”推断网络与服务都正常，也不能由“一个按钮失败”推断整张页面从未下载成功。 图片、库存与下单，可能由谁提供 这个虚构站可以把页面放在shop.example.com，图片放在img.example.com，把库存查询放在api.example.com。浏览器显示一张页面时，就可能同时联系几个名称。 管理员也可以只用一个主机名，再按不同路径分给商品、库存和订单程序。名称怎样划分是部署选择，不是每项功能必须另买一个域名。 所以，页面正常而图片失败，可能与图片那次下载有关；图片正常而下单被拒，可能是订单规则给出结果。观察时说清具体缺哪部分，比“网站坏了”更有用。子域名和路径参数解释这些入口怎样表达。 第二次打开很快，是不是内容没经过网络 浏览器可以把取得的图片、程序等保留副本，规则允许时重复使用。这叫缓存。再次访问时，有的资源可以直接使用本地副本，有的需要先问服务有没有更新，有的必须重新取得。缓存如何复用与核对响应 网站还可以借CDN在不同地点安排接收和分发服务器。某个节点保存着可用副本时，可以就近提供图片等内容；需要实时处理的请求，也可能由它继续交给网站后台。CDN不是把所有业务都变成永远有效的旧文件。 因此，第二次变快可能是少下载了一些内容、少建立了一些连接，不必是宽带突然变快。刷新也不保证各层副本全部丢弃，更不能保证购物站的旧价格仍适用于最终订单。 断网以后页面还在，为什么库存又查不到 假设页面已经下载并显示，此时网络中断。屏幕上现有的标题、图片不必立即消失，你还可能滚动、展开本地说明。可“查看最新库存”需要再次向服务器请求，结果就可能取不到。 页面可见，只说明已有内容仍能显示。库存、登录和提交需要各自完成相应通信与处理。完整浏览顺序见从点击到看到页面，点击提交后怎样区分显示反馈与真实记录，见操作何时成功。","outline":[{"id":"section-1","title":"浏览器和网站服务器，分别在哪里工作","depth":2},{"id":"section-2","title":"打开42号商品页，第一份内容是什么","depth":2},{"id":"section-3","title":"点击“查看运费”，页面为什么不用重新打开","depth":2},{"id":"section-4","title":"图片、库存与下单，可能由谁提供","depth":2},{"id":"section-5","title":"第二次打开很快，是不是内容没经过网络","depth":2},{"id":"section-6","title":"断网以后页面还在，为什么库存又查不到","depth":2}]},{"id":"url-pages","group":"services","title":"路径、问号、井号：不同页面究竟怎么区分？","question":"路径、问号、井号：不同页面究竟怎么区分？","summary":"从商品、搜索、分页和章节链接区分路径、查询和片段，并理解URL之外的请求数据。","terms":["路径","参数","锚点","请求正文"],"aliases":["路径","path pathname 目录","参数","","锚点","","请求正文",""],"related":["url","web"],"html":"\u003cp>你在同一网站点商品、搜索、翻页和评价，地址栏会发生不同变化：有时斜线后的文字变了，有时问号后多了条件，有时只有井号后改变，还有时候地址根本不变。\u003cstrong>页面不是“一页对应一个IP”；同一个网站可以根据路径、参数和登录状态返回不同内容；浏览器也可以在本机切换显示。\u003c/strong>\u003c/p>\n\u003cp>下面的商品站与字段均为虚构教学设计，重点是比较你日常会观察到的差异。\u003c/p>\n\u003ch2 id=\"section-1\">路径告诉服务想访问哪个资源\u003c/h2>\n\u003cp>\u003ccode>https://shop.example.com/products/42\u003c/code> 与 \u003ccode>/products/43\u003c/code> 访问同一主机中的不同商品资源。浏览器在请求中写明路径；网站程序读到/products/42，就按自己的规则查42号商品并回复。\u003c/p>\n\u003cp>资源不限于页面：\u003ccode>/images/42.jpg\u003c/code>可能是图片，\u003ccode>/api/products/42\u003c/code>可能返回供页面程序使用的数据。这些名称是网站选择的结构，不是网络强制规定。\u003c/p>\n\u003cp>路径看起来像文件目录，却未必对应硬盘文件。比如 \u003ccode>/orders/18\u003c/code> 可以代表数据库里的一笔订单；服务接到请求后检查你的账号是否拥有该订单，再决定显示。改数字只改变请求，不会自动改变权限，也不保证资源存在。\u003c/p>\n\u003ch2 id=\"section-2\">问号后常用来说明条件\u003c/h2>\n\u003cp>\u003ccode>/search?q=coffee&amp;page=2\u003c/code>可以表示搜coffee并看第二页。问号后叫查询部分；这类网站常把它组织成“名称=值”，多个条件用 \u003ccode>&amp;\u003c/code>连接。服务器或网页程序读取这些条件，按约定筛选结果。\u003c/p>\n\u003cp>于是同一个 \u003ccode>/search\u003c/code> 路径可以显示无数搜索结果，没必要给每个关键词建一个域名或端口。路径和参数的分工也不是绝对：网站可以用 \u003ccode>/search/coffee/2\u003c/code> 表达类似选择，URL语法不决定业务必须怎么设计。\u003c/p>\n\u003cp>商品链接多出 \u003ccode>utm_source=newsletter\u003c/code> 之类参数，常用来记录这次访问来自哪里，例如邮件中的链接，不一定换商品。网站也可能据参数改变优惠、排序或语言，所以不能把“问号后的内容都能删”当成规则。删除后是否仍正确，要看该服务怎样使用它。\u003c/p>\n\u003ch2 id=\"section-3\">搜索与翻页时，参数怎样变成眼前的内容\u003c/h2>\n\u003cp>继续这个\u003cstrong>虚构商品站\u003c/strong>：你输入coffee，第一页显示一组商品。点“下一页”时，页面可以请求/search?q=coffee&amp;page=2。网站先读取q与page，按自己的搜索和排序规则找到第二组结果，再返回页面或数据。浏览器取得后，才把第二组显示出来。\u003c/p>\n\u003cp>参数写成page=2，只是在表达要求，并不是浏览器已经拥有第二页。网络中断时，地址栏可能已经改变，内容仍没有更新；网站不接受这个值时，也可能返回错误或采用默认值。参数含义、有效取值与出错反馈，都由网站程序安排。\u003c/p>\n\u003cp>换成颜色选择也一样：?color=red告诉服务或页面程序你选择红色，程序还要查这件商品有没有红色、是否有库存。改文字不是修改后台商品资料，更不是绕过校验。\u003c/p>\n\u003ch2 id=\"section-4\">井号后通常交给浏览器处理\u003c/h2>\n\u003cp>\u003ccode>/products/42#reviews\u003c/code>可以让浏览器定位评价区。这种片段不直接放进初始HTTP请求目标里；服务可以只交回商品页面，浏览器再按reviews找到对应位置。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/URI/Reference/Fragment\" target=\"_blank\" rel=\"noopener noreferrer\">片段的标准行为\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>某些页面程序会把 \u003ccode>#/orders\u003c/code> 当成自己内部的导航状态，切换内容时再请求订单数据。此时井号后有“看起来像路径”的文字，但浏览器中的页面程序先读取#/orders，切换到订单界面，并可能再向网站请求订单数据。沿途路由器不会把orders当成网络地址。\u003c/p>\n\u003cp>这份知识库也使用类似页面内导航，你切篇时没有重新从外网下载正文。相同形式在其他产品里却可以触发额外请求。地址变化与网络通信不是一一对应。\u003c/p>\n\u003ch2 id=\"section-5\">比较五种你会真的碰见的变化\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>地址或动作\u003c/th>\n\u003cth>可以先怎样理解\u003c/th>\n\u003cth>实际结果取决于什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>/products/42换成/43\u003c/td>\n\u003ctd>请求另一资源\u003c/td>\n\u003ctd>网站是否有该内容，以及是否允许你查看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>?color=blue换成red\u003c/td>\n\u003ctd>改选择条件\u003c/td>\n\u003ctd>网站解释字段、验证取值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>?page=1换成2\u003c/td>\n\u003ctd>请求另一组结果\u003c/td>\n\u003ctd>服务或页面程序计算分页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>#details换成reviews\u003c/td>\n\u003ctd>改浏览器定位或状态\u003c/td>\n\u003ctd>页面中是否有对应位置，或程序怎样处理它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点“加入购物车”，地址没变\u003c/td>\n\u003ctd>页面可能发了额外操作请求\u003c/td>\n\u003ctd>购物车服务处理并返回\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>如果你只观察地址栏，就会漏掉最后一种。网页可以继续通信而不整页跳转，详见\u003ca href=\"#/browsing\">完整网页访问\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-6\">地址没变，加入购物车怎样完成\u003c/h2>\n\u003cp>页面程序可以读取你选中的商品和数量，发出单独的购物车请求。网站核对账号和商品状态，把结果保存，再返回购物车数量；页面更新右上角数字，地址栏可以始终停在同一商品页。\u003c/p>\n\u003cp>如果页面先把数字加一，再去提交，后续请求失败时就需要按实际结果恢复或提示。因此“画面有变化”与“网站保存了变化”也不能只凭地址栏判断，见\u003ca href=\"#/transactions\">提交之后的真实状态\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-7\">密码、图片和订单内容为什么没写在网址里\u003c/h2>\n\u003cp>网页请求不止请求目标，还可以包含额外说明和正文。登录表单通常把输入交给登录服务；上传文件需要传送文件内容，文件显然不能全塞进地址栏。应用发送这些资料时，也可能附带登录标记。\u003c/p>\n\u003cp>这说明URL相同不等于请求相同。两次访问同一个登录入口，一次输入正确资料，一次输入错误资料，结果会不同；同一个订单链接，不同账号可能得到自己的订单或无权访问。选择资源与证明身份是不同工作。\u003c/p>\n\u003cp>地址栏没有密码也不能证明页面没有传送密码；还要看浏览器与接收方是否使用了HTTPS等保护。相反，若链接本身含临时分享凭证，转发整条链接也可能转交访问能力，要按服务说明理解。\u003c/p>\n\u003ch2 id=\"section-8\">网址、网络与网站程序怎样配合\u003c/h2>\n\u003cp>“如何把请求送到网站”属于设备联网、按地址转送和传输数据；“这一条请求选什么资源”属于网页协议与应用规则；“资源是否该给你”由网站核对账号、权限和相关规则。你日常点击一个链接时，这些工作一起发生。\u003c/p>\n\u003cp>下次看到长链接，先看网站名称和端口，再看路径、问号和井号后的内容。改商品编号通常是在选另一件商品；改端口是在尝试联系另一个程序；换网络则改变请求经过的路线。三种操作影响不同步骤。通用组件规则见\u003ca href=\"https://www.rfc-editor.org/rfc/rfc3986.html\" target=\"_blank\" rel=\"noopener noreferrer\">URI规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"路径、问号、井号：不同页面究竟怎么区分？ 你在同一网站点商品、搜索、翻页和评价，地址栏会发生不同变化：有时斜线后的文字变了，有时问号后多了条件，有时只有井号后改变，还有时候地址根本不变。 页面不是“一页对应一个IP”；同一个网站可以根据路径、参数和登录状态返回不同内容；浏览器也可以在本机切换显示。 下面的商品站与字段均为虚构教学设计，重点是比较你日常会观察到的差异。 路径告诉服务想访问哪个资源 https://shop.example.com/products/42 与 /products/43 访问同一主机中的不同商品资源。浏览器在请求中写明路径；网站程序读到/products/42，就按自己的规则查42号商品并回复。 资源不限于页面： /images/42.jpg 可能是图片， /api/products/42 可能返回供页面程序使用的数据。这些名称是网站选择的结构，不是网络强制规定。 路径看起来像文件目录，却未必对应硬盘文件。比如 /orders/18 可以代表数据库里的一笔订单；服务接到请求后检查你的账号是否拥有该订单，再决定显示。改数字只改变请求，不会自动改变权限，也不保证资源存在。 问号后常用来说明条件 /search?q=coffee&page=2 可以表示搜coffee并看第二页。问号后叫查询部分；这类网站常把它组织成“名称=值”，多个条件用 & 连接。服务器或网页程序读取这些条件，按约定筛选结果。 于是同一个 /search 路径可以显示无数搜索结果，没必要给每个关键词建一个域名或端口。路径和参数的分工也不是绝对：网站可以用 /search/coffee/2 表达类似选择，URL语法不决定业务必须怎么设计。 商品链接多出 utm source=newsletter 之类参数，常用来记录这次访问来自哪里，例如邮件中的链接，不一定换商品。网站也可能据参数改变优惠、排序或语言，所以不能把“问号后的内容都能删”当成规则。删除后是否仍正确，要看该服务怎样使用它。 搜索与翻页时，参数怎样变成眼前的内容 继续这个 虚构商品站 ：你输入coffee，第一页显示一组商品。点“下一页”时，页面可以请求/search?q=coffee&page=2。网站先读取q与page，按自己的搜索和排序规则找到第二组结果，再返回页面或数据。浏览器取得后，才把第二组显示出来。 参数写成page=2，只是在表达要求，并不是浏览器已经拥有第二页。网络中断时，地址栏可能已经改变，内容仍没有更新；网站不接受这个值时，也可能返回错误或采用默认值。参数含义、有效取值与出错反馈，都由网站程序安排。 换成颜色选择也一样：?color=red告诉服务或页面程序你选择红色，程序还要查这件商品有没有红色、是否有库存。改文字不是修改后台商品资料，更不是绕过校验。 井号后通常交给浏览器处理 /products/42 reviews 可以让浏览器定位评价区。这种片段不直接放进初始HTTP请求目标里；服务可以只交回商品页面，浏览器再按reviews找到对应位置。片段的标准行为 某些页面程序会把 /orders 当成自己内部的导航状态，切换内容时再请求订单数据。此时井号后有“看起来像路径”的文字，但浏览器中的页面程序先读取 /orders，切换到订单界面，并可能再向网站请求订单数据。沿途路由器不会把orders当成网络地址。 这份知识库也使用类似页面内导航，你切篇时没有重新从外网下载正文。相同形式在其他产品里却可以触发额外请求。地址变化与网络通信不是一一对应。 比较五种你会真的碰见的变化 地址或动作 可以先怎样理解 实际结果取决于什么 --- --- --- /products/42换成/43 请求另一资源 网站是否有该内容，以及是否允许你查看 ?color=blue换成red 改选择条件 网站解释字段、验证取值 ?page=1换成2 请求另一组结果 服务或页面程序计算分页 details换成reviews 改浏览器定位或状态 页面中是否有对应位置，或程序怎样处理它 点“加入购物车”，地址没变 页面可能发了额外操作请求 购物车服务处理并返回 如果你只观察地址栏，就会漏掉最后一种。网页可以继续通信而不整页跳转，详见完整网页访问。 地址没变，加入购物车怎样完成 页面程序可以读取你选中的商品和数量，发出单独的购物车请求。网站核对账号和商品状态，把结果保存，再返回购物车数量；页面更新右上角数字，地址栏可以始终停在同一商品页。 如果页面先把数字加一，再去提交，后续请求失败时就需要按实际结果恢复或提示。因此“画面有变化”与“网站保存了变化”也不能只凭地址栏判断，见提交之后的真实状态。 密码、图片和订单内容为什么没写在网址里 网页请求不止请求目标，还可以包含额外说明和正文。登录表单通常把输入交给登录服务；上传文件需要传送文件内容，文件显然不能全塞进地址栏。应用发送这些资料时，也可能附带登录标记。 这说明URL相同不等于请求相同。两次访问同一个登录入口，一次输入正确资料，一次输入错误资料，结果会不同；同一个订单链接，不同账号可能得到自己的订单或无权访问。选择资源与证明身份是不同工作。 地址栏没有密码也不能证明页面没有传送密码；还要看浏览器与接收方是否使用了HTTPS等保护。相反，若链接本身含临时分享凭证，转发整条链接也可能转交访问能力，要按服务说明理解。 网址、网络与网站程序怎样配合 “如何把请求送到网站”属于设备联网、按地址转送和传输数据；“这一条请求选什么资源”属于网页协议与应用规则；“资源是否该给你”由网站核对账号、权限和相关规则。你日常点击一个链接时，这些工作一起发生。 下次看到长链接，先看网站名称和端口，再看路径、问号和井号后的内容。改商品编号通常是在选另一件商品；改端口是在尝试联系另一个程序；换网络则改变请求经过的路线。三种操作影响不同步骤。通用组件规则见URI规范。","outline":[{"id":"section-1","title":"路径告诉服务想访问哪个资源","depth":2},{"id":"section-2","title":"问号后常用来说明条件","depth":2},{"id":"section-3","title":"搜索与翻页时，参数怎样变成眼前的内容","depth":2},{"id":"section-4","title":"井号后通常交给浏览器处理","depth":2},{"id":"section-5","title":"比较五种你会真的碰见的变化","depth":2},{"id":"section-6","title":"地址没变，加入购物车怎样完成","depth":2},{"id":"section-7","title":"密码、图片和订单内容为什么没写在网址里","depth":2},{"id":"section-8","title":"网址、网络与网站程序怎样配合","depth":2}]},{"id":"browsing","group":"services","title":"从点击商品链接到看到页面，完整经历了什么？","question":"从点击商品链接到看到页面，完整经历了什么？","summary":"将URL、DNS、IP端口、连接、请求、页面组装和后续点击连成一次完整访问。","terms":["重定向","页面路由"],"aliases":["重定向","redirect 短链接 跳转","页面路由",""],"related":["web","url-pages","domains","ports"],"html":"\u003cp>朋友发来商品链接，你点开以后看见标题、图片和评价。\u003cstrong>浏览器先读懂链接要联系谁，再借网络取得页面所需内容，最后在本机显示；网页打开以后，还可以继续请求库存、运费等结果。\u003c/strong> IP、端口、域名和参数，都在这段过程里承担不同工作。\u003c/p>\n\u003cp>下面是一条\u003cstrong>虚构教学轨迹\u003c/strong>。先假设没有适用缓存，也没有可复用连接，以便看清各步。实际浏览器会并行处理、复用已有工作，也可能使用不同HTTP版本，顺序不必每次从头重来。\u003c/p>\n\u003ch2 id=\"section-1\">链接拆开以后，商品还没有到电脑上\u003c/h2>\n\u003cp>链接是 \u003ccode>https://shop.example.com/products/42?color=blue#reviews\u003c/code>。浏览器读出HTTPS、主机名shop.example.com、默认端口443、商品路径/products/42、颜色条件color=blue，以及片段reviews。\u003c/p>\n\u003cp>此时它只知道“准备向哪里要什么”。主机名用于查地址，端口用于联系接收入口；路径和颜色条件要在后面的请求中告诉网站；reviews先留给浏览器处理页面位置。你点击链接，不等于这些工作已经完成。\u003ca href=\"#/url\">网址各部分\u003c/a>\u003c/p>\n\u003cp>如果地址栏里输入的是搜索词，浏览器可能先请求搜索服务，取得一组链接；点其中的商品站，再开始这里的访问。搜索关键词与DNS查已知名称，是不同工作。\u003c/p>\n\u003ch2 id=\"section-2\">名称查到地址，设备才知道往哪里发\u003c/h2>\n\u003cp>浏览器或系统先看有没有可用记录；本例没有，于是询问DNS服务，取得shop.example.com的适用地址。DNS服务交回地址，并没有交回42号商品详情。\u003c/p>\n\u003cp>电脑根据路由规则决定下一步。目标在外部网络，便把数据交给家中网关；家中出口按共享IPv4安排转换来源、保存连接记录，再经运营商和其他网络逐段转送。后面的设备按目的地址继续决定下一步，不需要读懂“蓝色商品”。\u003c/p>\n\u003cp>网站回复时，目标可以是出口的公共来源，出口按记录交回原电脑。所以网站不需要先掌握你家所有内网地址，才能把页面回给这次连接。\u003ca href=\"#/dns\">DNS\u003c/a>、\u003ca href=\"#/routes\">路由\u003c/a>、\u003ca href=\"#/nat\">共享出口\u003c/a>\u003c/p>\n\u003ch2 id=\"section-3\">联系网页端口，并核对HTTPS对象\u003c/h2>\n\u003cp>浏览器按地址与443端口尝试联系服务。接收程序正在运行、路径与访问规则允许，双方才有机会建立通信；HTTPS还要完成相应连接校验和保护安排。\u003c/p>\n\u003cp>浏览器核对服务器提供的证书是否适合shop.example.com等条件，再与实际HTTPS接收端交换受保护内容。没人接收、一直等不到回应与证书不适合该名称，是不同失败，不应都当成“网页文件没有上传”。\u003c/p>\n\u003cp>这里不要求记握手字段。保留关系即可：取得地址，联系入口，建立适当的受保护通信，再交换网页需求与回答。已有连接时，部分步骤可以复用；不同HTTP版本的底层过程也不完全相同。\u003ca href=\"#/security\">HTTPS的范围\u003c/a>\u003c/p>\n\u003ch2 id=\"section-4\">网站拿到请求，才去查42号商品\u003c/h2>\n\u003cp>浏览器在请求中保留主机名、路径与颜色条件。如果同一入口提供多个网站，入口先按名称选择相应站点；商品程序再读/products/42，查找商品42，并按自己的规则解释color=blue。\u003c/p>\n\u003cp>假设该商品有蓝色款，网站取得标题、图片地址和页面所需资料，生成响应。如果商品不存在，可以返回相应说明；如果所需内容只向登录用户开放，就还要验证请求附带的登录标记。\u003c/p>\n\u003cp>同一个URL不保证每个人得到完全相同的内容。不同账号、语言偏好或服务规则，都可能参与结果。能得到一个明确拒绝页，也说明某个服务已经回答；与始终没取得回复不同。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP中的请求与响应\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-5\">页面说明先到，图片和程序再陆续取得\u003c/h2>\n\u003cp>本例中，网站先返回HTML，里面写着商品标题、内容结构、图片位置，以及要使用的样式与程序。浏览器读取后，继续下载相应文件。图片可能来自img.example.com，下载它就又涉及相应目标的查询和连接。\u003c/p>\n\u003cp>标题先有了，浏览器可以先显示标题；图片后到，再填入图片区域。样式决定排版，程序负责相应交互，所以文件未齐时可能出现内容逐步完善的过程。浏览器是在你的设备上把这些材料组成网页，不是在接收远方屏幕的录像。\u003c/p>\n\u003cp>页面有适当评价位置时，浏览器按reviews滚动过去。若评价需另外查询，页面程序还会请求评价数据。片段留在本机处理，并不意味着整个访问没有通信。\u003ca href=\"#/web\">浏览器怎样组合页面\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">页面打开以后，三次点击可以做不同的事\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你接着点什么\u003c/th>\n\u003cth>这个示例中的处理\u003c/th>\n\u003cth>为什么结果可能不同\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>展开已下载的商品说明\u003c/td>\n\u003ctd>本地显示已有文字\u003c/td>\n\u003ctd>可以不再向网站取数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查询红色款库存\u003c/td>\n\u003ctd>页面发新请求，服务查库存再回\u003c/td>\n\u003ctd>需要当前网络与库存服务可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加入购物车\u003c/td>\n\u003ctd>提交商品和数量，服务核对并保存\u003c/td>\n\u003ctd>涉及账号、库存规则与保存结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>因此，页面还在、说明能展开、库存却转圈，可以同时发生。地址栏不变也不表示没有新请求；地址变了，也可能只是页面内导航。\u003ca href=\"#/url-pages\">路径、参数与片段\u003c/a>\u003c/p>\n\u003ch2 id=\"section-7\">短链接和登录跳转，在哪一步接上这条链\u003c/h2>\n\u003cp>服务可以在响应中要求浏览器去另一个地址，页面程序也可以发起跳转。短链接常先到中转入口，再引向商品页；未登录时，网站也可能先带你去登录入口，再按设计回到目标。\u003c/p>\n\u003cp>浏览器遇到新的名称，可能需要再查地址和建立连接；只换路径时，则可以复用适当连接。跳转不是让旧地址悄悄变成另一台机器，而是浏览器按新的目标继续访问。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections\" target=\"_blank\" rel=\"noopener noreferrer\">网页跳转方式\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>若页面像原品牌，主机名却已经变化，仍应核对真实入口。界面相似不等于连接对象相同。\u003c/p>\n\u003ch2 id=\"section-8\">用完整过程解释眼前的不一致\u003c/h2>\n\u003cp>第一次慢、第二次快，可能是地址、连接或内容副本得以复用；文字有、图片无，可能是图片那次获取失败；朋友点同一链接要登录，可能是他的浏览器没有相应凭据；换网后页面仍在而刷新失败，则可能只是本地已有内容还显示着。\u003c/p>\n\u003cp>这些是解释方向，不是对任一实际故障的诊断。按\u003ca href=\"#/troubleshoot\">对照排障\u003c/a>核对具体结果。看到页面以后，登录和下单还需要新的业务过程；\u003ca href=\"#/transactions\">点击提交之后\u003c/a>继续说明服务怎样处理，以及为什么超时不一定表示没有保存。\u003c/p>\n","text":"从点击商品链接到看到页面，完整经历了什么？ 朋友发来商品链接，你点开以后看见标题、图片和评价。 浏览器先读懂链接要联系谁，再借网络取得页面所需内容，最后在本机显示；网页打开以后，还可以继续请求库存、运费等结果。 IP、端口、域名和参数，都在这段过程里承担不同工作。 下面是一条 虚构教学轨迹 。先假设没有适用缓存，也没有可复用连接，以便看清各步。实际浏览器会并行处理、复用已有工作，也可能使用不同HTTP版本，顺序不必每次从头重来。 链接拆开以后，商品还没有到电脑上 链接是 https://shop.example.com/products/42?color=blue reviews 。浏览器读出HTTPS、主机名shop.example.com、默认端口443、商品路径/products/42、颜色条件color=blue，以及片段reviews。 此时它只知道“准备向哪里要什么”。主机名用于查地址，端口用于联系接收入口；路径和颜色条件要在后面的请求中告诉网站；reviews先留给浏览器处理页面位置。你点击链接，不等于这些工作已经完成。网址各部分 如果地址栏里输入的是搜索词，浏览器可能先请求搜索服务，取得一组链接；点其中的商品站，再开始这里的访问。搜索关键词与DNS查已知名称，是不同工作。 名称查到地址，设备才知道往哪里发 浏览器或系统先看有没有可用记录；本例没有，于是询问DNS服务，取得shop.example.com的适用地址。DNS服务交回地址，并没有交回42号商品详情。 电脑根据路由规则决定下一步。目标在外部网络，便把数据交给家中网关；家中出口按共享IPv4安排转换来源、保存连接记录，再经运营商和其他网络逐段转送。后面的设备按目的地址继续决定下一步，不需要读懂“蓝色商品”。 网站回复时，目标可以是出口的公共来源，出口按记录交回原电脑。所以网站不需要先掌握你家所有内网地址，才能把页面回给这次连接。DNS、路由、共享出口 联系网页端口，并核对HTTPS对象 浏览器按地址与443端口尝试联系服务。接收程序正在运行、路径与访问规则允许，双方才有机会建立通信；HTTPS还要完成相应连接校验和保护安排。 浏览器核对服务器提供的证书是否适合shop.example.com等条件，再与实际HTTPS接收端交换受保护内容。没人接收、一直等不到回应与证书不适合该名称，是不同失败，不应都当成“网页文件没有上传”。 这里不要求记握手字段。保留关系即可：取得地址，联系入口，建立适当的受保护通信，再交换网页需求与回答。已有连接时，部分步骤可以复用；不同HTTP版本的底层过程也不完全相同。HTTPS的范围 网站拿到请求，才去查42号商品 浏览器在请求中保留主机名、路径与颜色条件。如果同一入口提供多个网站，入口先按名称选择相应站点；商品程序再读/products/42，查找商品42，并按自己的规则解释color=blue。 假设该商品有蓝色款，网站取得标题、图片地址和页面所需资料，生成响应。如果商品不存在，可以返回相应说明；如果所需内容只向登录用户开放，就还要验证请求附带的登录标记。 同一个URL不保证每个人得到完全相同的内容。不同账号、语言偏好或服务规则，都可能参与结果。能得到一个明确拒绝页，也说明某个服务已经回答；与始终没取得回复不同。HTTP中的请求与响应 页面说明先到，图片和程序再陆续取得 本例中，网站先返回HTML，里面写着商品标题、内容结构、图片位置，以及要使用的样式与程序。浏览器读取后，继续下载相应文件。图片可能来自img.example.com，下载它就又涉及相应目标的查询和连接。 标题先有了，浏览器可以先显示标题；图片后到，再填入图片区域。样式决定排版，程序负责相应交互，所以文件未齐时可能出现内容逐步完善的过程。浏览器是在你的设备上把这些材料组成网页，不是在接收远方屏幕的录像。 页面有适当评价位置时，浏览器按reviews滚动过去。若评价需另外查询，页面程序还会请求评价数据。片段留在本机处理，并不意味着整个访问没有通信。浏览器怎样组合页面 页面打开以后，三次点击可以做不同的事 你接着点什么 这个示例中的处理 为什么结果可能不同 --- --- --- 展开已下载的商品说明 本地显示已有文字 可以不再向网站取数据 查询红色款库存 页面发新请求，服务查库存再回 需要当前网络与库存服务可用 加入购物车 提交商品和数量，服务核对并保存 涉及账号、库存规则与保存结果 因此，页面还在、说明能展开、库存却转圈，可以同时发生。地址栏不变也不表示没有新请求；地址变了，也可能只是页面内导航。路径、参数与片段 短链接和登录跳转，在哪一步接上这条链 服务可以在响应中要求浏览器去另一个地址，页面程序也可以发起跳转。短链接常先到中转入口，再引向商品页；未登录时，网站也可能先带你去登录入口，再按设计回到目标。 浏览器遇到新的名称，可能需要再查地址和建立连接；只换路径时，则可以复用适当连接。跳转不是让旧地址悄悄变成另一台机器，而是浏览器按新的目标继续访问。网页跳转方式 若页面像原品牌，主机名却已经变化，仍应核对真实入口。界面相似不等于连接对象相同。 用完整过程解释眼前的不一致 第一次慢、第二次快，可能是地址、连接或内容副本得以复用；文字有、图片无，可能是图片那次获取失败；朋友点同一链接要登录，可能是他的浏览器没有相应凭据；换网后页面仍在而刷新失败，则可能只是本地已有内容还显示着。 这些是解释方向，不是对任一实际故障的诊断。按对照排障核对具体结果。看到页面以后，登录和下单还需要新的业务过程；点击提交之后继续说明服务怎样处理，以及为什么超时不一定表示没有保存。","outline":[{"id":"section-1","title":"链接拆开以后，商品还没有到电脑上","depth":2},{"id":"section-2","title":"名称查到地址，设备才知道往哪里发","depth":2},{"id":"section-3","title":"联系网页端口，并核对HTTPS对象","depth":2},{"id":"section-4","title":"网站拿到请求，才去查42号商品","depth":2},{"id":"section-5","title":"页面说明先到，图片和程序再陆续取得","depth":2},{"id":"section-6","title":"页面打开以后，三次点击可以做不同的事","depth":2},{"id":"section-7","title":"短链接和登录跳转，在哪一步接上这条链","depth":2},{"id":"section-8","title":"用完整过程解释眼前的不一致","depth":2}]},{"id":"security","group":"trust","title":"信息经过别人，哪些内容能被看见？","question":"信息经过别人，哪些内容能被看见？","summary":"加密保护特定两端之间的内容，沿途仍可能观察连接线索。","terms":["HTTPS","加密","证书"],"aliases":["HTTPS","TLS SSL 安全连接","加密","","证书",""],"related":["web","identity","vpn"],"html":"\u003cp>你在酒店Wi-Fi上填写收货地址，请求会经过酒店网络、运营商和其他设备。它们需要转送数据，却不一定需要读懂你的地址。\u003cstrong>HTTPS保护浏览器与实际HTTPS接收端之间的内容；沿途仍可能观察连接地址、时间和数据量等线索。\u003c/strong>\u003c/p>\n\u003cp>判断保护效果，要说清楚谁想看什么，以及保护从哪里开始、在哪里结束。一个开关不会让所有参与者同时失去所有信息。\u003c/p>\n\u003ch2 id=\"section-1\">填写收货地址时，HTTPS具体保护哪一段\u003c/h2>\n\u003cp>以下用\u003cstrong>虚构商品站\u003c/strong>说明。你确认正式网址后，在HTTPS页面填写地址，按提交。浏览器与网站的HTTPS接收端通过TLS等安排保护交换内容，使普通沿途转送者难以直接读取或悄悄修改里面的明文资料。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security\" target=\"_blank\" rel=\"noopener noreferrer\">TLS的保护与认证\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>接收端要解开保护，才能使用请求。网站需要读取收货信息来处理订单，因此HTTPS不会让经营者自己看不见你提交的地址。网站收到以后怎样保存、授权员工读取或继续处理，是服务管理的另一件事。\u003c/p>\n\u003cp>网站的HTTPS接收端也不一定就是保存订单的那台机器。浏览器可能先与CDN或统一入口建立保护连接，入口解密后，再通过另一条受保护连接交给后台。每段连接的两端需要分别看，不能把“加密传输”理解为所有中间服务永远无法处理内容。\u003c/p>\n\u003ch2 id=\"section-2\">酒店网络不能读正文，为什么还可能知道我在通信\u003c/h2>\n\u003cp>转送设备需要知道下一步把数据送往哪个地址，也能观察数据何时出现、持续多久、数量多少。HTTPS保护请求正文，并不让这些通信事实消失。\u003c/p>\n\u003cp>域名能否被观察，还取决于DNS查询与连接信息使用了怎样的保护安排。不能一概说酒店能看见每一条浏览内容，也不能一概说只要HTTPS，酒店就完全不知道你在访问外面。\u003c/p>\n\u003cp>因此，购物站中的路径、查询参数和表单内容可以受到HTTPS传输保护；但若你把含凭证的链接主动发给别人，对方得到链接本身，已经不是沿途偷读问题。终端恶意程序、共享屏幕和用户转发也不由传输保护自动解决。\u003c/p>\n\u003ch2 id=\"section-3\">再开VPN以后，三方看到的东西怎样变\u003c/h2>\n\u003cp>假设你按提供者的设置，让这次商品访问经过VPN公共出口。设备先在现有网络上联系VPN服务器，把目标访问装进受保护的VPN通信。另一端取出里面的数据，再向商品站转送。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参与者\u003c/th>\n\u003cth>在这个路径示意中通常能观察什么\u003c/th>\n\u003cth>不应直接扩大成什么结论\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>酒店网络\u003c/td>\n\u003ctd>你在联系VPN服务器，以及时间、流量等\u003c/td>\n\u003ctd>已读懂隧道内全部网页正文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VPN提供者或出口\u003c/td>\n\u003ctd>参与隧道与向目标转送，可取得相应连接线索\u003c/td>\n\u003ctd>对所有活动必然全知，或必然完全不知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>商品站的HTTPS接收端\u003c/td>\n\u003ctd>收到并解密相应请求，处理账号与收货资料\u003c/td>\n\u003ctd>因为用了VPN就无法关联账号\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>VPN和HTTPS可以同时存在：前者常保护设备到VPN另一端的通信，后者保护浏览器到相应HTTPS接收端的交换。VPN出口转送HTTPS数据，不意味着普通转送就能解密HTTPS正文。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">公共出口的路径安排\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>实际可见性还受客户端、证书信任、企业管理和协议安排影响。本表帮助区分观察位置，不是对任何产品无条件的隐私承诺。\u003c/p>\n\u003ch2 id=\"section-4\">有HTTPS，为什么仍可能是冒牌商家\u003c/h2>\n\u003cp>浏览器会核对服务器提供的证书是否适合你访问的名称，并检查相关信任条件。通过校验，有助于确认当前连接对象能够证明自己有权使用这个名称，并保护后续通信。\u003c/p>\n\u003cp>但一个人也可以为自己控制的仿冒名称取得有效证书。名称本身与真正商家不同，页面却可以做得很像。HTTPS不能替你确认商品存在、客服诚实或退款承诺会兑现。\u003c/p>\n\u003cp>所以要核对完整主机名与已知正式入口，而不是只找某个锁形标记。若出现证书警告，应检查网址、设备时间和官方渠道说明；关闭校验不会让错误的连接对象变正确。怎样识别名称层级，见\u003ca href=\"#/domains\">域名\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">无痕窗口、退出账号和VPN为什么不是同一种保护\u003c/h2>\n\u003cp>无痕或私密窗口通常使用单独的浏览数据环境，并减少会话结束后留在本机的浏览记录。它不会自动换公共出口，也不会让网络服务收不到请求。你在无痕窗口重新登录同一账号，网站仍然知道你验证了哪个账号。\u003c/p>\n\u003cp>退出账号主要影响网站允许当前会话使用的登录状态；VPN改变指定访问的路径及来源。它们分别改变本地记录、登录凭据与网络连接，不能互相替代。\u003c/p>\n\u003cp>例如，你担心家人翻看本机历史，与担心酒店网络读取表单，或担心商家保存订单，是三种不同问题。应先说清关心的观察者和资料，再判断某项措施覆盖了哪一段。账号怎样跨越换网继续识别，见\u003ca href=\"#/identity\">会话与身份\u003c/a>。\u003c/p>\n","text":"信息经过别人，哪些内容能被看见？ 你在酒店Wi-Fi上填写收货地址，请求会经过酒店网络、运营商和其他设备。它们需要转送数据，却不一定需要读懂你的地址。 HTTPS保护浏览器与实际HTTPS接收端之间的内容；沿途仍可能观察连接地址、时间和数据量等线索。 判断保护效果，要说清楚谁想看什么，以及保护从哪里开始、在哪里结束。一个开关不会让所有参与者同时失去所有信息。 填写收货地址时，HTTPS具体保护哪一段 以下用 虚构商品站 说明。你确认正式网址后，在HTTPS页面填写地址，按提交。浏览器与网站的HTTPS接收端通过TLS等安排保护交换内容，使普通沿途转送者难以直接读取或悄悄修改里面的明文资料。TLS的保护与认证 接收端要解开保护，才能使用请求。网站需要读取收货信息来处理订单，因此HTTPS不会让经营者自己看不见你提交的地址。网站收到以后怎样保存、授权员工读取或继续处理，是服务管理的另一件事。 网站的HTTPS接收端也不一定就是保存订单的那台机器。浏览器可能先与CDN或统一入口建立保护连接，入口解密后，再通过另一条受保护连接交给后台。每段连接的两端需要分别看，不能把“加密传输”理解为所有中间服务永远无法处理内容。 酒店网络不能读正文，为什么还可能知道我在通信 转送设备需要知道下一步把数据送往哪个地址，也能观察数据何时出现、持续多久、数量多少。HTTPS保护请求正文，并不让这些通信事实消失。 域名能否被观察，还取决于DNS查询与连接信息使用了怎样的保护安排。不能一概说酒店能看见每一条浏览内容，也不能一概说只要HTTPS，酒店就完全不知道你在访问外面。 因此，购物站中的路径、查询参数和表单内容可以受到HTTPS传输保护；但若你把含凭证的链接主动发给别人，对方得到链接本身，已经不是沿途偷读问题。终端恶意程序、共享屏幕和用户转发也不由传输保护自动解决。 再开VPN以后，三方看到的东西怎样变 假设你按提供者的设置，让这次商品访问经过VPN公共出口。设备先在现有网络上联系VPN服务器，把目标访问装进受保护的VPN通信。另一端取出里面的数据，再向商品站转送。 参与者 在这个路径示意中通常能观察什么 不应直接扩大成什么结论 --- --- --- 酒店网络 你在联系VPN服务器，以及时间、流量等 已读懂隧道内全部网页正文 VPN提供者或出口 参与隧道与向目标转送，可取得相应连接线索 对所有活动必然全知，或必然完全不知 商品站的HTTPS接收端 收到并解密相应请求，处理账号与收货资料 因为用了VPN就无法关联账号 VPN和HTTPS可以同时存在：前者常保护设备到VPN另一端的通信，后者保护浏览器到相应HTTPS接收端的交换。VPN出口转送HTTPS数据，不意味着普通转送就能解密HTTPS正文。公共出口的路径安排 实际可见性还受客户端、证书信任、企业管理和协议安排影响。本表帮助区分观察位置，不是对任何产品无条件的隐私承诺。 有HTTPS，为什么仍可能是冒牌商家 浏览器会核对服务器提供的证书是否适合你访问的名称，并检查相关信任条件。通过校验，有助于确认当前连接对象能够证明自己有权使用这个名称，并保护后续通信。 但一个人也可以为自己控制的仿冒名称取得有效证书。名称本身与真正商家不同，页面却可以做得很像。HTTPS不能替你确认商品存在、客服诚实或退款承诺会兑现。 所以要核对完整主机名与已知正式入口，而不是只找某个锁形标记。若出现证书警告，应检查网址、设备时间和官方渠道说明；关闭校验不会让错误的连接对象变正确。怎样识别名称层级，见域名。 无痕窗口、退出账号和VPN为什么不是同一种保护 无痕或私密窗口通常使用单独的浏览数据环境，并减少会话结束后留在本机的浏览记录。它不会自动换公共出口，也不会让网络服务收不到请求。你在无痕窗口重新登录同一账号，网站仍然知道你验证了哪个账号。 退出账号主要影响网站允许当前会话使用的登录状态；VPN改变指定访问的路径及来源。它们分别改变本地记录、登录凭据与网络连接，不能互相替代。 例如，你担心家人翻看本机历史，与担心酒店网络读取表单，或担心商家保存订单，是三种不同问题。应先说清关心的观察者和资料，再判断某项措施覆盖了哪一段。账号怎样跨越换网继续识别，见会话与身份。","outline":[{"id":"section-1","title":"填写收货地址时，HTTPS具体保护哪一段","depth":2},{"id":"section-2","title":"酒店网络不能读正文，为什么还可能知道我在通信","depth":2},{"id":"section-3","title":"再开VPN以后，三方看到的东西怎样变","depth":2},{"id":"section-4","title":"有HTTPS，为什么仍可能是冒牌商家","depth":2},{"id":"section-5","title":"无痕窗口、退出账号和VPN为什么不是同一种保护","depth":2}]},{"id":"identity","group":"trust","title":"换了IP，网站为什么还认得你？","question":"换了IP，网站为什么还认得你？","summary":"换网络以后，浏览器保存的登录标记可能还在，网站因此仍能找到同一账号。","terms":["Cookie","会话","设备指纹"],"aliases":["Cookie","cookie cookies 登录 浏览器标记","会话","","设备指纹","fingerprint device fingerprint"],"related":["nat","security","risk","vpn"],"html":"\u003cp>你从家中Wi-Fi换成手机流量，购物站仍显示原来的头像和订单。\u003cstrong>网站可以通过浏览器携带的登录标记，找到同一个账号；它不必根据新IP重新猜测你是谁。\u003c/strong> 网络来源、浏览器会话与账号，是几种能够同时存在的识别线索。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgNDIwIDUyMCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjAiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPklQ5Y+Y5LqG77yM572R56uZ5LuN5Y+v6IO96K6k5b6X6LSm5Y+3PC90ZXh0PjxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDgwLDEwNikiPjxyZWN0IHg9Ii0yNCIgeT0iLTM1IiB3aWR0aD0iNDgiIGhlaWdodD0iNzAiIHJ4PSI5IiBmaWxsPSIjZTJlY2UyIiBzdHJva2U9IiMyNzY2NTUiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9Ii0xNiIgeT0iLTIyIiB3aWR0aD0iMzIiIGhlaWdodD0iNDAiIHJ4PSIzIiBmaWxsPSIjZmZmZWZhIi8+PHBhdGggZD0iTS03IDI2SDciIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9nPjx0ZXh0IHg9IjgwIiB5PSIxNjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPuWQjOS4gOiuvuWkhzwvdGV4dD48cGF0aCBkPSJNMTEzIDEwN0gxNThWNzlIMjE3IiBmaWxsPSJub25lIiBzdHJva2U9IiMyNzY2NTUiIHN0cm9rZS13aWR0aD0iMyIgbWFya2VyLWVuZD0idXJsKCNhKSIvPjxwYXRoIGQ9Ik0xNTkgMTA3VjE1M0gyMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIzIiBtYXJrZXItZW5kPSJ1cmwoI2EpIi8+PHRleHQgeD0iMzAzIiB5PSI4NiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOSIgZmlsbD0iIzI0M2IzNiI+5a625Lit5Ye65Y+jQTwvdGV4dD48dGV4dCB4PSIzMDMiIHk9IjE2MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOSIgZmlsbD0iIzI0M2IzNiI+5omL5py6572R57ucQjwvdGV4dD48dGV4dCB4PSIyMTAiIHk9IjIxOSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzI0M2IzNiI+5o2i572R57uc77yM5p2l5rqQ5Y+v6IO95pS55Y+YPC90ZXh0PjxwYXRoIGQ9Ik01NyAyNjVIMzYzVjMzMUg4Mkw1NyAzNTFaIiBmaWxsPSIjZTNlY2UxIi8+PHRleHQgeD0iMjEwIiB5PSIyOTIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPua1j+iniOWZqOeZu+W9leagh+iusOi/mOWcqDwvdGV4dD48dGV4dCB4PSIyMTAiIHk9IjMyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzI0M2IzNiI+5ZCO57ut6K+35rGC5LuN5Y+v5pC65bim5a6DPC90ZXh0PjxwYXRoIGQ9Ik0yMTAgMzU3VjM5NCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjMiIG1hcmtlci1lbmQ9InVybCgjYSkiLz48Y2lyY2xlIGN4PSIyMTAiIGN5PSI0MzUiIHI9IjI2IiBmaWxsPSIjYjM4YTUyIi8+PHRleHQgeD0iMjEwIiB5PSI0NDIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiNmZmYiPuWPtzwvdGV4dD48dGV4dCB4PSIyMTAiIHk9IjQ5MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOSIgZmlsbD0iIzI0M2IzNiI+55m75b2V5YWz6IGU55qE6LSm5Y+35LuN55u45ZCMPC90ZXh0PjwvZz48L3N2Zz4=\" alt=\"同一设备从家中出口换到手机网络，来源可变，浏览器会话标记与登录账号仍可关联。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>同一设备从家中出口换到手机网络，来源可变，浏览器会话标记与登录账号仍可关联。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">从第一次进入，到“我的订单”出现\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构购物系统\u003c/strong>。你第一次打开首页，网站可以给这段访问一个编号，记录语言偏好或未登录购物车。随后你输入账号和密码，网站核对通过，再把有效登录状态与账号关联。\u003c/p>\n\u003cp>网站让浏览器保存一份相应标记。常见做法是放进Cookie：这是浏览器按范围规则保存，并在适用请求中发送的数据。标记可以只是一个难以随意伪造的关联编号，不必直接写着你的姓名；账号资料和会话记录可以保存在服务端。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies\" target=\"_blank\" rel=\"noopener noreferrer\">Cookie怎样支持登录状态\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>你点“我的订单”时，浏览器又发出请求，并按规则附上标记。网站核对它是否有效、过期或已撤销，找到对应账号，再检查这个账号有权看哪些订单，最后返回结果。\u003c/p>\n\u003cp>所以连续点击不同页面，不需要每次重新输入密码。网站也不是因为看见同一IP，就把别人家的订单交给你。真正授权访问，需要验证相应凭据和权限。\u003c/p>\n\u003ch2 id=\"section-2\">从Wi-Fi切到流量，哪一项变了，哪一项还在\u003c/h2>\n\u003cp>手机切换网络后，新请求的来源IP可能变化，原有某条连接也可能中断并重新建立。但浏览器存储没有因为切网自动清空，登录标记仍可以随后续请求发出。\u003c/p>\n\u003cp>网站再次收到有效标记，就仍能找到原账号的订单和购物车。保存的订单在网站那边，浏览器只需要证明这次访问有权读取，不必让公网IP始终保持不变。\u003c/p>\n\u003cp>服务也可能把来源和设备变化列为额外检查线索，要求重新验证。这是会话与风控的设计，不是所有网站都必须“IP一变立即退出”，也不是登录标记永远不会失效。\u003c/p>\n\u003ch2 id=\"section-3\">同一办公室共用IP，账号为什么仍能分开\u003c/h2>\n\u003cp>同事甲和乙各自在自己的浏览器登录，浏览器保存不同会话标记。两人的请求经过共同出口，网站看到相同来源IP，却仍可验证两份凭据并返回各自资料。\u003c/p>\n\u003cp>反过来，一个人使用手机和电脑登录同一账号，可以对应两个会话、两种来源，却仍读取同一账号记录。于是“来自哪里”“哪段访问”“登录哪个账号”不是一一对应。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享IP造成的识别歧义\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>账号也不必等于一个自然人：可能有组织授权共用账号，一个人也可能拥有多个账号。网站记录某账号执行过操作，与证明某个自然人亲手执行，仍是不同程度的判断。\u003c/p>\n\u003ch2 id=\"section-4\">换浏览器或清Cookie以后，为什么又要求登录\u003c/h2>\n\u003cp>另一个浏览器通常没有自动复制原浏览器的登录标记。网站接到的请求缺少有效凭据，就可能先显示登录页。清除网站Cookie也可能产生类似效果：本机不再携带原标记，但服务器上的账号、订单和其他会话不会因此自动删除。\u003c/p>\n\u003cp>你重新登录同一账号，网站核对通过后仍可以显示先前订单。没有凭据可用，与账号资料不存在，是两件事。\u003c/p>\n\u003cp>退出登录则应由网站处理会话失效或撤销，使相应凭据不能继续授权。退出是否同时影响其他设备、多久生效，要看产品说明；不能只看地址栏切到首页就确认所有设备已经退出。\u003c/p>\n\u003ch2 id=\"section-5\">主站已经登录，帮助站为什么还要再登\u003c/h2>\n\u003cp>Cookie有发送范围。某份标记可能只发给shop.example.com，另一份可能按适当父域名范围发送；路径、保护要求及浏览器规则也会影响实际发送。\u003c/p>\n\u003cp>即使同属一个品牌，help.example.com的登录服务也未必使用相同会话。网站可以专门建设共享登录，让两边配合；不能只凭域名长得相近，就推断凭据自动通用。\u003c/p>\n\u003cp>页面程序能否读取另一个来源的数据，还涉及同源等规则。这与Cookie能否发送、业务账号是否共用有关联，却不是同一套判断。具体区别见\u003ca href=\"#/domains\">子域名与登录\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-6\">设备指纹怎样帮助关联，又为什么不能当身份证\u003c/h2>\n\u003cp>网站可能取得浏览器类型、语言、设备环境等特征，把组合用于比较访问是否可能相关。这类做法常称设备指纹。它是关联判断，不是一个永远不变、全球唯一的硬件编号。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/device-inputs-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">风险产品公开的设备与会话输入\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>同类设备可能相似，系统升级或设置变化又会改变特征。因此，看到“环境相似”不能直接证明同一自然人；看到“环境不同”也不能直接证明账号被盗。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>动作\u003c/th>\n\u003cth>首先改变的东西\u003c/th>\n\u003cth>不会自动做到的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>换Wi-Fi、流量或VPN出口\u003c/td>\n\u003ctd>某些连接的来源与路径\u003c/td>\n\u003ctd>删除账号和历史订单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除网站Cookie\u003c/td>\n\u003ctd>本浏览器保存的相应标记\u003c/td>\n\u003ctd>清除服务端全部记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>退出登录\u003c/td>\n\u003ctd>相应会话的授权状态\u003c/td>\n\u003ctd>隐藏一切来源与行为线索\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换设备后重新登录\u003c/td>\n\u003ctd>本地环境、会话和可能的网络来源\u003c/td>\n\u003ctd>让网站无法关联同一账号\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>网站认人时，可以同时查看来源IP、有效凭据、账号、设备环境和行为。不同线索各有作用，也各有误差。它们怎样参与验证码和异常登录判断，见\u003ca href=\"#/risk\">IP与风控\u003c/a>。\u003c/p>\n","text":"换了IP，网站为什么还认得你？ 你从家中Wi-Fi换成手机流量，购物站仍显示原来的头像和订单。 网站可以通过浏览器携带的登录标记，找到同一个账号；它不必根据新IP重新猜测你是谁。 网络来源、浏览器会话与账号，是几种能够同时存在的识别线索。 同一设备从家中出口换到手机网络，来源可变，浏览器会话标记与登录账号仍可关联。 从第一次进入，到“我的订单”出现 以下是 虚构购物系统 。你第一次打开首页，网站可以给这段访问一个编号，记录语言偏好或未登录购物车。随后你输入账号和密码，网站核对通过，再把有效登录状态与账号关联。 网站让浏览器保存一份相应标记。常见做法是放进Cookie：这是浏览器按范围规则保存，并在适用请求中发送的数据。标记可以只是一个难以随意伪造的关联编号，不必直接写着你的姓名；账号资料和会话记录可以保存在服务端。Cookie怎样支持登录状态 你点“我的订单”时，浏览器又发出请求，并按规则附上标记。网站核对它是否有效、过期或已撤销，找到对应账号，再检查这个账号有权看哪些订单，最后返回结果。 所以连续点击不同页面，不需要每次重新输入密码。网站也不是因为看见同一IP，就把别人家的订单交给你。真正授权访问，需要验证相应凭据和权限。 从Wi-Fi切到流量，哪一项变了，哪一项还在 手机切换网络后，新请求的来源IP可能变化，原有某条连接也可能中断并重新建立。但浏览器存储没有因为切网自动清空，登录标记仍可以随后续请求发出。 网站再次收到有效标记，就仍能找到原账号的订单和购物车。保存的订单在网站那边，浏览器只需要证明这次访问有权读取，不必让公网IP始终保持不变。 服务也可能把来源和设备变化列为额外检查线索，要求重新验证。这是会话与风控的设计，不是所有网站都必须“IP一变立即退出”，也不是登录标记永远不会失效。 同一办公室共用IP，账号为什么仍能分开 同事甲和乙各自在自己的浏览器登录，浏览器保存不同会话标记。两人的请求经过共同出口，网站看到相同来源IP，却仍可验证两份凭据并返回各自资料。 反过来，一个人使用手机和电脑登录同一账号，可以对应两个会话、两种来源，却仍读取同一账号记录。于是“来自哪里”“哪段访问”“登录哪个账号”不是一一对应。共享IP造成的识别歧义 账号也不必等于一个自然人：可能有组织授权共用账号，一个人也可能拥有多个账号。网站记录某账号执行过操作，与证明某个自然人亲手执行，仍是不同程度的判断。 换浏览器或清Cookie以后，为什么又要求登录 另一个浏览器通常没有自动复制原浏览器的登录标记。网站接到的请求缺少有效凭据，就可能先显示登录页。清除网站Cookie也可能产生类似效果：本机不再携带原标记，但服务器上的账号、订单和其他会话不会因此自动删除。 你重新登录同一账号，网站核对通过后仍可以显示先前订单。没有凭据可用，与账号资料不存在，是两件事。 退出登录则应由网站处理会话失效或撤销，使相应凭据不能继续授权。退出是否同时影响其他设备、多久生效，要看产品说明；不能只看地址栏切到首页就确认所有设备已经退出。 主站已经登录，帮助站为什么还要再登 Cookie有发送范围。某份标记可能只发给shop.example.com，另一份可能按适当父域名范围发送；路径、保护要求及浏览器规则也会影响实际发送。 即使同属一个品牌，help.example.com的登录服务也未必使用相同会话。网站可以专门建设共享登录，让两边配合；不能只凭域名长得相近，就推断凭据自动通用。 页面程序能否读取另一个来源的数据，还涉及同源等规则。这与Cookie能否发送、业务账号是否共用有关联，却不是同一套判断。具体区别见子域名与登录。 设备指纹怎样帮助关联，又为什么不能当身份证 网站可能取得浏览器类型、语言、设备环境等特征，把组合用于比较访问是否可能相关。这类做法常称设备指纹。它是关联判断，不是一个永远不变、全球唯一的硬件编号。风险产品公开的设备与会话输入 同类设备可能相似，系统升级或设置变化又会改变特征。因此，看到“环境相似”不能直接证明同一自然人；看到“环境不同”也不能直接证明账号被盗。 动作 首先改变的东西 不会自动做到的事 --- --- --- 换Wi-Fi、流量或VPN出口 某些连接的来源与路径 删除账号和历史订单 清除网站Cookie 本浏览器保存的相应标记 清除服务端全部记录 退出登录 相应会话的授权状态 隐藏一切来源与行为线索 换设备后重新登录 本地环境、会话和可能的网络来源 让网站无法关联同一账号 网站认人时，可以同时查看来源IP、有效凭据、账号、设备环境和行为。不同线索各有作用，也各有误差。它们怎样参与验证码和异常登录判断，见IP与风控。","outline":[{"id":"section-1","title":"从第一次进入，到“我的订单”出现","depth":2},{"id":"section-2","title":"从Wi-Fi切到流量，哪一项变了，哪一项还在","depth":2},{"id":"section-3","title":"同一办公室共用IP，账号为什么仍能分开","depth":2},{"id":"section-4","title":"换浏览器或清Cookie以后，为什么又要求登录","depth":2},{"id":"section-5","title":"主站已经登录，帮助站为什么还要再登","depth":2},{"id":"section-6","title":"设备指纹怎样帮助关联，又为什么不能当身份证","depth":2}]},{"id":"transactions","group":"services","title":"点了登录、提交订单，什么才算真的成功？","question":"点了登录、提交订单，什么才算真的成功？","summary":"区分点按钮、请求送达、业务写入、响应到达和界面显示，不因超时重复推断成败。","terms":["业务状态","接口","API"],"aliases":["业务状态","","接口","","API","interface 接口"],"related":["web","identity","delivery"],"html":"\u003cp>按钮按下，页面转圈，几秒后提示超时。你不知道订单到底有没有创建。\u003cstrong>本机记录点击、请求送到、服务保存、回复返回和页面显示，是相接但不同的事件。\u003c/strong> 后面一步失败，不能自动推翻前面已经完成的事。\u003c/p>\n\u003cp>下面用一个\u003cstrong>虚构购物系统\u003c/strong>讲解。商品、订单和结果均为教学设计，不需要操作真实付款；现实业务以服务正式记录和恢复流程核对。\u003c/p>\n\u003ch2 id=\"section-1\">登录表单出现以后，账号还要怎样被验证\u003c/h2>\n\u003cp>浏览器先取得并显示登录表单。你填写账号和密码，页面可能先检查是否漏填，再向登录服务提交。网站核对相应凭据，符合要求后建立或更新会话，让浏览器保存适当标记。\u003c/p>\n\u003cp>你随后请求订单列表，浏览器再按规则附上标记，网站核对有效性与账号权限，才返回你的订单。显示输入框、通过本地检查与完成网站登录，是三个不同阶段。\u003ca href=\"#/identity\">会话怎样连接连续操作\u003c/a>\u003c/p>\n\u003cp>所以“密码不能为空”可能是页面本地判断，“密码错误”可能是服务核对后拒绝；单看一个转圈动画，则不能知道它正在等连接、验证还是回复。具体提示的来源与产品设计有关。\u003c/p>\n\u003ch2 id=\"section-2\">查询订单与创建订单，为什么要分开看\u003c/h2>\n\u003cp>查询是索取已有状态，创建订单则请求网站改变状态。页面程序通过约定入口提交资料、接收结果，这类供程序使用的约定常叫接口或API。它可以在地址栏不变时发生。\u003c/p>\n\u003cp>创建请求里可以有商品、数量、收货地址和登录凭据。网站收到后，仍要核对这些资料、账号权限、库存以及重复操作等规则。客户端写了商品42或订单18，不表示服务必须接受，也不授予不属于你的权限。\u003c/p>\n\u003ch2 id=\"section-3\">一次订单提交，沿着五个阶段走\u003c/h2>\n\u003cp>小林选好商品和数量，按提交。本例先假设资料完整、库存足够，服务能够正常处理。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>页面记录操作并检查资料。\u003c/strong> 页面程序读取选择，检查必填项，准备请求。若地址漏填，它可以直接提示，尚不发出完整订单提交。\u003c/li>\n\u003cli>\u003cstrong>请求经过网络。\u003c/strong> 浏览器把请求交给通信系统，沿适当路径到达网站。接收机制取得数据，只说明数据交到了相应一端，不表示订单已写入。\u003c/li>\n\u003cli>\u003cstrong>网站核对并保存。\u003c/strong> 订单服务验证账号、商品和库存等条件，在本例中创建订单记录并产生订单编号。若库存不足，也可以在这里返回拒绝，网络未必出错。\u003c/li>\n\u003cli>\u003cstrong>网站回复结果。\u003c/strong> 服务把订单编号及状态放入响应，交给网络返回。即使订单已保存，返回途中仍可能中断。\u003c/li>\n\u003cli>\u003cstrong>浏览器解释并显示。\u003c/strong> 页面程序读到结果，停止等待，显示订单号。若本地程序异常，远处成功结果也未必正确出现在屏幕上。\u003c/li>\n\u003c/ol>\n\u003cp>这些阶段回答不同问题。“响应顺利到达”不自动等于业务获准：响应正文仍可能说库存不足；HTTP的数字状态也需要结合正文理解。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP语义与响应状态\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-4\">同一个“超时”，背后可以有两条经过\u003c/h2>\n\u003cp>现在只改变中断发生的位置：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>教学情形\u003c/th>\n\u003cth>服务那边发生什么\u003c/th>\n\u003cth>小林这边可能看到什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>请求没有成功交到订单程序\u003c/td>\n\u003ctd>没有创建这笔订单\u003c/td>\n\u003ctd>等待后超时，没有订单号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>订单已保存，成功回复没有及时返回\u003c/td>\n\u003ctd>已有订单记录\u003c/td>\n\u003ctd>也可能超时，没有订单号\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>因此，没有订单号只能先说明页面没有取得或显示需要的结果。它不能在这两种经过中替你选择一个答案。\u003c/p>\n\u003cp>这也是为什么不能反复点提交来“确认刚才没成功”。如果每次点击被当作新的业务请求，就可能产生重复操作。服务可以采用操作编号或其他防重安排，但不能假定每个网站都有相同保护。\u003c/p>\n\u003ch2 id=\"section-5\">超时以后，怎样用新证据确认结果\u003c/h2>\n\u003cp>小林保留操作时间和提示，重新打开同一服务的订单列表，核对本次商品、时间、编号和状态。假设本例查到对应记录，便知道服务已有这笔订单，应按该记录继续核对，而不是再提交同样动作。\u003c/p>\n\u003cp>如果列表也打不开，保存结果仍未知，应按服务恢复流程查询。若查不到，也要考虑该服务是否存在处理或显示延迟，结合官方提示决定下一步，不能一律把“暂时没查到”当作“绝对没保存”。\u003c/p>\n\u003cp>如果页面明确说明资料未通过且未提交，则按提示修正再操作。证据不同，下一步就不同：已查到记录，围绕已有状态处理；未知，先查状态；明确未提交，再修正输入。\u003c/p>\n\u003ch2 id=\"section-6\">换热点以后成功了，是否说明刚才真的失败\u003c/h2>\n\u003cp>提交后原网络断开，再切热点查到成功记录，新网络可能只是让你重新取到了先前保存的结果。创建动作可能早已发生，并不一定是在换网后第一次完成。\u003c/p>\n\u003cp>同理，刷新页面、退出账号或换IP，通常不会自动撤销服务已经保存的订单。撤销需要按相应业务流程提出并取得结果，不能靠改变界面或网络状态代替。\u003c/p>\n\u003ch2 id=\"section-7\">网络重传与业务防重，分别处理哪种重复\u003c/h2>\n\u003cp>在一次数据传输中，通信机制可以补发缺失部分，并在接收端处理顺序和重复，尽量正确交付那串数据。连接失败后应用重新发一份业务请求，或者用户再次点击，则可能是另一次业务动作。\u003c/p>\n\u003cp>网站需要在业务层识别两次请求是否代表同一操作。这与网络重传不是一个开关。\u003ca href=\"#/delivery\">传输确认\u003c/a>解释前者负责的数据交付；\u003ca href=\"#/messages\">消息状态\u003c/a>把服务接收、设备取得和人已读分开。\u003c/p>\n\u003cp>日常核对结果时，抓住服务名称、操作时间、具体提示、正式编号与官方记录。这样能说明哪一步已经有证据，哪一步仍未知，避免把所有等待都叫网络问题，也避免把一条动画当成真实业务状态。\u003c/p>\n","text":"点了登录、提交订单，什么才算真的成功？ 按钮按下，页面转圈，几秒后提示超时。你不知道订单到底有没有创建。 本机记录点击、请求送到、服务保存、回复返回和页面显示，是相接但不同的事件。 后面一步失败，不能自动推翻前面已经完成的事。 下面用一个 虚构购物系统 讲解。商品、订单和结果均为教学设计，不需要操作真实付款；现实业务以服务正式记录和恢复流程核对。 登录表单出现以后，账号还要怎样被验证 浏览器先取得并显示登录表单。你填写账号和密码，页面可能先检查是否漏填，再向登录服务提交。网站核对相应凭据，符合要求后建立或更新会话，让浏览器保存适当标记。 你随后请求订单列表，浏览器再按规则附上标记，网站核对有效性与账号权限，才返回你的订单。显示输入框、通过本地检查与完成网站登录，是三个不同阶段。会话怎样连接连续操作 所以“密码不能为空”可能是页面本地判断，“密码错误”可能是服务核对后拒绝；单看一个转圈动画，则不能知道它正在等连接、验证还是回复。具体提示的来源与产品设计有关。 查询订单与创建订单，为什么要分开看 查询是索取已有状态，创建订单则请求网站改变状态。页面程序通过约定入口提交资料、接收结果，这类供程序使用的约定常叫接口或API。它可以在地址栏不变时发生。 创建请求里可以有商品、数量、收货地址和登录凭据。网站收到后，仍要核对这些资料、账号权限、库存以及重复操作等规则。客户端写了商品42或订单18，不表示服务必须接受，也不授予不属于你的权限。 一次订单提交，沿着五个阶段走 小林选好商品和数量，按提交。本例先假设资料完整、库存足够，服务能够正常处理。 1. 页面记录操作并检查资料。 页面程序读取选择，检查必填项，准备请求。若地址漏填，它可以直接提示，尚不发出完整订单提交。 2. 请求经过网络。 浏览器把请求交给通信系统，沿适当路径到达网站。接收机制取得数据，只说明数据交到了相应一端，不表示订单已写入。 3. 网站核对并保存。 订单服务验证账号、商品和库存等条件，在本例中创建订单记录并产生订单编号。若库存不足，也可以在这里返回拒绝，网络未必出错。 4. 网站回复结果。 服务把订单编号及状态放入响应，交给网络返回。即使订单已保存，返回途中仍可能中断。 5. 浏览器解释并显示。 页面程序读到结果，停止等待，显示订单号。若本地程序异常，远处成功结果也未必正确出现在屏幕上。 这些阶段回答不同问题。“响应顺利到达”不自动等于业务获准：响应正文仍可能说库存不足；HTTP的数字状态也需要结合正文理解。HTTP语义与响应状态 同一个“超时”，背后可以有两条经过 现在只改变中断发生的位置： 教学情形 服务那边发生什么 小林这边可能看到什么 --- --- --- 请求没有成功交到订单程序 没有创建这笔订单 等待后超时，没有订单号 订单已保存，成功回复没有及时返回 已有订单记录 也可能超时，没有订单号 因此，没有订单号只能先说明页面没有取得或显示需要的结果。它不能在这两种经过中替你选择一个答案。 这也是为什么不能反复点提交来“确认刚才没成功”。如果每次点击被当作新的业务请求，就可能产生重复操作。服务可以采用操作编号或其他防重安排，但不能假定每个网站都有相同保护。 超时以后，怎样用新证据确认结果 小林保留操作时间和提示，重新打开同一服务的订单列表，核对本次商品、时间、编号和状态。假设本例查到对应记录，便知道服务已有这笔订单，应按该记录继续核对，而不是再提交同样动作。 如果列表也打不开，保存结果仍未知，应按服务恢复流程查询。若查不到，也要考虑该服务是否存在处理或显示延迟，结合官方提示决定下一步，不能一律把“暂时没查到”当作“绝对没保存”。 如果页面明确说明资料未通过且未提交，则按提示修正再操作。证据不同，下一步就不同：已查到记录，围绕已有状态处理；未知，先查状态；明确未提交，再修正输入。 换热点以后成功了，是否说明刚才真的失败 提交后原网络断开，再切热点查到成功记录，新网络可能只是让你重新取到了先前保存的结果。创建动作可能早已发生，并不一定是在换网后第一次完成。 同理，刷新页面、退出账号或换IP，通常不会自动撤销服务已经保存的订单。撤销需要按相应业务流程提出并取得结果，不能靠改变界面或网络状态代替。 网络重传与业务防重，分别处理哪种重复 在一次数据传输中，通信机制可以补发缺失部分，并在接收端处理顺序和重复，尽量正确交付那串数据。连接失败后应用重新发一份业务请求，或者用户再次点击，则可能是另一次业务动作。 网站需要在业务层识别两次请求是否代表同一操作。这与网络重传不是一个开关。传输确认解释前者负责的数据交付；消息状态把服务接收、设备取得和人已读分开。 日常核对结果时，抓住服务名称、操作时间、具体提示、正式编号与官方记录。这样能说明哪一步已经有证据，哪一步仍未知，避免把所有等待都叫网络问题，也避免把一条动画当成真实业务状态。","outline":[{"id":"section-1","title":"登录表单出现以后，账号还要怎样被验证","depth":2},{"id":"section-2","title":"查询订单与创建订单，为什么要分开看","depth":2},{"id":"section-3","title":"一次订单提交，沿着五个阶段走","depth":2},{"id":"section-4","title":"同一个“超时”，背后可以有两条经过","depth":2},{"id":"section-5","title":"超时以后，怎样用新证据确认结果","depth":2},{"id":"section-6","title":"换热点以后成功了，是否说明刚才真的失败","depth":2},{"id":"section-7","title":"网络重传与业务防重，分别处理哪种重复","depth":2}]},{"id":"messages","group":"services","title":"朋友不在线，消息怎么还能送达？","question":"朋友不在线，消息怎么还能送达？","summary":"服务器先保存消息，朋友设备恢复联网后再收取；发送、送达和已读各有含义。","terms":["存储转发","推送","已读"],"aliases":["存储转发","","推送","","已读",""],"related":["web","delivery","identity"],"html":"\u003cp>你半夜发一条消息，朋友早晨开机以后仍能看到。\u003cstrong>常见安排是你的应用先把消息交给服务保存，朋友重新联网后，再由服务把待收内容送给他的设备。\u003c/strong> 两个人不必始终同时在线。\u003c/p>\n\u003cp>不同聊天产品在保存、加密和同步方面各有设计。下面使用一个\u003cstrong>虚构聊天服务\u003c/strong>讲清这种机制，不把它当作某个真实产品的内部实现说明。\u003c/p>\n\u003ch2 id=\"section-1\">你点发送时，先联系谁\u003c/h2>\n\u003cp>你在朋友的聊天窗口输入“到了吗”，点发送。应用准备消息正文、收件账号和用来证明当前登录身份的标记，再把请求发给聊天服务。\u003c/p>\n\u003cp>网络地址把数据送到服务入口；服务读取请求里的收件账号，才知道这句话发给谁。它不是沿着朋友上次使用的手机IP一直寻找，也不靠句子的含义猜收件人。朋友换了Wi-Fi或手机流量，你通常也不需要重新向他索要IP。\u003c/p>\n\u003cp>服务核对你是否可以发送，把这条消息与发送账号、接收账号及相应记录关联起来。假设它已按设计保存，并回复接收成功，才可以说服务这一阶段完成。你自己屏幕上先出现气泡，则可能只是应用已经记录了本地操作，未必证明远处保存成功。\u003c/p>\n\u003ch2 id=\"section-2\">朋友离线时，消息等在哪里\u003c/h2>\n\u003cp>本例中，服务发现朋友的设备此时不可联系，就保留待交付记录。朋友早晨打开手机，应用重新连接服务，证明自己登录哪个账号，并同步尚未取得的消息。服务找到相应记录后发给手机，应用显示这句话。\u003c/p>\n\u003cp>朋友在线时，服务可以利用已有连接交付；离线时，则等待后续同步。邮件的服务器接收、保存和继续转发，也体现了跨越双方不同时在线的通信方式。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321.html\" target=\"_blank\" rel=\"noopener noreferrer\">邮件的接收与重试\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>“服务保存”不一定等于“服务能读正文”。产品可以保存受到端到端加密保护的消息，交给获准设备解密；具体历史消息保留、恢复和多设备方式，需要看产品设计。这里说明交付关系，不承诺所有聊天记录都可无限期取回。\u003c/p>\n\u003ch2 id=\"section-3\">锁屏通知是怎样到达的\u003c/h2>\n\u003cp>手机里的应用并不一定始终保持同样的运行状态。系统提供的推送服务，可以帮助应用服务器把提醒交到设备，由系统展示或交给应用处理。例如Apple设备可以使用APNs这样的通知链。\u003ca href=\"https://developer.apple.com/documentation/usernotifications/setting-up-a-remote-notification-server\" target=\"_blank\" rel=\"noopener noreferrer\">Apple远程通知说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>一次图片消息可以有两条相接但不同的工作：推送服务先带来“有一张图片”的提醒，聊天应用打开后再向自己的服务下载图片正文。提醒比较轻，完整内容需要另外取得。\u003c/p>\n\u003cp>所以，锁屏通知已经出现，点进去图片仍转圈，并不矛盾：通知到过，图片下载尚未完成。反过来，通知权限关闭时，打开聊天应用仍可能同步到消息。没有弹窗，不足以证明服务没有保存。\u003c/p>\n\u003ch2 id=\"section-4\">同一个账号的手机和电脑，为什么暂时不同步\u003c/h2>\n\u003cp>假设手机在线，电脑休眠。服务先把新消息交给手机，电脑要等恢复连接后再同步。两台设备加入同一账号，并不意味着它们每一刻都保持相同进度。\u003c/p>\n\u003cp>阅读状态也需要传递。手机打开对话后，应用按产品规则报告阅读状态，服务保存相应变化；电脑下一次同步才可能更新未读数。有些产品会同步某些状态，有些保留设备差异，不能用一个产品的表现代表所有聊天工具。\u003c/p>\n\u003cp>因此，检查“消息丢了”时，要先说清是服务未接收、某台设备未取得、图片没下完，还是未读标记没更新。它们需要的证据不同。\u003c/p>\n\u003ch2 id=\"section-5\">已发送、已送达、已读，各确认到哪一步\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>在本例中的显示\u003c/th>\n\u003cth>假设产品给它的含义\u003c/th>\n\u003cth>后面仍可能没发生的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>发送中\u003c/td>\n\u003ctd>本机正在尝试交付\u003c/td>\n\u003ctd>服务还没有保存成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已发送\u003c/td>\n\u003ctd>服务确认接收\u003c/td>\n\u003ctd>朋友设备还没取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已送达\u003c/td>\n\u003ctd>朋友设备确认取得\u003c/td>\n\u003ctd>朋友还没打开内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已读\u003c/td>\n\u003ctd>应用报告相应阅读状态\u003c/td>\n\u003ctd>对方不一定认真看完、理解或同意\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>这是一组教学定义，真实产品的对勾和文字必须以自己的说明为准。有的产品不提供这些阶段，有的把状态合并。网络数据到达、服务保存、设备显示与人的阅读，不是一个事件的不同叫法。\u003c/p>\n\u003cp>若发送后换网才看见成功，也可能只是新连接查到了先前已经保存的记录，不能直接认定消息刚刚才发出。确认结果与实际保存分离的情况，见\u003ca href=\"#/delivery\">传输确认\u003c/a>和\u003ca href=\"#/transactions\">提交后怎样核对记录\u003c/a>。\u003c/p>\n","text":"朋友不在线，消息怎么还能送达？ 你半夜发一条消息，朋友早晨开机以后仍能看到。 常见安排是你的应用先把消息交给服务保存，朋友重新联网后，再由服务把待收内容送给他的设备。 两个人不必始终同时在线。 不同聊天产品在保存、加密和同步方面各有设计。下面使用一个 虚构聊天服务 讲清这种机制，不把它当作某个真实产品的内部实现说明。 你点发送时，先联系谁 你在朋友的聊天窗口输入“到了吗”，点发送。应用准备消息正文、收件账号和用来证明当前登录身份的标记，再把请求发给聊天服务。 网络地址把数据送到服务入口；服务读取请求里的收件账号，才知道这句话发给谁。它不是沿着朋友上次使用的手机IP一直寻找，也不靠句子的含义猜收件人。朋友换了Wi-Fi或手机流量，你通常也不需要重新向他索要IP。 服务核对你是否可以发送，把这条消息与发送账号、接收账号及相应记录关联起来。假设它已按设计保存，并回复接收成功，才可以说服务这一阶段完成。你自己屏幕上先出现气泡，则可能只是应用已经记录了本地操作，未必证明远处保存成功。 朋友离线时，消息等在哪里 本例中，服务发现朋友的设备此时不可联系，就保留待交付记录。朋友早晨打开手机，应用重新连接服务，证明自己登录哪个账号，并同步尚未取得的消息。服务找到相应记录后发给手机，应用显示这句话。 朋友在线时，服务可以利用已有连接交付；离线时，则等待后续同步。邮件的服务器接收、保存和继续转发，也体现了跨越双方不同时在线的通信方式。邮件的接收与重试 “服务保存”不一定等于“服务能读正文”。产品可以保存受到端到端加密保护的消息，交给获准设备解密；具体历史消息保留、恢复和多设备方式，需要看产品设计。这里说明交付关系，不承诺所有聊天记录都可无限期取回。 锁屏通知是怎样到达的 手机里的应用并不一定始终保持同样的运行状态。系统提供的推送服务，可以帮助应用服务器把提醒交到设备，由系统展示或交给应用处理。例如Apple设备可以使用APNs这样的通知链。Apple远程通知说明 一次图片消息可以有两条相接但不同的工作：推送服务先带来“有一张图片”的提醒，聊天应用打开后再向自己的服务下载图片正文。提醒比较轻，完整内容需要另外取得。 所以，锁屏通知已经出现，点进去图片仍转圈，并不矛盾：通知到过，图片下载尚未完成。反过来，通知权限关闭时，打开聊天应用仍可能同步到消息。没有弹窗，不足以证明服务没有保存。 同一个账号的手机和电脑，为什么暂时不同步 假设手机在线，电脑休眠。服务先把新消息交给手机，电脑要等恢复连接后再同步。两台设备加入同一账号，并不意味着它们每一刻都保持相同进度。 阅读状态也需要传递。手机打开对话后，应用按产品规则报告阅读状态，服务保存相应变化；电脑下一次同步才可能更新未读数。有些产品会同步某些状态，有些保留设备差异，不能用一个产品的表现代表所有聊天工具。 因此，检查“消息丢了”时，要先说清是服务未接收、某台设备未取得、图片没下完，还是未读标记没更新。它们需要的证据不同。 已发送、已送达、已读，各确认到哪一步 在本例中的显示 假设产品给它的含义 后面仍可能没发生的事 --- --- --- 发送中 本机正在尝试交付 服务还没有保存成功 已发送 服务确认接收 朋友设备还没取得 已送达 朋友设备确认取得 朋友还没打开内容 已读 应用报告相应阅读状态 对方不一定认真看完、理解或同意 这是一组教学定义，真实产品的对勾和文字必须以自己的说明为准。有的产品不提供这些阶段，有的把状态合并。网络数据到达、服务保存、设备显示与人的阅读，不是一个事件的不同叫法。 若发送后换网才看见成功，也可能只是新连接查到了先前已经保存的记录，不能直接认定消息刚刚才发出。确认结果与实际保存分离的情况，见传输确认和提交后怎样核对记录。","outline":[{"id":"section-1","title":"你点发送时，先联系谁","depth":2},{"id":"section-2","title":"朋友离线时，消息等在哪里","depth":2},{"id":"section-3","title":"锁屏通知是怎样到达的","depth":2},{"id":"section-4","title":"同一个账号的手机和电脑，为什么暂时不同步","depth":2},{"id":"section-5","title":"已发送、已送达、已读，各确认到哪一步","depth":2}]},{"id":"live","group":"services","title":"视频通话为什么比看视频更怕卡？","question":"视频通话为什么比看视频更怕卡？","summary":"实时互动更需要及时信息，过晚到达会破坏交流。","terms":["缓冲","中继","实时通信"],"aliases":["缓冲","","中继","","实时通信",""],"related":["delivery","speed"],"html":"\u003cp>同一条网络，看录播很顺，开会却常听不清。\u003cstrong>录播可以提前下载尚未播放的内容；通话只能传送刚刚发生的声音和画面，来得太晚就会打断对话。\u003c/strong> 两者都需要容量，但实时交流还格外在意到达时间是否稳定。\u003c/p>\n\u003ch2 id=\"section-1\">你说一句话，对方听见之前发生什么\u003c/h2>\n\u003cp>以一次视频会议的日常过程说明。你的麦克风不断采集声音，软件把短时间内的声音编码、压缩，交给网络发送。它不能等整场会议录完，必须一边记录、一边传。\u003c/p>\n\u003cp>对方的设备收到后，按顺序和播放时间等信息准备声音，再交给扬声器。为了吸收一点到达波动，接收端可以先暂存少量内容再播放。这段暂存叫缓冲：某份数据稍晚一点，仍可能赶在相应声音播放前补上。\u003c/p>\n\u003cp>但缓冲越多，听到你说话就越晚。对方还没听完，你以为他没反应而补一句；你们又可能同时开始说话。这样的互相打断，有时来自传送和播放等待，不只是沟通习惯。\u003c/p>\n\u003ch2 id=\"section-2\">录播提前十秒，通话为什么做不到\u003c/h2>\n\u003cp>下面做一个\u003cstrong>虚构教学比较\u003c/strong>：录好的课程已保存在服务器，播放器提前取得接下来十秒的内容。网络短暂停顿时，它仍可以播放手里这部分；恢复后继续下载，只要缓冲没耗尽，观众可能感觉不到中断。\u003c/p>\n\u003cp>会议中未来十秒的话尚未说出，服务器和对方设备都没有这份内容，无法提前下载。声音一旦连续迟到，接收端只能在等待、跳过过晚片段、恢复部分声音或调整质量之间选择，具体办法由产品设计。\u003c/p>\n\u003cp>迟到很久的文件片段仍值得补齐，迟到很久的问候却可能已经错过回应时机。所以实时通信会平衡完整性与及时性；并不是它比下载少做了工作，而是“什么结果更有用”变了。\u003c/p>\n\u003cp>应用可以自行安排恢复或纠错，不能只因基础传送使用UDP，就断定它一定不补救或不保护内容；详见\u003ca href=\"#/delivery\">传送规则的分工\u003c/a>。\u003c/p>\n\u003cp>录播也会卡：持续传入速度低于播放需要，已有缓冲最终会用完。它只是多了提前准备的机会，不是完全不依赖网络。\u003c/p>\n\u003ch2 id=\"section-3\">邀请能发出去，为什么接通后没有声音\u003c/h2>\n\u003cp>会议首先需要一些协调工作：确认账号、加入房间、通知对方，并交换建立连接所需的信息。完成这些工作，不等于声音和画面已经能顺利传送。\u003c/p>\n\u003cp>以浏览器实时通信为例，设备可能尝试直接交换媒体，也可能经中继服务器转送。负责房间和账号的业务服务，与实际转送声音的路径，可以不是同一条链。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API/Connectivity\" target=\"_blank\" rel=\"noopener noreferrer\">WebRTC怎样建立可用连接\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>所以房间列表和聊天文字正常，声音仍可能失败。也可能网络传送没问题，只是麦克风没有获得权限、录音设备选错或扬声器静音。必须先区分“没有采到声音”“没有及时送到”“收到后没有播放”。\u003c/p>\n\u003cp>普通电话还涉及运营商的号码资格、呼叫建立和通话系统。外观同样是两个人说话，不表示与聊天软件视频通话使用完全相同的服务。\u003c/p>\n\u003ch2 id=\"section-4\">对方声音忽断忽续，为什么发文字却正常\u003c/h2>\n\u003cp>短文字晚一点到，通常仍能完整阅读；声音要按节奏连续播放。若各小段到达时间忽快忽慢，缓冲可能来不及吸收，就会出现停顿或恢复痕迹。这种时间波动称为抖动。\u003c/p>\n\u003cp>数据丢失也可能导致缺口，路径排队则会增加等待。提高家庭套餐的标称下载容量，并不自动消除这些问题。软件有时通过降低视频清晰度、调整发送量或恢复声音，争取让交流继续；真实效果取决于当时限制在哪里。\u003c/p>\n\u003cp>中继也不必然比直连差。多经一个服务器可能增加等待，但服务器与双方网络的连接条件也可能更好，不能仅凭路径图多一个节点就判断质量。\u003c/p>\n\u003ch2 id=\"section-5\">遇到卡顿，哪些对照能帮助理解\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到的变化\u003c/th>\n\u003cth>为什么值得检查\u003c/th>\n\u003cth>还不能直接认定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>关闭视频后声音改善\u003c/td>\n\u003ctd>需要传的数据量减少，容量压力可能缓解\u003c/td>\n\u003ctd>原因一定是套餐太低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本地录音也没有声音\u003c/td>\n\u003ctd>问题可能在采集、权限或设备选择\u003c/td>\n\u003ctd>网络一定丢包\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只有某一方持续异常\u003c/td>\n\u003ctd>可比较该方设备、接入与到其他人的路径\u003c/td>\n\u003ctd>一定是对方宽带故障\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同设备同会议换热点改善\u003c/td>\n\u003ctd>接入和后续路径的差异值得核对\u003c/td>\n\u003ctd>已确定某一台路由器损坏\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>这些观察帮助安排检查顺序，不单独证明原因。先看录音和播放是否正常，再看目标会议在相近条件下的结果，比只凭一个测速数字判断更有用。容量、延迟、抖动和丢包分别怎样影响体验，见\u003ca href=\"#/speed\">网速\u003c/a>；如何保持对照可解释，见\u003ca href=\"#/troubleshoot\">访问排障\u003c/a>。\u003c/p>\n","text":"视频通话为什么比看视频更怕卡？ 同一条网络，看录播很顺，开会却常听不清。 录播可以提前下载尚未播放的内容；通话只能传送刚刚发生的声音和画面，来得太晚就会打断对话。 两者都需要容量，但实时交流还格外在意到达时间是否稳定。 你说一句话，对方听见之前发生什么 以一次视频会议的日常过程说明。你的麦克风不断采集声音，软件把短时间内的声音编码、压缩，交给网络发送。它不能等整场会议录完，必须一边记录、一边传。 对方的设备收到后，按顺序和播放时间等信息准备声音，再交给扬声器。为了吸收一点到达波动，接收端可以先暂存少量内容再播放。这段暂存叫缓冲：某份数据稍晚一点，仍可能赶在相应声音播放前补上。 但缓冲越多，听到你说话就越晚。对方还没听完，你以为他没反应而补一句；你们又可能同时开始说话。这样的互相打断，有时来自传送和播放等待，不只是沟通习惯。 录播提前十秒，通话为什么做不到 下面做一个 虚构教学比较 ：录好的课程已保存在服务器，播放器提前取得接下来十秒的内容。网络短暂停顿时，它仍可以播放手里这部分；恢复后继续下载，只要缓冲没耗尽，观众可能感觉不到中断。 会议中未来十秒的话尚未说出，服务器和对方设备都没有这份内容，无法提前下载。声音一旦连续迟到，接收端只能在等待、跳过过晚片段、恢复部分声音或调整质量之间选择，具体办法由产品设计。 迟到很久的文件片段仍值得补齐，迟到很久的问候却可能已经错过回应时机。所以实时通信会平衡完整性与及时性；并不是它比下载少做了工作，而是“什么结果更有用”变了。 应用可以自行安排恢复或纠错，不能只因基础传送使用UDP，就断定它一定不补救或不保护内容；详见传送规则的分工。 录播也会卡：持续传入速度低于播放需要，已有缓冲最终会用完。它只是多了提前准备的机会，不是完全不依赖网络。 邀请能发出去，为什么接通后没有声音 会议首先需要一些协调工作：确认账号、加入房间、通知对方，并交换建立连接所需的信息。完成这些工作，不等于声音和画面已经能顺利传送。 以浏览器实时通信为例，设备可能尝试直接交换媒体，也可能经中继服务器转送。负责房间和账号的业务服务，与实际转送声音的路径，可以不是同一条链。WebRTC怎样建立可用连接 所以房间列表和聊天文字正常，声音仍可能失败。也可能网络传送没问题，只是麦克风没有获得权限、录音设备选错或扬声器静音。必须先区分“没有采到声音”“没有及时送到”“收到后没有播放”。 普通电话还涉及运营商的号码资格、呼叫建立和通话系统。外观同样是两个人说话，不表示与聊天软件视频通话使用完全相同的服务。 对方声音忽断忽续，为什么发文字却正常 短文字晚一点到，通常仍能完整阅读；声音要按节奏连续播放。若各小段到达时间忽快忽慢，缓冲可能来不及吸收，就会出现停顿或恢复痕迹。这种时间波动称为抖动。 数据丢失也可能导致缺口，路径排队则会增加等待。提高家庭套餐的标称下载容量，并不自动消除这些问题。软件有时通过降低视频清晰度、调整发送量或恢复声音，争取让交流继续；真实效果取决于当时限制在哪里。 中继也不必然比直连差。多经一个服务器可能增加等待，但服务器与双方网络的连接条件也可能更好，不能仅凭路径图多一个节点就判断质量。 遇到卡顿，哪些对照能帮助理解 看到的变化 为什么值得检查 还不能直接认定 --- --- --- 关闭视频后声音改善 需要传的数据量减少，容量压力可能缓解 原因一定是套餐太低 本地录音也没有声音 问题可能在采集、权限或设备选择 网络一定丢包 只有某一方持续异常 可比较该方设备、接入与到其他人的路径 一定是对方宽带故障 同设备同会议换热点改善 接入和后续路径的差异值得核对 已确定某一台路由器损坏 这些观察帮助安排检查顺序，不单独证明原因。先看录音和播放是否正常，再看目标会议在相近条件下的结果，比只凭一个测速数字判断更有用。容量、延迟、抖动和丢包分别怎样影响体验，见网速；如何保持对照可解释，见访问排障。","outline":[{"id":"section-1","title":"你说一句话，对方听见之前发生什么","depth":2},{"id":"section-2","title":"录播提前十秒，通话为什么做不到","depth":2},{"id":"section-3","title":"邀请能发出去，为什么接通后没有声音","depth":2},{"id":"section-4","title":"对方声音忽断忽续，为什么发文字却正常","depth":2},{"id":"section-5","title":"遇到卡顿，哪些对照能帮助理解","depth":2}]},{"id":"speed","group":"services","title":"网速很高，为什么打开网页仍然慢？","question":"网速很高，为什么打开网页仍然慢？","summary":"速度取决于容量、等待、波动以及服务处理。","terms":["带宽","延迟","抖动","丢包"],"aliases":["带宽","bandwidth 网速 速度","延迟","latency ping 等待","抖动","","丢包",""],"related":["delivery","web","troubleshoot","live","routes"],"html":"\u003cp>测速结果很好，商品页却要等，视频会议也会卡。\u003cstrong>单位时间能传多少数据，与点一下以后要等多久，是不同问题。\u003c/strong> 一次真实操作还包含查询地址、建立连接、网站处理、下载与显示；其中任何一项等待，都可能让你觉得慢。\u003c/p>\n\u003ch2 id=\"section-1\">打开一张小网页，为什么也要等几秒\u003c/h2>\n\u003cp>以浏览器第一次进入商品站为例。它可能先等名称查询，取得地址后联系服务器，建立HTTPS保护，再发出页面请求。网站收到后可能还要查询商品资料、生成回答。页面回来，浏览器继续取图片和程序，最后才能完成显示。\u003c/p>\n\u003cp>这些工作并不是“页面只有一点点文字，所以瞬间就该结束”。有些等待发生在数据正式下载之前，有些发生在网站处理期间。增加家中宽带容量，并不能替远方服务器提前算好结果。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">网页请求的组成\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>再打开一次可能更快：已有地址记录、连接、图片和程序可以按规则复用，少做了之前的一部分工作。这不必意味着第二次宽带速度提高了。\u003c/p>\n\u003ch2 id=\"section-2\">下载速度、延迟、抖动和丢包，各在说什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>在实际通信中看什么\u003c/th>\n\u003cth>日常感受\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>带宽\u003c/td>\n\u003ctd>一段连接在单位时间可承载的数据量\u003c/td>\n\u003ctd>大文件多久能传完，多人共享是否吃紧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>延迟\u003c/td>\n\u003ctd>信息到达或一次往返需要的时间\u003c/td>\n\u003ctd>点一下等多久，对方晚多久听到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>抖动\u003c/td>\n\u003ctd>数据到达时间的波动\u003c/td>\n\u003ctd>声音一阵顺、一阵断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>丢包\u003c/td>\n\u003ctd>某些小份数据没能到达\u003c/td>\n\u003ctd>下载补发等待，实时播放出现缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>标称带宽描述一段连接的能力，真实下载速度还受整条路径、对方发送能力和设备处理等影响。一次操作很慢，也未必已经把带宽用满。\u003c/p>\n\u003cp>可以把差异放到实际任务里：下载一份已经准备好的大文件，持续传来的数据量很重要；远程对话每次回应都要等待，延迟更明显；声音忽早忽晚，就还需要看抖动。它们不能用同一个“快”字互相替代。\u003c/p>\n\u003ch2 id=\"section-3\">家里上传照片，为什么其他人开网页也变慢\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构家庭场景\u003c/strong>：电脑自动备份照片，长时间持续上传。家中会议声音开始断续，另一台设备点网页也要多等。\u003c/p>\n\u003cp>这些访问都要经过某些共同连接。若上传数据到达出口的速度长期超过可向外发送的速度，就会排队。新来的网页请求和会议数据也可能等待；下载过程中的确认等返回信息还需要上行，因此“我只在上传”也可能影响别人的接收体验。\u003c/p>\n\u003cp>暂停备份后明显改善，是一个有用对照，说明共同发送压力值得检查。它不能单独确定队列在哪台设备，也不能证明路由器必须更换。实际问题还可能涉及无线信号、设备负载和上游路径。\u003c/p>\n\u003cp>传输机制会依据反馈调整发送速度，目的之一就是适应接收方和路径承受能力，并非一直发得越猛越快。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP中的流量与拥塞处理\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-4\">测速连的是谁，为什么不代表所有应用\u003c/h2>\n\u003cp>测速工具在某个时刻，联系它选定的测试服务器，测量这段通信的表现。测试点可能较近，连接条件也与购物站、公司系统或会议服务器不同。\u003c/p>\n\u003cp>因此，测速快至少说明“这次到这个测试点的数据传送表现不错”，不能扩大成“所有外部网络和服务都正常”。如果目标网站忙着处理订单，测速也不会代替它完成处理。\u003c/p>\n\u003cp>若同一场会议在原网络差、切热点改善，可以更关注原接入及后续路径；但要尽量保持设备、会议和时段接近。前后隔很久，服务负载也可能变化，证据就更难解释。\u003ca href=\"#/troubleshoot\">对照排障\u003c/a>\u003c/p>\n\u003ch2 id=\"section-5\">页面秒开，订单为什么还是一直转圈\u003c/h2>\n\u003cp>首页的一部分可能已经缓存在本机或分发服务器，打开时可以迅速使用。订单却要查询你账号下最新记录，仍需网站响应。缓存让展示更快，不会自动替实时业务提供正确答案。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9111.html\" target=\"_blank\" rel=\"noopener noreferrer\">缓存怎样复用与核对\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>这时应该具体描述“首页显示快，查看订单等待”，而不是把两次任务平均成一句“网速忽快忽慢”。页面下载、业务处理和本地显示承担不同工作；同一网站中的不同功能也可能联系不同程序。\u003c/p>\n\u003ch2 id=\"section-6\">要改善体验，先确定究竟慢在哪种动作\u003c/h2>\n\u003cp>如果是大文件持续传得慢，可比较目标服务、同网其他设备和共享负载；如果是点击后很久才开始出现内容，要考虑查询、连接和服务处理；如果是会议声音不稳定，还应检查录音播放、延迟与抖动。\u003c/p>\n\u003cp>不需要先掌握所有网络参数。先保留具体任务、等待发生的位置、相近条件下的对照结果，再决定找网络提供者、服务支持还是检查本机设备。只升级某一段容量，不保证整条访问链都会同比变快。\u003c/p>\n","text":"网速很高，为什么打开网页仍然慢？ 测速结果很好，商品页却要等，视频会议也会卡。 单位时间能传多少数据，与点一下以后要等多久，是不同问题。 一次真实操作还包含查询地址、建立连接、网站处理、下载与显示；其中任何一项等待，都可能让你觉得慢。 打开一张小网页，为什么也要等几秒 以浏览器第一次进入商品站为例。它可能先等名称查询，取得地址后联系服务器，建立HTTPS保护，再发出页面请求。网站收到后可能还要查询商品资料、生成回答。页面回来，浏览器继续取图片和程序，最后才能完成显示。 这些工作并不是“页面只有一点点文字，所以瞬间就该结束”。有些等待发生在数据正式下载之前，有些发生在网站处理期间。增加家中宽带容量，并不能替远方服务器提前算好结果。网页请求的组成 再打开一次可能更快：已有地址记录、连接、图片和程序可以按规则复用，少做了之前的一部分工作。这不必意味着第二次宽带速度提高了。 下载速度、延迟、抖动和丢包，各在说什么 名称 在实际通信中看什么 外验证。\u003c/strong> IP容易取得、覆盖面广，所以常被用作风控的重要输入。\u003c/p>\n\u003cp>这里的风控，是服务用不完整的信息判断是否放行、补充验证或限制操作。重要输入不等于唯一依据；IP本身不能证明一个人的真实身份或意图。\u003c/p>\n\u003ch2 id=\"section-1\">未登录的请求，怎样先被放到同一组\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构商品站\u003c/strong>，规则与结果仅用于讲解，不代表任何真实平台。你打开商品页，网站的接收入口拿到请求，也能取得来源地址。它可以先记下“这个来源在当前时段访问了哪些入口、发生多少请求”。\u003c/p>\n\u003cp>第二次访问到来，即使没有账号或Cookie，仍可按同一来源累计。假如服务发现这一组请求过于密集，可以要求验证码、暂缓回答或降低请求频率。这种按来源计数不依赖先知道姓名，也不等于已经验证每次操作来自同一个人。\u003ca href=\"https://developers.cloudflare.com/waf/rate-limiting-rules/parameters/\" target=\"_blank\" rel=\"noopener noreferrer\">按IP计数与共享来源\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>IP因此能帮助服务在登录前保护公开入口，也能为登录后的异常判断补充来源信息。但共享、变化和代理会限制它的精度，所以并不是所有平台、所有操作都应把IP当作最核心或决定性的条件。\u003c/p>\n\u003ch2 id=\"section-2\">同事一起遇到验证码，为什么未必是人人违规\u003c/h2>\n\u003cp>假设办公室多人经过同一个公共出口。甲看商品、乙搜索、丙反复刷新，网站按IP合计时，可能把三人的请求放在同一组。每个人觉得自己点得很少，服务看到的却是同一来源的累计活动。\u003c/p>\n\u003cp>若规则触发额外验证，几个人可能同时看到验证码。他们起初可能以为“平台认定我们每个人都违规了”，但共同出口的累计方式提供了另一种解释。完成核对后，更合适的判断是这组来源需要进一步确认，而不是直接认定三个人分别违规。完成服务要求的验证，保留发生时间和共同网络这一线索；持续影响工作时，再向服务支持说明。\u003c/p>\n\u003cp>改变一个条件：只有甲的账号在家里、办公室和手机热点上都受限制，其他同事正常。仅靠共同出口就不容易解释这个结果，应更多看甲收到的账号通知、会话与操作记录。对照能改变检查顺序，仍不能自动揭示平台内部规则。\u003c/p>\n\u003ch2 id=\"section-3\">IP地区、网络归属和信誉，是怎样得到的\u003c/h2>\n\u003cp>IP数字里没有直接写着城市或家庭住址。服务可以把地址交给相应数据库，取得估计地区、所属网络、已知代理属性，以及基于观察形成的风险资料。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>资料\u003c/th>\n\u003cth>在判断中可能有什么用\u003c/th>\n\u003cth>为什么不能单独定论\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>大致地区\u003c/td>\n\u003ctd>与账号常用地区比较，发现明显变化\u003c/td>\n\u003ctd>估计有误差，出口位置也可能不同于本人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网络归属\u003c/td>\n\u003ctd>区分普通接入、公司、云或托管网络等来源\u003c/td>\n\u003ctd>正常工作也会使用云服务和企业网络\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已知VPN或代理属性\u003c/td>\n\u003ctd>识别一部分已观察到的转送出口\u003c/td>\n\u003ctd>数据可能不完整，使用VPN也有正常用途\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>历史与当前行为\u003c/td>\n\u003ctd>比较同来源的请求量、失败尝试等\u003c/td>\n\u003ctd>共享来源可能混合多人的活动\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>地区是推断，不能凭一次跳变定位某个人或证明被盗。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-geolocation-risk-data-maxmind\" target=\"_blank\" rel=\"noopener noreferrer\">地区估计的边界\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a> 代理标签也依赖持续观察和数据库，不是看一眼地址就能全知。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-anonymizer-risk-data-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">代理风险资料\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-4\">一次异地登录，系统还可以看什么\u003c/h2>\n\u003cp>继续这个虚构账号场景。你出差后登录，来源地区变了，但原有设备和会话仍在；系统可以把这些线索放在一起，决定是否要求二次验证。\u003c/p>\n\u003cp>如果同时出现大量错误密码尝试、陌生设备和敏感操作，组合含义就可能不同。二次验证通过以后，服务又可以获得“使用者仍能完成相应身份验证”的新证据，再按规则处理这次访问。\u003c/p>\n\u003cp>风险服务可以接收IP、浏览器、会话等输入，但公开字段不能代表某个平台实际采用的全部组合、权重或阈值。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/device-inputs-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">公开设备输入示例\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a> 讲清机制，不等于知道某平台“换哪种IP就一定放行”。\u003c/p>\n\u003ch2 id=\"section-5\">网站前面还有CDN，它看到的是谁的IP\u003c/h2>\n\u003cp>浏览器有时先联系CDN或反向转送入口，再由入口联系业务服务器。后面的程序直接收到的连接，可能来自入口服务器，而不是用户出口。\u003c/p>\n\u003cp>服务需要从自己信任的入口取得适当来源信息，正确区分用户来源与中间节点。如果随意相信客户端自行填写的“我来自某地址”，数据就可能不可靠；如果把所有入口连接都误算成一个用户，又可能把大量正常访问混在一起。\u003c/p>\n\u003cp>这解释了为什么“网站使用IP风控”仍包含识别来源、取得资料和组合判断等工作，不是拿到一个数字就自动得到人的身份。\u003c/p>\n\u003ch2 id=\"section-6\">验证码、登录验证、频率限制与封禁有何不同\u003c/h2>\n\u003cp>验证码常用于进一步确认访问方式或缓解滥用；二次登录验证用于核对当前使用者是否有权使用账号；频率限制控制一段时间的操作量；账号限制则可能涉及业务政策和账号状态。\u003c/p>\n\u003cp>它们可能连续出现，也可能只出现一种。应看完整提示、官方通知与当前操作，而不是一见验证码就认定账号已封。换网络以后恢复，也只说明改变条件后结果不同，不能独立证明原IP就是唯一原因。\u003c/p>\n\u003cp>日常遇到异常，可以记录：发生时间、具体入口、完整提示、是否登录、同网其他人是否受影响、同账号在另一获准网络的结果。按官方验证或申诉流程恢复，比同时改多项设置更容易保留可解释的线索。\u003c/p>\n\u003ch2 id=\"section-7\">“住宅、机房、静态、独享、纯净”各在承诺什么\u003c/h2>\n\u003cp>住宅、机房通常描述网络归属类别；静态描述地址按安排是否保持；独享描述服务承诺的共用范围。它们是不同属性，不能拼成一个普遍有效的“平台信任等级”。\u003c/p>\n\u003cp>“纯净”没有跨平台统一的信任标准。家庭出口也可能汇集异常活动，固定独享来源也可能属于已知代理；平台还会查看账号和行为。任何标签都不能保证永不验证，也不能替你取得业务权限。\u003c/p>\n\u003cp>理解IP的用途后，比较稳妥的判断是：它帮助关联网络来源和活动，平台再根据更多信息作决定。账号为何跨IP保留，见\u003ca href=\"#/identity\">身份与会话\u003c/a>；出口怎样变化，见\u003ca href=\"#/vpn\">VPN\u003c/a>。\u003c/p>\n","text":"IP为什么是风控的重要线索？ 你还没登录，网站就要求验证码；同事在同一办公室也遇到相同提示。 网站接收通信时就能观察来源IP，因而可以在账号未知时，先按来源统计请求、查询网络属性，再决定是否需要额外验证。 IP容易取得、覆盖面广，所以常被用作风控的重要输入。 这里的风控，是服务用不完整的信息判断是否放行、补充验证或限制操作。重要输入不等于唯一依据；IP本身不能证明一个人的真实身份或意图。 未登录的请求，怎样先被放到同一组 以下是 虚构商品站 ，规则与结果仅用于讲解，不代表任何真实平台。你打开商品页，网站的接收入口拿到请求，也能取得来源地址。它可以先记下“这个来源在当前时段访问了哪些入口、发生多少请求”。 第二次访问到来，即使没有账号或Cookie，仍可按同一来源累计。假如服务发现这一组请求过于密集，可以要求验证码、暂缓回答或降低请求频率。这种按来源计数不依赖先知道姓名，也不等于已经验证每次操作来自同一个人。按IP计数与共享来源 IP因此能帮助服务在登录前保护公开入口，也能为登录后的异常判断补充来源信息。但共享、变化和代理会限制它的精度，所以并不是所有平台、所有操作都应把IP当作最核心或决定性的条件。 同事一起遇到验证码，为什么未必是人人违规 假设办公室多人经过同一个公共出口。甲看商品、乙搜索、丙反复刷新，网站按IP合计时，可能把三人的请求放在同一组。每个人觉得自己点得很少，服务看到的却是同一来源的累计活动。 若规则触发额外验证，几个人可能同时看到验证码。他们起初可能以为“平台认定我们每个人都违规了”，但共同出口的累计方式提供了另一种解释。完成核对后，更合适的判断是这组来源需要进一步确认，而不是直接认定三个人分别违规。完成服务要求的验证，保留发生时间和共同网络这一线索；持续影响工作时，再向服务支持说明。 改变一个条件：只有甲的账号在家里、办公室和手机热点上都受限制，其他同事正常。仅靠共同出口就不容易解释这个结果，应更多看甲收到的账号通知、会话与操作记录。对照能改变检查顺序，仍不能自动揭示平台内部规则。 IP地区、网络归属和信誉，是怎样得到的 IP数字里没有直接写着城市或家庭住址。服务可以把地址交给相应数据库，取得估计地区、所属网络、已知代理属性，以及基于观察形成的风险资料。 资料 在判断中可能有什么用 为什么不能单独定论 --- --- --- 大致地区 与账号常用地区比较，发现明显变化 估计有误差，出口位置也可能不同于本人 网络归属 区分普通接入、公司、云或托管网络等来源 正常工作也会使用云服务和企业网络 已知VPN或代理属性 识别一部分已观察到的转送出口 数据可能不完整，使用VPN也有正常用途 历史与当前行为 比较同来源的请求量、失败尝试等 共享来源可能混合多人的活动 地区是推断，不能凭一次跳变定位某个人或证明被盗。地区估计的边界 代理标签也依赖持续观察和数据库，不是看一眼地址就能全知。代理风险资料 一次异地登录，系统还可以看什么 继续这个虚构账号场景。你出差后登录，来源地区变了，但原有设备和会话仍在；系统可以把这些线索放在一起，决定是否要求二次验证。 如果同时出现大量错误密码尝试、陌生设备和敏感操作，组合含义就可能不同。二次验证通过以后，服务又可以获得“使用者仍能完成相应身份验证”的新证据，再按规则处理这次访问。 风险服务可以接收IP、浏览器、会话等输入，但公开字段不能代表某个平台实际采用的全部组合、权重或阈值。公开设备输入示例 讲清机制，不等于知道某平台“换哪种IP就一定放行”。 网站前面还有CDN，它看到的是谁的IP 浏览器有时先联系CDN或反向转送入口，再由入口联系业务服务器。后面的程序直接收到的连接，可能来自入口服务器，而不是用户出口。 服务需要从自己信任的入口取得适当来源信息，正确区分用户来源与中间节点。如果随意相信客户端自行填写的“我来自某地址”，数据就可能不可靠；如果把所有入口连接都误算成一个用户，又可能把大量正常访问混在一起。 这解释了为什么“网站使用IP风控”仍包含识别来源、取得资料和组合判断等工作，不是拿到一个数字就自动得到人的身份。 验证码、登录验证、频率限制与封禁有何不同 验证码常用于进一步确认访问方式或缓解滥用；二次登录验证用于核对当前使用者是否有权使用账号；频率限制控制一段时间的操作量；账号限制则可能涉及业务政策和账号状态。 它们可能连续出现，也可能只出现一种。应看完整提示、官方通知与当前操作，而不是一见验证码就认定账号已封。换网络以后恢复，也只说明改变条件后结果不同，不能独立证明原IP就是唯一原因。 日常遇到异常，可以记录：发生时间、具体入口、完整提示、是否登录、同网其他人是否受影响、同账号在另一获准网络的结果。按官方验证或申诉流程恢复，比同时改多项设置更容易保留可解释的线索。 “住宅、机房、静态、独享、纯净”各在承诺什么 住宅、机房通常描述网络归属类别；静态描述地址按安排是否保持；独享描述服务承诺的共用范围。它们是不同属性，不能拼成一个普遍有效的“平台信任等级”。 “纯净”没有跨平台统一的信任标准。家庭出口也可能汇集异常活动，固定独享来源也可能属于已知代理；平台还会查看账号和行为。任何标签都不能保证永不验证，也不能替你取得业务权限。 理解IP的用途后，比较稳妥的判断是：它帮助关联网络来源和活动，平台再根据更多信息作决定。账号为何跨IP保留，见身份与会话；出口怎样变化，见VPN。","outline":[{"id":"section-1","title":"未登录的请求，怎样先被放到同一组","depth":2},{"id":"section-2","title":"同事一起遇到验证码，为什么未必是人人违规","depth":2},{"id":"section-3","title":"IP地区、网络归属和信誉，是怎样得到的","depth":2},{"id":"section-4","title":"一次异地登录，系统还可以看什么","depth":2},{"id":"section-5","title":"网站前面还有CDN，它看到的是谁的IP","depth":2},{"id":"section-6","title":"验证码、登录验证、频率限制与封禁有何不同","depth":2},{"id":"section-7","title":"“住宅、机房、静态、独享、纯净”各在承诺什么","depth":2}]},{"id":"vpn","group":"vpn","title":"VPN究竟改变了哪一段通信？","question":"VPN究竟改变了哪一段通信？","summary":"VPN建立受保护的连接，让选定流量经另一端访问资源。","terms":["VPN","隧道","出口节点"],"aliases":["VPN","virtual private network 虚拟专用网络","隧道","","出口节点",""],"related":["routes","security","split","setup","remote"],"html":"\u003cp>你在家可以购物，却打不开公司报销系统；连接公司VPN以后，报销页能打开，公共IP查询结果却没变。\u003cstrong>VPN先借现有网络联系另一端，再把指定通信经这条连接送过去。它可以只接通内部系统，也可以让公共上网经另一处出口。\u003c/strong> 要看用途和覆盖范围，不能只看“已连接”。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgNDIwIDUyMCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVp i+ivt+axgui1sOWTqumHjOOAgeaYr+WQpuWFgeiuuOiuv+mXrjwvdGV4dD48dGV4dCB4PSIyMTAiIHk9IjQ5MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzI0M2IzNiI+5LiN5piv5q+P5p2h6L+e5o6l6YO95o2i5LiK572RSVA8L3RleHQ+PC9nPjwvc3ZnPg==\" alt=\"VPN隧道依托原网络，另一端可通向获准内部资源，也可作为公共上网出口；用途取决于路径。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>VPN隧道依托原网络，另一端可通向获准内部资源，也可作为公共上网出口；用途取决于路径。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">在家打开公司报销页，多了哪一步\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构公司场景\u003c/strong>。内部报销系统只接受公司安排的网络访问。你在家直接打开时，可能连名称都查不到，也可能知道地址却没有可达路径。\u003c/p>\n\u003cp>你打开公司指定VPN客户端，按要求验证身份。客户端先通过家里的网络联系公司VPN服务器，双方建立受保护连接。接下来，客户端按照公司规则，把发往内部系统的通信交给这条连接；必要时，内部名称查询也采用公司的安排。\u003c/p>\n\u003cp>公司VPN服务器收到以后，把里面发往报销系统的通信继续送过去。报销系统返回页面，数据再通过公司VPN回到家中设备，浏览器才显示内容。系统仍可能要求报销账号登录，连接资格与业务权限各自核对。\u003c/p>\n\u003cp>普通购物访问如果不在公司分流范围，仍经家庭出口。因此“报销页能打开”和“查公网IP没变”可以同时成立；这恰好可能符合公司只转送内部访问的目的。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">内部成员连接与公共出口的区别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-2\">所谓隧道，是不是另拉了一条物理网线\u003c/h2>\n\u003cp>没有。可以把通信分成里面和外面两层来理解：里面的数据说明“去报销系统”；客户端把它装进受保护的VPN通信，外面这层先说明“去公司VPN服务器”。家中路由器和运营商按外层目标继续转送。\u003c/p>\n\u003cp>到达公司VPN服务器后，服务器去掉外面这层处理，按里面的目标继续发送。报销系统的回复则沿相应连接返回。把一层通信装在另一层里传送，常称隧道。\u003c/p>\n\u003cp>这条隧道仍要靠原来的Wi-Fi、网线或移动网络运行。本地接入彻底断了，客户端连VPN服务器都联系不到，就不能靠“VPN已安装”继续送数据。VPN不是一份可以脱离现有网络独立运行的互联网。\u003c/p>\n\u003ch2 id=\"section-3\">想让网站看到另一处来源，过程怎样不同\u003c/h2>\n\u003cp>换一个\u003cstrong>虚构公共出口场景\u003c/strong>：你希望指定访问从远方出口发出。客户端将适用的网站通信先送入VPN隧道；另一端再联系公共网站，网站通常观察到出口的公网来源。回复先回到出口，再经VPN送回你的设备。\u003c/p>\n\u003cp>这次改变的是公共访问的后半段路径与网站看到的网络来源。验证时，应在目标应用中确认实际来源是否符合所选出口；只证明内部报销能用，并不能证明这项目的也完成。\u003c/p>\n\u003cp>工具也可能要求另行选择或批准出口。普通私有成员网络可以先只连接获准设备，不默认接管公共上网。两种能力可能在同一个客户端里，开了其中一项，不代表另一项自动开启。\u003c/p>\n\u003ch2 id=\"section-4\">“已连接”后，为什么仍可能打不开目标\u003c/h2>\n\u003cp>连接成功，首先说明设备与VPN另一端已建立相应通信。下一步还有几个独立条件：内部名称是否查对，目标流量是否在覆盖范围，另一端是否能联系目标，目标程序是否运行，以及账号有没有使用权限。\u003c/p>\n\u003cp>例如，你到达报销登录页，却收到无权查看某部门资料，这通常已经超过“隧道有没有建立”的问题；若客户端自身提示认证失败，报销网站可能还没有参与。\u003c/p>\n\u003cp>按阶段区分，才知道应核对连接资料、路径范围还是业务账号。\u003ca href=\"#/setup\">配置与验证\u003c/a>给出对应操作，\u003ca href=\"#/split\">分流\u003c/a>解释为什么不同软件可能结果不同。\u003c/p>\n\u003ch2 id=\"section-5\">切换节点，为什么有时更快、有时更慢\u003c/h2>\n\u003cp>节点通常指提供连接或转送的另一端。换节点，会改变先到哪处网络、后半段怎样联系网站，也可能改变来源地区、共用活动与服务观察到的属性。\u003c/p>\n\u003cp>如果新路径更适合目标服务，体验可能改善；若绕行更长、出口拥堵或本地到节点不稳定，体验也可能变差。VPN服务器还要处理通信，因此不能从“开启VPN”直接推断统一加速。\u003c/p>\n\u003cp>网络来源变了，浏览器保存的登录标记未必变化，网站仍可以认得账号。平台是否要求验证，还要看自己的规则，不是节点名字自动决定。\u003c/p>\n\u003ch2 id=\"section-6\">VPN和HTTPS分别保护哪里\u003c/h2>\n\u003cp>VPN通常保护隧道两端之间的通信。HTTPS可以同时保护浏览器与实际HTTPS接收端之间的网页内容；两种保护覆盖的参与者和范围不同。VPN出口参与向目标转送，但普通转送HTTPS数据不等于可以解密正文。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security\" target=\"_blank\" rel=\"noopener noreferrer\">传输保护的范围\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>VPN提供者仍可能取得相应连接线索，网站也仍处理你提交的账号和资料。因此，VPN不能自动删除登录记录、保证完全匿名或补足网站权限。理解时分别问：先到哪里、哪些通信经过、哪一段受到保护。远程访问自有设备的具体场景，见\u003ca href=\"#/remote\">远程连接\u003c/a>。\u003c/p>\n","text":"VPN究竟改变了哪一段通信？ 你在家可以购物，却打不开公司报销系统；连接公司VPN以后，报销页能打开，公共IP查询结果却没变。 VPN先借现有网络联系另一端，再把指定通信经这条连接送过去。它可以只接通内部系统，也可以让公共上网经另一处出口。 要看用途和覆盖范围，不能只看“已连接”。 VPN隧道依托原网络，另一端可通向获准内部资源，也可作为公共上网出口；用途取决于路径。 在家打开公司报销页，多了哪一步 以下是 虚构公司场景 。内部报销系统只接受公司安排的网络访问。你在家直接打开时，可能连名称都查不到，也可能知道地址却没有可达路径。 你打开公司指定VPN客户端，按要求验证身份。客户端先通过家里的网络联系公司VPN服务器，双方建立受保护连接。接下来，客户端按照公司规则，把发往内部系统的通信交给这条连接；必要时，内部名称查询也采用公司的安排。 公司VPN服务器收到以后，把里面发往报销系统的通信继续送过去。报销系统返回页面，数据再通过公司VPN回到家中设备，浏览器才显示内容。系统仍可能要求报销账号登录，连接资格与业务权限各自核对。 普通购物访问如果不在公司分流范围，仍经家庭出口。因此“报销页能打开”和“查公网IP没变”可以同时成立；这恰好可能符合公司只转送内部访问的目的。内部成员连接与公共出口的区别 所谓隧道，是不是另拉了一条物理网线 没有。可以把通信分成里面和外面两层来理解：里面的数据说明“去报销系统”；客户端把它装进受保护的VPN通信，外面这层先说明“去公司VPN服务器”。家中路由器和运营商按外层目标继续转送。 到达公司VPN服务器后，服务器去掉外面这层处理，按里面的目标继续发送。报销系统的回复则沿相应连接返回。把一层通信装在另一层里传送，常称隧道。 这条隧道仍要靠原来的Wi-Fi、网线或移动网络运行。本地接入彻底断了，客户端连VPN服务器都联系不到，就不能靠“VPN已安装”继续送数据。VPN不是一份可以脱离现有网络独立运行的互联网。 想让网站看到另一处来源，过程怎样不同 换一个 虚构公共出口场景 ：你希望指定访问从远方出口发出。客户端将适用的网站通信先送入VPN隧道；另一端再联系公共网站，网站通常观察到出口的公网来源。回复先回到出口，再经VPN送回你的设备。 这次改变的是公共访问的后半段路径与网站看到的网络来源。验证时，应在目标应用中确认实际来源是否符合所选出口；只证明内部报销能用，并不能证明这项目的也完成。 工具也可能要求另行选择或批准出口。普通私有成员网络可以先只连接获准设备，不默认接管公共上网。两种能力可能在同一个客户端里，开了其中一项，不代表另一项自动开启。 “已连接”后，为什么仍可能打不开目标 连接成功，首先说明设备与VPN另一端已建立相应通信。下一步还有几个独立条件：内部名称是否查对，目标流量是否在覆盖范围，另一端是否能联系目标，目标程序是否运行，以及账号有没有使用权限。 例如，你到达报销登录页，却收到无权查看某部门资料，这通常已经超过“隧道有没有建立”的问题；若客户端自身提示认证失败，报销网站可能还没有参与。 按阶段区分，才知道应核对连接资料、路径范围还是业务账号。配置与验证给出对应操作，分流解释为什么不同软件可能结果不同。 切换节点，为什么有时更快、有时更慢 节点通常指提供连接或转送的另一端。换节点，会改变先到哪处网络、后半段怎样联系网站，也可能改变来源地区、共用活动与服务观察到的属性。 如果新路径更适合目标服务，体验可能改善；若绕行更长、出口拥堵或本地到节点不稳定，体验也可能变差。VPN服务器还要处理通信，因此不能从“开启VPN”直接推断统一加速。 网络来源变了，浏览器保存的登录标记未必变化，网站仍可以认得账号。平台是否要求验证，还要看自己的规则，不是节点名字自动决定。 VPN和HTTPS分别保护哪里 VPN通常保护隧道两端之间的通信。HTTPS可以同时保护浏览器与实际HTTPS接收端之间的网页内容；两种保护覆盖的参与者和范围不同。VPN出口参与向目标转送，但普通转送HTTPS数据不等于可以解密正文。传输保护的范围 VPN提供者仍可能取得相应连接线索，网站也仍处理你提交的账号和资料。因此，VPN不能自动删除登录记录、保证完全匿名或补足网站权限。理解时分别问：先到哪里、哪些通信经过、哪一段受到保护。远程访问自有设备的具体场景，见远程连接。","outline":[{"id":"section-1","title":"在家打开公司报销页，多了哪一步","depth":2},{"id":"section-2","title":"所谓隧道，是不是另拉了一条物理网线","depth":2},{"id":"section-3","title":"想让网站看到另一处来源，过程怎样不同","depth":2},{"id":"section-4","title":"“已连接”后，为什么仍可能打不开目标","depth":2},{"id":"section-5","title":"切换节点，为什么有时更快、有时更慢","depth":2},{"id":"section-6","title":"VPN和HTTPS分别保护哪里","depth":2}]},{"id":"split","group":"vpn","title":"全局、分流、代理，为什么影响的应用不同？","question":"全局、分流、代理，为什么影响的应用不同？","summary":"规则决定哪些请求直达、哪些经过中间节点。","terms":["代理","分流","全局模式","节点"],"aliases":["代理","proxy 系统代理","分流","split tunnel routing 全局","全局模式","","节点",""],"related":["vpn","setup","identity"],"html":"\u003cp>浏览器开了代理后能正常访问，会议软件却还是卡；公司VPN连上以后报销页能开，IP查询页又没变。\u003cstrong>连接工具需要先决定接管哪些通信，其他通信仍可能使用原来的路径。\u003c/strong> “开启”描述工具状态，不直接说明整台设备的所有请求都经过它。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTYyIiB2aWV3Qm94PSIwIDAgNDIwIDU2MiI+PGR
