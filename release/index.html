显示；CDN在不同地点安排服务器。如果其中一台保存着可用副本，浏览器就可以从那里下载，不必每次都找网站最初保存文件的服务器。CDN既可以分发图片等文件，也可以转送其他请求。\u003c/p>\n\u003cp>\u003cstrong>教学对照\u003c/strong>：你断网后，已打开商品页的图片仍在，但点击实时库存失败。图片已经保存在电脑里或显示在屏幕上；查询实时库存却还需要网站回复。这能解释“页面明明在，为什么说没网络”。有内容的缓存还需按规则核对新鲜度，不能拿旧价格代替业务最终确认。\u003c/p>\n\u003ch2 id=\"section-4\">同一网页里，哪些属于本地变化\u003c/h2>\n\u003cp>展开说明、滚动到评价、切换已经取得的图片，可能只在本地处理；加入购物车或查询订单，通常还要联系服务。地址栏改变不保证请求发生，地址栏不变也不保证没有请求。\u003c/p>\n\u003cp>具体操作由页面程序设计。判断时要看按钮具体做什么：展开已有文字可以在本机完成，查询最新订单则需要网站回复。不能只看按钮的外观。详细网址差异见\u003ca href=\"#/url-pages\">路径参数\u003c/a>，完整顺序见\u003ca href=\"#/browsing\">从点击到页面\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">从找到地址，到收到页面内容\u003c/h2>\n\u003cp>没有可复用连接或缓存时，常见过程是：查询名称，联系网站，建立用于HTTPS的受保护连接，发出网页请求，取得响应，再请求图片、样式等资源。实际浏览器会复用连接、缓存或并行工作，所以顺序不是每次都完全重来。\u003c/p>\n\u003cp>HTTP就是客户端与服务端组织请求和响应的一套规则。请求说明想取得或执行什么，网站在响应中发回页面内容或操作结果。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">网页通信的组成\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">服务器并不住在屏幕里\u003c/h2>\n\u003cp>浏览器在你的设备上工作，服务器是远处提供服务的计算机与程序。服务器可以交回静态文件，也可以根据账号与资料生成结果。你看到按钮，并不意味着按钮要做的全部工作已经完成。\u003c/p>\n\u003cp>以下是\u003cstrong>虚构教学示意\u003c/strong>：页面先显示按钮；你点“查看订单”，才发出另一次请求。网页外壳可以正常出现，订单服务却暂时失败。这种情况下不能说“网页开了，所以网络与所有功能都没问题”。\u003c/p>\n\u003ch2 id=\"section-7\">一张页面，可以从多个地方下载内容\u003c/h2>\n\u003cp>图片、视频与登录请求可以发往不同服务器。CDN会在不同地点安排服务器：已有可用副本时，可以直接提供文件；需要实时查询时，可以把请求转给网站后台程序。\u003c/p>\n\u003cp>缓存是保留副本并在规则允许时再次使用。它能减少重复获取，但需要检查是否还新鲜，或向原服务确认。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9111.html\" target=\"_blank\" rel=\"noopener noreferrer\">缓存如何复用响应\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-8\">为什么刷新，也未必看到最新内容\u003c/h2>\n\u003cp>浏览器、分发设施、应用都可能保存副本。刷新触发了新的动作，不保证每个环节都重新下载所有文件。内容更新慢时，要区分名称地址仍旧、内容副本仍旧和服务根本没更新；这是不同原因。\u003c/p>\n\u003cp>打开网页的完整模型是“找到服务 → 请求页面内容 → 收到回复 → 显示网页 → 按操作继续通信”。理解这条链，比把网站想成远方电脑的一张截图更接近实际。\u003c/p>\n","text":"打开一个网页，背后是谁在回答？ 你输入网址后，屏幕上的网页通常不是一次收到的完整图片。 网站先发回页面的文字和结构说明。浏览器按说明继续下载图片、排版规则和页面程序，再在你的设备上显示网页。 浏览器下载页面结构、图片等内容，再按排版规则显示。它可能向不同服务器下载这些文件。 用商品页上的图片和按钮区分三种工作 在一个 虚构商品站 里，你先看见标题，随后商品图片出现，点击“查看运费”才得到另一个结果。标题和图片可以分开下载。点击“查看运费”时，页面程序又向网站发了一次请求。所以网页是逐步下载、显示和更新的，不是从远处收到的一整张截图。 浏览器负责显示与交互，远处服务负责提供内容或处理业务。网站给回的页面描述叫HTML，样式常由CSS描述，程序常由JavaScript运行；这些名字可以先理解为内容结构、外观规则和操作逻辑，不必学写代码。浏览器读取这些内容，按照排版规则显示页面，运行按钮等功能的程序；网络负责把这些内容传过来。 网站收到请求后，还可能交给其他程序 浏览器可能先联系网站统一接收请求的服务器，再由它把商品查询、登录、下单分别交给不同程序。收到商品页，不代表登录和下单程序此时也都正常。 例如页面可以从shop.example.com下载，图片从img.example.com下载，库存从api.example.com查询。这些名称由网站管理者安排，也可以把三个功能放在同一主机名下，用不同路径区分。因此文字正常、图片失败、下单失败可以是不同通信或业务环节。 缓存和CDN怎样改变你看到的过程 浏览器已有可用图片，就可能直接显示；CDN在不同地点安排服务器。如果其中一台保存着可用副本，浏览器就可以从那里下载，不必每次都找网站最初保存文件的服务器。CDN既可以分发图片等文件，也可以转送其他请求。 教学对照 ：你断网后，已打开商品页的图片仍在，但点击实时库存失败。图片已经保存在电脑里或显示在屏幕上；查询实时库存却还需要网站回复。这能解释“页面明明在，为什么说没网络”。有内容的缓存还需按规则核对新鲜度，不能拿旧价格代替业务最终确认。 同一网页里，哪些属于本地变化 展开说明、滚动到评价、切换已经取得的图片，可能只在本地处理；加入购物车或查询订单，通常还要联系服务。地址栏改变不保证请求发生，地址栏不变也不保证没有请求。 具体操作由页面程序设计。判断时要看按钮具体做什么：展开已有文字可以在本机完成，查询最新订单则需要网站回复。不能只看按钮的外观。详细网址差异见路径参数，完整顺序见从点击到页面。 从找到地址，到收到页面内容 没有可复用连接或缓存时，常见过程是：查询名称，联系网站，建立用于HTTPS的受保护连接，发出网页请求，取得响应，再请求图片、样式等资源。实际浏览器会复用连接、缓存或并行工作，所以顺序不是每次都完全重来。 HTTP就是客户端与服务端组织请求和响应的一套规则。请求说明想取得或执行什么，网站在响应中发回页面内容或操作结果。网页通信的组成 服务器并不住在屏幕里 浏览器在你的设备上工作，服务器是远处提供服务的计算机与程序。服务器可以交回静态文件，也可以根据账号与资料生成结果。你看到按钮，并不意味着按钮要做的全部工作已经完成。 以下是 虚构教学示意 ：页面先显示按钮；你点“查看订单”，才发出另一次请求。网页外壳可以正常出现，订单服务却暂时失败。这种情况下不能说“网页开了，所以网络与所有功能都没问题”。 一张页面，可以从多个地方下载内容 图片、视频与登录请求可以发往不同服务器。CDN会在不同地点安排服务器：已有可用副本时，可以直接提供文件；需要实时查询时，可以把请求转给网站后台程序。 缓存是保留副本并在规则允许时再次使用。它能减少重复获取，但需要检查是否还新鲜，或向原服务确认。缓存如何复用响应 为什么刷新，也未必看到最新内容 浏览器、分发设施、应用都可能保存副本。刷新触发了新的动作，不保证每个环节都重新下载所有文件。内容更新慢时，要区分名称地址仍旧、内容副本仍旧和服务根本没更新；这是不同原因。 打开网页的完整模型是“找到服务 → 请求页面内容 → 收到回复 → 显示网页 → 按操作继续通信”。理解这条链，比把网站想成远方电脑的一张截图更接近实际。 相关概念 - 名称查询 - 网站怎样识别会话 - 自己的网页怎样对外可达","outline":[{"id":"section-1","title":"用商品页上的图片和按钮区分三种工作","depth":2},{"id":"section-2","title":"网站收到请求后，还可能交给其他程序","depth":2},{"id":"section-3","title":"缓存和CDN怎样改变你看到的过程","depth":2},{"id":"section-4","title":"同一网页里，哪些属于本地变化","depth":2},{"id":"section-5","title":"从找到地址，到收到页面内容","depth":2},{"id":"section-6","title":"服务器并不住在屏幕里","depth":2},{"id":"section-7","title":"一张页面，可以从多个地方下载内容","depth":2},{"id":"section-8","title":"为什么刷新，也未必看到最新内容","depth":2}]},{"id":"url-pages","group":"services","title":"路径、问号、井号：不同页面究竟怎么区分？","question":"路径、问号、井号：不同页面究竟怎么区分？","summary":"从商品、搜索、分页和章节链接区分路径、查询和片段，并理解URL之外的请求数据。","terms":["路径","参数","锚点","请求正文"],"aliases":["路径","path pathname 目录","参数","","锚点","","请求正文",""],"related":["url","web"],"html":"\u003cp>你在同一网站点商品、搜索、翻页和评价，地址栏会发生不同变化：有时斜线后的文字变了，有时问号后多了条件，有时只有井号后改变，还有时候地址根本不变。\u003cstrong>页面不是“一页对应一个IP”；同一个网站可以根据路径、参数和登录状态返回不同内容；浏览器也可以在本机切换显示。\u003c/strong>\u003c/p>\n\u003cp>下面的商品站与字段均为虚构教学设计，重点是比较你日常会观察到的差异。\u003c/p>\n\u003ch2 id=\"section-1\">路径告诉服务想访问哪个资源\u003c/h2>\n\u003cp>\u003ccode>https://shop.example.com/products/42\u003c/code> 与 \u003ccode>/products/43\u003c/code> 访问同一主机中的不同商品资源。浏览器在请求中写明路径；网站程序读到/products/42，就按自己的规则查42号商品并回复。\u003c/p>\n\u003cp>资源不限于页面：\u003ccode>/images/42.jpg\u003c/code>可能是图片，\u003ccode>/api/products/42\u003c/code>可能返回供页面程序使用的数据。这些名称是网站选择的结构，不是网络强制规定。\u003c/p>\n\u003cp>路径看起来像文件目录，却未必对应硬盘文件。比如 \u003ccode>/orders/18\u003c/code> 可以代表数据库里的一笔订单；服务接到请求后检查你的账号是否拥有该订单，再决定显示。改数字只改变请求，不会自动改变权限，也不保证资源存在。\u003c/p>\n\u003ch2 id=\"section-2\">问号后常用来说明条件\u003c/h2>\n\u003cp>\u003ccode>/search?q=coffee&amp;page=2\u003c/code>可以表示搜coffee并看第二页。问号后叫查询部分；这类网站常把它组织成“名称=值”，多个条件用 \u003ccode>&amp;\u003c/code>连接。服务器或网页程序读取这些条件，按约定筛选结果。\u003c/p>\n\u003cp>于是同一个 \u003ccode>/search\u003c/code> 路径可以显示无数搜索结果，没必要给每个关键词建一个域名或端口。路径和参数的分工也不是绝对：网站可以用 \u003ccode>/search/coffee/2\u003c/code> 表达类似选择，URL语法不决定业务必须怎么设计。\u003c/p>\n\u003cp>商品链接多出 \u003ccode>utm_source=newsletter\u003c/code> 之类参数，常用来记录这次访问来自哪里，例如邮件中的链接，不一定换商品。网站也可能据参数改变优惠、排序或语言，所以不能把“问号后的内容都能删”当成规则。删除后是否仍正确，要看该服务怎样使用它。\u003c/p>\n\u003ch2 id=\"section-3\">井号后通常交给浏览器处理\u003c/h2>\n\u003cp>\u003ccode>/products/42#reviews\u003c/code>可以让浏览器定位评价区。这种片段不直接放进初始HTTP请求目标里；服务可以只交回商品页面，浏览器再按reviews找到对应位置。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/URI/Reference/Fragment\" target=\"_blank\" rel=\"noopener noreferrer\">片段的标准行为\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>某些页面程序会把 \u003ccode>#/orders\u003c/code> 当成自己内部的导航状态，切换内容时再请求订单数据。此时井号后有“看起来像路径”的文字，但浏览器中的页面程序先读取#/orders，切换到订单界面，并可能再向网站请求订单数据。沿途路由器不会把orders当成网络地址。\u003c/p>\n\u003cp>这份知识库也使用类似页面内导航，你切篇时没有重新从外网下载正文。相同形式在其他产品里却可以触发额外请求。地址变化与网络通信不是一一对应。\u003c/p>\n\u003ch2 id=\"section-4\">比较五种你会真的碰见的变化\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>地址或动作\u003c/th>\n\u003cth>可以先怎样理解\u003c/th>\n\u003cth>实际结果取决于什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>/products/42换成/43\u003c/td>\n\u003ctd>请求另一资源\u003c/td>\n\u003ctd>网站是否有该内容，以及是否允许你查看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>?color=blue换成red\u003c/td>\n\u003ctd>改选择条件\u003c/td>\n\u003ctd>网站解释字段、验证取值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>?page=1换成2\u003c/td>\n\u003ctd>请求另一组结果\u003c/td>\n\u003ctd>服务或页面程序计算分页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>#details换成reviews\u003c/td>\n\u003ctd>改浏览器定位或状态\u003c/td>\n\u003ctd>页面中是否有对应位置，或程序怎样处理它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点“加入购物车”，地址没变\u003c/td>\n\u003ctd>页面可能发了额外操作请求\u003c/td>\n\u003ctd>购物车服务处理并返回\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>如果你只观察地址栏，就会漏掉最后一种。网页可以继续通信而不整页跳转，详见\u003ca href=\"#/browsing\">完整网页访问\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">密码、图片和订单内容为什么没写在网址里\u003c/h2>\n\u003cp>网页请求不止请求目标，还可以包含额外说明和正文。登录表单通常把输入交给登录服务；上传文件需要传送文件内容，文件显然不能全塞进地址栏。应用发送这些资料时，也可能附带登录标记。\u003c/p>\n\u003cp>这说明URL相同不等于请求相同。两次访问同一个登录入口，一次输入正确资料，一次输入错误资料，结果会不同；同一个订单链接，不同账号可能得到自己的订单或无权访问。选择资源与证明身份是不同工作。\u003c/p>\n\u003cp>地址栏没有密码也不能证明页面没有传送密码；还要看浏览器与接收方是否使用了HTTPS等保护。相反，若链接本身含临时分享凭证，转发整条链接也可能转交访问能力，要按服务说明理解。\u003c/p>\n\u003ch2 id=\"section-6\">网址、网络与网站程序怎样配合\u003c/h2>\n\u003cp>“如何把请求送到网站”属于设备联网、按地址转送和传输数据；“这一条请求选什么资源”属于网页协议与应用规则；“资源是否该给你”由网站核对账号、权限和相关规则。你日常点击一个链接时，这些工作一起发生。\u003c/p>\n\u003cp>下次看到长链接，先看网站名称和端口，再看路径、问号和井号后的内容。改商品编号通常是在选另一件商品；改端口是在尝试联系另一个程序；换网络则改变请求经过的路线。三种操作影响不同步骤。通用组件规则见\u003ca href=\"https://www.rfc-editor.org/rfc/rfc3986.html\" target=\"_blank\" rel=\"noopener noreferrer\">URI规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"路径、问号、井号：不同页面究竟怎么区分？ 你在同一网站点商品、搜索、翻页和评价，地址栏会发生不同变化：有时斜线后的文字变了，有时问号后多了条件，有时只有井号后改变，还有时候地址根本不变。 页面不是“一页对应一个IP”；同一个网站可以根据路径、参数和登录状态返回不同内容；浏览器也可以在本机切换显示。 下面的商品站与字段均为虚构教学设计，重点是比较你日常会观察到的差异。 路径告诉服务想访问哪个资源 https://shop.example.com/products/42 与 /products/43 访问同一主机中的不同商品资源。浏览器在请求中写明路径；网站程序读到/products/42，就按自己的规则查42号商品并回复。 资源不限于页面： /images/42.jpg 可能是图片， /api/products/42 可能返回供页面程序使用的数据。这些名称是网站选择的结构，不是网络强制规定。 路径看起来像文件目录，却未必对应硬盘文件。比如 /orders/18 可以代表数据库里的一笔订单；服务接到请求后检查你的账号是否拥有该订单，再决定显示。改数字只改变请求，不会自动改变权限，也不保证资源存在。 问号后常用来说明条件 /search?q=coffee&page=2 可以表示搜coffee并看第二页。问号后叫查询部分；这类网站常把它组织成“名称=值”，多个条件用 & 连接。服务器或网页程序读取这些条件，按约定筛选结果。 于是同一个 /search 路径可以显示无数搜索结果，没必要给每个关键词建一个域名或端口。路径和参数的分工也不是绝对：网站可以用 /search/coffee/2 表达类似选择，URL语法不决定业务必须怎么设计。 商品链接多出 utm source=newsletter 之类参数，常用来记录这次访问来自哪里，例如邮件中的链接，不一定换商品。网站也可能据参数改变优惠、排序或语言，所以不能把“问号后的内容都能删”当成规则。删除后是否仍正确，要看该服务怎样使用它。 井号后通常交给浏览器处理 /products/42 reviews 可以让浏览器定位评价区。这种片段不直接放进初始HTTP请求目标里；服务可以只交回商品页面，浏览器再按reviews找到对应位置。片段的标准行为 某些页面程序会把 /orders 当成自己内部的导航状态，切换内容时再请求订单数据。此时井号后有“看起来像路径”的文字，但浏览器中的页面程序先读取 /orders，切换到订单界面，并可能再向网站请求订单数据。沿途路由器不会把orders当成网络地址。 这份知识库也使用类似页面内导航，你切篇时没有重新从外网下载正文。相同形式在其他产品里却可以触发额外请求。地址变化与网络通信不是一一对应。 比较五种你会真的碰见的变化 地址或动作 可以先怎样理解 实际结果取决于什么 --- --- --- /products/42换成/43 请求另一资源 网站是否有该内容，以及是否允许你查看 ?color=blue换成red 改选择条件 网站解释字段、验证取值 ?page=1换成2 请求另一组结果 服务或页面程序计算分页 details换成reviews 改浏览器定位或状态 页面中是否有对应位置，或程序怎样处理它 点“加入购物车”，地址没变 页面可能发了额外操作请求 购物车服务处理并返回 如果你只观察地址栏，就会漏掉最后一种。网页可以继续通信而不整页跳转，详见完整网页访问。 密码、图片和订单内容为什么没写在网址里 网页请求不止请求目标，还可以包含额外说明和正文。登录表单通常把输入交给登录服务；上传文件需要传送文件内容，文件显然不能全塞进地址栏。应用发送这些资料时，也可能附带登录标记。 这说明URL相同不等于请求相同。两次访问同一个登录入口，一次输入正确资料，一次输入错误资料，结果会不同；同一个订单链接，不同账号可能得到自己的订单或无权访问。选择资源与证明身份是不同工作。 地址栏没有密码也不能证明页面没有传送密码；还要看浏览器与接收方是否使用了HTTPS等保护。相反，若链接本身含临时分享凭证，转发整条链接也可能转交访问能力，要按服务说明理解。 网址、网络与网站程序怎样配合 “如何把请求送到网站”属于设备联网、按地址转送和传输数据；“这一条请求选什么资源”属于网页协议与应用规则；“资源是否该给你”由网站核对账号、权限和相关规则。你日常点击一个链接时，这些工作一起发生。 下次看到长链接，先看网站名称和端口，再看路径、问号和井号后的内容。改商品编号通常是在选另一件商品；改端口是在尝试联系另一个程序；换网络则改变请求经过的路线。三种操作影响不同步骤。通用组件规则见URI规范。","outline":[{"id":"section-1","title":"路径告诉服务想访问哪个资源","depth":2},{"id":"section-2","title":"问号后常用来说明条件","depth":2},{"id":"section-3","title":"井号后通常交给浏览器处理","depth":2},{"id":"section-4","title":"比较五种你会真的碰见的变化","depth":2},{"id":"section-5","title":"密码、图片和订单内容为什么没写在网址里","depth":2},{"id":"section-6","title":"网址、网络与网站程序怎样配合","depth":2}]},{"id":"browsing","group":"services","title":"从点击商品链接到看到页面，完整经历了什么？","question":"从点击商品链接到看到页面，完整经历了什么？","summary":"将URL、DNS、IP端口、连接、请求、页面组装和后续点击连成一次完整访问。","terms":["重定向","页面路由"],"aliases":["重定向","redirect 短链接 跳转","页面路由",""],"related":["web","url-pages","domains","ports"],"html":"\u003cp>把IP、端口、域名和参数分别讲清后，还需要看它们怎样在同一次访问里合作。\u003cstrong>你点链接后，浏览器先联系网站，下载文字、图片和页面程序，再显示网页。你点击按钮时，页面还可能继续向网站发请求。\u003c/strong>\u003c/p>\n\u003cp>以下是一条\u003cstrong>虚构教学轨迹\u003c/strong>。为方便理解，先假设浏览器没有合适缓存，也没有可复用的现成连接；实际浏览器会并行处理、复用连接、应用不同协议，次序不必每次完全重来。\u003c/p>\n\u003ch2 id=\"section-1\">你看到一条链接，浏览器看到几种工作\u003c/h2>\n\u003cp>链接是 \u003ccode>https://shop.example.com/products/42?color=blue#reviews\u003c/code>。浏览器读出访问方式、主机、默认服务端口、资源路径、条件和片段。片段先留在本地用于页面状态；主机名用来查询地址，端口用来连接程序，路径和参数则写进网页请求。\u003ca href=\"#/url\">网址拆分\u003c/a>\u003c/p>\n\u003cp>此时商品页面还不存在于屏幕上。浏览器先知道“准备做什么”，不是已经完成“找到并取回”。如果你在地址栏输入的只是几个搜索词，浏览器可能先交给搜索服务；搜索结果中再点网站，会开启另一轮访问。地址栏既能接网址也能接搜索词，不要把搜索服务当DNS。\u003c/p>\n\u003ch2 id=\"section-2\">查询名称，取得可以联系的地址\u003c/h2>\n\u003cp>浏览器或系统先看看是否已有可用记录，再需要时询问名称查询服务。回答可能含多个地址；浏览器选择其中的地址尝试连接。DNS给出的是网站地址，还没有传回商品图片或账号资料。\u003c/p>\n\u003cp>随后设备把访问送入当前网络，沿途按目标地址转送。家中共享出口可能改写你的来源，并保存返回映射；目标服务不需要知道你屋内设备的原始内网IP，才可回应。\u003ca href=\"#/dns\">DNS\u003c/a>、\u003ca href=\"#/nat\">共享出口\u003c/a>\u003c/p>\n\u003ch2 id=\"section-3\">联系网站，并建立HTTPS连接\u003c/h2>\n\u003cp>浏览器按访问方式联系相应端口。服务在接收，路径和规则允许时，才有条件建立通信。HTTPS还涉及确认对端适合这个名称、协商如何保护后续交换内容。证书错误与“没人接收”是不同失败。\u003c/p>\n\u003cp>现代网页可能采用TCP或基于其他传输安排的HTTP版本；不需要用某一套握手细节替代主线。你要保留的关系是：\u003cstrong>先取得网站地址，再联系接收请求的程序，建立连接，最后发送网页请求。\u003c/strong> 已有连接时，部分工作可以复用。\u003c/p>\n\u003ch2 id=\"section-4\">发出请求，网站才解释商品和条件\u003c/h2>\n\u003cp>浏览器在请求中写明主机名shop.example.com、路径/products/42和条件color=blue，并可能附带已有会话标记。如果服务器提供多个网站，它先根据主机名选择站点，再由商品程序读取路径、颜色条件和登录标记。\u003c/p>\n\u003cp>商品服务找到资料后生成响应。如果没有商品，可能回复不存在；如果需要登录，可能要求登录或让浏览器跳到登录入口；如果业务暂时异常，也可能返回错误。收到明确回答和根本没收到回答，是两种观察。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP工作链\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-5\">内容陆续下载，网页才逐步显示\u003c/h2>\n\u003cp>网站可能先发回页面结构，说明要使用哪些图片、排版规则和程序。浏览器继续下载这些文件，可能需要联系img.example.com等其他服务器。部分先到，部分后到，于是你会见到标题先出现、图片稍后出现。\u003c/p>\n\u003cp>浏览器按排版规则显示文字和图片，运行页面程序，再滚动到评价区。与此同时，推荐商品、库存或运费可能通过额外请求取得。标题和按钮出现，说明部分内容已经下载并显示；库存查询、登录或下单可能还没有完成。\u003c/p>\n\u003ch2 id=\"section-6\">你点击下一步，并不总重新取整页\u003c/h2>\n\u003cp>点击“红色”，页面可能只请求另一款的库存并替换选中状态；点击“加入购物车”，页面可能发出操作请求并弹提示；点击“评价”，可能只滚动本地页面。三者看起来都是点按钮，网络动作不同。\u003c/p>\n\u003cp>服务或页面也可以引导浏览器访问另一个网址，这叫重定向或跳转。短链接常先到一个中转入口，再进入真正的商品页。跳转之后主机可能变化，也可能只换路径；品牌界面不能替代实际地址判断。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections\" target=\"_blank\" rel=\"noopener noreferrer\">跳转方式\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-7\">用这条轨迹解释四个日常现象\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>这条过程提供的解释方向\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>打开很慢，打开后操作很快\u003c/td>\n\u003ctd>第一次需要查询地址、建立连接和下载文件，后来可以复用连接或已下载内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>商品页正常，图片加载失败\u003c/td>\n\u003ctd>图片可能来自另一个服务器，或需要另发请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同一链接在朋友手机上要求登录\u003c/td>\n\u003ctd>会话与登录标记对应的账号不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换网后页面仍在，刷新却失败\u003c/td>\n\u003ctd>已经显示的文字和图片还在，新通信走了另一条路径\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>这些是可能的解释，还需要对照才能确定原因。你可以按\u003ca href=\"#/troubleshoot\">对照排障\u003c/a>缩小范围；不用为了理解而操作真实订单。下一段完整过程在\u003ca href=\"#/transactions\">点击提交以后\u003c/a>，它解释通信成功为何仍不等于业务办成。\u003c/p>\n","text":"从点击商品链接到看到页面，完整经历了什么？ 把IP、端口、域名和参数分别讲清后，还需要看它们怎样在同一次访问里合作。 你点链接后，浏览器先联系网站，下载文字、图片和页面程序，再显示网页。你点击按钮时，页面还可能继续向网站发请求。 以下是一条 虚构教学轨迹 。为方便理解，先假设浏览器没有合适缓存，也没有可复用的现成连接；实际浏览器会并行处理、复用连接、应用不同协议，次序不必每次完全重来。 你看到一条链接，浏览器看到几种工作 链接是 https://shop.example.com/products/42?color=blue reviews 。浏览器读出访问方式、主机、默认服务端口、资源路径、条件和片段。片段先留在本地用于页面状态；主机名用来查询地址，端口用来连接程序，路径和参数则写进网页请求。网址拆分 此时商品页面还不存在于屏幕上。浏览器先知道“准备做什么”，不是已经完成“找到并取回”。如果你在地址栏输入的只是几个搜索词，浏览器可能先交给搜索服务；搜索结果中再点网站，会开启另一轮访问。地址栏既能接网址也能接搜索词，不要把搜索服务当DNS。 查询名称，取得可以联系的地址 浏览器或系统先看看是否已有可用记录，再需要时询问名称查询服务。回答可能含多个地址；浏览器选择其中的地址尝试连接。DNS给出的是网站地址，还没有传回商品图片或账号资料。 随后设备把访问送入当前网络，沿途按目标地址转送。家中共享出口可能改写你的来源，并保存返回映射；目标服务不需要知道你屋内设备的原始内网IP，才可回应。DNS、共享出口 联系网站，并建立HTTPS连接 浏览器按访问方式联系相应端口。服务在接收，路径和规则允许时，才有条件建立通信。HTTPS还涉及确认对端适合这个名称、协商如何保护后续交换内容。证书错误与“没人接收”是不同失败。 现代网页可能采用TCP或基于其他传输安排的HTTP版本；不需要用某一套握手细节替代主线。你要保留的关系是： 先取得网站地址，再联系接收请求的程序，建立连接，最后发送网页请求。 已有连接时，部分工作可以复用。 发出请求，网站才解释商品和条件 浏览器在请求中写明主机名shop.example.com、路径/products/42和条件color=blue，并可能附带已有会话标记。如果服务器提供多个网站，它先根据主机名选择站点，再由商品程序读取路径、颜色条件和登录标记。 商品服务找到资料后生成响应。如果没有商品，可能回复不存在；如果需要登录，可能要求登录或让浏览器跳到登录入口；如果业务暂时异常，也可能返回错误。收到明确回答和根本没收到回答，是两种观察。HTTP工作链 内容陆续下载，网页才逐步显示 网站可能先发回页面结构，说明要使用哪些图片、排版规则和程序。浏览器继续下载这些文件，可能需要联系img.example.com等其他服务器。部分先到，部分后到，于是你会见到标题先出现、图片稍后出现。 浏览器按排版规则显示文字和图片，运行页面程序，再滚动到评价区。与此同时，推荐商品、库存或运费可能通过额外请求取得。标题和按钮出现，说明部分内容已经下载并显示；库存查询、登录或下单可能还没有完成。 你点击下一步，并不总重新取整页 点击“红色”，页面可能只请求另一款的库存并替换选中状态；点击“加入购物车”，页面可能发出操作请求并弹提示；点击“评价”，可能只滚动本地页面。三者看起来都是点按钮，网络动作不同。 服务或页面也可以引导浏览器访问另一个网址，这叫重定向或跳转。短链接常先到一个中转入口，再进入真正的商品页。跳转之后主机可能变化，也可能只换路径；品牌界面不能替代实际地址判断。跳转方式 用这条轨迹解释四个日常现象 现象 这条过程提供的解释方向 --- --- 打开很慢，打开后操作很快 第一次需要查询地址、建立连接和下载文件，后来可以复用连接或已下载内容 商品页正常，图片加载失败 图片可能来自另一个服务器，或需要另发请求 同一链接在朋友手机上要求登录 会话与登录标记对应的账号不同 换网后页面仍在，刷新却失败 已经显示的文字和图片还在，新通信走了另一条路径 这些是可能的解释，还需要对照才能确定原因。你可以按对照排障缩小范围；不用为了理解而操作真实订单。下一段完整过程在点击提交以后，它解释通信成功为何仍不等于业务办成。","outline":[{"id":"section-1","title":"你看到一条链接，浏览器看到几种工作","depth":2},{"id":"section-2","title":"查询名称，取得可以联系的地址","depth":2},{"id":"section-3","title":"联系网站，并建立HTTPS连接","depth":2},{"id":"section-4","title":"发出请求，网站才解释商品和条件","depth":2},{"id":"section-5","title":"内容陆续下载，网页才逐步显示","depth":2},{"id":"section-6","title":"你点击下一步，并不总重新取整页","depth":2},{"id":"section-7","title":"用这条轨迹解释四个日常现象","depth":2}]},{"id":"security","group":"trust","title":"信息经过别人，哪些内容能被看见？","question":"信息经过别人，哪些内容能被看见？","summary":"加密保护特定两端之间的内容，沿途仍可能观察连接线索。","terms":["HTTPS","加密","证书"],"aliases":["HTTPS","TLS SSL 安全连接","加密","","证书",""],"related":["web","identity","vpn"],"html":"\u003cp>沿途的设备必须处理转送信息，但不一定需要读懂你交给网站的正文。\u003cstrong>加密可以保护特定两端之间的内容，连接来源、目的地或流量变化等线索仍可能被观察。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">用提交收货地址，看清谁仍能读取\u003c/h2>\n\u003cp>你在HTTPS商品站填写收货地址。浏览器和接收端之间的内容受到传输保护，普通沿途转送者不应直接读到明文地址；但接收地址的服务为了处理订单，必须能够使用它。你主动交给服务的资料不会因为HTTPS而对服务经营者自动隐形。\u003c/p>\n\u003cp>如果浏览器先连接CDN服务器，HTTPS可能在CDN服务器上解密，再由它另建受保护连接，把请求交给网站后台。这里所说的连接两端，是实际进行加密和解密的程序，未必就是你想象中的那一台网站服务器。资料的后续保存与使用另需服务规则约束。\u003c/p>\n\u003ch2 id=\"section-2\">酒店网络、VPN出口和购物站各能看到什么\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构路径对照\u003c/strong>。不使用VPN时，请求经过酒店网络时，酒店网络通常可以观察来源地址、目的地址、时间和数据量等信息；能否取得名称还取决于DNS和连接安排，不能一概说它知道你每一条浏览内容。\u003c/p>\n\u003cp>经VPN公共出口访问时，酒店网络看到你在联系VPN服务器；VPN出口再联系购物网站。HTTPS仍可保护浏览器到相应HTTPS接收端的正文，VPN隧道保护又覆盖到VPN另一端的那一段。\u003c/p>\n\u003cp>VPN和HTTPS可以同时保护通信中的不同部分。判断隐私时，需要分别看酒店网络、VPN提供者和购物网站各能看到什么。购物站仍能处理提交资料和账号，VPN不会使账号消失；出口也不是自动全盲。更精细的可见性取决于实际协议与部署。\u003c/p>\n\u003ch2 id=\"section-3\">为什么小锁或HTTPS不能替你判断商家诚不诚实\u003c/h2>\n\u003cp>浏览器用证书核对连接的服务器是否能证明自己有权使用这个网站名称。HTTPS保护双方传送的内容，但不能证明商品一定存在、客服一定兑现承诺。一个模仿品牌名称的网站可以给自己的名称配置有效证书。\u003c/p>\n\u003cp>所以网址核对与内容可信度是另一项判断。完整主机名的位置见\u003ca href=\"#/domains\">域名\u003c/a>。证书警告时，应核对名称、设备时间和正式入口；改用IP直接访问也可能造成名称不匹配，不能把它当普适解法。\u003c/p>\n\u003ch2 id=\"section-4\">无痕窗口保护的是哪种边界\u003c/h2>\n\u003cp>浏览器的私密或无痕方式通常减少这次浏览在本机留下的历史记录，并单独管理这次访问的Cookie等数据，不会自动让网络路径消失，也不会让登录账号变成另一个人。它与传输加密、VPN出口、账号身份是不同改变。\u003c/p>\n\u003cp>理解隐私措施时，要看你想防谁读取什么内容：酒店网络能看到什么，VPN服务器能看到什么，购物网站又保存了什么。不能把任何单个开关当所有观察者都失去信息的证明。\u003c/p>\n\u003ch2 id=\"section-5\">HTTPS保护的两端在哪里\u003c/h2>\n\u003cp>网页使用HTTPS时，浏览器与它建立连接的HTTPS服务端之间使用TLS保护内容。TLS提供内容保密、完整性保护和对端认证；证书帮助浏览器核对连接对象。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security\" target=\"_blank\" rel=\"noopener noreferrer\">TLS保护的范围\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>如果浏览器先连接CDN等转送服务器，HTTPS可能先在那里解密，再由它建立另一条连接通往网站后台。运营者如何安排后续保护，仍需单独判断。\u003c/p>\n\u003ch2 id=\"section-6\">保护内容，不让连接消失\u003c/h2>\n\u003cp>附近网络通常仍能观察你正与某个地址通信，以及时间和流量大小。能否进一步看到域名，还取决于名称查询和连接信息的保护安排。不能用一句“HTTPS全部隐藏了”概括所有可见线索。\u003c/p>\n\u003cp>HTTPS接收方可以解密收到的内容：你把资料提交给网站，网站要处理它，HTTPS不会让网站自己看不见。设备上恶意程序或用户主动泄露内容，也不由传输加密解决。\u003c/p>\n\u003ch2 id=\"section-7\">VPN与HTTPS可以同时存在\u003c/h2>\n\u003cp>VPN通常保护设备与VPN另一端之间的隧道；HTTPS保护浏览器与相应服务端之间的通信。流量经过VPN公共出口时，网站通常看到出口来源，但浏览器提交给HTTPS接收方的内容仍受到HTTPS保护。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">出口节点的路径\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>VPN提供者可能观察隧道连接及出口目的等线索。网站也可能继续通过登录和浏览器会话识别你。VPN保护了某段传输，不等于网站无法通过登录账号识别你。\u003c/p>\n\u003ch2 id=\"section-8\">浏览器没有报警，网站就可信吗\u003c/h2>\n\u003cp>证书与连接保护帮助确认你连到了对应名称，并保护传输；它不替网站的商业承诺、商品质量或文章真实性背书。一个骗人网站也能使用HTTPS。\u003c/p>\n\u003cp>反过来，证书警告意味着当前身份或连接校验出了问题。确认网址和设备时间，按服务官方渠道核对，不把关闭保护当普通排障步骤。理解的是谁能看见哪段内容，以及你正在信任哪个端点。\u003c/p>\n","text":"信息经过别人，哪些内容能被看见？ 沿途的设备必须处理转送信息，但不一定需要读懂你交给网站的正文。 加密可以保护特定两端之间的内容，连接来源、目的地或流量变化等线索仍可能被观察。 用提交收货地址，看清谁仍能读取 你在HTTPS商品站填写收货地址。浏览器和接收端之间的内容受到传输保护，普通沿途转送者不应直接读到明文地址；但接收地址的服务为了处理订单，必须能够使用它。你主动交给服务的资料不会因为HTTPS而对服务经营者自动隐形。 如果浏览器先连接CDN服务器，HTTPS可能在CDN服务器上解密，再由它另建受保护连接，把请求交给网站后台。这里所说的连接两端，是实际进行加密和解密的程序，未必就是你想象中的那一台网站服务器。资料的后续保存与使用另需服务规则约束。 酒店网络、VPN出口和购物站各能看到什么 以下是 虚构路径对照 。不使用VPN时，请求经过酒店网络时，酒店网络通常可以观察来源地址、目的地址、时间和数据量等信息；能否取得名称还取决于DNS和连接安排，不能一概说它知道你每一条浏览内容。 经VPN公共出口访问时，酒店网络看到你在联系VPN服务器；VPN出口再联系购物网站。HTTPS仍可保护浏览器到相应HTTPS接收端的正文，VPN隧道保护又覆盖到VPN另一端的那一段。 VPN和HTTPS可以同时保护通信中的不同部分。判断隐私时，需要分别看酒店网络、VPN提供者和购物网站各能看到什么。购物站仍能处理提交资料和账号，VPN不会使账号消失；出口也不是自动全盲。更精细的可见性取决于实际协议与部署。 为什么小锁或HTTPS不能替你判断商家诚不诚实 浏览器用证书核对连接的服务器是否能证明自己有权使用这个网站名称。HTTPS保护双方传送的内容，但不能证明商品一定存在、客服一定兑现承诺。一个模仿品牌名称的网站可以给自己的名称配置有效证书。 所以网址核对与内容可信度是另一项判断。完整主机名的位置见域名。证书警告时，应核对名称、设备时间和正式入口；改用IP直接访问也可能造成名称不匹配，不能把它当普适解法。 无痕窗口保护的是哪种边界 浏览器的私密或无痕方式通常减少这次浏览在本机留下的历史记录，并单独管理这次访问的Cookie等数据，不会自动让网络路径消失，也不会让登录账号变成另一个人。它与传输加密、VPN出口、账号身份是不同改变。 理解隐私措施时，要看你想防谁读取什么内容：酒店网络能看到什么，VPN服务器能看到什么，购物网站又保存了什么。不能把任何单个开关当所有观察者都失去信息的证明。 HTTPS保护的两端在哪里 网页使用HTTPS时，浏览器与它建立连接的HTTPS服务端之间使用TLS保护内容。TLS提供内容保密、完整性保护和对端认证；证书帮助浏览器核对连接对象。TLS保护的范围 如果浏览器先连接CDN等转送服务器，HTTPS可能先在那里解密，再由它建立另一条连接通往网站后台。运营者如何安排后续保护，仍需单独判断。 保护内容，不让连接消失 附近网络通常仍能观察你正与某个地址通信，以及时间和流量大小。能否进一步看到域名，还取决于名称查询和连接信息的保护安排。不能用一句“HTTPS全部隐藏了”概括所有可见线索。 HTTPS接收方可以解密收到的内容：你把资料提交给网站，网站要处理它，HTTPS不会让网站自己看不见。设备上恶意程序或用户主动泄露内容，也不由传输加密解决。 VPN与HTTPS可以同时存在 VPN通常保护设备与VPN另一端之间的隧道；HTTPS保护浏览器与相应服务端之间的通信。流量经过VPN公共出口时，网站通常看到出口来源，但浏览器提交给HTTPS接收方的内容仍受到HTTPS保护。出口节点的路径 VPN提供者可能观察隧道连接及出口目的等线索。网站也可能继续通过登录和浏览器会话识别你。VPN保护了某段传输，不等于网站无法通过登录账号识别你。 浏览器没有报警，网站就可信吗 证书与连接保护帮助确认你连到了对应名称，并保护传输；它不替网站的商业承诺、商品质量或文章真实性背书。一个骗人网站也能使用HTTPS。 反过来，证书警告意味着当前身份或连接校验出了问题。确认网址和设备时间，按服务官方渠道核对，不把关闭保护当普通排障步骤。理解的是谁能看见哪段内容，以及你正在信任哪个端点。 相关概念 - 账号与会话怎样识别人 - VPN路径","outline":[{"id":"section-1","title":"用提交收货地址，看清谁仍能读取","depth":2},{"id":"section-2","title":"酒店网络、VPN出口和购物站各能看到什么","depth":2},{"id":"section-3","title":"为什么小锁或HTTPS不能替你判断商家诚不诚实","depth":2},{"id":"section-4","title":"无痕窗口保护的是哪种边界","depth":2},{"id":"section-5","title":"HTTPS保护的两端在哪里","depth":2},{"id":"section-6","title":"保护内容，不让连接消失","depth":2},{"id":"section-7","title":"VPN与HTTPS可以同时存在","depth":2},{"id":"section-8","title":"浏览器没有报警，网站就可信吗","depth":2}]},{"id":"identity","group":"trust","title":"换了IP，网站为什么还认得你？","question":"换了IP，网站为什么还认得你？","summary":"换网络以后，浏览器保存的登录标记可能还在，网站因此仍能找到同一账号。","terms":["Cookie","会话","设备指纹"],"aliases":["Cookie","cookie cookies 登录 浏览器标记","会话","","设备指纹","fingerprint device fingerprint"],"related":["nat","security","risk","vpn"],"html":"\u003cp>你从Wi-Fi换到手机流量，网站仍显示自己的账号。\u003cstrong>IP说明这次访问从哪个网络地址来；浏览器保存的登录标记则可以让网站找到你的账号。换了网络，登录标记可能还在。\u003c/strong> 更换其中一项，其他项不一定消失。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgNDIwIDUyMCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjAiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPklQ5Y+Y5LqG77yM572R56uZ5LuN5Y+v6IO96K6k5b6X6LSm5Y+3PC90ZXh0PjxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDgwLDEwNikiPjxyZWN0IHg9Ii0yNCIgeT0iLTM1IiB3aWR0aD0iNDgiIGhlaWdodD0iNzAiIHJ4PSI5IiBmaWxsPSIjZTJlY2UyIiBzdHJva2U9IiMyNzY2NTUiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9Ii0xNiIgeT0iLTIyIiB3aWR0aD0iMzIiIGhlaWdodD0iNDAiIHJ4PSIzIiBmaWxsPSIjZmZmZWZhIi8+PHBhdGggZD0iTS03IDI2SDciIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9nPjx0ZXh0IHg9IjgwIiB5PSIxNjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPuWQjOS4gOiuvuWkhzwvdGV4dD48cGF0aCBkPSJNMTEzIDEwN0gxNThWNzlIMjE3IiBmaWxsPSJub25lIiBzdHJva2U9IiMyNzY2NTUiIHN0cm9rZS13aWR0aD0iMyIgbWFya2VyLWVuZD0idXJsKCNhKSIvPjxwYXRoIGQ9Ik0xNTkgMTA3VjE1M0gyMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIzIiBtYXJrZXItZW5kPSJ1cmwoI2EpIi8+PHRleHQgeD0iMzAzIiB5PSI4NiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOSIgZmlsbD0iI ction-3\">为什么换子域名、换浏览器，登录状态会不同\u003c/h2>\n\u003cp>浏览器保存的数据有发送范围。某个Cookie可以只用于当前主机，另一个可以按合适父域名范围使用，路径等条件也会限制发送。这些安排不等于所有同品牌页面必然共享会话。\u003c/p>\n\u003cp>换另一个浏览器，新浏览器没有自动复制原会话；打开网站可能先要求登录。若再登录同一账号，服务器仍能展示同一账号下已有资料。清本地标记改变的是这段访问的凭据，不是把远处数据库的账号删除。\u003c/p>\n\u003cp>\u003ca href=\"#/domains\">子域名与同源\u003c/a>解释页面安全边界，Cookie规则与之有联系但并不相同。退出登录也应由应用处理会话撤销，而不是只凭地址栏变了就判断已经退出。\u003c/p>\n\u003ch2 id=\"section-4\">设备指纹为什么只能作为关联线索\u003c/h2>\n\u003cp>浏览器类型、语言、设备环境及其他可得特征可能形成组合，用来判断访问是否可能相关。升级系统、改设置会改变特征，不同设备也可能相似；这些特征只能帮助关联访问；网站核对登录凭据，才是在验证账号。\u003c/p>\n\u003cp>你理解网站认人时，可以把一条访问展开为来源IP、携带标记、验证账号、设备环境、实际行为。风控使用它们联合推断，登录系统核对登录标记等凭据；不能把其中任何一个都叫作精确永久“身份”。\u003c/p>\n\u003ch2 id=\"section-5\">网站怎样把连续操作接起来\u003c/h2>\n\u003cp>网页通信中，每次请求都要说明想做什么。网站还需要把“登录成功”“查看订单”等操作关联起来。常见方法是给这段访问一个会话标记，让浏览器保存并在后续请求中附带它。\u003c/p>\n\u003cp>Cookie就是浏览器按规则保存并发送给对应网站的一类数据。网站可用它保存会话标记，再从服务器记录中找出访问状态。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies\" target=\"_blank\" rel=\"noopener noreferrer\">浏览器如何保存与发送Cookie\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>这不是每个Cookie都直接写着姓名；有些只存一个关联编号，有些用途与登录无关。\u003c/p>\n\u003ch2 id=\"section-6\">同一个人，不必来自同一个网络\u003c/h2>\n\u003cp>你换了接入网络，来源IP可能变了，浏览器里的会话标记还在，网站便可能继续找到同一会话。再次登录同一个账号，即使换了设备，也能关联到同一账号记录。\u003c/p>\n\u003cp>反过来，多个人可能在办公室共用一个来源IP，各自却有独立会话和账号。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享IP的识别问题\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a> 网络地址适合做来源线索，不能代替密码、登录标记等账号验证。\u003c/p>\n\u003ch2 id=\"section-7\">设备指纹是在做怎样的判断\u003c/h2>\n\u003cp>浏览器与设备特征也可能被用于关联访问。这类特征组合常被称为设备指纹。它们可能提供识别线索，但不是不可改变的硬件身份证；不同设备可能相似，升级也可能改变特征。\u003c/p>\n\u003cp>风险产品可接收浏览器、语言、会话等资料。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/device-inputs-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">MaxMind公开的设备输入\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a> 哪个平台用了哪些组合、怎样比较，必须以该平台信息为准。\u003c/p>\n\u003ch2 id=\"section-8\">换IP、清Cookie、退出登录，分别改变什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>动作\u003c/th>\n\u003cth>主要改变的东西\u003c/th>\n\u003cth>不自动做到的事情\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>换网络或出口\u003c/td>\n\u003ctd>某些访问的来源\u003c/td>\n\u003ctd>删除网站账号或历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除网站Cookie\u003c/td>\n\u003ctd>浏览器保存的标记\u003c/td>\n\u003ctd>删除服务器已有记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>退出登录\u003c/td>\n\u003ctd>网站允许当前浏览器使用的登录状态\u003c/td>\n\u003ctd>保证所有来源线索都消失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换设备\u003c/td>\n\u003ctd>设备与本地资料\u003c/td>\n\u003ctd>保证同一账号无法关联\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>实际效果受网站会话设计影响。理解身份时，可以先问三个问题：从哪个网络来，携带了哪个访问标记，网站验证的是哪个账号。它们有联系，但不能互相替代。\u003c/p>\n","text":"换了IP，网站为什么还认得你？ 你从Wi-Fi换到手机流量，网站仍显示自己的账号。 IP说明这次访问从哪个网络地址来；浏览器保存的登录标记则可以让网站找到你的账号。换了网络，登录标记可能还在。 更换其中一项，其他项不一定消失。 同一设备从家中出口换到手机网络，来源可变，浏览器会话标记与登录账号仍可关联。 在同一条商品链接上，网站怎样知道订单属于你 用一个 虚构购物系统 展开：第一次进入时，你可能只有一个未登录会话。登录成功后，服务把会话关联到账号，浏览器保存相应标记。之后点击“我的订单”，请求附上这个标记，服务从自己的记录找出账号，再核对订单权限。 标记可以是不含姓名的编号，账号资料保存在服务端。浏览器不能自己随意宣告“我是小林”就得到小林订单；服务要验证这份标记是否有效、过期、已撤销以及是否拥有相应权限。 你切到热点后来源IP变了，保存的标记可能仍有效，所以网站继续显示账号。网站用原有登录标记找到了账号，并不需要“通过新IP猜出你是谁”。若服务要求重新验证，它可能在评估会话和风险，具体由其规则决定。 同一个办公室，是一个来源却有许多账号 几个人共用公网出口，各自在浏览器中保留自己的会话。网站虽然看见同一个来源IP，仍可以通过不同登录标记区分账号。平台如果只按IP统计，会把多人的操作合起来；如果还看会话，就有更多分辨线索。 这些线索也不保证唯一定位自然人：账号可由多人按授权共享，一个人可用多个设备，浏览器特征可能相似。业务记录“某账号执行过操作”和“某个自然人亲自做了操作”之间仍可能需要其他证据。 为什么换子域名、换浏览器，登录状态会不同 浏览器保存的数据有发送范围。某个Cookie可以只用于当前主机，另一个可以按合适父域名范围使用，路径等条件也会限制发送。这些安排不等于所有同品牌页面必然共享会话。 换另一个浏览器，新浏览器没有自动复制原会话；打开网站可能先要求登录。若再登录同一账号，服务器仍能展示同一账号下已有资料。清本地标记改变的是这段访问的凭据，不是把远处数据库的账号删除。 子域名与同源解释页面安全边界，Cookie规则与之有联系但并不相同。退出登录也应由应用处理会话撤销，而不是只凭地址栏变了就判断已经退出。 设备指纹为什么只能作为关联线索 浏览器类型、语言、设备环境及其他可得特征可能形成组合，用来判断访问是否可能相关。升级系统、改设置会改变特征，不同设备也可能相似；这些特征只能帮助关联访问；网站核对登录凭据，才是在验证账号。 你理解网站认人时，可以把一条访问展开为来源IP、携带标记、验证账号、设备环境、实际行为。风控使用它们联合推断，登录系统核对登录标记等凭据；不能把其中任何一个都叫作精确永久“身份”。 网站怎样把连续操作接起来 网页通信中，每次请求都要说明想做什么。网站还需要把“登录成功”“查看订单”等操作关联起来。常见方法是给这段访问一个会话标记，让浏览器保存并在后续请求中附带它。 Cookie就是浏览器按规则保存并发送给对应网站的一类数据。网站可用它保存会话标记，再从服务器记录中找出访问状态。浏览器如何保存与发送Cookie 这不是每个Cookie都直接写着姓名；有些只存一个关联编号，有些用途与登录无关。 同一个人，不必来自同一个网络 你换了接入网络，来源IP可能变了，浏览器里的会话标记还在，网站便可能继续找到同一会话。再次登录同一个账号，即使换了设备，也能关联到同一账号记录。 反过来，多个人可能在办公室共用一个来源IP，各自却有独立会话和账号。共享IP的识别问题 网络地址适合做来源线索，不能代替密码、登录标记等账号验证。 设备指纹是在做怎样的判断 浏览器与设备特征也可能被用于关联访问。这类特征组合常被称为设备指纹。它们可能提供识别线索，但不是不可改变的硬件身份证；不同设备可能相似，升级也可能改变特征。 风险产品可接收浏览器、语言、会话等资料。MaxMind公开的设备输入 哪个平台用了哪些组合、怎样比较，必须以该平台信息为准。 换IP、清Cookie、退出登录，分别改变什么 动作 主要改变的东西 不自动做到的事情 --- --- --- 换网络或出口 某些访问的来源 删除网站账号或历史 清除网站Cookie 浏览器保存的标记 删除服务器已有记录 退出登录 网站允许当前浏览器使用的登录状态 保证所有来源线索都消失 换设备 设备与本地资料 保证同一账号无法关联 实际效果受网站会话设计影响。理解身份时，可以先问三个问题：从哪个网络来，携带了哪个访问标记，网站验证的是哪个账号。它们有联系，但不能互相替代。 相关概念 - IP怎样用于风控 - VPN保护与身份边界","outline":[{"id":"section-1","title":"在同一条商品链接上，网站怎样知道订单属于你","depth":2},{"id":"section-2","title":"同一个办公室，是一个来源却有许多账号","depth":2},{"id":"section-3","title":"为什么换子域名、换浏览器，登录状态会不同","depth":2},{"id":"section-4","title":"设备指纹为什么只能作为关联线索","depth":2},{"id":"section-5","title":"网站怎样把连续操作接起来","depth":2},{"id":"section-6","title":"同一个人，不必来自同一个网络","depth":2},{"id":"section-7","title":"设备指纹是在做怎样的判断","depth":2},{"id":"section-8","title":"换IP、清Cookie、退出登录，分别改变什么","depth":2}]},{"id":"transactions","group":"services","title":"点了登录、提交订单，什么才算真的成功？","question":"点了登录、提交订单，什么才算真的成功？","summary":"区分点按钮、请求送达、业务写入、响应到达和界面显示，不因超时重复推断成败。","terms":["业务状态","接口","API"],"aliases":["业务状态","","接口","","API","interface 接口"],"related":["web","identity","delivery"],"html":"\u003cp>网页按钮亮了，你点下去，页面开始转圈。转圈后提示成功、失败，或者一直没有结果。\u003cstrong>“我点击了”“信息送到了”“服务保存了”“回答回来了”“界面显示了”，是不同事件。\u003c/strong> 这能解释很多日常困惑：网络没断却操作失败，或者超时后事情其实已经办成。\u003c/p>\n\u003cp>下面用一个\u003cstrong>虚构购物系统\u003c/strong>说明机制，所有记录和状态为教学设计。不需要操作真实付款；真实订单以服务的正式记录和支持渠道核对。\u003c/p>\n\u003ch2 id=\"section-1\">登录时，网站核对账号和凭据\u003c/h2>\n\u003cp>页面收集你的输入，再把登录请求交给对应服务。网站核对密码等凭据，确认你有权登录这个账号。浏览器只检查输入够不够长，还不能证明登录成功。成功时，服务建立或更新会话，浏览器保存相应标记；后面查看订单时，再附带这个标记。\u003c/p>\n\u003cp>这样看，“显示登录表单”只说明你拿到了页面；“提示密码错误”通常说明有一项验证给出了拒绝结果；“一直等待”则可能发生在连接、处理或返回阶段。错误反馈的具体来源因应用而异，不能用一条转圈动画区分所有原因。\u003ca href=\"#/identity\">会话如何连接操作\u003c/a>\u003c/p>\n\u003ch2 id=\"section-2\">查看订单与提交订单，需求不同\u003c/h2>\n\u003cp>查看通常是索取已有资料，提交则请求服务改变状态。两者都要通信，但后者更需要服务核对账号、库存、重复操作及其他规则。网页程序通过约定的方式向服务器发请求、取得结果，这种约定常叫接口或API。例如页面可以请求“查询订单”或“创建订单”，地址栏未必因此变化。\u003c/p>\n\u003cp>路径可以说明要查看或修改哪笔订单；请求正文可以携带商品和收货地址；登录标记帮助网站找到操作账号。服务仍要自己验证这些内容，不能因为收到“订单18”就把任何账号当成订单主人。\u003c/p>\n\u003ch2 id=\"section-3\">一次提交的五个可区分阶段\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>页面记录操作。\u003c/strong> 点击可能触发本地检查；发现必填项缺失时，根本还没有发出完整提交请求。\u003c/li>\n\u003cli>\u003cstrong>请求经网络到达。\u003c/strong> 数据交给接收服务。传输层确认取得数据，不等于应用完成保存。\u003c/li>\n\u003cli>\u003cstrong>服务核对并处理。\u003c/strong> 检查权限、资料和业务状态，按规则写入订单；库存不足也可能在这里返回失败。\u003c/li>\n\u003cli>\u003cstrong>结果返回。\u003c/strong> 服务把结果交给网络，但返回途中仍可中断。\u003c/li>\n\u003cli>\u003cstrong>页面解释并显示。\u003c/strong> 浏览器取得结果并更新界面；本地程序异常也可能使正确结果没显示。\u003c/li>\n\u003c/ol>\n\u003cp>每一段都能出问题。定位时，需要看已经知道哪一步完成了，而不是把所有失败都叫“网络不好”。网页响应里的数字状态也只描述协议结果；某个响应正常到达，正文仍可能说明业务未获批准。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP语义与状态\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-4\">完整示范：超时后，我是否该再点一次\u003c/h2>\n\u003cp>虚构输入：小林选好商品点“提交”，页面等待后提示超时，没有订单号。首次判断是“没成功，继续按就行”。\u003c/p>\n\u003cp>先看能确定什么：他只知道没有及时收到结果。可能请求没到，也可能服务已经保存订单、回复没回来。单靠超时，不能在这两种情况中作选择。\u003c/p>\n\u003cp>更合适的做法：保留原来的时间和提示，重新进入同一服务的订单列表，核对是否有本次订单和其状态。假设示范中能找到对应订单，小林就停止重复提交，改为核对已有订单；这时得到的结论是服务有记录，而不是根据转圈猜测成败。\u003c/p>\n\u003cp>改变条件：如果订单列表也打不开，他仍没有足够证据确定是否写入，应该保留时间和提示，通过服务规定的恢复流程查询。若页面明确告诉他资料校验失败且未提交，则可以修正资料后重新操作。不同证据决定不同下一步。\u003c/p>\n\u003cp>应用可以设计操作编号，让重复的业务请求识别为同一次动作。这是应用防重逻辑；与底层网络对丢失数据的重传不同。不能假定任何网站都有同样保护。\u003c/p>\n\u003ch2 id=\"section-5\">为什么切换网络有时只是恢复显示\u003c/h2>\n\u003cp>你提交后断网，再切到热点，页面重新查到成功记录。新的网络只帮助你再联系服务、取回状态，并不一定是在热点上第一次创建记录。这解释了“刚才报错，怎么后来又成功”的一部分情形。\u003c/p>\n\u003cp>同样，消息服务收到、朋友设备收到、朋友阅读是不同阶段；网盘接收文件、保存完成、分享权限生效也不同。因此要分别问：服务器保存了吗，接收设备收到了吗，接收者读了吗？不能用一个“发送成功”概括全部结果。见\u003ca href=\"#/messages\">消息的送达状态\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-6\">日常处理时可以抓住哪些线索\u003c/h2>\n\u003cp>记录服务名称、操作时间、具体错误、是否获得正式编号、是否能在官方记录中找到结果。不要把刷新、退出或换IP当作“撤销已提交业务”的可靠办法；这些动作主要改变界面、会话或路径，服务保存的状态需由相应业务流程处理。\u003c/p>\n\u003cp>看到“成功”时，知道成功属于哪一步；看到“失败”时，知道现有证据能排除什么。这样才能决定下一步是检查网络、修改资料，还是查询已有记录，避免把超时误当成“什么都没发生”。\u003c/p>\n","text":"点了登录、提交订单，什么才算真的成功？ 网页按钮亮了，你点下去，页面开始转圈。转圈后提示成功、失败，或者一直没有结果。 “我点击了”“信息送到了”“服务保存了”“回答回来了”“界面显示了”，是不同事件。 这能解释很多日常困惑：网络没断却操作失败，或者超时后事情其实已经办成。 下面用一个 虚构购物系统 说明机制，所有记录和状态为教学设计。不需要操作真实付款；真实订单以服务的正式记录和支持渠道核对。 登录时，网站核对账号和凭据 页面收集你的输入，再把登录请求交给对应服务。网站核对密码等凭据，确认你有权登录这个账号。浏览器只检查输入够不够长，还不能证明登录成功。成功时，服务建立或更新会话，浏览器保存相应标记；后面查看订单时，再附带这个标记。 这样看，“显示登录表单”只说明你拿到了页面；“提示密码错误”通常说明有一项验证给出了拒绝结果；“一直等待”则可能发生在连接、处理或返回阶段。错误反馈的具体来源因应用而异，不能用一条转圈动画区分所有原因。会话如何连接操作 查看订单与提交订单，需求不同 查看通常是索取已有资料，提交则请求服务改变状态。两者都要通信，但后者更需要服务核对账号、库存、重复操作及其他规则。网页程序通过约定的方式向服务器发请求、取得结果，这种约定常叫接口或API。例如页面可以请求“查询订单”或“创建订单”，地址栏未必因此变化。 路径可以说明要查看或修改哪笔订单；请求正文可以携带商品和收货地址；登录标记帮助网站找到操作账号。服务仍要自己验证这些内容，不能因为收到“订单18”就把任何账号当成订单主人。 一次提交的五个可区分阶段 1. 页面记录操作。 点击可能触发本地检查；发现必填项缺失时，根本还没有发出完整提交请求。 2. 请求经网络到达。 数据交给接收服务。传输层确认取得数据，不等于应用完成保存。 3. 服务核对并处理。 检查权限、资料和业务状态，按规则写入订单；库存不足也可能在这里返回失败。 4. 结果返回。 服务把结果交给网络，但返回途中仍可中断。 5. 页面解释并显示。 浏览器取得结果并更新界面；本地程序异常也可能使正确结果没显示。 每一段都能出问题。定位时，需要看已经知道哪一步完成了，而不是把所有失败都叫“网络不好”。网页响应里的数字状态也只描述协议结果；某个响应正常到达，正文仍可能说明业务未获批准。HTTP语义与状态 完整示范：超时后，我是否该再点一次 虚构输入：小林选好商品点“提交”，页面等待后提示超时，没有订单号。首次判断是“没成功，继续按就行”。 先看能确定什么：他只知道没有及时收到结果。可能请求没到，也可能服务已经保存订单、回复没回来。单靠超时，不能在这两种情况中作选择。 更合适的做法：保留原来的时间和提示，重新进入同一服务的订单列表，核对是否有本次订单和其状态。假设示范中能找到对应订单，小林就停止重复提交，改为核对已有订单；这时得到的结论是服务有记录，而不是根据转圈猜测成败。 改变条件：如果订单列表也打不开，他仍没有足够证据确定是否写入，应该保留时间和提示，通过服务规定的恢复流程查询。若页面明确告诉他资料校验失败且未提交，则可以修正资料后重新操作。不同证据决定不同下一步。 应用可以设计操作编号，让重复的业务请求识别为同一次动作。这是应用防重逻辑；与底层网络对丢失数据的重传不同。不能假定任何网站都有同样保护。 为什么切换网络有时只是恢复显示 你提交后断网，再切到热点，页面重新查到成功记录。新的网络只帮助你再联系服务、取回状态，并不一定是在热点上第一次创建记录。这解释了“刚才报错，怎么后来又成功”的一部分情形。 同样，消息服务收到、朋友设备收到、朋友阅读是不同阶段；网盘接收文件、保存完成、分享权限生效也不同。因此要分别问：服务器保存了吗，接收设备收到了吗，接收者读了吗？不能用一个“发送成功”概括全部结果。见消息的送达状态。 日常处理时可以抓住哪些线索 记录服务名称、操作时间、具体错误、是否获得正式编号、是否能在官方记录中找到结果。不要把刷新、退出或换IP当作“撤销已提交业务”的可靠办法；这些动作主要改变界面、会话或路径，服务保存的状态需由相应业务流程处理。 看到“成功”时，知道成功属于哪一步；看到“失败”时，知道现有证据能排除什么。这样才能决定下一步是检查网络、修改资料，还是查询已有记录，避免把超时误当成“什么都没发生”。","outline":[{"id":"section-1","title":"登录时，网站核对账号和凭据","depth":2},{"id":"section-2","title":"查看订单与提交订单，需求不同","depth":2},{"id":"section-3","title":"一次提交的五个可区分阶段","depth":2},{"id":"section-4","title":"完整示范：超时后，我是否该再点一次","depth":2},{"id":"section-5","title":"为什么切换网络有时只是恢复显示","depth":2},{"id":"section-6","title":"日常处理时可以抓住哪些线索","depth":2}]},{"id":"messages","group":"services","title":"朋友不在线，消息怎么还能送达？","question":"朋友不在线，消息怎么还能送达？","summary":"服务器先保存消息，朋友设备恢复联网后再收取；发送、送达和已读各有含义。","terms":["存储转发","推送","已读"],"aliases":["存储转发","","推送","","已读",""],"related":["web","delivery","identity"],"html":"\u003cp>两个人不必同时保持连接，消息仍可以在后来出现。\u003cstrong>聊天服务器可以先接收并保存消息，等朋友的设备重新联网后再发送。\u003c/strong> 这类安排让双方在线时间不必重合。\u003c/p>\n\u003ch2 id=\"section-1\">从发送一句话，到朋友手机上出现它\u003c/h2>\n\u003cp>以一个\u003cstrong>虚构聊天服务\u003c/strong>为例：你给朋友账号发“到了吗”。聊天软件向服务器提交消息正文、朋友的账号和自己的登录标记。网络把数据送到聊天服务器；服务器根据朋友的账号找接收者，不是网络从正文中认出朋友。\u003c/p>\n\u003cp>服务核对身份并保存消息，然后决定目标账号目前有哪些可联系设备。设备在线时，消息可以经已有连接交付；暂时不在线时，记录可以等设备恢复后同步。好友账号比当前IP更稳定，所以他从Wi-Fi切到流量，不需要你重新拿他的IP发消息。\u003c/p>\n\u003cp>因此，发消息时不需要把朋友的IP写进每条消息：你的设备先联系聊天服务，服务再根据朋友的账号安排交付。有些产品会加密消息正文，服务器未必能读取。这里说明账号和消息怎样交付，不代表所有产品都使用同一种保护方式。\u003c/p>\n\u003ch2 id=\"section-2\">通知弹出来，正文却还没有加载\u003c/h2>\n\u003cp>手机系统的推送能力帮助应用在不同状态下获得通知。应用服务可以经系统推送服务传提醒或部分内容，应用打开后再取完整消息、图片或历史记录。这样通知链和内容同步链可以分开。\u003c/p>\n\u003cp>\u003cstrong>教学对照\u003c/strong>：锁屏出现“有一张图片”，打开应用却转圈。通知可能已经到达，完整图片访问暂时失败；若通知设置被关闭，你又可能在打开应用后直接看到消息。两种现象都不能仅凭通知有无判断消息保存是否成功。\u003c/p>\n\u003ch2 id=\"section-3\">多台设备为什么会有不同的未读状态\u003c/h2>\n\u003cp>账号在手机和电脑上使用时，服务还要管理各设备的同步进度和阅读状态。手机已经取得，不保证电脑此刻在线；手机报告阅读之后，电脑也需要在后续同步时更新相应显示。\u003c/p>\n\u003cp>有些产品把一个对勾当服务接收，有些另有送达与已读规则，必须看产品定义。理解时把证据分开：你按下发送、服务器保存消息、朋友的设备收到、应用标为已读，以及朋友实际理解了内容。网络机制最多支撑其中一部分，不能替后面的事件作保证。\u003c/p>\n\u003ch2 id=\"section-4\">地址负责到服务，账号负责到人\u003c/h2>\n\u003cp>把消息送到聊天服务，需要网络地址；告诉服务“发给哪个账号”，则是应用内容中的信息。两者解决不同层次的定位问题。服务器不能只凭网络来源就知道你想给哪位朋友发消息。\u003c/p>\n\u003cp>不同产品内部设计不同。下面用\u003cstrong>虚构聊天服务\u003c/strong>说明一种常见工作安排，不代表微信或其他具体应用的内部实现。\u003c/p>\n\u003ch2 id=\"section-5\">服务器先保存消息，朋友上线后再收取\u003c/h2>\n\u003cp>你发送消息，服务器核对发送账号的权限，把它与目标账号关联并保存。朋友在线时，服务可以通过已有连接交付；朋友离线时，保存的记录可等到以后取回。\u003c/p>\n\u003cp>邮箱的服务器接收与继续转发，是另一种存储转发安排。它说明通信可以跨越双方不同时在线的情况。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321.html\" target=\"_blank\" rel=\"noopener noreferrer\">邮件服务器的接收与重试\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">通知与完整内容，也可以分开走\u003c/h2>\n\u003cp>手机系统可能提供统一推送服务。应用服务器发出通知，推送服务联系设备，系统再展示或交给应用。应用打开后，还可以向自己的服务取得完整记录。\u003ca href=\"https://developer.apple.com/documentation/usernotifications/setting-up-a-remote-notification-server\" target=\"_blank\" rel=\"noopener noreferrer\">Apple对通知链的说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>因此，看到通知不一定证明完整消息已经同步到每台设备；没有通知也不一定证明服务器没有保存消息。通知权限、设备状态和应用取用路径都可能影响现象。\u003c/p>\n\u003ch2 id=\"section-7\">发送、送达、已读，各到哪一步\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态名称\u003c/th>\n\u003cth>在示意系统中可能代表的阶段\u003c/th>\n\u003cth>不能直接证明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>已发送\u003c/td>\n\u003ctd>服务接收了消息\u003c/td>\n\u003ctd>朋友设备已经取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已送达\u003c/td>\n\u003ctd>目标设备确认取得\u003c/td>\n\u003ctd>朋友已经阅读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已读\u003c/td>\n\u003ctd>应用报告阅读状态\u003c/td>\n\u003ctd>对方理解或同意内容\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>真实产品的这些名称以产品说明为准。网络传输确认、服务保存、设备收到和人的阅读是不同事件，不能用一个对勾替所有阶段作保证。\u003c/p>\n","text":"朋友不在线，消息怎么还能送达？ 两个人不必同时保持连接，消息仍可以在后来出现。 聊天服务器可以先接收并保存消息，等朋友的设备重新联网后再发送。 这类安排让双方在线时间不必重合。 从发送一句话，到朋友手机上出现它 以一个 虚构聊天服务 为例：你给朋友账号发“到了吗”。聊天软件向服务器提交消息正文、朋友的账号和自己的登录标记。网络把数据送到聊天服务器；服务器根据朋友的账号找接收者，不是网络从正文中认出朋友。 服务核对身份并保存消息，然后决定目标账号目前有哪些可联系设备。设备在线时，消息可以经已有连接交付；暂时不在线时，记录可以等设备恢复后同步。好友账号比当前IP更稳定，所以他从Wi-Fi切到流量，不需要你重新拿他的IP发消息。 因此，发消息时不需要把朋友的IP写进每条消息：你的设备先联系聊天服务，服务再根据朋友的账号安排交付。有些产品会加密消息正文，服务器未必能读取。这里说明账号和消息怎样交付，不代表所有产品都使用同一种保护方式。 通知弹出来，正文却还没有加载 手机系统的推送能力帮助应用在不同状态下获得通知。应用服务可以经系统推送服务传提醒或部分内容，应用打开后再取完整消息、图片或历史记录。这样通知链和内容同步链可以分开。 教学对照 ：锁屏出现“有一张图片”，打开应用却转圈。通知可能已经到达，完整图片访问暂时失败；若通知设置被关闭，你又可能在打开应用后直接看到消息。两种现象都不能仅凭通知有无判断消息保存是否成功。 多台设备为什么会有不同的未读状态 账号在手机和电脑上使用时，服务还要管理各设备的同步进度和阅读状态。手机已经取得，不保证电脑此刻在线；手机报告阅读之后，电脑也需要在后续同步时更新相应显示。 有些产品把一个对勾当服务接收，有些另有送达与已读规则，必须看产品定义。理解时把证据分开：你按下发送、服务器保存消息、朋友的设备收到、应用标为已读，以及朋友实际理解了内容。网络机制最多支撑其中一部分，不能替后面的事件作保证。 地址负责到服务，账号负责到人 把消息送到聊天服务，需要网络地址；告诉服务“发给哪个账号”，则是应用内容中的信息。两者解决不同层次的定位问题。服务器不能只凭网络来源就知道你想给哪位朋友发消息。 不同产品内部设计不同。下面用 虚构聊天服务 说明一种常见工作安排，不代表微信或其他具体应用的内部实现。 服务器先保存消息，朋友上线后再收取 你发送消息，服务器核对发送账号的权限，把它与目标账号关联并保存。朋友在线时，服务可以通过已有连接交付；朋友离线时，保存的记录可等到以后取回。 邮箱的服务器接收与继续转发，是另一种存储转发安排。它说明通信可以跨越双方不同时在线的情况。邮件服务器的接收与重试 通知与完整内容，也可以分开走 手机系统可能提供统一推送服务。应用服务器发出通知，推送服务联系设备，系统再展示或交给应用。应用打开后，还可以向自己的服务取得完整记录。Apple对通知链的说明 因此，看到通知不一定证明完整消息已经同步到每台设备；没有通知也不一定证明服务器没有保存消息。通知权限、设备状态和应用取用路径都可能影响现象。 发送、送达、已读，各到哪一步 状态名称 在示意系统中可能代表的阶段 不能直接证明 --- --- --- 已发送 服务接收了消息 朋友设备已经取得 已送达 目标设备确认取得 朋友已经阅读 已读 应用报告阅读状态 对方理解或同意内容 真实产品的这些名称以产品说明为准。网络传输确认、服务保存、设备收到和人的阅读是不同事件，不能用一个对勾替所有阶段作保证。 相关概念 - 传输确认的边界 - IP与账号的区别","outline":[{"id":"section-1","title":"从发送一句话，到朋友手机上出现它","depth":2},{"id":"section-2","title":"通知弹出来，正文却还没有加载","depth":2},{"id":"section-3","title":"多台设备为什么会有不同的未读状态","depth":2},{"id":"section-4","title":"地址负责到服务，账号负责到人","depth":2},{"id":"section-5","title":"服务器先保存消息，朋友上线后再收取","depth":2},{"id":"section-6","title":"通知与完整内容，也可以分开走","depth":2},{"id":"section-7","title":"发送、送达、已读，各到哪一步","depth":2}]},{"id":"live","group":"services","title":"视频通话为什么比看视频更怕卡？","question":"视频通话为什么比看视频更怕卡？","summary":"实时互动更需要及时信息，过晚到达会破坏交流。","terms":["缓冲","中继","实时通信"],"aliases":["缓冲","","中继","","实时通信",""],"related":["delivery","speed"],"html":"\u003cp>看一段录好的视频，可以提前下载后面的内容，再逐步播放；通话时，下一句话还没说出口。\u003cstrong>实时互动既要有足够的传输容量，也要让新信息及时抵达。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">会议里文字正常，声音却断断续续\u003c/h2>\n\u003cp>你在视频会议里打字能发出去，对方的语音却不连续。文字可以晚一点到仍读得完整；声音若每一小段忽早忽晚到达，播放就难保持节奏。文字晚一点到通常还可以阅读；通话如果延后太久，就难以接上对方的话。\u003c/p>\n\u003cp>设备正在连续采集声音，压缩成数据，附上播放时间等信息，再送到另一端。接收端不能等整场会议结束才播放，也不能无限等待迟到的片段。它会用少量缓冲吸收到达波动，必要时降低画质或采用声音恢复办法。\u003c/p>\n\u003ch2 id=\"section-2\">录播可以提前拿，通话拿不到未来\u003c/h2>\n\u003cp>\u003cstrong>虚构教学比较\u003c/strong>：你看录播时，设备提前攒下后面的内容，网络停一下仍能播；你正开麦说话，未来十秒尚未录下，另一端没有办法提前下载。所以同样网络条件，看视频流畅不证明会议也会流畅。\u003c/p>\n\u003cp>缓冲增加后，停顿可能减少，但你听到对方更晚。远距离会议里互相打断，有时正与往返等待及播放延后有关，而不只是参与者不愿听别人说完。实时体验既有容量问题，也有到达时间问题。\u003c/p>\n\u003ch2 id=\"section-3\">先找到对方，再传声音，可能不是同一条链\u003c/h2>\n\u003cp>会议软件可以先通过服务器发送邀请、确认账号，并交换建立连接需要的信息。声音和画面随后可能在两台设备间直接传送，也可能经过服务器转送。能接通会议说明协调取得一定结果，不说明声音路径已经达到理想质量。一个环节可用，另一个仍可能卡住。\u003c/p>\n\u003cp>若双方网络不便直接建立媒体连接，中继服务器帮助两端转送声音和画面。它多做了一次转送，但不意味着必定比直连差，实际互联条件还会影响结果。普通电话也涉及运营商服务资格与通话系统，不能仅凭外观把它与应用通话画成同一实现。\u003c/p>\n\u003ch2 id=\"section-4\">遇到卡顿，观察哪种变化才有用\u003c/h2>\n\u003cp>视频降清晰度后声音改善，容量压力值得检查；同一会议只有某一方声音异常，可比较那一方的接入和设备；大家同时异常，共同路径或服务值得核对。麦克风未获准、设备采集失败也会造成听不到，不能自动当网络丢包。\u003c/p>\n\u003cp>这些观察改变检查顺序，不直接确定原因。用\u003ca href=\"#/speed\">网速四种现象\u003c/a>和\u003ca href=\"#/troubleshoot\">对照排障\u003c/a>分别检查麦克风录音、网络传送和扬声器播放，才不会只用一个测速数解释所有问题。\u003c/p>\n\u003ch2 id=\"section-5\">一句话正在发生时怎样传递\u003c/h2>\n\u003cp>设备持续采集声音与画面，把它们编码和压缩，再通过网络送给另一端播放。这里是一连串正在进行的小工作，不是录完整场通话后才交付。\u003c/p>\n\u003cp>接收端常留一点缓冲：先攒少量内容，再平稳播放，吸收到达时间的波动。攒得更多可能更顺，却也让你更晚听到对方。流畅与及时之间需要平衡。\u003c/p>\n\u003ch2 id=\"section-6\">视频会通过谁\u003c/h2>\n\u003cp>以浏览器实时通信为例，双方通常先交换连接信息，尝试找到可用路径。能直接建立媒体连接时可以直接传，不能直连时可能通过中继节点转送。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API/Connectivity\" target=\"_blank\" rel=\"noopener noreferrer\">WebRTC连接方式\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>因此，业务服务器可能负责让双方找到彼此，声音却走另一条路径；也可能采用服务器转送。不能把所有通话都画成同一种固定链条。\u003c/p>\n\u003ch2 id=\"section-7\">迟到的声音，为什么未必值得一直等\u003c/h2>\n\u003cp>完整文件少一段，会影响文件正确性；实时声音某一段迟到太久，即使补回来，也可能赶不上交流节奏。应用需要判断哪些内容及时恢复、哪些用替代方式处理，还可能降低画质来减少压力。\u003c/p>\n\u003cp>可靠、有序的传输很有价值，但完整性与及时性是不同目标。使用某种轻量传输方式，也不意味着应用不做恢复或保护。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">传输规则的职责\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-8\">换个场景，需求就变了\u003c/h2>\n\u003cp>这是一组\u003cstrong>虚构教学对照\u003c/strong>：下载课程录音时，多等一下换来完整文件可以接受；连线讨论时，总是晚几秒听到回应会打断对话。两者都在传声音，却有不同的可接受结果。\u003c/p>\n\u003cp>录播也不是完全不怕网络变化。缓冲用完、容量持续不足，照样会停顿。只是它有机会使用提前取得的内容，实时通话无法提前拿到尚未发生的话。\u003c/p>\n","text":"视频通话为什么比看视频更怕卡？ 看一段录好的视频，可以提前下载后面的内容，再逐步播放；通话时，下一句话还没说出口。 实时互动既要有足够的传输容量，也要让新信息及时抵达。 会议里文字正常，声音却断断续续 你在视频会议里打字能发出去，对方的语音却不连续。文字可以晚一点到仍读得完整；声音若每一小段忽早忽晚到达，播放就难保持节奏。文字晚一点到通常还可以阅读；通话如果延后太久，就难以接上对方的话。 设备正在连续采集声音，压缩成数据，附上播放时间等信息，再送到另一端。接收端不能等整场会议结束才播放，也不能无限等待迟到的片段。它会用少量缓冲吸收到达波动，必要时降低画质或采用声音恢复办法。 录播可以提前拿，通话拿不到未来 虚构教学比较 ：你看录播时，设备提前攒下后面的内容，网络停一下仍能播；你正开麦说话，未来十秒尚未录下，另一端没有办法提前下载。所以同样网络条件，看视频流畅不证明会议也会流畅。 缓冲增加后，停顿可能减少，但你听到对方更晚。远距离会议里互相打断，有时正与往返等待及播放延后有关，而不只是参与者不愿听别人说完。实时体验既有容量问题，也有到达时间问题。 先找到对方，再传声音，可能不是同一条链 会议软件可以先通过服务器发送邀请、确认账号，并交换建立连接需要的信息。声音和画面随后可能在两台设备间直接传送，也可能经过服务器转送。能接通会议说明协调取得一定结果，不说明声音路径已经达到理想质量。一个环节可用，另一个仍可能卡住。 若双方网络不便直接建立媒体连接，中继服务器帮助两端转送声音和画面。它多做了一次转送，但不意味着必定比直连差，实际互联条件还会影响结果。普通电话也涉及运营商服务资格与通话系统，不能仅凭外观把它与应用通话画成同一实现。 遇到卡顿，观察哪种变化才有用 视频降清晰度后声音改善，容量压力值得检查；同一会议只有某一方声音异常，可比较那一方的接入和设备；大家同时异常，共同路径或服务值得核对。麦克风未获准、设备采集失败也会造成听不到，不能自动当网络丢包。 这些观察改变检查顺序，不直接确定原因。用网速四种现象和对照排障分别检查麦克风录音、网络传送和扬声器播放，才不会只用一个测速数解释所有问题。 一句话正在发生时怎样传递 设备持续采集声音与画面，把它们编码和压缩，再通过网络送给另一端播放。这里是一连串正在进行的小工作，不是录完整场通话后才交付。 接收端常留一点缓冲：先攒少量内容，再平稳播放，吸收到达时间的波动。攒得更多可能更顺，却也让你更晚听到对方。流畅与及时之间需要平衡。 视频会通过谁 以浏览器实时通信为例，双方通常先交换连接信息，尝试找到可用路径。能直接建立媒体连接时可以直接传，不能直连时可能通过中继节点转送。WebRTC连接方式 因此，业务服务器可能负责让双方找到彼此，声音却走另一条路径；也可能采用服务器转送。不能把所有通话都画成同一种固定链条。 迟到的声音，为什么未必值得一直等 完整文件少一段，会影响文件正确性；实时声音某一段迟到太久，即使补回来，也可能赶不上交流节奏。应用需要判断哪些内容及时恢复、哪些用替代方式处理，还可能降低画质来减少压力。 可靠、有序的传输很有价值，但完整性与及时性是不同目标。使用某种轻量传输方式，也不意味着应用不做恢复或保护。传输规则的职责 换个场景，需求就变了 这是一组 虚构教学对照 ：下载课程录音时，多等一下换来完整文件可以接受；连线讨论时，总是晚几秒听到回应会打断对话。两者都在传声音，却有不同的可接受结果。 录播也不是完全不怕网络变化。缓冲用完、容量持续不足，照样会停顿。只是它有机会使用提前取得的内容，实时通话无法提前拿到尚未发生的话。 相关概念 - 延迟与抖动 - 丢失与恢复","outline":[{"id":"section-1","title":"会议里文字正常，声音却断断续续","depth":2},{"id":"section-2","title":"录播可以提前拿，通话拿不到未来","depth":2},{"id":"section-3","title":"先找到对方，再传声音，可能不是同一条链","depth":2},{"id":"section-4","title":"遇到卡顿，观察哪种变化才有用","depth":2},{"id":"section-5","title":"一句话正在发生时怎样传递","depth":2},{"id":"section-6","title":"视频会通过谁","depth":2},{"id":"section-7","title":"迟到的声音，为什么未必值得一直等","depth":2},{"id":"section-8","title":"换个场景，需求就变了","depth":2}]},{"id":"speed","group":"services","title":"网速很高，为什么打开网页仍然慢？","question":"网速很高，为什么打开网页仍然慢？","summary":"速度取决于容量、等待、波动以及服务处理。","terms":["带宽","延迟","抖动","丢包"],"aliases":["带宽","bandwidth 网速 速度","延迟","latency ping 等待","抖动","","丢包",""],"related":["delivery","web","troubleshoot","live","routes"],"html":"\u003cp>“能同时搬多少”和“多久得到第一次回应”是两项不同能力。\u003cstrong>下载速度、收到回复要等多久、数据是否迟到或丢失，都会影响体验。网站处理请求的时间也会让你等待。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">把“慢”说成你正在经历的动作\u003c/h2>\n\u003cp>等待商品站第一次出现、下载文件的持续速度、会议中对方晚几秒回应，是三种不同的慢。打开网页可能要等DNS查询、建立连接、网站处理，再下载页面内容。下载文件更在意每秒传来多少数据；会议还在意声音要等多久、能否连续到达。\u003c/p>\n\u003cp>买更高容量的家庭接入，可能改善多人同时传大文件；如果主要在等远方服务处理，或那条路径往返很长，升级本地容量不必带来同等改善。不能把某一段的标称能力当整条访问链的最终表现。\u003c/p>\n\u003ch2 id=\"section-2\">下载很快，上传为什么让全家都觉得卡\u003c/h2>\n\u003cp>\u003cstrong>虚构家庭场景\u003c/strong>：电脑备份照片时，其他人的网页点击和会议都变慢。照片上传持续占用出口，其他小份通信也要排队；下载接收的确认和控制信息也需要返回，所以只观察下载容量会漏掉共同影响。\u003c/p>\n\u003cp>停止备份后恢复正常，是一个有用对照，说明同时上传值得检查。但设备性能、接入信号和服务状态仍可能影响结果；不能只凭这一现象就认定路由器必须更换。\u003c/p>\n\u003ch2 id=\"section-3\">“第一次慢，第二次快”不一定是网速变了\u003c/h2>\n\u003cp>第一次访问可能需要查询名称、建立连接、取得程序与图片；第二次可以复用连接或副本。服务端也可能已经准备好所需资料。第二次打开少做了查询、连接或下载等工作，即使网速没有变化，也可能更快。\u003c/p>\n\u003cp>相反，页面的文字和图片已经保存在电脑里，但实时订单仍需远处服务回答。首页秒开、订单转圈可以同时发生；理解速度要对准具体请求，而不是只观察页面有没有出现。\u003c/p>\n\u003ch2 id=\"section-4\">测速结果怎样用，怎样不过度用\u003c/h2>\n\u003cp>测速工具在当时连接某个测试服务器，测量你与它之间的数据传送表现。它可以帮助发现接入容量明显不足，却不覆盖所有跨网服务、设备负载、登录等待和业务处理。\u003c/p>\n\u003cp>\u003cstrong>教学对照\u003c/strong>：测速好，远方会议差；同一会议换热点改善。两次证据结合后，可以更关注原路径，但仍需保持会议服务、设备和时段尽量接近。你真正关心的是目标应用的完整任务能否顺畅完成。\u003ca href=\"#/browsing\">一次访问\u003c/a>列出那些在测速数字以外的等待环节。\u003c/p>\n\u003ch2 id=\"section-5\">四种常被混称为网速的现象\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>用普通话看什么\u003c/th>\n\u003cth>更明显影响的体验\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>带宽\u003c/td>\n\u003ctd>一段连接单位时间能承载多少信息\u003c/td>\n\u003ctd>大文件与多人共享\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>延迟\u003c/td>\n\u003ctd>信息抵达或往返要等多久\u003c/td>\n\u003ctd>点击响应与对话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>抖动\u003c/td>\n\u003ctd>到达时间是否忽快忽慢\u003c/td>\n\u003ctd>实时声音与画面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>丢包\u003c/td>\n\u003ctd>部分小份信息没到\u003c/td>\n\u003ctd>重传等待或播放缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>带宽高表示单位时间能传较多数据，不代表第一次回复来得快。网页很小也可能等很久：请求要往返，网站还需要时间处理。\u003c/p>\n\u003ch2 id=\"section-6\">打开小网页，也可能多次等待\u003c/h2>\n\u003cp>名称查询、建立新连接、协商HTTPS保护、下载页面的不同文件，都可能需要往返；已有连接或缓存可省掉一部分等待。网页文件很小，也可能在到达之前经历多次停顿。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">网页请求的工作链\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>服务器忙着验证、读取或生成结果，也会造成等待。网络把请求送到之后，网页仍可能转圈。这时加大本地接入容量未必解决问题。\u003c/p>\n\u003ch2 id=\"section-7\">排队会让等待突然变长\u003c/h2>\n\u003cp>一条共享道路被大量上传或下载占用时，其他信息可能在出口排队。传输会根据反馈调整发送节奏；并不是发送越猛越快。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP的流量与拥塞处理\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>近处已有可用副本时，缓存能够减少远方取用与往返。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9111.html\" target=\"_blank\" rel=\"noopener noreferrer\">响应缓存\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a> 这也解释了为什么第一次打开与再次打开，体验可能不同。\u003c/p>\n\u003ch2 id=\"section-8\">怎样解释“测得很快，应用却慢”\u003c/h2>\n\u003cp>以下为\u003cstrong>虚构教学对照\u003c/strong>：测速连到附近测试点，大文件吞吐表现好；视频会议连到另一条远方路径，仍有停顿。前一次测试没有覆盖后一次路径与服务，结果可以同时成立。\u003c/p>\n\u003cp>要判断实际问题，应观察目标应用，在相近时段比较同网络与另一网络，并区分开始等待与持续传输。一个测速数字不能替所有服务做保证。具体步骤见\u003ca href=\"#/troubleshoot\">对照排障\u003c/a>。\u003c/p>\n","text":"网速很高，为什么打开网页仍然慢？ “能同时搬多少”和“多久得到第一次回应”是两项不同能力。 下载速度、收到回复要等多久、数据是否迟到或丢失，都会影响体验。网站处理请求的时间也会让你等待。 把“慢”说成你正在经历的动作 等待商品站第一次出现、下载文件的持续速度、会议中对方晚几秒回应，是三种不同的慢。打开网页可能要等DNS查询、建立连接、网站处理，再下载页面内容。下载文件更在意每秒传来多少数据；会议还在意声音要等多久、能否连续到达。 买更高容量的家庭接入，可能改善多人同时传大文件；如果主要在等远方服务处理，或那条路径往返很长，升级本地容量不必带来同等改善。不能把某一段的标称能力当整条访问链的最终表现。 下载很快，上传为什么让全家都觉得卡 虚构家庭场景 ：电脑备份照片时，其他人的网页点击和会议都变慢。照片上传持续占用出口，其他小份通信也要排队；下载接收的确认和控制信息也需要返回，所以只观察下载容量会漏掉共同影响。 停止备份后恢复正常，是一个有用对照，说明同时上传值得检查。但设备性能、接入信号和服务状态仍可能影响结果；不能只凭这一现象就认定路由器必须更换。 “第一次慢，第二次快”不一定是网速变了 第一次访问可能需要查询名称、建立连接、取得程序与图片；第二次可以复用连接或副本。服务端也可能已经准备好所需资料。第二次打开少做了查询、连接或下载等工作，即使网速没有变化，也可能更快。 相反，页面的文字和图片已经保存在电脑里，但实时订单仍需远处服务回答。首页秒开、订单转圈可以同时发生；理解速度要对准具体请求，而不是只观察页面有没有出现。 测速结果怎样用，怎样不过度用 测速工具在当时连接某个测试服务器，测量你与它之间的数据传送表现。它可以帮助发现接入容量明显不足，却不覆盖所有跨网服务、设备负载、登录等待和业务处理。 教学对照 ：测速好，远方会议差；同一会议换热点改善。两次证据结合后，可以更关注原路径，但仍需保持会议服务、设备和时段尽量接近。你真正关心的是目标应用的完整任务能否顺畅完成。一次访问列出那些在测速数字以外的等待环节。 四种常被混称为网速的现象 名称 用普通话看什么 更明显影响的体验 --- --- --- 带宽 一段连接单位时间能承载多少信息 大文件与多人共享 延迟 信息抵达或往返要等多久 点击响应与对话 抖动 到达时间是否忽快忽慢 实时声音与画面 丢包 部分小份信息没到 重传等待或播放缺口 带宽高表示单位时间能传较多数据，不代表第一次回复来得快。网页很小也可能等很久：请求要往返，网站还需要时间处理。 打开小网页，也可能多次等待 名称查询、建立新连接、协商HTTPS保护、下载页面的不同文件，都可能需要往返；已有连接或缓存可省掉一部分等待。网页文件很小，也可能在到达之前经历多次停顿。网页请求的工作链 服务器忙着验证、读取或生成结果，也会造成等待。网络把请求送到之后，网页仍可能转圈。这时加大本地接入容量未必解决问题。 排队会让等待突然变长 一条共享道路被大量上传或下载占用时，其他信息可能在出口排队。传输会根据反馈调整发送节奏；并不是发送越猛越快。TCP的流量与拥塞处理 近处已有可用副本时，缓存能够减少远方取用与往返。响应缓存 这也解释了为什么第一次打开与再次打开，体验可能不同。 怎样解释“测得很快，应用却慢” 以下为 虚构教学对照 ：测速连到附近测试点，大文件吞吐表现好；视频会议连到另一条远方路径，仍有停顿。前一次测试没有覆盖后一次路径与服务，结果可以同时成立。 要判断实际问题，应观察目标应用，在相近时段比较同网络与另一网络，并区分开始等待与持续传输。一个测速数字不能替所有服务做保证。具体步骤见对照排障。 相关概念 - 实时通信的取舍 - 路径为什么可能绕行","outline":[{"id":"section-1","title":"把“慢”说成你正在经历的动作","depth":2},{"id":"section-2","title":"下载很快，上传为什么让全家都觉得卡","depth":2},{"id":"section-3","title":"“第一次慢，第二次快”不一定是网速变了","depth":2},{"id":"section-4","title":"测速结果怎样用，怎样不过度用","depth":2},{"id":"section-5","title":"四种常被混称为网速的现象","depth":2},{"id":"section-6","title":"打开小网页，也可能多次等待","depth":2},{"id":"section-7","title":"排队会让等待突然变长","depth":2},{"id":"section-8","title":"怎样解释“测得很快，应用却慢”","depth":2}]},{"id":"risk","group":"trust","title":"IP为什么是风控的重要线索？","question":"IP为什么是风控的重要线索？","summary":"IP可提供来源、区域和历史活动线索，平台还需要联合其他证据。","terms":["IP信誉","风控","机房IP","住宅IP"],"aliases":["IP信誉","","风控","risk fraud 验证码 封禁 异常登录","机房IP","","住宅IP","residential IP 纯净IP 独享IP"],"related":["identity","nat","vpn"],"html":"\u003cp>你登录账号，平台突然要求验证码。它可能已经收到了你的请求，只是希望进一步确认这次访问。\u003cstrong>风控是在信息不完整时，用多条线索判断是否需要额外验证或限制。\u003c/strong> IP是常见线索之一，不能独立证明一个人的身份或意图。\u003c/p>\n\u003ch2 id=\"section-1\">为什么还没登录，网站就能用IP判断风险\u003c/h2>\n\u003cp>网站接收连接时，通常就能看到来源IP，即使你还没登录。网站可以统计同一IP短时间发来多少请求，并决定是否要求验证码或暂时限制访问。账号可能尚未确认，IP却已经可以用于计数。\u003c/p>\n\u003cp>但“早能拿到”和“唯一准确”不是一回事。请求从公共代理、分发入口或共享出口过来时，需要确认网站看到的是用户出口的IP，还是中间转送服务器的IP。网站可以通过自己信任的转送服务器取得原始来源信息。不能把客户端随意声明的地址当验证过的网络事实。\u003c/p>\n\u003ch2 id=\"section-2\">平台从一条访问里怎样逐步形成判断\u003c/h2>\n\u003cp>以一个\u003cstrong>虚构账号保护场景\u003c/strong>为例：某账号常在本地区使用，今天从远方出口登录，同时出现设备变化。系统可以比较来源地区、网络属性、会话和操作，再决定是否要求二次验证。IP不是开关，而是判断输入之一。\u003c/p>\n\u003cp>如果只有IP估计的地区变化，登录凭据和操作习惯仍与以往一致，解释可能是出差、移动网络安排或VPN；若同时有异常尝试与身份变化，风险解释会不同。具体平台选哪些线索、怎样组合及多久更新，公开厂商字段不能代替它的内部规则。\u003c/p>\n\u003cp>IP可以用来识别请求的网络来源，帮助网站关联访问、统计请求量。但同一个IP可能由多人共用，也可能是VPN或代理的出口；同一个人换网络后，IP也可能变化。因此，来源IP相同只能说明访问使用了同一个网络地址，不能直接证明是同一个人。\u003c/p>\n\u003ch2 id=\"section-3\">验证码、登录验证、频率限制和账号封禁不同\u003c/h2>\n\u003cp>验证码可能在确认访问方式或缓解滥用；二次登录验证可能在确认使用者是否有权登录这个账号；频率限制在控制短时操作量；账号限制又涉及业务政策。屏幕文字、状态和官方通知才帮助区分当前是哪种处理。\u003c/p>\n\u003cp>不能因为看见验证码就认定账号已违规；也不能因为换网后可用就确定原IP是唯一原因。换网同时改变路径、查询、地区来源等多个条件，证据只能支持相应程度的判断。\u003c/p>\n\u003ch2 id=\"section-4\">遇到“住宅、机房、独享、纯净”营销词怎样理解\u003c/h2>\n\u003cp>这些标签有的描述网络归属，有的描述地址分配，有的没有统一定义。一个家庭出口也会有共享活动，一个固定独享出口也可能属于已知代理来源。标签不是平台信誉证明，更不保证任何账号永不验证。\u003c/p>\n\u003cp>正常使用中，保留验证或限制的具体提示、发生时段、账号是否多网络持续异常，按官方流程恢复，会比反复换来源更能帮助支持人员判断。这些线索有助于判断访问是否异常，但不能仅凭来源IP确定一个人的意图。\u003c/p>\n\u003ch2 id=\"section-5\">平台为什么容易观察到IP\u003c/h2>\n\u003cp>访问必须经过网络送到接收端，接收端需要知道把回复送回哪条连接。因此，接收入口通常能观察访问的来源地址。若服务前面有转发或分发设施，后面的业务程序可能直接看到中间节点地址，需要从可信入口正确取得来源信息。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/device-inputs-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">MaxMind对访问来源的说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>若访问经VPN公共出口，观察到的来源可能是出口IP。这说明的是网络路径，不会自动清掉你的账号或浏览器会话。\u003c/p>\n\u003ch2 id=\"section-6\">一个地址，可以附带哪些线索\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>线索\u003c/th>\n\u003cth>平台可能借它提出的问题\u003c/th>\n\u003cth>推断的边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>大致地区\u003c/td>\n\u003ctd>与账号此前常用地区是否明显不同？\u003c/td>\n\u003ctd>地区估计有误差，不能定位住址\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网络归属\u003c/td>\n\u003ctd>来自普通接入网络，还是云服务网络？\u003c/td>\n\u003ctd>公司、自建服务和合法代理也会用云网络\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已知代理属性\u003c/td>\n\u003ctd>是否属于观察到的VPN或代理出口？\u003c/td>\n\u003ctd>数据不完整；使用VPN有正常用途\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求行为\u003c/td>\n\u003ctd>同一来源是否短时间带来大量操作？\u003c/td>\n\u003ctd>共用出口可能汇集许多人的正常访问\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>IP地区通常来自数据库估计，不是地址里写着城市。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-geolocation-risk-data-maxmind\" target=\"_blank\" rel=\"noopener noreferrer\">地区数据的准确性与边界\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a> 已知代理属性也依赖观察和数据库，不是看一眼地址就全知。\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-anonymizer-risk-data-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">代理来源识别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>“住宅IP”通常是在描述普通家庭接入网络的来源，“机房IP”通常是在描述云或托管网络来源。“静态IP”说的是地址是否保持，“独享IP”说的是是否共用；这些词回答不同的问题。任何一种标签都不保证平台信任，营销中的“纯净”也没有跨平台统一的安全标准。\u003c/p>\n\u003ch2 id=\"section-7\">完整示范：同事一起遇到验证码\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构教学示例\u003c/strong>。办公室几个人在同一时间访问服务，都出现验证码。他们起初以为“平台认定每个人都违规了”。\u003c/p>\n\u003cp>先看证据：办公室可能共用一个公网出口。如果规则把同一IP的请求累计到一起，几个人的正常操作也会集中计数。\u003ca href=\"https://developers.cloudflare.com/waf/rate-limiting-rules/parameters/\" target=\"_blank\" rel=\"noopener noreferrer\">Cloudflare对共享出口计数的说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>更合适的做法是记录时间、提示，以及几个人共用同一办公室网络这一事实，完成平台要求的验证；若持续影响工作，向平台提交这些线索。假设后来确认是共享来源触发了额外验证，修正后的结论就是“这个来源需要进一步确认”，不能外推为“所有账号违规”。这是示范结果，不是对现实平台的诊断。\u003c/p>\n\u003cp>\u003cstrong>换一个条件\u003c/strong>：只有一个账号在家庭网络、办公室和手机热点都遇到限制，其他同事正常。共同出口的解释就弱了，需要检查账号通知、会话或该账号行为。更换网络只能改变某些线索，不能证明限制会消失。\u003c/p>\n\u003ch2 id=\"section-8\">理解规则后，怎样应对异常\u003c/h2>\n\u003cp>平台可以把来源、账号、设备和访问行为一起分析，具体权重与阈值因平台而异。正常换网络、出差或使用VPN也可能带来新线索。收到提示时先分清是连接失败、补充验证还是账号限制，再按官方验证或申诉流程处理。\u003c/p>\n\u003cp>面对某个平台的限制，应结合具体提示和访问情况判断。公开资料只能帮助理解常见机制，不能揭示该平台的全部内部规则。\u003c/p>\n","text":"IP为什么是风控的重要线索？ 你登录账号，平台突然要求验证码。它可能已经收到了你的请求，只是希望进一步确认这次访问。 风控是在信息不完整时，用多条线索判断是否需要额外验证或限制。 IP是常见线索之一，不能独立证明一个人的身份或意图。 为什么还没登录，网站就能用IP判断风险 网站接收连接时，通常就能看到来源IP，即使你还没登录。网站可以统计同一IP短时间发来多少请求，并决定是否要求验证码或暂时限制访问。账号可能尚未确认，IP却已经可以用于计数。 但“早能拿到”和“唯一准确”不是一回事。请求从公共代理、分发入口或共享出口过来时，需要确认网站看到的是用户出口的IP，还是中间转送服务器的IP。网站可以通过自己信任的转送服务器取得原始来源信息。不能把客户端随意声明的地址当验证过的网络事实。 平台从一条访问里怎样逐步形成判断 以一个 虚构账号保护场景 为例：某账号常在本地区使用，今天从远方出口登录，同时出现设备变化。系统可以比较来源地区、网络属性、会话和操作，再决定是否要求二次验证。IP不是开关，而是判断输入之一。 如果只有IP估计的地区变化，登录凭据和操作习惯仍与以往一致，解释可能是出差、移动网络安排或VPN；若同时有异常尝试与身份变化，风险解释会不同。具体平台选哪些线索、怎样组合及多久更新，公开厂商字段不能代替它的内部规则。 IP可以用来识别请求的网络来源，帮助网站关联访问、统计请求量。但同一个IP可能由多人共用，也可能是VPN或代理的出口；同一个人换网络后，IP也可能变化。因此，来源IP相同只能说明访问使用了同一个网络地址，不能直接证明是同一个人。 验证码、登录验证、频率限制和账号封禁不同 验证码可能在确认访问方式或缓解滥用；二次登录验证可能在确认使用者是否有权登录这个账号；频率限制在控制短时操作量；账号限制又涉及业务政策。屏幕文字、状态和官方通知才帮助区分当前是哪种处理。 不能因为看见验证码就认定账号已违规；也不能因为换网后可用就确定原IP是唯一原因。换网同时改变路径、查询、地区来源等多个条件，证据只能支持相应程度的判断。 遇到“住宅、机房、独享、纯净”营销词怎样理解 这些标签有的描述网络归属，有的描述地址分配，有的没有统一定义。一个家庭出口也会有共享活动，一个固定独享出口也可能属于已知代理来源。标签不是平台信誉证明，更不保证任何账号永不验证。 正常使用中，保留验证或限制的具体提示、发生时段、账号是否多网络持续异常，按官方流程恢复，会比反复换来源更能帮助支持人员判断。这些线索有助于判断访问是否异常，但不能仅凭来源IP确定一个人的意图。 平台为什么容易观察到IP 访问必须经过网络送到接收端，接收端需要知道把回复送回哪条连接。因此，接收入口通常能观察访问的来源地址。若服务前面有转发或分发设施，后面的业务程序可能直接看到中间节点地址，需要从可信入口正确取得来源信息。MaxMind对访问来源的说明 若访问经VPN公共出口，观察到的来源可能是出口IP。这说明的是网络路径，不会自动清掉你的账号或浏览器会话。 一个地址，可以附带哪些线索 线索 平台可能借它提出的问题 推断的边界 --- --- --- 大致地区 与账号此前常用地区是否明显不同？ 地区估计有误差，不能定位住址 网络归属 来自普通接入网络，还是云服务网络？ 公司、自建服务和合法代理也会用云网络 已知代理属性 是否属于观察到的VPN或代理出口？ 数据不完整；使用VPN有正常用途 请求行为 同一来源是否短时间带来大量操作？ 共用出口可能汇集许多人的正常访问 IP地区通常来自数据库估计，不是地址里写着城市。地区数据的准确性与边界 已知代理属性也依赖观察和数据库，不是看一眼地址就全知。代理来源识别 “住宅IP”通常是在描述普通家庭接入网络的来源，“机房IP”通常是在描述云或托管网络来源。“静态IP”说的是地址是否保持，“独享IP”说的是是否共用；这些词回答不同的问题。任何一种标签都不保证平台信任，营销中的“纯净”也没有跨平台统一的安全标准。 完整示范：同事一起遇到验证码 以下是 虚构教学示例 。办公室几个人在同一时间访问服务，都出现验证码。他们起初以为“平台认定每个人都违规了”。 先看证据：办公室可能共用一个公网出口。如果规则把同一IP的请求累计到一起，几个人的正常操作也会集中计数。Cloudflare对共享出口计数的说明 更合适的做法是记录时间、提示，以及几个人共用同一办公室网络这一事实，完成平台要求的验证；若持续影响工作，向平台提交这些线索。假设后来确认是共享来源触发了额外验证，修正后的结论就是“这个来源需要进一步确认”，不能外推为“所有账号违规”。这是示范结果，不是对现实平台的诊断。 换一个条件 ：只有一个账号在家庭网络、办公室和手机热点都遇到限制，其他同事正常。共同出口的解释就弱了，需要检查账号通知、会话或该账号行为。更换网络只能改变某些线索，不能证明限制会消失。 理解规则后，怎样应对异常 平台可以把来源、账号、设备和访问行为一起分析，具体权重与阈值因平台而异。正常换网络、出差或使用VPN也可能带来新线索。收到提示时先分清是连接失败、补充验证还是账号限制，再按官方验证或申诉流程处理。 面对某个平台的限制，应结合具体提示和访问情况判断。公开资料只能帮助理解常见机制，不能揭示该平台的全部内部规则。 相关概念 - 网络来源与账号身份 - 共用出口怎样发生 - VPN改变哪些线索","outline":[{"id":"section-1","title":"为什么还没登录，网站就能用IP判断风险","depth":2},{"id":"section-2","title":"平台从一条访问里怎样逐步形成判断","depth":2},{"id":"section-3","title":"验证码、登录验证、频率限制和账号封禁不同","depth":2},{"id":"section-4","title":"遇到“住宅、机房、独享、纯净”营销词怎样理解","depth":2},{"id":"section-5","title":"平台为什么容易观察到IP","depth":2},{"id":"section-6","title":"一个地址，可以附带哪些线索","depth":2},{"id":"section-7","title":"完整示范：同事一起遇到验证码","depth":2},{"id":"section-8","title":"理解规则后，怎样应对异常","depth":2}]},{"id":"vpn","group":"vpn","title":"VPN究竟改变了哪一段通信？","question":"VPN究竟改变了哪一段通信？","summary":"VPN建立受保护的连接，让选定流量经另一端访问资源。","terms":["VPN","隧道","出口节点"],"aliases":["VPN","virtual private network 虚拟专用网络","隧道","","出口节点",""],"related":["routes","security","split","setup","remote"],"html":"\u003cp>\u003cstrong>VPN先通过你现有的网络连接VPN服务器。随后，指定的访问可以先传到这台服务器，再由它联系公司内部系统或外部网站。\u003c/strong> VPN服务器在哪里、哪些请求经过它，决定了你能访问什么，以及网站看到的来源IP是否改变。\u003c/p>\n\u003cp>VPN把要传送的数据包在一层受保护的通信中，先送到VPN另一端。这常被叫作“隧道”。它仍使用原来的Wi-Fi、网线或移动网络传送，原网络断了，隧道也无法继续通信。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgNDIwIDUyMCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjAiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPlZQTuaUueWPmOmAieWumua1gemHj+eahOi3r+W+hDwvdGV4dD48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSg5MCwxMDUpIj48cmVjdCB4PSItMzQiIHk9Ii0yNyIgd2lkdGg9IjY4IiBoZWlnaHQ9IjQ1IiByeD0iNCIgZmlsbD0iI2ZmZmVmYSIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNLTQxIDI1SDQxTDM0IDE4SC0zNFoiIGZpbGw9IiNjNmRhY2IiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9nPjx0ZXh0IHg9IjkwIiB5PSIxNjEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPuS9oOeahOiuvuWkhzwvdGV4dD48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgzMTQsMTA1KSI+PHJlY3QgeD0iLTM1IiB5PSItMzAiIHdpZHRoPSI3MCIgaGVpZ2h0PSIxOCIgcng9IjMiIGZpbGw9IiNkY2U3ZGMiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIyIi8+PGNpcmNsZSBjeD0iLTIyIiBjeT0iLTIxIiByPSIzIiBmaWxsPSIjMjc2NjU1Ii8+PHJlY3QgeD0iLTM1IiB5PSItNyIgd2lkdGg9IjcwIiBoZWlnaHQ9IjE4IiByeD0iMyIgZmlsbD0iI2RjZTdkYyIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjIiLz48Y2lyY2xlIGN4PSItMjIiIGN5PSIyIiByPSIzIiBmaWxsPSIjMjc2NjU1Ii8+PHJlY3QgeD0iLTM1IiB5PSIxNiIgd2lkdGg9IjcwIiBoZWlnaHQ9IjE4IiByeD0iMyIgZmlsbD0iI2RjZTdkYyIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjIiLz48Y2l n\u003cp>账号会话却不因这一变化自动删除，平台仍可关联之前账号。VPN可以带来正常工作和隐私用途，也可能被某些服务要求验证；不能承诺开启后统一变快或不被识别。\u003c/p>\n\u003ch2 id=\"section-4\">连上VPN以后，目标系统仍要检查权限\u003c/h2>\n\u003cp>私有连接让成员设备能够联系彼此，但目标设备上的文件或网页程序仍要运行、接收请求，并允许你的账号使用。公共出口替你转送上网访问，购物站也仍可拒绝某项操作。VPN帮助请求到达目标，文件或网页程序仍会核对账号和权限。\u003c/p>\n\u003cp>使用VPN时，先说清要访问公司系统，还是更换上网出口；再看哪些请求经过它，最后在目标应用里检查结果。具体设置见\u003ca href=\"#/setup\">配置\u003c/a>，范围见\u003ca href=\"#/split\">分流\u003c/a>，自有设备场景见\u003ca href=\"#/remote\">远程访问\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">用途一：联系内部设备\u003c/h2>\n\u003cp>公司内网系统或自己的设备，未必向整个互联网开放。VPN可以让管理员允许的设备联系内部系统或其他成员设备。普通浏览网页的流量可以继续走原来出口。\u003c/p>\n\u003cp>因此，VPN连接成功、内部系统可用、IP查询页地址没变，可以同时成立。Tailscale的普通覆盖网络就主要连接成员设备，公共上网不默认通过另一台设备。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">内部连接与出口的区别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">用途二：经另一处出口上网\u003c/h2>\n\u003cp>若选定流量经VPN另一端访问公共互联网，VPN另一端就充当上网出口。目标服务看到的来源通常是出口的公网地址，回复先返回出口，再经连接送回你。\u003c/p>\n\u003cp>这里改变的是访问路径与观察到的来源。只给部分应用或目标这样安排，就只影响对应访问。直接走原路径的流量仍可能显示原来源。\u003c/p>\n\u003ch2 id=\"section-7\">原来的网络承担什么\u003c/h2>\n\u003cp>你的设备仍需要先联系VPN服务器或另一端。附近Wi-Fi或移动网络中断后，隧道也无法凭空继续工作。到VPN另一端的距离、网络互联情况，以及当时传送的数据量，还会影响体验。\u003c/p>\n\u003cp>绕经另一处可能让某条路径更适合，也可能更慢。不能仅凭VPN开启推断网络一定更快。\u003c/p>\n\u003ch2 id=\"section-8\">它保护谁看不到哪段内容\u003c/h2>\n\u003cp>隧道保护覆盖其两端之间；HTTPS可以同时保护浏览器与网页服务之间的内容。VPN出口仍负责向目标转送，网站仍可能看见账号与会话。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security\" target=\"_blank\" rel=\"noopener noreferrer\">传输保护的边界\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>VPN不会自动删除登录记录，也不保证所有目的信息对提供者不可见。评估时把三个问题分开：路径在哪里变化，哪些流量经过，哪些内容在哪段受到保护。\u003c/p>\n","text":"VPN究竟改变了哪一段通信？ VPN先通过你现有的网络连接VPN服务器。随后，指定的访问可以先传到这台服务器，再由它联系公司内部系统或外部网站。 VPN服务器在哪里、哪些请求经过它，决定了你能访问什么，以及网站看到的来源IP是否改变。 VPN把要传送的数据包在一层受保护的通信中，先送到VPN另一端。这常被叫作“隧道”。它仍使用原来的Wi-Fi、网线或移动网络传送，原网络断了，隧道也无法继续通信。 VPN隧道依托原网络，另一端可通向获准内部资源，也可作为公共上网出口；用途取决于路径。 同一个“连接成功”，可以满足两种完全不同的生活目标 虚构公司场景 ：你在家能逛购物站，却进不了内部报销页。公司VPN先确认你获准加入，建立到公司VPN服务器的连接，电脑再通过这条连接发送访问报销系统的请求。报销服务继续检查你的账号和权限，页面才出现。 普通购物访问如果不在该连接范围，仍经家庭出口。于是报销页恢复、公网IP查询不变，都可以与VPN有效同时成立；验证这项用途，应看报销页面能否打开，以及你的账号能否使用它。 虚构公共出口场景 ：你想让选定浏览器访问经某处出口。浏览器的目标通信进入隧道，在另一端再向购物站发出，站点通常观察到出口来源。这里验证的是这项访问从哪里出来，不是公司内部系统权限。 隧道内外，同时有不同目标 设备先把受保护的VPN通信送到VPN服务器。服务器解开这一层，再把里面的请求送向报销系统或购物网站。沿途设备先看到的目标是VPN服务器，最终访问目标则在里面。它没有让原来的Wi-Fi和运营商从路径里消失，只改变了哪些信息受保护以及后续经过哪里。 VPN提供者需要运行VPN服务器。你的设备必须能通过现有网络联系它，并按要求登录或通过其他验证。VPN连接本身失败时，目标网页和风控不必已经参与；连接成功后网页失败，又是另一阶段。 为什么切节点可能改变速度和提示 切换另一端，会改变先抵达哪处网络、后半段怎样互联、外部可能观察到的来源。某条目标路径可能改善，也可能绕得更远；出口共用活动和地区线索也可能变化。 账号会话却不因这一变化自动删除，平台仍可关联之前账号。VPN可以带来正常工作和隐私用途，也可能被某些服务要求验证；不能承诺开启后统一变快或不被识别。 连上VPN以后，目标系统仍要检查权限 私有连接让成员设备能够联系彼此，但目标设备上的文件或网页程序仍要运行、接收请求，并允许你的账号使用。公共出口替你转送上网访问，购物站也仍可拒绝某项操作。VPN帮助请求到达目标，文件或网页程序仍会核对账号和权限。 使用VPN时，先说清要访问公司系统，还是更换上网出口；再看哪些请求经过它，最后在目标应用里检查结果。具体设置见配置，范围见分流，自有设备场景见远程访问。 用途一：联系内部设备 公司内网系统或自己的设备，未必向整个互联网开放。VPN可以让管理员允许的设备联系内部系统或其他成员设备。普通浏览网页的流量可以继续走原来出口。 因此，VPN连接成功、内部系统可用、IP查询页地址没变，可以同时成立。Tailscale的普通覆盖网络就主要连接成员设备，公共上网不默认通过另一台设备。内部连接与出口的区别 用途二：经另一处出口上网 若选定流量经VPN另一端访问公共互联网，VPN另一端就充当上网出口。目标服务看到的来源通常是出口的公网地址，回复先返回出口，再经连接送回你。 这里改变的是访问路径与观察到的来源。只给部分应用或目标这样安排，就只影响对应访问。直接走原路径的流量仍可能显示原来源。 原来的网络承担什么 你的设备仍需要先联系VPN服务器或另一端。附近Wi-Fi或移动网络中断后，隧道也无法凭空继续工作。到VPN另一端的距离、网络互联情况，以及当时传送的数据量，还会影响体验。 绕经另一处可能让某条路径更适合，也可能更慢。不能仅凭VPN开启推断网络一定更快。 它保护谁看不到哪段内容 隧道保护覆盖其两端之间；HTTPS可以同时保护浏览器与网页服务之间的内容。VPN出口仍负责向目标转送，网站仍可能看见账号与会话。传输保护的边界 VPN不会自动删除登录记录，也不保证所有目的信息对提供者不可见。评估时把三个问题分开：路径在哪里变化，哪些流量经过，哪些内容在哪段受到保护。 相关概念 - 分流与全局 - 配置与验证 - 远程访问自有设备","outline":[{"id":"section-1","title":"同一个“连接成功”，可以满足两种完全不同的生活目标","depth":2},{"id":"section-2","title":"隧道内外，同时有不同目标","depth":2},{"id":"section-3","title":"为什么切节点可能改变速度和提示","depth":2},{"id":"section-4","title":"连上VPN以后，目标系统仍要检查权限","depth":2},{"id":"section-5","title":"用途一：联系内部设备","depth":2},{"id":"section-6","title":"用途二：经另一处出口上网","depth":2},{"id":"section-7","title":"原来的网络承担什么","depth":2},{"id":"section-8","title":"它保护谁看不到哪段内容","de
