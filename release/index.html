img都是example.com的子域名。它们可以共用服务器，也可以使用不同服务器。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>shop、help和img都是example.com的子域名。它们可以共用服务器，也可以使用不同服务器。\u003c/figcaption>\u003c/figure>\n\u003cp>“二级域名”有时按名称层级严格使用，有时在日常沟通中被拿来指子域名。听别人这样说时，最好拿到实际名称，而不是只凭叫法判断结构。对 \u003ccode>example.co.uk\u003c/code> 之类名称，可注册部分的边界不等于永远取最后两段；\u003ca href=\"https://publicsuffix.org/learn/\" target=\"_blank\" rel=\"noopener noreferrer\">公用后缀有自己的规则\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-2\">子域名和斜线后目录，是两种划分\u003c/h2>\n\u003cp>\u003ccode>shop.example.com\u003c/code> 改变了主机名；\u003ccode>example.com/shop\u003c/code> 保持主机名、改变路径。shop.example.com可以在DNS中单独设置地址；example.com/shop则仍先联系example.com，网站程序收到请求后再处理/shop这个路径。\u003c/p>\n\u003cp>网站可以把两种做法设计成相似界面，也可以让其中一个跳转到另一个。你看见相同品牌和导航，不能据此推断底层一定相同；看到不同子域名，也不能推断一定是不同公司。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>例子\u003c/th>\n\u003cth>改的是哪一部分\u003c/th>\n\u003cth>常见用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"http://www.example.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.example.com\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/td>\n\u003ctd>主机名\u003c/td>\n\u003ctd>主站入口；www可有可无，并非强制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>shop.example.com\u003c/td>\n\u003ctd>主机名\u003c/td>\n\u003ctd>购物入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>api.example.com\u003c/td>\n\u003ctd>主机名\u003c/td>\n\u003ctd>应用取数据或执行操作的入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>example.com/help\u003c/td>\n\u003ctd>路径\u003c/td>\n\u003ctd>同一名称下的帮助资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>example.com/help?page=2\u003c/td>\n\u003ctd>查询条件\u003c/td>\n\u003ctd>帮助资源的筛选或分页\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>api是常见的人为命名，不代表一种特殊的网络地址。它背后提供的是供程序调用的服务；普通页面也可以通过相同主机名的路径提供这些服务。\u003c/p>\n\u003ch2 id=\"section-3\">一张商品页里，为什么会碰到三个名称\u003c/h2>\n\u003cp>继续这家\u003cstrong>虚构网站\u003c/strong>。浏览器先请求shop.example.com的商品页面，页面说明图片位于img.example.com，于是浏览器再查找图片名称、联系它并下载。你点击查看库存时，页面程序又可以请求api.example.com，取得库存数据后更新页面。\u003c/p>\n\u003cp>对你来说仍在看一个商品页，对浏览器来说却可能是三组目标。它们可以采用不同地址、不同接收程序，也可以共用前面的入口，再由入口分给后面的服务。品牌与界面把它们组合在一起，域名本身不保证内部部署相同。\u003c/p>\n\u003cp>这也解释了主站正常、图片失败为什么能同时发生：主站那次访问可用，图片那次仍可能在查询、连接或文件提供环节失败。单凭地址栏只显示shop，不能认为浏览器只联系过shop。\u003c/p>\n\u003ch2 id=\"section-4\">为什么两个域名能是同一个IP\u003c/h2>\n\u003cp>同一台服务器可以提供多个网站。浏览器虽然联系相同IP和端口，网页访问还带着想访问的主机名，服务据此分派到shop或help。保护连接的证书也需要适合所访问的名称。\u003c/p>\n\u003cp>因此直接把域名换成查到的IP，有时打不开，或者出现证书错误，或者打开了另一个站点。这不证明地址查询错了，而可能是没有提供服务器选择网站或浏览器核对证书所需要的主机名。IP把请求送到服务器；主机名继续告诉服务器，浏览器要访问它提供的哪一个网站。\u003c/p>\n\u003cp>反方向也成立：同一个主机名可以返回多个地址，用于不同地点或负载安排。你和朋友查到的地址不同，不必就是伪造；要结合实际服务和查询环境判断。\u003ca href=\"#/dns\">DNS过程\u003c/a>负责解释地址怎样查出。\u003c/p>\n\u003ch2 id=\"section-5\">同一品牌，为什么某个子域名还要登录\u003c/h2>\n\u003cp>几个子域名是否共用账号，需要网站专门安排。浏览器还限制不同网站页面之间的数据读取：访问方式、主机名、端口三项相同才通常算同源。\u003ccode>https://shop.example.com\u003c/code> 和 \u003ccode>https://help.example.com\u003c/code> 的主机名不同，就不是同源。\u003c/p>\n\u003cp>比如购物页上的程序想读取api.example.com的库存响应，浏览器要按跨来源规则判断是否允许页面读取。数据服务可以按规则明确允许相应页面使用它；不是把两个名称写在同一品牌下面就自动授权。\u003c/p>\n\u003cp>同源用于控制页面程序读取其他来源的数据；它不意味着跨来源请求绝对不能发出。登录标记又有自身的Cookie范围规则，有的仅发给某个主机，有的可以覆盖合适的父域名范围。登录标记是否发给另一个子域名，要看Cookie的发送规则；页面能否读取另一个来源的数据，要看同源等规则；账号是否通用，则要看网站是否共用登录系统。这三件事各有条件。\u003c/p>\n\u003cp>所以帮助站有时自动认得账号，有时需要再次登录；这是共享登录安排与浏览器规则的结果，不能只从“都在example.com下面”推出必然结论。细节见\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy\" target=\"_blank\" rel=\"noopener noreferrer\">浏览器同源规则\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"#/identity\">会话身份\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-6\">怎样读一个看起来很像官方的域名\u003c/h2>\n\u003cp>\u003ccode>shop.example.com\u003c/code>和\u003ccode>example.com.other-site.net\u003c/code>不同。后一串的example.com在左侧名字里，整串却在other-site.net下面；不能因为开头出现熟悉名称就认成前一家网站。路径和参数也可以含某品牌的文字，仍不改变真正主机。\u003c/p>\n\u003cp>页面可以做得很像官方页面，但网站名称仍可能属于别的域名。确认真实服务时应核对完整主机名和已知官方入口，再考虑页面用途；HTTPS的保护不能替代这个核对。名称层级可核对\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name\" target=\"_blank\" rel=\"noopener noreferrer\">MDN域名说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>，来源定义见\u003ca href=\"https://developer.mozilla.org/en-US/docs/Glossary/Origin\" target=\"_blank\" rel=\"noopener noreferrer\">浏览器的origin\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"www、shop、api：同一个网站为何有多个域名？ 你打开一家网站，地址栏是 www.example.com ，购物时变成 shop.example.com ，图片又来自 img.example.com 。 它们都是example.com下面的子域名，但可以指向不同服务器、运行不同程序，也可能要求分别登录。 你眼中的同一家网站，可能用几个不同的主机名提供页面、图片和数据。 本篇用example.com这组保留示例域名说明，功能分配均为虚构教学设计。真实网站需要以实际链接和官方说明判断。 域名的层级要从右向左看 com 位于顶级， example.com 是在它下面的名称， shop.example.com 又在example.com下面， m.shop.example.com 还多了一层。每一个点隔开的标签增加命名层次；左侧名称在右侧名称之下。 在这组例子里，example.com通常是可注册的域名；网站管理者可以安排shop、help等子域名。子域名不是另一个页面目录，名字里的shop也不会自动生成购物功能，只是人选的名称。 shop、help和img都是example.com的子域名。它们可以共用服务器，也可以使用不同服务器。 “二级域名”有时按名称层级严格使用，有时在日常沟通中被拿来指子域名。听别人这样说时，最好拿到实际名称，而不是只凭叫法判断结构。对 example.co.uk 之类名称，可注册部分的边界不等于永远取最后两段；公用后缀有自己的规则。 子域名和斜线后目录，是两种划分 shop.example.com 改变了主机名； example.com/shop 保持主机名、改变路径。shop.example.com可以在DNS中单独设置地址；example.com/shop则仍先联系example.com，网站程序收到请求后再处理/shop这个路径。 网站可以把两种做法设计成相似界面，也可以让其中一个跳转到另一个。你看见相同品牌和导航，不能据此推断底层一定相同；看到不同子域名，也不能推断一定是不同公司。 例子 改的是哪一部分 常见用途 --- --- --- www.example.com 主机名 主站入口；www可有可无，并非强制 shop.example.com 主机名 购物入口 api.example.com 主机名 应用取数据或执行操作的入口 example.com/help 路径 同一名称下的帮助资源 example.com/help?page=2 查询条件 帮助资源的筛选或分页 api是常见的人为命名，不代表一种特殊的网络地址。它背后提供的是供程序调用的服务；普通页面也可以通过相同主机名的路径提供这些服务。 一张商品页里，为什么会碰到三个名称 继续这家 虚构网站 。浏览器先请求shop.example.com的商品页面，页面说明图片位于img.example.com，于是浏览器再查找图片名称、联系它并下载。你点击查看库存时，页面程序又可以请求api.example.com，取得库存数据后更新页面。 对你来说仍在看一个商品页，对浏览器来说却可能是三组目标。它们可以采用不同地址、不同接收程序，也可以共用前面的入口，再由入口分给后面的服务。品牌与界面把它们组合在一起，域名本身不保证内部部署相同。 这也解释了主站正常、图片失败为什么能同时发生：主站那次访问可用，图片那次仍可能在查询、连接或文件提供环节失败。单凭地址栏只显示shop，不能认为浏览器只联系过shop。 为什么两个域名能是同一个IP 同一台服务器可以提供多个网站。浏览器虽然联系相同IP和端口，网页访问还带着想访问的主机名，服务据此分派到shop或help。保护连接的证书也需要适合所访问的名称。 因此直接把域名换成查到的IP，有时打不开，或者出现证书错误，或者打开了另一个站点。这不证明地址查询错了，而可能是没有提供服务器选择网站或浏览器核对证书所需要的主机名。IP把请求送到服务器；主机名继续告诉服务器，浏览器要访问它提供的哪一个网站。 反方向也成立：同一个主机名可以返回多个地址，用于不同地点或负载安排。你和朋友查到的地址不同，不必就是伪造；要结合实际服务和查询环境判断。DNS过程负责解释地址怎样查出。 同一品牌，为什么某个子域名还要登录 几个子域名是否共用账号，需要网站专门安排。浏览器还限制不同网站页面之间的数据读取：访问方式、主机名、端口三项相同才通常算同源。 https://shop.example.com 和 https://help.example.com 的主机名不同，就不是同源。 比如购物页上的程序想读取api.example.com的库存响应，浏览器要按跨来源规则判断是否允许页面读取。数据服务可以按规则明确允许相应页面使用它；不是把两个名称写在同一品牌下面就自动授权。 同源用于控制页面程序读取其他来源的数据；它不意味着跨来源请求绝对不能发出。登录标记又有自身的Cookie范围规则，有的仅发给某个主机，有的可以覆盖合适的父域名范围。登录标记是否发给另一个子域名，要看Cookie的发送规则；页面能否读取另一个来源的数据，要看同源等规则；账号是否通用，则要看网站是否共用登录系统。这三件事各有条件。 所以帮助站有时自动认得账号，有时需要再次登录；这是共享登录安排与浏览器规则的结果，不能只从“都在example.com下面”推出必然结论。细节见浏览器同源规则与会话身份。 怎样读一个看起来很像官方的域名 shop.example.com 和 example.com.other-site.net 不同。后一串的example.com在左侧名字里，整串却在other-site.net下面；不能因为开头出现熟悉名称就认成前一家网站。路径和参数也可以含某品牌的文字，仍不改变真正主机。 页面可以做得很像官方页面，但网站名称仍可能属于别的域名。确认真实服务时应核对完整主机名和已知官方入口，再考虑页面用途；HTTPS的保护不能替代这个核对。名称层级可核对MDN域名说明，来源定义见浏览器的origin。","outline":[{"id":"section-1","title":"域名的层级要从右向左看","depth":2},{"id":"section-2","title":"子域名和斜线后目录，是两种划分","depth":2},{"id":"section-3","title":"一张商品页里，为什么会碰到三个名称","depth":2},{"id":"section-4","title":"为什么两个域名能是同一个IP","depth":2},{"id":"section-5","title":"同一品牌，为什么某个子域名还要登录","depth":2},{"id":"section-6","title":"怎样读一个看起来很像官方的域名","depth":2}]},{"id":"dns","group":"address","title":"输入网址后，电脑怎么找到网站？","question":"输入网址后，电脑怎么找到网站？","summary":"名称查询先找出可联系的地址，浏览器再与服务通信。","terms":["域名","DNS"],"aliases":["域名","","DNS","Domain Name System 域名解析"],"related":["domains","ip","browsing","troubleshoot"],"html":"\u003cp>你记得购物网站的名字，却不记得它的服务器地址。浏览器也不能只拿着“shop.example.com”就让每台路由器沿途猜。\u003cstrong>它通常先通过DNS查询这个名称的地址记录，再联系取得的地址。\u003c/strong> DNS解决“这个名字对应哪些记录”，网站程序才负责“返回什么商品内容”。\u003c/p>\n\u003ch2 id=\"section-1\">点开商品链接，先问了谁\u003c/h2>\n\u003cp>以下用\u003cstrong>虚构商品站\u003c/strong>的 \u003ccode>https://shop.example.com/products/42\u003c/code> 说明。假设这次没有可用的旧查询记录，浏览器需要重新找地址。实际浏览器可能使用系统提供的查询服务，也可能采用自己配置的查询方式。\u003c/p>\n\u003cp>浏览器把需要查询的主机名shop.example.com交给查询服务。这个帮你找答案的服务，常称递归解析器：你提出一个名称，它负责取得适用的记录再回复。查询通常不需要把/products/42一并交给DNS，因为商品编号不参与查网站地址。\u003c/p>\n\u003cp>查询服务若自己也没有可用缓存，就需要寻找管理这个名称的记录。它会沿名称层级取得线索：从根服务找到负责com的服务，再找到example.com所使用的权威名称服务，向有权维护该名称记录的一方取得答案。这里的“权威”表示对这份名称记录负责，并不是替网站内容可信度背书。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc1034.html\" target=\"_blank\" rel=\"noopener noreferrer\">DNS的层级、查询与缓存\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>查询服务把地址记录返回给设备。浏览器接着尝试联系其中适用的地址和网页端口，发出商品请求。到这一步，DNS的查找已经产生结果，但商品页面还没有取得。\u003c/p>\n\u003ch2 id=\"section-2\">谁决定网站名称现在指向哪里\u003c/h2>\n\u003cp>网站管理者在相应的名称服务中维护记录。迁移服务器时，可以更新网站名称对应的地址；域名没有因此改名，你保存的链接也不必每次换成一串新IP。\u003c/p>\n\u003cp>不同记录有不同用途。常见A记录提供IPv4地址，AAAA记录提供IPv6地址；别名记录则让名称指向另一个名称，再继续查询。你可以先不记这些简称，只需知道答案不一定只有一个数字，也可能需要跟随另一名称。\u003c/p>\n\u003cp>同一个主机名还可以提供多个地址，让访问到不同接收入口；不同主机名也可以共用一个入口。DNS没有规定“一家公司、一个名字、一台服务器”必须一一对应。服务器如何继续区分网站，见\u003ca href=\"#/domains\">子域名与多站点\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-3\">网站搬家后，为什么你与朋友看见的不一样\u003c/h2>\n\u003cp>查询服务取得答案后，通常会按记录允许的时间暂存，设备本地也可能保留适用结果。这叫缓存。下一次有人问相同名称时，可以在规则允许的时间内直接使用已有答案，减少重复询问。\u003c/p>\n\u003cp>现在做一个\u003cstrong>教学对照\u003c/strong>：商品站把名称记录从旧入口改到新入口。你使用的查询服务还保留着未过期的旧答案，朋友那边已经取得新答案，于是两人暂时联系不同入口。管理者修改记录，并不能瞬间让世界上所有缓存一起丢掉旧结果。\u003c/p>\n\u003cp>但旧页面还有别的来源：浏览器可能保存旧图片，分发节点可能仍提供旧副本，网站后台也可能尚未更新。只有确认两次地址查询不同，才能把“联系入口不同”当成线索；看到旧文字，不足以直接认定DNS没更新。\u003c/p>\n\u003ch2 id=\"section-4\">公司里能打开，回家为什么显示找不到名称\u003c/h2>\n\u003cp>公司可以在内部名称服务里保存报销系统的记录，并只向获准网络提供。你在办公室使用公司查询安排，能查到系统地址；回家改用公共查询服务，对方可能根本没有这份内部记录。\u003c/p>\n\u003cp>连接公司VPN以后，客户端可能把内部名称的查询交给公司服务，并安排通往内部地址的路径。于是同一个名字又能查到、也有机会联系。这两步都需要配置：只查到内部地址，没有通往它的路径，网页仍打不开；能够联系服务器，没有报销账号权限，也不能查看资料。\u003c/p>\n\u003cp>所以公司提供的DNS设置不是随意附带的一串数字。把它替换成公共DNS，可能使内部系统名称失效。具体配置按提供者说明处理，见\u003ca href=\"#/setup\">VPN配置\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">改DNS，到底改变了哪件事\u003c/h2>\n\u003cp>更换查询服务，改变的是设备向谁询问名称。它可能影响查询是否成功、等待时间和得到的记录；普通DNS设置本身不会把网页正文都经由查询服务转送，也不会自动更换公共上网出口。\u003c/p>\n\u003cp>可以用两种结果对照理解：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对照结果\u003c/th>\n\u003cth>可以得到的线索\u003c/th>\n\u003cth>仍不能确定的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原服务查不到，新服务查到适用地址\u003c/td>\n\u003ctd>查询安排值得核对\u003c/td>\n\u003ctd>后续连接和网站业务一定成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>两者返回相同地址，网页仍超时\u003c/td>\n\u003ctd>还要看连接、路径和接收服务\u003c/td>\n\u003ctd>DNS必然是唯一故障\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查得到地址，出现证书警告\u003c/td>\n\u003ctd>名称查询与连接校验是不同步骤\u003c/td>\n\u003ctd>可以忽略警告继续提交资料\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>直接拿查到的IP替换域名，也不是通用检查方法。服务可能根据主机名选择网站，HTTPS也需要核对名称；替换以后缺少这些条件，即使查询正确也可能打不开。\u003ca href=\"#/domains\">主机名为什么还要保留\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">DNS和搜索引擎，为什么都能“帮你找网站”\u003c/h2>\n\u003cp>你在地址栏输入完整网址，浏览器可以直接处理这个名称；输入“附近咖啡店”这类词，浏览器通常先请求搜索服务。搜索服务找到相关网页，给你一组链接；你再点击某一条，才开始访问相应网站。\u003c/p>\n\u003cp>DNS查询的是已知名称的记录，搜索引擎是在内容索引中寻找可能符合关键词的页面。前者不会根据你的购物喜好挑网站，后者给出链接以后，也没有替你完成后续连接和访问。地址找到以后，请求怎样经过各个网络，见\u003ca href=\"#/routes\">路由\u003c/a>。\u003c/p>\n","text":"输入网址后，电脑怎么找到网站？ 你记得购物网站的名字，却不记得它的服务器地址。浏览器也不能只拿着“shop.example.com”就让每台路由器沿途猜。 它通常先通过DNS查询这个名称的地址记录，再联系取得的地址。 DNS解决“这个名字对应哪些记录”，网站程序才负责“返回什么商品内容”。 点开商品链接，先问了谁 以下用 虚构商品站 的 https://shop.example.com/products/42 说明。假设这次没有可用的旧查询记录，浏览器需要重新找地址。实际浏览器可能使用系统提供的查询服务，也可能采用自己配置的查询方式。 浏览器把需要查询的主机名shop.example.com交给查询服务。这个帮你找答案的服务，常称递归解析器：你提出一个名称，它负责取得适用的记录再回复。查询通常不需要把/products/42一并交给DNS，因为商品编号不参与查网站地址。 查询服务若自己也没有可用缓存，就需要寻找管理这个名称的记录。它会沿名称层级取得线索：从根服务找到负责com的服务，再找到example.com所使用的权威名称服务，向有权维护该名称记录的一方取得答案。这里的“权威”表示对这份名称记录负责，并不是替网站内容可信度背书。DNS的层级、查询与缓存 查询服务把地址记录返回给设备。浏览器接着尝试联系其中适用的地址和网页端口，发出商品请求。到这一步，DNS的查找已经产生结果，但商品页面还没有取得。 谁决定网站名称现在指向哪里 网站管理者在相应的名称服务中维护记录。迁移服务器时，可以更新网站名称对应的地址；域名没有因此改名，你保存的链接也不必每次换成一串新IP。 不同记录有不同用途。常见A记录提供IPv4地址，AAAA记录提供IPv6地址；别名记录则让名称指向另一个名称，再继续查询。你可以先不记这些简称，只需知道答案不一定只有一个数字，也可能需要跟随另一名称。 同一个主机名还可以提供多个地址，让访问到不同接收入口；不同主机名也可以共用一个入口。DNS没有规定“一家公司、一个名字、一台服务器”必须一一对应。服务器如何继续区分网站，见子域名与多站点。 网站搬家后，为什么你与朋友看见的不一样 查询服务取得答案后，通常会按记录允许的时间暂存，设备本地也可能保留适用结果。这叫缓存。下一次有人问相同名称时，可以在规则允许的时间内直接使用已有答案，减少重复询问。 现在做一个 教学对照 ：商品站把名称记录从旧入口改到新入口。你使用的查询服务还保留着未过期的旧答案，朋友那边已经取得新答案，于是两人暂时联系不同入口。管理者修改记录，并不能瞬间让世界上所有缓存一起丢掉旧结果。 但旧页面还有别的来源：浏览器可能保存旧图片，分发节点可能仍提供旧副本，网站后台也可能尚未更新。只有确认两次地址查询不同，才能把“联系入口不同”当成线索；看到旧文字，不足以直接认定DNS没更新。 公司里能打开，回家为什么显示找不到名称 公司可以在内部名称服务里保存报销系统的记录，并只向获准网络提供。你在办公室使用公司查询安排，能查到系统地址；回家改用公共查询服务，对方可能根本没有这份内部记录。 连接公司VPN以后，客户端可能把内部名称的查询交给公司服务，并安排通往内部地址的路径。于是同一个名字又能查到、也有机会联系。这两步都需要配置：只查到内部地址，没有通往它的路径，网页仍打不开；能够联系服务器，没有报销账号权限，也不能查看资料。 所以公司提供的DNS设置不是随意附带的一串数字。把它替换成公共DNS，可能使内部系统名称失效。具体配置按提供者说明处理，见VPN配置。 改DNS，到底改变了哪件事 更换查询服务，改变的是设备向谁询问名称。它可能影响查询是否成功、等待时间和得到的记录；普通DNS设置本身不会把网页正文都经由查询服务转送，也不会自动更换公共上网出口。 可以用两种结果对照理解： 对照结果 可以得到的线索 仍不能确定的事 --- --- --- 原服务查不到，新服务查到适用地址 查询安排值得核对 后续连接和网站业务一定成功 两者返回相同地址，网页仍超时 还要看连接、路径和接收服务 DNS必然是唯一故障 查得到地址，出现证书警告 名称查询与连接校验是不同步骤 可以忽略警告继续提交资料 直接拿查到的IP替换域名，也不是通用检查方法。服务可能根据主机名选择网站，HTTPS也需要核对名称；替换以后缺少这些条件，即使查询正确也可能打不开。主机名为什么还要保留 DNS和搜索引擎，为什么都能“帮你找网站” 你在地址栏输入完整网址，浏览器可以直接处理这个名称；输入“附近咖啡店”这类词，浏览器通常先请求搜索服务。搜索服务找到相关网页，给你一组链接；你再点击某一条，才开始访问相应网站。 DNS查询的是已知名称的记录，搜索引擎是在内容索引中寻找可能符合关键词的页面。前者不会根据你的购物喜好挑网站，后者给出链接以后，也没有替你完成后续连接和访问。地址找到以后，请求怎样经过各个网络，见路由。","outline":[{"id":"section-1","title":"点开商品链接，先问了谁","depth":2},{"id":"section-2","title":"谁决定网站名称现在指向哪里","depth":2},{"id":"section-3","title":"网站搬家后，为什么你与朋友看见的不一样","depth":2},{"id":"section-4","title":"公司里能打开，回家为什么显示找不到名称","depth":2},{"id":"section-5","title":"改DNS，到底改变了哪件事","depth":2},{"id":"section-6","title":"DNS和搜索引擎，为什么都能“帮你找网站”","depth":2}]},{"id":"routes","group":"address","title":"经过那么多网络，谁决定往哪走？","question":"经过那么多网络，谁决定往哪走？","summary":"中间设备根据自己掌握的转发规则决定下一跳。","terms":["路由","路由器","网关"],"aliases":["路由","","路由器","","网关",""],"related":["ip","vpn","speed"],"html":"\u003cp>你打开远方网站，电脑不必先取得沿途所有设备的名单。\u003cstrong>它先决定下一步把数据交给谁；后面的转送设备再根据目的地址决定自己的下一步。\u003c/strong> 一段接一段地转送，称为逐跳转送；选择方向的规则属于路由。\u003c/p>\n\u003ch2 id=\"section-1\">先在家里找打印机，再去外面找网站\u003c/h2>\n\u003cp>在一个\u003cstrong>虚构家庭网络\u003c/strong>中，电脑已经知道打印机的内部地址。设备根据地址安排和自己的路由规则，判断目标在本地可联系范围内，就在附近网络寻找并联系它，不必为了这次本地任务先绕到互联网上。\u003c/p>\n\u003cp>随后你打开购物网站。网站地址不属于这个本地范围，电脑便把数据交给通向其他网络的设备。家里通常由路由器承担这个角色，设置中常把它叫默认网关。它的意思是：没有更合适的专门路线时，发往外面的通信先交给这里。\u003c/p>\n\u003cp>电脑把数据交给网关，并没有把最终目的地改成路由器。包里仍说明最终要去的网站地址；路由器只是这一步的接收者，负责继续往前送。把“下一步交给谁”和“最后交给谁”分开，才能理解接力怎样发生。\u003c/p>\n\u003ch2 id=\"section-2\">家中路由器拿到以后，凭什么知道下一步\u003c/h2>\n\u003cp>路由器有自己的转发表，把一些目的地址范围与下一段连接对应起来。它读取目的IP，找适用的方向，把数据交给上游设备。上游再按自己掌握的规则继续处理。\u003c/p>\n\u003cp>转发表不需要为全球每一个商品页都存一条记录。地址有组织结构，许多目的地址可以归入同一个范围，先向同一个方向转送。到了更接近目标的网络，再用更具体的规则继续区分。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">IP中的地址与转送\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>运营商、学校、云服务等分别管理自己的网络。不同网络通过互联及相应约定交换流量，也传播哪些地址范围可以通过哪里到达的信息。于是你只连接一家接入网络，仍有机会联系位于另一家网络中的服务器。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work\" target=\"_blank\" rel=\"noopener noreferrer\">网络怎样相互连接\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>互联网由这些相连的网络组成，并没有一台所有聊天、购物、视频都必须先经过的“互联网总服务器”。网站服务器负责提供某项服务，路由设备负责把通信继续送过去。\u003c/p>\n\u003ch2 id=\"section-3\">网站回话时，为什么不必原路逐个倒回来\u003c/h2>\n\u003cp>网站回复时，数据又有了新的目的地址：这次是你的设备或共享出口。回程上的设备根据各自转发表选择方向，并不需要照着去程留下的旅行记录逆序走一遍。\u003c/p>\n\u003cp>因此，去程经过的网络和回程可能不同。家中共享出口还要根据连接记录，把返回数据交回正确设备；这一工作见\u003ca href=\"#/nat\">共享出口\u003c/a>。你能发出请求，不自动保证回程此刻畅通。\u003c/p>\n\u003cp>若某段线路中断，网络可能更新规则并改用别的连接。但更新有时间过程，也不是任何位置都有备用通路。一次访问中断，不足以证明远方服务器已经关机；“互联网有多条路径”也不能保证每次通信都能恢复。\u003c/p>\n\u003ch2 id=\"section-4\">同一网站，为什么家里快、另一处Wi-Fi慢\u003c/h2>\n\u003cp>沿用商品站做\u003cstrong>教学对照\u003c/strong>：网址没改，电脑也没换，从家中网络移到另一处Wi-Fi后，图片等待明显变长。两次起点不同，上游互联、排队情况、名称查询结果以及可能选到的服务入口都可能不同。\u003c/p>\n\u003cp>所以地理上离网站更近，不代表通信更快。网络可能按互联与管理规则转送，也可能有某一段拥挤；地图上的直线距离不能代替实际路径质量。\u003c/p>\n\u003cp>“换网后改善”可以提示原路径相关条件值得检查，却还不能确定具体哪台设备有问题。也可能网站恰好在这段时间恢复。对照时尽量保持设备、目标和时段相近，见\u003ca href=\"#/troubleshoot\">访问排障\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">公司VPN为什么能只改变报销页的路径\u003c/h2>\n\u003cp>连接公司VPN以后，电脑的规则可以变成：发往公司内部地址的数据交给VPN，普通购物访问仍交给家庭默认网关。\u003cstrong>同一台电脑可以同时为不同目标选择不同路径。\u003c/strong> 并不一定只有一条“整台电脑的路线”。\u003c/p>\n\u003cp>进入VPN的数据，先被装进与VPN服务器通信的受保护连接。外面这层通信仍要通过家中的Wi-Fi、路由器和运营商，才能到达VPN服务器；另一端再把里面的数据交给公司系统。\u003c/p>\n\u003cp>因此，本地接入彻底中断时，VPN也无法凭空把数据送出去。公司访问恢复、购物站来源IP没变，却可以是正常分流结果。路径范围见\u003ca href=\"#/split\">分流\u003c/a>，隧道怎样包住原通信见\u003ca href=\"#/vpn\">VPN\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-6\">路由正确了，为什么登录仍会失败\u003c/h2>\n\u003cp>路由帮助请求到达接收入口。网站拿到请求以后，才会核对密码、账号和商品条件。沿途设备也可能执行过滤规则，但转送成功不能替代网站的业务判断。\u003c/p>\n\u003cp>若屏幕收到网站的“密码错误”，至少已有相应服务给出回复；继续反复换路由通常不能把错误密码改成正确密码。若一直等不到任何回复，则还要检查连接、接收服务和回程等条件。路径回答的是怎么送到，服务回答的是收到以后做什么。\u003c/p>\n","text":"经过那么多网络，谁决定往哪走？ 你打开远方网站，电脑不必先取得沿途所有设备的名单。 它先决定下一步把数据交给谁；后面的转送设备再根据目的地址决定自己的下一步。 一段接一段地转送，称为逐跳转送；选择方向的规则属于路由。 先在家里找打印机，再去外面找网站 在一个 虚构家庭网络 中，电脑已经知道打印机的内部地址。设备根据地址安排和自己的路由规则，判断目标在本地可联系范围内，就在附近网络寻找并联系它，不必为了这次本地任务先绕到互联网上。 随后你打开购物网站。网站地址不属于这个本地范围，电脑便把数据交给通向其他网络的设备。家里通常由路由器承担这个角色，设置中常把它叫默认网关。它的意思是：没有更合适的专门路线时，发往外面的通信先交给这里。 电脑把数据交给网关，并没有把最终目的地改成路由器。包里仍说明最终要去的网站地址；路由器只是这一步的接收者，负责继续往前送。把“下一步交给谁”和“最后交给谁”分开，才能理解接力怎样发生。 家中路由器拿到以后，凭什么知道下一步 路由器有自己的转发表，把一些目的地址范围与下一段连接对应起来。它读取目的IP，找适用的方向，把数据交给上游设备。上游再按自己掌握的规则继续处理。 转发表不需要为全球每一个商品页都存一条记录。地址有组织结构，许多目的地址可以归入同一个范围，先向同一个方向转送。到了更接近目标的网络，再用更具体的规则继续区分。IP中的地址与转送 运营商、学校、云服务等分别管理自己的网络。不同网络通过互联及相应约定交换流量，也传播哪些地址范围可以通过哪里到达的信息。于是你只连接一家接入网络，仍有机会联系位于另一家网络中的服务器。网络怎样相互连接 互联网由这些相连的网络组成，并没有一台所有聊天、购物、视频都必须先经过的“互联网总服务器”。网站服务器负责提供某项服务，路由设备负责把通信继续送过去。 网站回话时，为什么不必原路逐个倒回来 网站回复时，数据又有了新的目的地址：这次是你的设备或共享出口。回程上的设备根据各自转发表选择方向，并不需要照着去程留下的旅行记录逆序走一遍。 因此，去程经过的网络和回程可能不同。家中共享出口还要根据连接记录，把返回数据交回正确设备；这一工作见共享出口。你能发出请求，不自动保证回程此刻畅通。 若某段线路中断，网络可能更新规则并改用别的连接。但更新有时间过程，也不是任何位置都有备用通路。一次访问中断，不足以证明远方服务器已经关机；“互联网有多条路径”也不能保证每次通信都能恢复。 同一网站，为什么家里快、另一处Wi-Fi慢 沿用商品站做 教学对照 ：网址没改，电脑也没换，从家中网络移到另一处Wi-Fi后，图片等待明显变长。两次起点不同，上游互联、排队情况、名称查询结果以及可能选到的服务入口都可能不同。 所以地理上离网站更近，不代表通信更快。网络可能按互联与管理规则转送，也可能有某一段拥挤；地图上的直线距离不能代替实际路径质量。 “换网后改善”可以提示原路径相关条件值得检查，却还不能确定具体哪台设备有问题。也可能网站恰好在这段时间恢复。对照时尽量保持设备、目标和时段相近，见访问排障。 公司VPN为什么能只改变报销页的路径 连接公司VPN以后，电脑的规则可以变成：发往公司内部地址的数据交给VPN，普通购物访问仍交给家庭默认网关。 同一台电脑可以同时为不同目标选择不同路径。 并不一定只有一条“整台电脑的路线”。 进入VPN的数据，先被装进与VPN服务器通信的受保护连接。外面这层通信仍要通过家中的Wi-Fi、路由器和运营商，才能到达VPN服务器；另一端再把里面的数据交给公司系统。 因此，本地接入彻底中断时，VPN也无法凭空把数据送出去。公司访问恢复、购物站来源IP没变，却可以是正常分流结果。路径范围见分流，隧道怎样包住原通信见VPN。 路由正确了，为什么登录仍会失败 路由帮助请求到达接收入口。网站拿到请求以后，才会核对密码、账号和商品条件。沿途设备也可能执行过滤规则，但转送成功不能替代网站的业务判断。 若屏幕收到网站的“密码错误”，至少已有相应服务给出回复；继续反复换路由通常不能把错误密码改成正确密码。若一直等不到任何回复，则还要检查连接、接收服务和回程等条件。路径回答的是怎么送到，服务回答的是收到以后做什么。","outline":[{"id":"section-1","title":"先在家里找打印机，再去外面找网站","depth":2},{"id":"section-2","title":"家中路由器拿到以后，凭什么知道下一步","depth":2},{"id":"section-3","title":"网站回话时，为什么不必原路逐个倒回来","depth":2},{"id":"section-4","title":"同一网站，为什么家里快、另一处Wi-Fi慢","depth":2},{"id":"section-5","title":"公司VPN为什么能只改变报销页的路径","depth":2},{"id":"section-6","title":"路由正确了，为什么登录仍会失败","depth":2}]},{"id":"delivery","group":"services","title":"信息丢了、乱序了，怎么还能完整收到？","question":"信息丢了、乱序了，怎么还能完整收到？","summary":"发送端与接收端补发丢失数据、处理顺序；收到数据还不等于网站完成操作。","terms":["TCP","UDP","重传","超时"],"aliases":["TCP","","UDP","","重传","","超时",""],"related":["packets","routes","messages","live"],"html":"\u003cp>一个文件分成很多份传送，途中可能有缺失、重复或迟到。\u003cstrong>需要完整内容时，两端会记录已经收到的数据、反馈接收情况、补发缺失部分，再按顺序交给应用。\u003c/strong> 网络中的到达顺序，与软件最终读取的顺序，可以不同。\u003c/p>\n\u003cp>IP负责按地址尽力转送，本身不保证完整有序。TCP是在此基础上，为应用提供可靠有序数据流的一套传输规则；“数据流”可以先理解为程序按顺序读到的一串数据。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">IP的范围\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>、\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP的交付职责\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-1\">下载PDF时，中间一段没到会发生什么\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构教学过程\u003c/strong>。为看清顺序，把文件中的连续数据简写成甲、乙、丙三段，不把它们当作真实页码或固定大小的数据包。\u003c/p>\n\u003cp>发送端先后送出甲、乙、丙。接收端拿到甲和丙，发现中间还缺乙，就不能把丙直接接在甲后面，当成完整连续数据交给需要顺序的程序。每段带有判断数据位置所需的线索，接收端可以暂存已到部分，同时反馈接收范围。\u003c/p>\n\u003cp>发送端结合确认反馈和等待情况，判断哪些数据需要再送。乙补到后，接收端把它放回正确位置，按甲、乙、丙的顺序让应用读取。若旧的乙也晚到了一份，系统还要识别这是重复数据，不能把它当成文件新增加的一段。\u003c/p>\n\u003cp>你通常只看到下载进度停顿后继续。中间恢复过程由通信机制完成，不需要用户找到“文件第几页掉在了哪条线上”。实际分段也不与PDF页面一一对应。\u003c/p>\n\u003ch2 id=\"section-2\">双方怎样知道哪些内容已经收到\u003c/h2>\n\u003cp>接收端会告诉发送端已取得哪些范围，发送端据此知道哪些数据可以结束等待。确认可以覆盖一段连续数据，不必每个包都得到一封单独回信。\u003c/p>\n\u003cp>如果确认本身迟到或丢失，发送端可能再次发送已经到过的数据；接收端识别重复，是整个恢复过程的一部分。通信还会调整速度，避免超过接收方能处理的量，或让已经拥堵的路径继续承受过大压力。\u003c/p>\n\u003cp>这就是“可靠”的具体含义：两端按规则处理这些情况，成功时给应用正确、有序的数据。它没有保证断网多久都能无限等下去。持续收不到需要的数据，连接仍可以失败，应用会提示中断、重试或其他结果。\u003c/p>\n\u003ch2 id=\"section-3\">下载完成，为什么PDF仍可能打不开\u003c/h2>\n\u003cp>传输机制保证的对象，是发送端交来的那串数据。若服务器原本保存的文件就损坏，或浏览器不支持相应格式，完整送到也不会自动修好。网站甚至可能返回一个错误说明，应用却把它当文件保存了下来。\u003c/p>\n\u003cp>因此，传送是否完成、文件格式是否正确、应用能否解释，是相接但不同的检查。查看正式下载结果、文件类型和服务提示，比只凭进度到100%判断全部正常更可靠。\u003c/p>\n\u003ch2 id=\"section-4\">UDP是不是“丢了就永远不管”\u003c/h2>\n\u003cp>UDP提供另一种数据报传送方式，其基础规则不自动提供TCP那样的可靠有序数据流。但应用或建立在UDP之上的其他协议可以自己实现恢复、顺序控制和加密保护。现代网页使用的QUIC就是一个相关例子。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9000.html\" target=\"_blank\" rel=\"noopener noreferrer\">QUIC的机制\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>所以看见TCP或UDP，只能先知道基础传送安排，不能据此直接推断整个应用是否安全、是否补发。下载文件希望所有必要内容齐全；实时声音更在意新内容赶得上播放，这会影响采用怎样的恢复策略。见\u003ca href=\"#/live\">视频通话\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">为什么“超时”没有告诉你究竟断在哪\u003c/h2>\n\u003cp>应用有自己的等待期限。在期限内没拿到需要的结果，就可能显示超时。它可能在等地址查询、连接、文件数据、网站处理，也可能在等处理完成后的回复。一个提示通常不能指出哪份包在哪里丢失。\u003c/p>\n\u003cp>把场景换成网盘上传：服务可能尚未收到完整文件，也可能已经保存，最后的成功回复却没回到你的设备。两种情况都可能让你等待后报错，但文件状态不同。\u003c/p>\n\u003cp>这时更有用的是重新进入网盘的正式文件列表，核对文件是否存在、上传是否完成以及能否使用。若列表也无法访问，结果仍未知，应保留时间和提示，按服务恢复流程查询。超时不是“确认从未发生”的另一种叫法。\u003c/p>\n\u003ch2 id=\"section-6\">网络补发与重复创建订单，为什么要分别处理\u003c/h2>\n\u003cp>网络层补发缺失数据时，接收机制会识别顺序和重复，尽量把同一份数据正确交付。若连接失败后，用户再点一次“提交订单”，应用可能发出一份全新的业务请求；网站需要自己的操作编号、去重或状态核对，才能识别是不是同一次动作。\u003c/p>\n\u003cp>所以可靠传输不等于“重复按按钮绝不会重复下单”，也不等于“朋友已经看了消息”。它只支撑相应的数据交付阶段。网站保存了什么、怎样查询业务结果，见\u003ca href=\"#/transactions\">提交之后何时算成功\u003c/a>；服务接收与人已读的差别，见\u003ca href=\"#/messages\">聊天消息\u003c/a>。\u003c/p>\n","text":"信息丢了、乱序了，怎么还能完整收到？ 一个文件分成很多份传送，途中可能有缺失、重复或迟到。 需要完整内容时，两端会记录已经收到的数据、反馈接收情况、补发缺失部分，再按顺序交给应用。 网络中的到达顺序，与软件最终读取的顺序，可以不同。 IP负责按地址尽力转送，本身不保证完整有序。TCP是在此基础上，为应用提供可靠有序数据流的一套传输规则；“数据流”可以先理解为程序按顺序读到的一串数据。IP的范围、TCP的交付职责 下载PDF时，中间一段没到会发生什么 以下是 虚构教学过程 。为看清顺序，把文件中的连续数据简写成甲、乙、丙三段，不把它们当作真实页码或固定大小的数据包。 发送端先后送出甲、乙、丙。接收端拿到甲和丙，发现中间还缺乙，就不能把丙直接接在甲后面，当成完整连续数据交给需要顺序的程序。每段带有判断数据位置所需的线索，接收端可以暂存已到部分，同时反馈接收范围。 发送端结合确认反馈和等待情况，判断哪些数据需要再送。乙补到后，接收端把它放回正确位置，按甲、乙、丙的顺序让应用读取。若旧的乙也晚到了一份，系统还要识别这是重复数据，不能把它当成文件新增加的一段。 你通常只看到下载进度停顿后继续。中间恢复过程由通信机制完成，不需要用户找到“文件第几页掉在了哪条线上”。实际分段也不与PDF页面一一对应。 双方怎样知道哪些内容已经收到 接收端会告诉发送端已取得哪些范围，发送端据此知道哪些数据可以结束等待。确认可以覆盖一段连续数据，不必每个包都得到一封单独回信。 如果确认本身迟到或丢失，发送端可能再次发送已经到过的数据；接收端识别重复，是整个恢复过程的一部分。通信还会调整速度，避免超过接收方能处理的量，或让已经拥堵的路径继续承受过大压力。 这就是“可靠”的具体含义：两端按规则处理这些情况，成功时给应用正确、有序的数据。它没有保证断网多久都能无限等下去。持续收不到需要的数据，连接仍可以失败，应用会提示中断、重试或其他结果。 下载完成，为什么PDF仍可能打不开 传输机制保证的对象，是发送端交来的那串数据。若服务器原本保存的文件就损坏，或浏览器不支持相应格式，完整送到也不会自动修好。网站甚至可能返回一个错误说明，应用却把它当文件保存了下来。 因此，传送是否完成、文件格式是否正确、应用能否解释，是相接但不同的检查。查看正式下载结果、文件类型和服务提示，比只凭进度到100%判断全部正常更可靠。 UDP是不是“丢了就永远不管” UDP提供另一种数据报传送方式，其基础规则不自动提供TCP那样的可靠有序数据流。但应用或建立在UDP之上的其他协议可以自己实现恢复、顺序控制和加密保护。现代网页使用的QUIC就是一个相关例子。QUIC的机制 所以看见TCP或UDP，只能先知道基础传送安排，不能据此直接推断整个应用是否安全、是否补发。下载文件希望所有必要内容齐全；实时声音更在意新内容赶得上播放，这会影响采用怎样的恢复策略。见视频通话。 为什么“超时”没有告诉你究竟断在哪 应用有自己的等待期限。在期限内没拿到需要的结果，就可能显示超时。它可能在等地址查询、连接、文件数据、网站处理，也可能在等处理完成后的回复。一个提示通常不能指出哪份包在哪里丢失。 把场景换成网盘上传：服务可能尚未收到完整文件，也可能已经保存，最后的成功回复却没回到你的设备。两种情况都可能让你等待后报错，但文件状态不同。 这时更有用的是重新进入网盘的正式文件列表，核对文件是否存在、上传是否完成以及能否使用。若列表也无法访问，结果仍未知，应保留时间和提示，按服务恢复流程查询。超时不是“确认从未发生”的另一种叫法。 网络补发与重复创建订单，为什么要分别处理 网络层补发缺失数据时，接收机制会识别顺序和重复，尽量把同一份数据正确交付。若连接失败后，用户再点一次“提交订单”，应用可能发出一份全新的业务请求；网站需要自己的操作编号、去重或状态核对，才能识别是不是同一次动作。 所以可靠传输不等于“重复按按钮绝不会重复下单”，也不等于“朋友已经看了消息”。它只支撑相应的数据交付阶段。网站保存了什么、怎样查询业务结果，见提交之后何时算成功；服务接收与人已读的差别，见聊天消息。","outline":[{"id":"section-1","title":"下载PDF时，中间一段没到会发生什么","depth":2},{"id":"section-2","title":"双方怎样知道哪些内容已经收到","depth":2},{"id":"section-3","title":"下载完成，为什么PDF仍可能打不开","depth":2},{"id":"section-4","title":"UDP是不是“丢了就永远不管”","depth":2},{"id":"section-5","title":"为什么“超时”没有告诉你究竟断在哪","depth":2},{"id":"section-6","title":"网络补发与重复创建订单，为什么要分别处理","depth":2}]},{"id":"web","group":"services","title":"打开一个网页，背后是谁在回答？","question":"打开一个网页，背后是谁在回答？","summary":"网站传回文字、图片和页面程序，浏览器读取并显示；按钮还可能发出新请求。","terms":["HTTP","服务器","请求","响应","CDN"],"aliases":["HTTP","","服务器","","请求","","响应","","CDN",""],"related":["browsing","url-pages","transactions","identity"],"html":"\u003cp>商品页先出现标题，过一会儿才出现图片；点“查看运费”，页面又转了一次圈。\u003cstrong>浏览器通常分几次取得页面所需的内容，再在你的设备上组合显示。按钮也可以在页面打开后继续向网站请求新结果。\u003c/strong> 你看到的一张网页，背后可能有许多次通信。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgNDIwIDU3MCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1NzAiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPua1j+iniOWZqOS4i+i9veWGheWuueW5tuaYvuekuue9kemhtTwvdGV4dD48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgyMTAsMTAxKSI+PHJlY3QgeD0iLTM0IiB5PSItMjciIHdpZHRoPSI2OCIgaGVpZ2h0PSI0NSIgcng9IjQiIGZpbGw9IiNmZmZlZmEiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iTS00MSAyNUg0MUwzNCAxOEgtMzRaIiBmaWxsPSIjYzZkYWNiIiBzdHJva2U9IiMyNzY2NTUiIHN0cm9rZS13aWR0aD0iMiIvPjwvZz48dGV4dCB4PSIyMTAiIHk9IjE1NyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzI0M2IzNiI+5rWP6KeI5ZmoPC90ZXh0PjxwYXRoIGQ9Ik0xNjkgMTc3TDgwIDIzNyIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMjc2Nj
