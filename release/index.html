层VPN可以通过系统路由等安排，把选中的通信装入隧道。应用不必都设置一个浏览器代理地址，但哪些目标、地址类型或应用被覆盖，仍受系统、客户端和规则限制。\u003c/p>\n\u003cp>还有一些客户端把代理和VPN式接管放在同一界面中。产品名字叫VPN，不表示它每个模式都采用同样接管方式；按钮名字相同，也不能推出不同产品范围相同。\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Mac VPN的配置选项\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-3\">分流怎样让公司系统与购物站分开走\u003c/h2>\n\u003cp>设想公司给出的规则是：内部报销和文件服务走公司VPN，普通互联网访问仍走家庭出口。设备按目标匹配规则，报销请求进入隧道，购物请求直接交给家中网关。这种按条件选择路径的安排，就是分流。\u003c/p>\n\u003cp>规则可以根据地址范围、域名、应用等条件设计，实际由工具能力和提供者配置决定。它不是让用户每点一次都亲自选路，而是把相应选择交给已有规则。\u003c/p>\n\u003cp>报销系统恢复、公共查询仍显示家庭来源，就可能是这份规则的预期结果。要验证公司系统，观察具体内部任务；要验证公共出口，才看相应公共访问的来源。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">出口节点承载的流量\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-4\">全局模式为什么还可能有例外\u003c/h2>\n\u003cp>“全局”常表示在某个工具负责的范围内，尽量统一采用指定路径。范围可能是全部适用代理请求，也可能是公共网络流量，并不保证所有本地、系统和协议活动都完全相同。\u003c/p>\n\u003cp>例如，某个公共出口方案可以接管互联网访问，同时允许你继续联系家中打印机；也可以默认不允许本地访问，再提供单独选项。公司方案还可能保留管理规则。你要核对产品说明，而不是把全局翻译成“一切活动隐形”。\u003c/p>\n\u003cp>设备同时使用IPv4和IPv6时，工具也需要有相应覆盖安排。若某类通信未接管，它可能采用原路径；一次查询显示新来源，不能代表所有可能路径。\u003c/p>\n\u003ch2 id=\"section-5\">同时开两个工具，请求可能怎样绕\u003c/h2>\n\u003cp>假设浏览器先把商品访问交给代理P，而设备的VPN又把去P的底层通信送进VPN。这时一次访问可能是：设备先通过VPN抵达P，再由P联系商品站。目标看到的来源与只开其中一个工具时未必相同。\u003c/p>\n\u003cp>也可能代理设置让公司内部请求走错入口，或另一工具接管了内部名称查询，使报销页不再可用。两个都显示已连接，只能说明各自建立了一部分状态，不能证明组合路径符合目的。\u003c/p>\n\u003cp>如果启用第二项以后问题才出现，可以先恢复本次新增设置，再比较同一目标是否恢复。一次只改变一项，才容易解释差异；公司受管规则按管理员流程处理，不随意删除。\u003c/p>\n\u003ch2 id=\"section-6\">查IP网页能验证什么，不能验证什么\u003c/h2>\n\u003cp>查询页报告的是它接到的那次访问来源。如果浏览器使用代理，而下载软件直连，查询页和下载服务可以看到不同来源。若页面分别检测IPv4和IPv6，两项结果也可能不同。\u003c/p>\n\u003cp>因此，把验证放回真实任务：报销页能不能打开，文件能不能读取，会议能不能传声，目标浏览器是否使用预期公共出口。工具状态和一次查询只是其中部分证据。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>常见选项\u003c/th>\n\u003cth>具体要问的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>节点、出口\u003c/td>\n\u003ctd>先联系哪里，再由哪里联系目标？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分流规则\u003c/td>\n\u003ctd>哪些请求走这里，哪些仍走原路径？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>允许本地网络\u003c/td>\n\u003ctd>开启后，家中打印机等目标还能否联系？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>断线保护\u003c/td>\n\u003ctd>隧道断开后，是恢复直连，还是继续阻止相关通信？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>断线保护会使“VPN断开以后仍不能上网”成为可能的预期行为，而不一定是原宽带又坏了。连接前记录原设置与恢复方法，按提供者说明验证和撤销本次改动，见\u003ca href=\"#/setup\">VPN配置\u003c/a>。\u003c/p>\n","text":"全局、分流、代理，为什么影响的应用不同？ 浏览器开了代理后能正常访问，会议软件却还是卡；公司VPN连上以后报销页能开，IP查询页又没变。 连接工具需要先决定接管哪些通信，其他通信仍可能使用原来的路径。 “开启”描述工具状态，不直接说明整台设备的所有请求都经过它。 规则把部分访问直达、部分经代理或VPN出口，因此不同访问可能呈现不同公网来源。 浏览器代理先接走了哪一项工作 以下是 虚构对照 ：你按提供者资料，在某浏览器中设了代理。原先浏览器直接联系商品站，现在适用请求先交给代理，再由代理联系目标，结果经代理返回浏览器。代理可以理解为替某些请求出面联系目标的中间服务。 会议软件是另一个程序。它可能既不读取这个浏览器的设置，也不支持同样的通信方式，仍按自己的安排发送声音。所以浏览器改善、会议未变，可以是覆盖范围不同，而不是同一个开关“有时有效、有时无效”。 某些代理会替你查询目标名称，另一些安排仍由本地查询。看到“代理”二字，还不能断定DNS和所有数据都经过同一位置。 系统代理与VPN，为什么不是同一个入口 系统代理把一份代理配置提供给应用，愿意并能够采用它的应用按相应规则工作。某些软件有独立设置，或使用不适用这项代理的通信，因此不一定跟随。 网络层VPN可以通过系统路由等安排，把选中的通信装入隧道。应用不必都设置一个浏览器代理地址，但哪些目标、地址类型或应用被覆盖，仍受系统、客户端和规则限制。 还有一些客户端把代理和VPN式接管放在同一界面中。产品名字叫VPN，不表示它每个模式都采用同样接管方式；按钮名字相同，也不能推出不同产品范围相同。Mac VPN的配置选项 分流怎样让公司系统与购物站分开走 设想公司给出的规则是：内部报销和文件服务走公司VPN，普通互联网访问仍走家庭出口。设备按目标匹配规则，报销请求进入隧道，购物请求直接交给家中网关。这种按条件选择路径的安排，就是分流。 规则可以根据地址范围、域名、应用等条件设计，实际由工具能力和提供者配置决定。它不是让用户每点一次都亲自选路，而是把相应选择交给已有规则。 报销系统恢复、公共查询仍显示家庭来源，就可能是这份规则的预期结果。要验证公司系统，观察具体内部任务；要验证公共出口，才看相应公共访问的来源。出口节点承载的流量 全局模式为什么还可能有例外 “全局”常表示在某个工具负责的范围内，尽量统一采用指定路径。范围可能是全部适用代理请求，也可能是公共网络流量，并不保证所有本地、系统和协议活动都完全相同。 例如，某个公共出口方案可以接管互联网访问，同时允许你继续联系家中打印机；也可以默认不允许本地访问，再提供单独选项。公司方案还可能保留管理规则。你要核对产品说明，而不是把全局翻译成“一切活动隐形”。 设备同时使用IPv4和IPv6时，工具也需要有相应覆盖安排。若某类通信未接管，它可能采用原路径；一次查询显示新来源，不能代表所有可能路径。 同时开两个工具，请求可能怎样绕 假设浏览器先把商品访问交给代理P，而设备的VPN又把去P的底层通信送进VPN。这时一次访问可能是：设备先通过VPN抵达P，再由P联系商品站。目标看到的来源与只开其中一个工具时未必相同。 也可能代理设置让公司内部请求走错入口，或另一工具接管了内部名称查询，使报销页不再可用。两个都显示已连接，只能说明各自建立了一部分状态，不能证明组合路径符合目的。 如果启用第二项以后问题才出现，可以先恢复本次新增设置，再比较同一目标是否恢复。一次只改变一项，才容易解释差异；公司受管规则按管理员流程处理，不随意删除。 查IP网页能验证什么，不能验证什么 查询页报告的是它接到的那次访问来源。如果浏览器使用代理，而下载软件直连，查询页和下载服务可以看到不同来源。若页面分别检测IPv4和IPv6，两项结果也可能不同。 因此，把验证放回真实任务：报销页能不能打开，文件能不能读取，会议能不能传声，目标浏览器是否使用预期公共出口。工具状态和一次查询只是其中部分证据。 常见选项 具体要问的问题 --- --- 节点、出口 先联系哪里，再由哪里联系目标？ 分流规则 哪些请求走这里，哪些仍走原路径？ 允许本地网络 开启后，家中打印机等目标还能否联系？ 断线保护 隧道断开后，是恢复直连，还是继续阻止相关通信？ 断线保护会使“VPN断开以后仍不能上网”成为可能的预期行为，而不一定是原宽带又坏了。连接前记录原设置与恢复方法，按提供者说明验证和撤销本次改动，见VPN配置。","outline":[{"id":"section-1","title":"浏览器代理先接走了哪一项工作","depth":2},{"id":"section-2","title":"系统代理与VPN，为什么不是同一个入口","depth":2},{"id":"section-3","title":"分流怎样让公司系统与购物站分开走","depth":2},{"id":"section-4","title":"全局模式为什么还可能有例外","depth":2},{"id":"section-5","title":"同时开两个工具，请求可能怎样绕","depth":2},{"id":"section-6","title":"查IP网页能验证什么，不能验证什么","depth":2}]},{"id":"setup","group":"vpn","title":"怎样配置VPN，并确认它真的生效？","question":"怎样配置VPN，并确认它真的生效？","summary":"先确认目的和提供者，再导入或填写配置，按目标验证并保留恢复路径。","terms":["VPN配置","连接验证"],"aliases":["VPN配置","","连接验证",""],"related":["split","dns","vpn","troubleshoot"],"html":"\u003cp>\u003cstrong>先说明要完成什么任务，再选择提供者要求的连接方式；连接后在目标应用里验证，最后确认能够恢复。\u003c/strong> “已连接”只说明连接取得相应结果，不代表公司系统权限和所有软件的公共出口都已验证。\u003c/p>\n\u003cp>下面是可以只阅读的\u003cstrong>虚构教学示例\u003c/strong>，不需要为了学习修改真实网络。操作入口以Mac为例，菜单随版本变化，以\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Apple官方说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>及提供者要求为准。\u003c/p>\n\u003ch2 id=\"section-1\">先把“我想开VPN”说成一个具体目标\u003c/h2>\n\u003cp>小林在家需要打开公司报销页。公司告诉他：使用指定客户端、以企业账号登录、只转送内部访问。这里的验收结果是“报销页能够打开，并能以获准账号使用”，而不是“浏览器查IP变成另一地区”。\u003c/p>\n\u003cp>换一个目标，如果他希望指定公共访问从某处出口发出，提供者还必须支持相应出口，客户端可能需要单独选择。验证也要改成在目标应用检查实际来源与任务结果。\u003c/p>\n\u003cp>两种目的可能使用相同工具，却不能共用一个模糊的“能连就行”。原理见\u003ca href=\"#/vpn\">VPN两种用途\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-2\">手上的资料，各自解决哪件事\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>资料或字段\u003c/th>\n\u003cth>具体用途\u003c/th>\n\u003cth>为什么不能靠教程猜\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户端、配置文件、连接类型\u003c/td>\n\u003ctd>告诉设备按哪种方式建立连接\u003c/td>\n\u003ctd>两端方式不匹配，地址填对也可能失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务器地址、节点\u003c/td>\n\u003ctd>告诉设备先联系哪台VPN入口\u003c/td>\n\u003ctd>它未必就是最终报销网站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号、密码、证书或登录批准\u003c/td>\n\u003ctd>证明你有权建立连接\u003c/td>\n\u003ctd>与网站业务账号可能不是同一份凭据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内部名称、分流与出口安排\u003c/td>\n\u003ctd>决定连接后哪些访问经过哪里\u003c/td>\n\u003ctd>直接影响内部系统与公共访问结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>如果提供者给的是某应用专用配置，就按该应用的官方流程导入。不能把一段不认识的配置随意塞进系统VPN，也不能从公开截图复制别人的服务器和账号。\u003c/p>\n\u003ch2 id=\"section-3\">连接前，先保留能恢复的起点\u003c/h2>\n\u003cp>在同一设备、同一网络记录三项观察：普通公共网页是否可用，目标内部页目前是什么结果，以及有没有其他代理或VPN正在作用。记录本次要改的设置；不要同时换DNS、开多个代理、改路由器。\u003c/p>\n\u003cp>小林的教学起点是：购物站正常，报销页无法联系，没有其他新加工具。这样连接后若购物也失败，就知道这项变化发生在本次连接以后。\u003c/p>\n\u003cp>公司管理的设备和配置按管理员要求操作。准备资料不足时，应先向提供者取得连接方式和恢复办法；这与“随便换几个参数试试”解决的是不同问题。\u003c/p>\n\u003ch2 id=\"section-4\">选对入口：指定应用，还是Mac内置设置\u003c/h2>\n\u003cp>如果公司要求指定客户端，小林应安装其正式版本、导入公司提供的配置，或在客户端发起企业登录。进入正确的组织或连接项目后，再继续认证。若找不到公司入口或配置不被识别，先核对资料对应的客户端与版本，不新建一个猜测的系统VPN。\u003c/p>\n\u003cp>如果提供者明确支持Mac内置方式，才使用系统设置分支：进入“系统设置 → 网络”，在操作菜单中选择“添加VPN配置”，再选择提供者指定的类型。应出现与该类型对应的设置窗口。没有所需类型时，回到提供者说明，确认是否要求专用应用。\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Apple的手动配置流程\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>两种分支是不同入口，不需要为了同一次连接都建立一遍。\u003c/p>\n\u003ch2 id=\"section-5\">按资料填写：哪些可以自己起名，哪些必须匹配\u003c/h2>\n\u003cp>连接显示名称只是帮助自己辨认，例如“公司报销访问”，一般不决定远方服务器身份。服务器地址、连接类型和认证方式则必须与提供者资料一致，证书或其他认证资料也要采用规定内容。\u003c/p>\n\u003cp>保存或创建以后，应能在客户端或系统中看到这条连接。若不能保存，先看哪个必填项缺失、配置是否被识别；若保存成功，它也只说明资料已登记，还没有证明能联系另一端。\u003c/p>\n\u003cp>内部DNS和访问范围可能由配置自动带入。不了解这些选项时，保留提供者要求，不用公共网络教程里的值替换公司记录。每个字段怎样参与连接，见\u003ca href=\"#/dns\">名称查询\u003c/a>与\u003ca href=\"#/split\">分流\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-6\">发起连接：看清失败发生在哪一段\u003c/h2>\n\u003cp>选择刚创建的连接，发起连接，按要求完成登录、批准或其他验证。正常时应看到相应连接状态，再进入目标验证。\u003c/p>\n\u003cp>若提示认证失败，先核对账号、凭据有效性和批准状态；若提示联系不到服务器，先比较普通接入是否仍可用，再让提供者核对入口和网络条件。此时不必已经访问过报销服务，不能把连接认证错误直接解释成“报销网站封了IP”。\u003c/p>\n\u003cp>若长时间等待，记录完整提示和时间，停止反复更换随机入口。一个“失败”字样不足以同时诊断名称查询、路径和身份，应把已有结果交给对应提供者。\u003c/p>\n\u003ch2 id=\"section-7\">按目的验证：成功应出现在实际任务中\u003c/h2>\n\u003cp>小林连接成功后，先打开公司给出的报销页。如果登录页出现，说明至少取到了网页回复；他还要按要求登录，确认有权查看自己的报销资料。出现无权限提示时，应检查业务账号，而不是只重装VPN。\u003c/p>\n\u003cp>本例中，报销系统可用，公共IP查询保持原样。因为公司只安排内部访问经过VPN，这个结果符合目标。经管理员允许再断开对照时，报销页不可联系而普通公共网页仍正常，可以进一步支持这项连接确实参与内部访问。\u003c/p>\n\u003cp>如果目标是更换公共出口，则在同一应用、同一查询服务比较连接前后来源，并确认与提供者的出口安排一致。结果没变时，要核对出口是否另行启用、目标应用是否采用该路径、查询使用哪种IP。只在浏览器查一次，不能证明下载或会议软件也在相同范围。\u003c/p>\n\u003ch2 id=\"section-8\">检查实际使用与恢复：断开后该看到什么\u003c/h2>\n\u003cp>完成验证后，在目标应用做一项获准的小任务，例如打开自己的报销记录；不必为验证创建真实付款。记录任务结果，而不是只保留客户端“已连接”的截图。\u003c/p>\n\u003cp>需要恢复时，先断开本次连接，只撤销本次手动改动，再检查连接前可用的公共访问是否恢复。若启用了断线保护，客户端可能继续阻止某些通信，应按其正式说明恢复；受管设备交由管理员处理，不随意删除公司配置。\u003c/p>\n\u003cp>若原访问仍未恢复，保留连接状态、具体提示和修改记录，按\u003ca href=\"#/troubleshoot\">访问排障\u003c/a>做对照。至此能够说明目标是否实现、影响哪些访问、怎样回到起点，才算把这次配置检查完整。\u003c/p>\n","text":"怎样配置VPN，并确认它真的生效？ 先说明要完成什么任务，再选择提供者要求的连接方式；连接后在目标应用里验证，最后确认能够恢复。 “已连接”只说明连接取得相应结果，不代表公司系统权限和所有软件的公共出口都已验证。 下面是可以只阅读的 虚构教学示例 ，不需要为了学习修改真实网络。操作入口以Mac为例，菜单随版本变化，以Apple官方说明及提供者要求为准。 先把“我想开VPN”说成一个具体目标 小林在家需要打开公司报销页。公司告诉他：使用指定客户端、以企业账号登录、只转送内部访问。这里的验收结果是“报销页能够打开，并能以获准账号使用”，而不是“浏览器查IP变成另一地区”。 换一个目标，如果他希望指定公共访问从某处出口发出，提供者还必须支持相应出口，客户端可能需要单独选择。验证也要改成在目标应用检查实际来源与任务结果。 两种目的可能使用相同工具，却不能共用一个模糊的“能连就行”。原理见VPN两种用途。 手上的资料，各自解决哪件事 资料或字段 具体用途 为什么不能靠教程猜 --- --- --- 客户端、配置文件、连接类型 告诉设备按哪种方式建立连接 两端方式不匹配，地址填对也可能失败 服务器地址、节点 告诉设备先联系哪台VPN入口 它未必就是最终报销网站 账号、密码、证书或登录批准 证明你有权建立连接 与网站业务账号可能不是同一份凭据 内部名称、分流与出口安排 决定连接后哪些访问经过哪里 直接影响内部系统与公共访问结果 如果提供者给的是某应用专用配置，就按该应用的官方流程导入。不能把一段不认识的配置随意塞进系统VPN，也不能从公开截图复制别人的服务器和账号。 连接前，先保留能恢复的起点 在同一设备、同一网络记录三项观察：普通公共网页是否可用，目标内部页目前是什么结果，以及有没有其他代理或VPN正在作用。记录本次要改的设置；不要同时换DNS、开多个代理、改路由器。 小林的教学起点是：购物站正常，报销页无法联系，没有其他新加工具。这样连接后若购物也失败，就知道这项变化发生在本次连接以后。 公司管理的设备和配置按管理员要求操作。准备资料不足时，应先向提供者取得连接方式和恢复办法；这与“随便换几个参数试试”解决的是不同问题。 选对入口：指定应用，还是Mac内置设置 如果公司要求指定客户端，小林应安装其正式版本、导入公司提供的配置，或在客户端发起企业登录。进入正确的组织或连接项目后，再继续认证。若找不到公司入口或配置不被识别，先核对资料对应的客户端与版本，不新建一个猜测的系统VPN。 如果提供者明确支持Mac内置方式，才使用系统设置分支：进入“系统设置 → 网络”，在操作菜单中选择“添加VPN配置”，再选择提供者指定的类型。应出现与该类型对应的设置窗口。没有所需类型时，回到提供者说明，确认是否要求专用应用。Apple的手动配置流程 两种分支是不同入口，不需要为了同一次连接都建立一遍。 按资料填写：哪些可以自己起名，哪些必须匹配 连接显示名称只是帮助自己辨认，例如“公司报销访问”，一般不决定远方服务器身份。服务器地址、连接类型和认证方式则必须与提供者资料一致，证书或其他认证资料也要采用规定内容。 保存或创建以后，应能在客户端或系统中看到这条连接。若不能保存，先看哪个必填项缺失、配置是否被识别；若保存成功，它也只说明资料已登记，还没有证明能联系另一端。 内部DNS和访问范围可能由配置自动带入。不了解这些选项时，保留提供者要求，不用公共网络教程里的值替换公司记录。每个字段怎样参与连接，见名称查询与分流。 发起连接：看清失败发生在哪一段 选择刚创建的连接，发起连接，按要求完成登录、批准或其他验证。正常时应看到相应连接状态，再进入目标验证。 若提示认证失败，先核对账号、凭据有效性和批准状态；若提示联系不到服务器，先比较普通接入是否仍可用，再让提供者核对入口和网络条件。此时不必已经访问过报销服务，不能把连接认证错误直接解释成“报销网站封了IP”。 若长时间等待，记录完整提示和时间，停止反复更换随机入口。一个“失败”字样不足以同时诊断名称查询、路径和身份，应把已有结果交给对应提供者。 按目的验证：成功应出现在实际任务中 小林连接成功后，先打开公司给出的报销页。如果登录页出现，说明至少取到了网页回复；他还要按要求登录，确认有权查看自己的报销资料。出现无权限提示时，应检查业务账号，而不是只重装VPN。 本例中，报销系统可用，公共IP查询保持原样。因为公司只安排内部访问经过VPN，这个结果符合目标。经管理员允许再断开对照时，报销页不可联系而普通公共网页仍正常，可以进一步支持这项连接确实参与内部访问。 如果目标是更换公共出口，则在同一应用、同一查询服务比较连接前后来源，并确认与提供者的出口安排一致。结果没变时，要核对出口是否另行启用、目标应用是否采用该路径、查询使用哪种IP。只在浏览器查一次，不能证明下载或会议软件也在相同范围。 检查实际使用与恢复：断开后该看到什么 完成验证后，在目标应用做一项获准的小任务，例如打开自己的报销记录；不必为验证创建真实付款。记录任务结果，而不是只保留客户端“已连接”的截图。 需要恢复时，先断开本次连接，只撤销本次手动改动，再检查连接前可用的公共访问是否恢复。若启用了断线保护，客户端可能继续阻止某些通信，应按其正式说明恢复；受管设备交由管理员处理，不随意删除公司配置。 若原访问仍未恢复，保留连接状态、具体提示和修改记录，按访问排障做对照。至此能够说明目标是否实现、影响哪些访问、怎样回到起点，才算把这次配置检查完整。","outline":[{"id":"section-1","title":"先把“我想开VPN”说成一个具体目标","depth":2},{"id":"section-2","title":"手上的资料，各自解决哪件事","depth":2},{"id":"section-3","title":"连接前，先保留能恢复的起点","depth":2},{"id":"section-4","title":"选对入口：指定应用，还是Mac内置设置","depth":2},{"id":"section-5","title":"按资料填写：哪些可以自己起名，哪些必须匹配","depth":2},{"id":"section-6","title":"发起连接：看清失败发生在哪一段","depth":2},{"id":"section-7","title":"按目的验证：成功应出现在实际任务中","depth":2},{"id":"section-8","title":"检查实际使用与恢复：断开后该看到什么","depth":2}]},{"id":"troubleshoot","group":"scenes","title":"连不上、打不开，怎样判断卡在哪一段？","question":"连不上、打不开，怎样判断卡在哪一段？","summary":"用少量对照缩小故障范围，一次只改变一个条件。","terms":["排障","热点"],"aliases":["排障","","热点",""],"related":["dns","split","setup","risk"],"html":"\u003cp>“打不开”可以是名字查不到、连接没人接、网站要求登录，也可以只是某张图片没显示。\u003cstrong>先描述实际结果，再一次改变一个条件，比较前后差异。\u003c/strong> 排障是在缩小范围，不是从一条错误提示直接猜出全部原因。\u003c/p>\n\u003cp>不需要先改任何设置。记录目标应用、操作时间、完整提示和发生在哪个动作，往往就是最有用的第一步。\u003c/p>\n\u003ch2 id=\"section-1\">先看有没有收到回答，再看回答说什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你眼前的结果\u003c/th>\n\u003cth>哪一步值得先核对\u003c/th>\n\u003cth>它还没有证明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>名称找不到、地址解析失败\u003c/td>\n\u003ctd>名称是否正确，当前查询安排能否取得记录\u003c/td>\n\u003ctd>网站程序一定停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连接拒绝\u003c/td>\n\u003ctd>目标入口是否接收、是否有规则明确拒绝\u003c/td>\n\u003ctd>全部网络中断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待超时\u003c/td>\n\u003ctd>查询、连接、路径、服务处理或返回是否卡住\u003c/td>\n\u003ctd>请求从未到达，业务从未保存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>证书警告\u003c/td>\n\u003ctd>网站名称、设备时间与连接校验\u003c/td>\n\u003ctd>可以通过关闭校验修好身份问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录页、403或验证码\u003c/td>\n\u003ctd>相应入口已给出回复，继续核对身份和访问规则\u003c/td>\n\u003ctd>网站全部后台功能都正常\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>404或页面说找不到内容\u003c/td>\n\u003ctd>资源、路径及服务提供方式\u003c/td>\n\u003ctd>家中Wi-Fi坏了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>回复可能由网站入口、CDN等中间服务给出，不能只凭一个数字就确定后台哪台机器出问题。正常到达的响应中也可能写着业务失败，仍要读正文。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP请求与响应\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-2\">一个具体例子：商品文字正常，图片空白\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构教学场景\u003c/strong>。小林能看到商品标题和价格，图片却一直不出。他想先重启所有设备，但已有结果至少说明浏览器取得并显示了一部分内容。\u003c/p>\n\u003cp>先保持同一设备、浏览器和网络，比较是一个商品图片缺失，还是站内图片普遍失败。若只有一张缺失而其他图片正常，缺失文件、链接或该资源的提供情况更值得核对。若全部图片失败，可以想到图片可能来自另一接收入口，也可能受本地显示或设置影响。\u003c/p>\n\u003cp>随后在许可范围内，用同一设备切到手机热点，重新访问同一目标。假设图片恢复，原网络相关的名称查询、路径或访问策略就值得继续检查。还不能由此断言“酒店封了图片”，因为多项网络条件可能同时改变。\u003c/p>\n\u003cp>若两条网络都只缺同一张图，文件本身或网站提供方式更值得关注。把“哪些图、哪个时段、两条网络分别怎样”交给服务支持，远比只说“网不好”具体。原理见\u003ca href=\"#/web\">网页怎样分批取得内容\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-3\">公司VPN之后打不开，按顺序做四个对照\u003c/h2>\n\u003cp>同样使用\u003cstrong>虚构教学示范\u003c/strong>：小林原来能上公共网站，公司VPN显示连接以后，内部报销页打不开。以下步骤可以只读；涉及公司网络时按管理员许可执行。\u003c/p>\n\u003ch3 id=\"section-4\">一、确认原有接入\u003c/h3>\n\u003cp>如果允许断开本次VPN，先断开它，在同一设备访问两个平常可用的公共服务。两个都失败时，附近连接、酒店联网确认或上游接入应先核对；部分正常则说明普通公共访问至少有一部分可用。\u003c/p>\n\u003cp>记录结果，再回到原网络和连接状态。不要在这一步同时清Cookie、改DNS、换浏览器，否则后面即使好了，也难说是哪项变化起作用。\u003c/p>\n\u003ch3 id=\"section-5\">二、比较连接状态与目标\u003c/h3>\n\u003cp>重新发起公司连接，记录是认证失败、无法联系服务器，还是已经连接。如果认证失败，先核对公司凭据和批准；如果已经连接，再访问管理员给出的准确报销入口。\u003c/p>\n\u003cp>名称查不到时，内部名称查询安排值得看；出现登录页时，已经收到网页，继续核对业务登录；登录后无权限时，要看账号获准范围。它们分别发生在不同阶段，不应统称为“VPN没连上”。\u003ca href=\"#/setup\">配置与目标验证\u003c/a>\u003c/p>\n\u003ch3 id=\"section-6\">三、在许可范围内换一个条件\u003c/h3>\n\u003cp>同设备、同账号、同目标，换另一条获准网络；或请有相应权限的同事在原条件下比较同一目标。不要共享密码或把个人会话给同事使用。\u003c/p>\n\u003cp>若小林只在原网络失败，该路径相关条件值得检查；若他在多处都失败而同事正常，他的设备、账号或配置更值得检查；若大家同时失败，目标服务或共同安排值得检查。对照是在调整检查顺序，不是已经证明唯一原因。\u003c/p>\n\u003ch3 id=\"section-7\">四、恢复并提交线索\u003c/h3>\n\u003cp>断开本次连接，只撤销本次手动修改，确认起初可用的访问恢复。若断线保护仍在阻止访问，按客户端或管理员说明处理。\u003c/p>\n\u003cp>报告可以写成：“某时段，同一Mac，原网络公共网站正常；VPN显示已连接；报销域名提示找不到；换获准热点后能到登录页。”这是教学写法，真实报告填写真实结果，不公开密码、认证文件或完整敏感链接。\u003c/p>\n\u003ch2 id=\"section-8\">为什么不要一上来把所有东西都重置\u003c/h2>\n\u003cp>重启可能暂时消除某些状态，但同时改掉太多条件，会失去解释原因的线索，也可能影响本来正常的工作。证书校验、公司受管规则和访问权限更不是应该随意关闭的排障开关。\u003c/p>\n\u003cp>一个有用对照要尽量固定设备、账号、目标和时段，只改变你要比较的条件。换网尤其会同时改变上游路径、查询安排和可能的来源，因此它是粗略分组线索，不能独立定位某一台设备。\u003c/p>\n\u003ch2 id=\"section-9\">超时后，先核对业务记录再决定是否重复\u003c/h2>\n\u003cp>若发生在提交订单、上传文件或发送消息以后，未收到及时回复，不代表服务没保存。按平台正式记录核对对应结果；若记录也无法取得，保留时间与提示，按服务恢复流程查询。\u003c/p>\n\u003cp>填写错误资料、网络没有结果、网站明确拒绝，是不同证据。前者可能需要修正输入，后者可能需要验证或支持，未知结果则需要查状态。完整过程见\u003ca href=\"#/transactions\">操作何时真的成功\u003c/a>。\u003c/p>\n","text":"连不上、打不开，怎样判断卡在哪一段？ “打不开”可以是名字查不到、连接没人接、网站要求登录，也可以只是某张图片没显示。 先描述实际结果，再一次改变一个条件，比较前后差异。 排障是在缩小范围，不是从一条错误提示直接猜出全部原因。 不需要先改任何设置。记录目标应用、操作时间、完整提示和发生在哪个动作，往往就是最有用的第一步。 先看有没有收到回答，再看回答说什么 你眼前的结果 哪一步值得先核对 它还没有证明什么 --- --- --- 名称找不到、地址解析失败 名称是否正确，当前查询安排能否取得记录 网站程序一定停止 连接拒绝 目标入口是否接收、是否有规则明确拒绝 全部网络中断 等待超时 查询、连接、路径、服务处理或返回是否卡住 请求从未到达，业务从未保存 证书警告 网站名称、设备时间与连接校验 可以通过关闭校验修好身份问题 登录页、403或验证码 相应入口已给出回复，继续核对身份和访问规则 网站全部后台功能都正常 404或页面说找不到内容 资源、路径及服务提供方式 家中Wi-Fi坏了 回复可能由网站入口、CDN等中间服务给出，不能只凭一个数字就确定后台哪台机器出问题。正常到达的响应中也可能写着业务失败，仍要读正文。HTTP请求与响应 一个具体例子：商品文字正常，图片空白 以下是 虚构教学场景 。小林能看到商品标题和价格，图片却一直不出。他想先重启所有设备，但已有结果至少说明浏览器取得并显示了一部分内容。 先保持同一设备、浏览器和网络，比较是一个商品图片缺失，还是站内图片普遍失败。若只有一张缺失而其他图片正常，缺失文件、链接或该资源的提供情况更值得核对。若全部图片失败，可以想到图片可能来自另一接收入口，也可能受本地显示或设置影响。 随后在许可范围内，用同一设备切到手机热点，重新访问同一目标。假设图片恢复，原网络相关的名称查询、路径或访问策略就值得继续检查。还不能由此断言“酒店封了图片”，因为多项网络条件可能同时改变。 若两条网络都只缺同一张图，文件本身或网站提供方式更值得关注。把“哪些图、哪个时段、两条网络分别怎样”交给服务支持，远比只说“网不好”具体。原理见网页怎样分批取得内容。 公司VPN之后打不开，按顺序做四个对照 同样使用 虚构教学示范 ：小林原来能上公共网站，公司VPN显示连接以后，内部报销页打不开。以下步骤可以只读；涉及公司网络时按管理员许可执行。 一、确认原有接入 如果允许断开本次VPN，先断开它，在同一设备访问两个平常可用的公共服务。两个都失败时，附近连接、酒店联网确认或上游接入应先核对；部分正常则说明普通公共访问至少有一部分可用。 记录结果，再回到原网络和连接状态。不要在这一步同时清Cookie、改DNS、换浏览器，否则后面即使好了，也难说是哪项变化起作用。 二、比较连接状态与目标 重新发起公司连接，记录是认证失败、无法联系服务器，还是已经连接。如果认证失败，先核对公司凭据和批准；如果已经连接，再访问管理员给出的准确报销入口。 名称查不到时，内部名称查询安排值得看；出现登录页时，已经收到网页，继续核对业务登录；登录后无权限时，要看账号获准范围。它们分别发生在不同阶段，不应统称为“VPN没连上”。配置与目标验证 三、在许可范围内换一个条件 同设备、同账号、同目标，换另一条获准网络；或请有相应权限的同事在原条件下比较同一目标。不要共享密码或把个人会话给同事使用。 若小林只在原网络失败，该路径相关条件值得检查；若他在多处都失败而同事正常，他的设备、账号或配置更值得检查；若大家同时失败，目标服务或共同安排值得检查。对照是在调整检查顺序，不是已经证明唯一原因。 四、恢复并提交线索 断开本次连接，只撤销本次手动修改，确认起初可用的访问恢复。若断线保护仍在阻止访问，按客户端或管理员说明处理。 报告可以写成：“某时段，同一Mac，原网络公共网站正常；VPN显示已连接；报销域名提示找不到；换获准热点后能到登录页。”这是教学写法，真实报告填写真实结果，不公开密码、认证文件或完整敏感链接。 为什么不要一上来把所有东西都重置 重启可能暂时消除某些状态，但同时改掉太多条件，会失去解释原因的线索，也可能影响本来正常的工作。证书校验、公司受管规则和访问权限更不是应该随意关闭的排障开关。 一个有用对照要尽量固定设备、账号、目标和时段，只改变你要比较的条件。换网尤其会同时改变上游路径、查询安排和可能的来源，因此它是粗略分组线索，不能独立定位某一台设备。 超时后，先核对业务记录再决定是否重复 若发生在提交订单、上传文件或发送消息以后，未收到及时回复，不代表服务没保存。按平台正式记录核对对应结果；若记录也无法取得，保留时间与提示，按服务恢复流程查询。 填写错误资料、网络没有结果、网站明确拒绝，是不同证据。前者可能需要修正输入，后者可能需要验证或支持，未知结果则需要查状态。完整过程见操作何时真的成功。","outline":[{"id":"section-1","title":"先看有没有收到回答，再看回答说什么","depth":2},{"id":"section-2","title":"一个具体例子：商品文字正常，图片空白","depth":2},{"id":"section-3","title":"公司VPN之后打不开，按顺序做四个对照","depth":2},{"id":"section-4","title":"一、确认原有接入","depth":3},{"id":"section-5","title":"二、比较连接状态与目标","depth":3},{"id":"section-6","title":"三、在许可范围内换一个条件","depth":3},{"id":"section-7","title":"四、恢复并提交线索","depth":3},{"id":"section-8","title":"为什么不要一上来把所有东西都重置","depth":2},{"id":"section-9","title":"超时后，先核对业务记录再决定是否重复","depth":2}]},{"id":"remote","group":"scenes","title":"人在外面，怎样访问家里或公司的设备？","question":"人在外面，怎样访问家里或公司的设备？","summary":"先让设备加入有身份控制的私有连接，再访问获准的服务。","terms":["远程访问","内网"],"aliases":["远程访问","","内网",""],"related":["vpn","identity","setup"],"html":"\u003cp>在家能打开照片设备，出门照着同一串内部地址却打不开。\u003cstrong>外面的设备需要先有一条获准路径，能够联系家中设备；家中还要有正在运行、接受这类请求的服务，并允许你的账号使用。\u003c/strong> 网络连接、服务运行和资料权限，缺一项都可能无法完成访问。\u003c/p>\n\u003ch2 id=\"section-1\">在家能看照片，出门为什么换了条件\u003c/h2>\n\u003cp>家中电脑和照片设备可能处在同一内部网络。浏览器按设备的内部地址联系照片服务，服务核对账号后返回图片，整个访问可以在家里完成。\u003c/p>\n\u003cp>出门以后，你加入咖啡店或移动网络。192.168.1.20这类内部地址不会自动说明“去我家”。另一个家庭也可以重复使用它；运营商和家中出口也不会把所有陌生的新连接都交给照片设备。\u003c/p>\n\u003cp>你在外仍能浏览公共网站，是因为设备主动访问公开服务，并接收已有通信的回复。让外部新连接找到家中某台设备，是另一项目的，需要安排适当入口。\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">出站与主动入站的区别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-2\">私有连接怎样让两台设备重新联系\u003c/h2>\n\u003cp>下面是\u003cstrong>虚构教学示范\u003c/strong>，用Tailscale这类私有覆盖网络说明。两台设备均属于你或已获明确许可，允许安装正式客户端，家中设备保持运行和联网。公司设备采用管理员指定方案，不自行加入个人网络。\u003c/p>\n\u003cp>这类工具可以把获准设备加入同一成员网络，提供成员名称或地址，并安排设备间的可用通信。数据仍通过各自现有互联网接入传送；可能直接联系，也可能由中继转送，不是物理上把两台电脑搬到同一家里。\u003c/p>\n\u003cp>你先建立成员连接，再在浏览器或文件客户端访问目标服务。工具提供的是联系设备的办法，照片应用继续负责展示照片和验证账号。\u003ca href=\"https://tailscale.com/docs/how-to/quickstart\" target=\"_blank\" rel=\"noopener noreferrer\">官方开始步骤\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-3\">第一步：建立成员身份\u003c/h2>\n\u003cp>按官方流程在两台设备安装客户端，加入正确的账号或组织范围，完成必要批准。管理界面应能看到对应设备，设备端也应处于相应连接状态。\u003c/p>\n\u003cp>若只出现外出电脑，没有家中设备，先核对家中客户端是否登录同一范围、是否等待批准、设备是否联网。此时还不需要猜照片端口或开放公网，因为前一项成员条件尚未满足。\u003c/p>\n\u003cp>不要把“设备已经登记”和“设备当前可联系”当成一回事。设备休眠、断电或客户端退出后，登记记录可以还在，实际通信却无法完成。\u003c/p>\n\u003ch2 id=\"section-4\">第二步：确认目标服务\u003c/h2>\n\u003cp>先在家中设备上检查照片服务。打开它的正式入口，确认程序正在运行，能正常显示自己的照片，并有适当的账号与文件权限。若本机都打不开，优先处理程序，私有连接不会替你启动它。\u003c/p>\n\u003cp>服务还必须接受来自获准网络的请求。程序若只在localhost接收，就只供本机访问，另一台成员设备也不能直接使用。应按照片程序官方说明设置合适的接收范围与防火墙规则，范围以任务需要为限。\u003c/p>\n\u003cp>“监听某地址和端口”就是程序在相应位置等请求；它与加入私有网络分属两项条件。见\u003ca href=\"#/ports\">端口与监听\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">第三步：从另一台设备访问\u003c/h2>\n\u003cp>在外出电脑连接成员网络，采用工具提供的目标名称或地址，再按照片服务要求的访问方式和端口打开。目标服务回应后，按照片服务自身的账号登录，检查是否能取得一张有权查看的照片。\u003c/p>\n\u003cp>若设备不可联系，先看成员在线状态和连接规则；若设备在线而服务无响应，检查程序运行、接收范围和防火墙；若已到登录页却被拒，检查服务账号和权限。不要从任一种失败都退回“重新加一遍设备”。\u003c/p>\n\u003cp>工具的设备身份可以限制谁能联系；照片应用的账号可以限制谁能看哪些内容。两项控制可以一起存在，加入成员网络并不授予全部文件权限。\u003c/p>\n\u003ch2 id=\"section-6\">第四步：验证范围并恢复\u003c/h2>\n\u003cp>两台设备都在家中测试成功，还没有覆盖真正的外出条件。应从实际要用的获准外部网络，再检查成员联系、服务响应和资料访问。这里只验证自己的资料，不操作其他成员未授权的文件。\u003c/p>\n\u003cp>完成以后，不再需要的成员资格、临时访问规则或连接可以按管理流程撤销，并检查相应访问停止。若撤销会影响其他获准用户，应先确认依赖关系。恢复的是本次安排，不是随意删除既有组织设置。\u003c/p>\n\u003ch2 id=\"section-7\">远程桌面、文件共享与网页，各给了什么能力\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>服务\u003c/th>\n\u003cth>外出设备实际取得什么\u003c/th>\n\u003cth>还需要满足什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>照片或管理网页\u003c/td>\n\u003ctd>浏览器取得页面、图片与操作结果\u003c/td>\n\u003ctd>相应网页服务运行并接受请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文件服务\u003c/td>\n\u003ctd>列出或读写授权文件\u003c/td>\n\u003ctd>文件服务账号与目录权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>远程桌面\u003c/td>\n\u003ctd>取得另一设备的画面，并发送键盘鼠标操作\u003c/td>\n\u003ctd>远程控制服务、登录与操作许可\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>它们可以运行在同一台设备，却可能采用不同端口和账号。能看网页不表示可以控制桌面，能远控也不表示所有共享目录开放。\u003c/p>\n\u003ch2 id=\"section-8\">这与“让上网从家里出去”有什么不同\u003c/h2>\n\u003cp>普通私有成员连接，主要帮助联系家中设备。你随后访问购物站，仍可能直接经咖啡店或手机出口，不默认绕回家里。\u003c/p>\n\u003cp>如果另行选择家中设备作为公共上网出口，公共访问才会按相应规则先回家、再由家中联系目标；这还需要出口支持、批准和客户端选择。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">内部连接与出口节点\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>访问家中照片和使用家中上网出口，是两项不同任务。先说清目标，再在相应应用检查，才能避免用一次公网IP查询判断所有远程能力。配置与恢复见\u003ca href=\"#/setup\">VPN配置\u003c/a>，面向所有人发布网页则见\u003ca href=\"#/deploy\">公共部署\u003c/a>。\u003c/p>\n","text":"人在外面，怎样访问家里或公司的设备？ 在家能打开照片设备，出门照着同一串内部地址却打不开。 外面的设备需要先有一条获准路径，能够联系家中设备；家中还要有正在运行、接受这类请求的服务，并允许你的账号使用。 网络连接、服务运行和资料权限，缺一项都可能无法完成访问。 在家能看照片，出门为什么换了条件 家中电脑和照片设备可能处在同一内部网络。浏览器按设备的内部地址联系照片服务，服务核对账号后返回图片，整个访问可以在家里完成。 出门以后，你加入咖啡店或移动网络。192.168.1.20这类内部地址不会自动说明“去我家”。另一个家庭也可以重复使用它；运营商和家中出口也不会把所有陌生的新连接都交给照片设备。 你在外仍能浏览公共网站，是因为设备主动访问公开服务，并接收已有通信的回复。让外部新连接找到家中某台设备，是另一项目的，需要安排适当入口。出站与主动入站的区别 私有连接怎样让两台设备重新联系 下面是 虚构教学示范 ，用Tailscale这类私有覆盖网络说明。两台设备均属于你或已获明确许可，允许安装正式客户端，家中设备保持运行和联网。公司设备采用管理员指定方案，不自行加入个人网络。 这类工具可以把获准设备加入同一成员网络，提供成员名称或地址，并安排设备间的可用通信。数据仍通过各自现有互联网接入传送；可能直接联系，也可能由中继转送，不是物理上把两台电脑搬到同一家里。 你先建立成员连接，再在浏览器或文件客户端访问目标服务。工具提供的是联系设备的办法，照片应用继续负责展示照片和验证账号。官方开始步骤 第一步：建立成员身份 按官方流程在两台设备安装客户端，加入正确的账号或组织范围，完成必要批准。管理界面应能看到对应设备，设备端也应处于相应连接状态。 若只出现外出电脑，没有家中设备，先核对家中客户端是否登录同一范围、是否等待批准、设备是否联网。此时还不需要猜照片端口或开放公网，因为前一项成员条件尚未满足。 不要把“设备已经登记”和“设备当前可联系”当成一回事。设备休眠、断电或客户端退出后，登记记录可以还在，实际通信却无法完成。 第二步：确认目标服务 先在家中设备上检查照片服务。打开它的正式入口，确认程序正在运行，能正常显示自己的照片，并有适当的账号与文件权限。若本机都打不开，优先处理程序，私有连接不会替你启动它。 服务还必须接受来自获准网络的请求。程序若只在localhost接收，就只供本机访问，另一台成员设备也不能直接使用。应按照片程序官方说明设置合适的接收范围与防火墙规则，范围以任务需要为限。 “监听某地址和端口”就是程序在相应位置等请求；它与加入私有网络分属两项条件。见端口与监听。 第三步：从另一台设备访问 在外出电脑连接成员网络，采用工具提供的目标名称或地址，再按照片服务要求的访问方式和端口打开。目标服务回应后，按照片服务自身的账号登录，检查是否能取得一张有权查看的照片。 若设备不可联系，先看成员在线状态和连接规则；若设备在线而服务无响应，检查程序运行、接收范围和防火墙；若已到登录页却被拒，检查服务账号和权限。不要从任一种失败都退回“重新加一遍设备”。 工具的设备身份可以限制谁能联系；照片应用的账号可以限制谁能看哪些内容。两项控制可以一起存在，加入成员网络并不授予全部文件权限。 第四步：验证范围并恢复 两台设备都在家中测试成功，还没有覆盖真正的外出条件。应从实际要用的获准外部网络，再检查成员联系、服务响应和资料访问。这里只验证自己的资料，不操作其他成员未授权的文件。 完成以后，不再需要的成员资格、临时访问规则或连接可以按管理流程撤销，并检查相应访问停止。若撤销会影响其他获准用户，应先确认依赖关系。恢复的是本次安排，不是随意删除既有组织设置。 远程桌面、文件共享与网页，各给了什么能力 服务 外出设备实际取得什么 还需要满足什么 --- --- --- 照片或管理网页 浏览器取得页面、图片与操作结果 相应网页服务运行并接受请求 文件服务 列出或读写授权文件 文件服务账号与目录权限 远程桌面 取得另一设备的画面，并发送键盘鼠标操作 远程控制服务、登录与操作许可 它们可以运行在同一台设备，却可能采用不同端口和账号。能看网页不表示可以控制桌面，能远控也不表示所有共享目录开放。 这与“让上网从家里出去”有什么不同 普通私有成员连接，主要帮助联系家中设备。你随后访问购物站，仍可能直接经咖啡店或手机出口，不默认绕回家里。 如果另行选择家中设备作为公共上网出口，公共访问才会按相应规则先回家、再由家中联系目标；这还需要出口支持、批准和客户端选择。内部连接与出口节点 访问家中照片和使用家中上网出口，是两项不同任务。先说清目标，再在相应应用检查，才能避免用一次公网IP查询判断所有远程能力。配置与恢复见VPN配置，面向所有人发布网页则见公共部署。","outline":[{"id":"section-1","title":"在家能看照片，出门为什么换了条件","depth":2},{"id":"section-2","title":"私有连接怎样让两台设备重新联系","depth":2},{"id":"section-3","title":"第一步：建立成员身份","depth":2},{"id":"section-4","title":"第二步：确认目标服务","depth":2},{"id":"section-5","title":"第三步：从另一台设备访问","depth":2},{"id":"section-6","title":"第四步：验证范围并恢复","depth":2},{"id":"section-7","title":"远程桌面、文件共享与网页，各给了什么能力","depth":2},{"id":"section-8","title":"这与“让上网从家里出去”有什么不同","depth":2}]},{"id":"deploy","group":"scenes","title":"电脑里的网页，怎样让别人也能打开？","question":"电脑里的网页，怎样让别人也能打开？","summary":"别人能打开网页，需要网络能够连接服务器，程序正在运行，并且允许外部请求。","terms":["localhost","端口","防火墙","部署"],"aliases":["localhost","127.0.0.1 本机","端口","port socket 冒号 3000 8080 443","防火墙","","部署",""],"related":["ports","domains","remote","web"],"html":"\u003cp>你做好的网页在自己电脑上能看，发给朋友却打不开。\u003cstrong>别人需要拿到可用内容，或能够通过自己的网络联系一个持续提供内容的服务。\u003c/strong> 本地文件、电脑上的临时服务和公共网站，虽然可以显示相似画面，依赖的运行条件却不同。\u003c/p>\n\u003ch2 id=\"section-1\">先看你分享的到底是哪一种地址\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你这里怎样打开\u003c/th>\n\u003cth>发生了什么\u003c/th>\n\u003cth>朋友拿到后会怎样\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>双击HTML文件\u003c/td>\n\u003ctd>浏览器读取本机文件\u003c/td>\n\u003ctd>要取得相应文件及所需资源，才能在自己设备打开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>localhost加端口\u003c/td>\n\u003ctd>浏览器向本机正在运行的程序请求\u003c/td>\n\u003ctd>localhost仍指朋友自己的设备，不会找到你的电脑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>家庭内部IP加端口\u003c/td>\n\u003ctd>联系家庭网络中的服务\u003c/td>\n\u003ctd>在外地通常没有直接进入你家内部网络的路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式公共网址\u003c/td>\n\u003ctd>浏览器联系对外提供服务的入口\u003c/td>\n\u003ctd>入口、程序和权限正常时，对方才有机会访问\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>localhost的含义是“当前访问者自己这台设备”。你的localhost:3000是你的程序，朋友输入相同文字寻找的是朋友电脑的3000端口。地址写法一样，不代表指向同一台电脑。\u003c/p>\n\u003ch2 id=\"section-2\">只发一个HTML文件，什么时候就够了\u003c/h2>\n\u003cp>如果页面所需文字、图片和程序都已包含在文件里，或随同资源一起交付，朋友可以在自己设备阅读。此时不是你的电脑远程向他提供服务，而是他有了自己的文件副本。\u003c/p>\n\u003cp>但若页面按钮还要调用你电脑上的程序、查询服务器数据库或提交留言，只复制页面外观不够。朋友需要能够联系那些服务，服务也必须有运行环境和适当权限。\u003c/p>\n\u003cp>这份知识库的离线包把正文和图解嵌入单文件，适合本地阅读；它不意味着带账号和共享数据的业务系统都能用相同方式离线交付。是否能只发文件，取决于完整任务的依赖。\u003c/p>\n\u003ch2 id=\"section-3\">一个作品页发布出去，托管方接手哪些工作\u003c/h2>\n\u003cp>下面是\u003cstrong>虚构发布过程\u003c/strong>。小林做了一个只展示文字和图片的作品页，选择静态网页托管服务，按要求上传页面与资源。托管方保存文件，在持续运行的服务器上提供接收入口，并给出访问网址。\u003c/p>\n\u003cp>朋友打开这个网址，浏览器查到托管入口的地址，联系网页端口，在请求中说明主机名和文件路径。托管服务器找到对应文件并发回；朋友的浏览器再解释和显示。小林的电脑此时即使关机，托管方仍可继续提供已发布内容。\u003c/p>\n\u003cp>把文件放到适合的设备或平台上，使它按预期向用户提供服务，这些工作常称部署。静态页面主要需要提供文件；如果还要登录、保存留言或同步用户资料，就需要相应后端程序和数据存储，不能只上传按钮的外观。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">网页服务与中间设施\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-4\">自定义域名和HTTPS分别补上什么\u003c/h2>\n\u003cp>托管默认网址可用以后，小林可以按平台要求绑定自己的域名。名称记录帮助浏览器找到入口，托管平台还要知道该名称属于哪个站点；仅在DNS写一个IP，不一定完成网站绑定。\u003c/p>\n\u003cp>HTTPS则要求接收端提供适合该名称的保护连接。浏览器核对通过以后，双方才能按相应规则交换受保护内容。域名负责查找与站点选择，证书与HTTPS负责连接校验和保护，它们不负责替你运行留言程序。\u003c/p>\n\u003cp>若默认托管网址正常，自定义名称异常，就可以先比较名称记录、站点绑定与证书；若两个地址都显示页面但留言失败，应继续看留言服务。不要把所有发布问题都归为“域名还没生效”。\u003ca href=\"#/dns\">DNS\u003c/a>、\u003ca href=\"#/domains\">多站点名称\u003c/a>\u003c/p>\n\u003ch2 id=\"section-5\">有公网IP，为什么家中电脑仍不能给别人看\u003c/h2>\n\u003cp>公网地址只解决公共网络中的寻址用途。服务可能根本没启动，只接受本机连接，被防火墙限制，或请求在上游共享出口处没有相应入口。设备休眠、断电或程序关闭以后，也无法继续回答。\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">出站与入站安排\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>即使本机程序使用3000端口，公共网站也不一定把3000暴露给用户。网站可以用HTTPS默认443接收，再由入口把请求交给内部其他端口的程序。公网一侧与程序内部的入口编号可以不同。\u003c/p>\n\u003cp>因此，公开网页需要同时考虑程序运行、接收范围、网络可达与访问规则。对自有设备的有限远程访问，可以选择\u003ca href=\"#/remote\">私有连接\u003c/a>；面向公共读者的网页，也可以让托管服务承担持续接收和维护。方案取决于要给谁使用什么能力。\u003c/p>\n\u003ch2 id=\"section-6\">上线后，怎样确认别人真的能用\u003c/h2>\n\u003cp>从另一台设备或另一条获准网络打开预期公共网址，先看标题与图片，再完成产品允许的小任务。作品页检查页面和资源；有登录、留言的产品，还要分别确认相应服务的真实结果。不要用“按钮能点”代替“服务器保存成功”。\u003c/p>\n\u003cp>如果图片缺失，检查文件和引用；如果登录页能开而账号拒绝，核对业务配置；如果提交后超时，先到正式记录确认是否保存。完整访问与业务状态见\u003ca href=\"#/browsing\">网页加载\u003c/a>和\u003ca href=\"#/transactions\">提交结果\u003c/a>。\u003c/p>\n\u003cp>发布还意味着有人持续承担运行、数据保存、权限和更新。域名续用、托管服务和程序各有责任，知道谁负责哪一段，才能区分“我这里能打开”与“别人能持续完成任务”。\u003c/p>\n","text":"电脑里的网页，怎样让别人也能打开？ 你做好的网页在自己电脑上能看，发给朋友却打不开。 别人需要拿到可用内容，或能够通过自己的网络联系一个持续提供内容的服务。 本地文件、电脑上的临时服务和公共网站，虽然可以显示相似画面，依赖的运行条件却不同。 先看你分享的到底是哪一种地址 你这里怎样打开 发生了什么 朋友拿到后会怎样 --- --- --- 双击HTML文件 浏览器读取本机文件 要取得相应文件及所需资源，才能在自己设备打开 localhost加端口 浏览器向本机正在运行的程序请求 localhost仍指朋友自己的设备，不会找到你的电脑 家庭内部IP加端口 联系家庭网络中的服务 在外地通常没有直接进入你家内部网络的路径 正式公共网址 浏览器联系对外提供服务的入口 入口、程序和权限正常时，对方才有机会访问 localhost的含义是“当前访问者自己这台设备”。你的localhost:3000是你的程序，朋友输入相同文字寻找的是朋友电脑的3000端口。地址写法一样，不代表指向同一台电脑。 只发一个HTML文件，什么时候就够了 如果页面所需文字、图片和程序都已包含在文件里，或随同资源一起交付，朋友可以在自己设备阅读。此时不是你的电脑远程向他提供服务，而是他有了自己的文件副本。 但若页面按钮还要调用你电脑上的程序、查询服务器数据库或提交留言，只复制页面外观不够。朋友需要能够联系那些服务，服务也必须有运行环境和适当权限。 这份知识库的离线包把正文和图解嵌入单文件，适合本地阅读；它不意味着带账号和共享数据的业务系统都能用相同方式离线交付。是否能只发文件，取决于完整任务的依赖。 一个作品页发布出去，托管方接手哪些工作 下面是 虚构发布过程 。小林做了一个只展示文字和图片的作品页，选择静态网页托管服务，按要求上传页面与资源。托管方保存文件，在持续运行的服务器上提供接收入口，并给出访问网址。 朋友打开这个网址，浏览器查到托管入口的地址，联系网页端口，在请求中说明主机名和文件路径。托管服务器找到对应文件并发回；朋友的浏览器再解释和显示。小林的电脑此时即使关机，托管方仍可继续提供已发布内容。 把文件放到适合的设备或平台上，使它按预期向用户提供服务，这些工作常称部署。静态页面主要需要提供文件；如果还要登录、保存留言或同步用户资料，就需要相应后端程序和数据存储，不能只上传按钮的外观。网页服务与中间设施 自定义域名和HTTPS分别补上什么 托管默认网址可用以后，小林可以按平台要求绑定自己的域名。名称记录帮助浏览器找到入口，托管平台还要知道该名称属于哪个站点；仅在DNS写一个IP，不一定完成网站绑定。 HTTPS则要求接收端提供适合该名称的保护连接。浏览器核对通过以后，双方才能按相应规则交换受保护内容。域名负责查找与站点选择，证书与HTTPS负责连接校验和保护，它们不负责替你运行留言程序。 若默认托管网址正常，自定义名称异常，就可以先比较名称记录、站点绑定与证书；若两个地址都显示页面但留言失败，应继续看留言服务。不要把所有发布问题都归为“域名还没生效”。DNS、多站点名称 有公网IP，为什么家中电脑仍不能给别人看 公网地址只解决公共网络中的寻址用途。服务可能根本没启动，只接受本机连接，被防火墙限制，或请求在上游共享出口处没有相应入口。设备休眠、断电或程序关闭以后，也无法继续回答。出站与入站安排 即使本机程序使用3000端口，公共网站也不一定把3000暴露给用户。网站可以用HTTPS默认443接收，再由入口把请求交给内部其他端口的程序。公网一侧与程序内部的入口编号可以不同。 因此，公开网页需要同时考虑程序运行、接收范围、网络可达与访问规则。对自有设备的有限远程访问，可以选择私有连接；面向公共读者的网页，也可以让托管服务承担持续接收和维护。方案取决于要给谁使用什么能力。 上线后，怎样确认别人真的能用 从另一台设备或另一条获准网络打开预期公共网址，先看标题与图片，再完成产品允许的小任务。作品页检查页面和资源；有登录、留言的产品，还要分别确认相应服务的真实结果。不要用“按钮能点”代替“服务器保存成功”。 如果图片缺失，检查文件和引用；如果登录页能开而账号拒绝，核对业务配置；如果提交后超时，先到正式记录确认是否保存。完整访问与业务状态见网页加载和提交结果。 发布还意味着有人持续承担运行、数据保存、权限和更新。域名续用、托管服务和程序各有责任，知道谁负责哪一段，才能区分“我这里能打开”与“别人能持续完成任务”。","outline":[{"id":"section-1","title":"先看你分享的到底是哪一种地址","depth":2},{"id":"section-2","title":"只发一个HTML文件，什么时候就够了","depth":2},{"id":"section-3","title":"一个作品页发布出去，托管方接手哪些工作","depth":2},{"id":"section-4","title":"自定义域名和HTTPS分别补上什么","depth":2},{"id":"section-5","title":"有公网IP，为什么家中电脑仍不能给别人看","depth":2},{"id":"section-6","title":"上线后，怎样确认别人真的能用","depth":2}]},{"id":"glossary","group":"reference","title":"遇到陌生名词，来这里查一句解释","question":"遇到陌生名词，来这里查一句解释","summary":"索引将常见名称连接到唯一的正文解释。","terms":[],"aliases":[],"related":["world-map","signals","access","packets","ip"],"html":"\u003cp>索引供随时查找，不需要背。这里先回答名称在说什么；要理解为什么会出现某种结果，请沿最后一列进入完整过程。简短定义不能代替实际通信中的前后步骤。\u003c/p>\n\u003cp>看到家中网络设置，先查Wi-Fi、IP、网关；看到长链接，先查域名、端口、路径、参数；遇到验证码与换网后仍登录，先查会话、Cookie与风控。它们怎样在同一次访问里合作，可以从\u003ca href=\"#/url\">一条商品链接\u003c/a>和\u003ca href=\"#/browsing\">完整访问\u003c/a>读起。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>一句解释\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>互联网\u003c/td>\n\u003ctd>把许多网络互相连接起来，让不同网络中的设备可以交换信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/world-map\">从一次上网出发，建立完整的网络地图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通信\u003c/td>\n\u003ctd>按约定把信息从一端交给另一端。\u003c/td>\n\u003ctd>\u003ca href=\"#/world-map\">从一次上网出发，建立完整的网络地图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网络\u003c/td>\n\u003ctd>连接设备并按规则传递信息的系统。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网页\u003c/td>\n\u003ctd>浏览器解释和显示的内容及操作界面。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网站\u003c/td>\n\u003ctd>供人访问的一组网页，以及提供查询、登录等功能的程序。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>浏览器\u003c/td>\n\u003ctd>你用来打开网页的软件；它发出请求、读取网页内容，并显示文字、图片和按钮。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>URL\u003c/td>\n\u003ctd>网址的正式名称；它说明访问方式、网站名称，以及要查看的内容等信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网址\u003c/td>\n\u003ctd>用来指定要访问哪里的地址，例如一个商品页的链接。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查询参数\u003c/td>\n\u003ctd>网址问号后的信息，例如颜色、搜索词或页码；含义由网站规定。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>片段\u003c/td>\n\u003ctd>网址井号后的部分；浏览器可用它定位到页面某处，页面程序也可读取它。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编码\u003c/td>\n\u003ctd>按约定把文字、声音或画面记成数据，接收软件再按相应规则解释。\u003c/td>\n\u003ctd>\u003ca href=\"#/signals\">文字和声音，怎么进入电线与空气？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信号\u003c/td>\n\u003ctd>设备用来携带数据的物理变化，例如电、光或无线电的变化。\u003c/td>\n\u003ctd>\u003ca href=\"#/signals\">文字和声音，怎么进入电线与空气？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>光纤\u003c/td>\n\u003ctd>用光传递信息的线路。\u003c/td>\n\u003ctd>\u003ca href=\"#/signals\">文字和声音，怎么进入电线与空气？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wi-Fi\u003c/td>\n\u003ctd>用无线电联系附近设备的接入方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/access\">连上Wi-Fi，为什么不一定能上网？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>基站\u003c/td>\n\u003ctd>让附近移动设备接入移动网络的设施。\u003c/td>\n\u003ctd>\u003ca href=\"#/access\">连上Wi-Fi，为什么不一定能上网？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运营商\u003c/td>\n\u003ctd>提供接入并管理网络的组织。\u003c/td>\n\u003ctd>\u003ca href=\"#/access\">连上Wi-Fi，为什么不一定能上网？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据包\u003c/td>\n\u003ctd>传送数据时组织出的一小份信息，带有目的地址等转送需要的说明。\u003c/td>\n\u003ctd>\u003ca href=\"#/packets\">一张照片为什么要分成许多小份？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>协议\u003c/td>\n\u003ctd>通信双方组织和处理信息的约定。\u003c/td>\n\u003ctd>\u003ca href=\"#/packets\">一张照片为什么要分成许多小份？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP\u003c/td>\n\u003ctd>标明数据包来源和目的地的网络地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IPv4\u003c/td>\n\u003ctd>较早的一代IP地址与传送规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IPv6\u003c/td>\n\u003ctd>支持更大地址范围的一代IP规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内网IP\u003c/td>\n\u003ctd>在内部网络范围使用的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公网IP\u003c/td>\n\u003ctd>可在公共互联网中寻址的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口\u003c/td>\n\u003ctd>设备区分接收程序和通信连接所用的编号，例如网页服务接收请求的443。\u003c/td>\n\u003ctd>\u003ca href=\"#/ports\">知道IP后，为什么还要写端口？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>监听\u003c/td>\n\u003ctd>程序在指定地址和端口等待通信。\u003c/td>\n\u003ctd>\u003ca href=\"#/ports\">知道IP后，为什么还要写端口？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>默认端口\u003c/td>\n\u003ctd>网址没有写端口时，浏览器按访问方式采用的端口，例如HTTPS采用443。\u003c/td>\n\u003ctd>\u003ca href=\"#/ports\">知道IP后，为什么还要写端口？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NAT\u003c/td>\n\u003ctd>转送时转换地址，并记录对应关系，以便把回复送回原设备。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共享IP\u003c/td>\n\u003ctd>多台设备或多个人访问外部网站时，网站看到相同的来源IP。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动态IP\u003c/td>\n\u003ctd>随接入安排可能变化的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>静态IP\u003c/td>\n\u003ctd>按安排保持固定的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子域名\u003c/td>\n\u003ctd>位于另一个域名下面的名称，不等于网页目录。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>二级域名\u003c/td>\n\u003ctd>严格按点分层级时，指顶级名称下一层，例如example.com；日常也有人泛指子域名。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主域名\u003c/td>\n\u003ctd>日常对主要域名或可注册域名的叫法，需结合完整名称判断具体所指。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同源\u003c/td>\n\u003ctd>浏览器按访问方式、主机名和端口确定的相同来源，用于页面数据读取等安全判断。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>域名\u003c/td>\n\u003ctd>人便于记住的网络名称。\u003c/td>\n\u003ctd>\u003ca href=\"#/dns\">输入网址后，电脑怎么找到网站？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DNS\u003c/td>\n\u003ctd>按网站名称查询地址等记录的系统；取得地址后，浏览器还要另外请求网页。\u003c/td>\n\u003ctd>\u003ca href=\"#/dns\">输入网址后，电脑怎么找到网站？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由\u003c/td>\n\u003ctd>根据目的地址和现有规则，决定数据下一步交给谁继续转送。\u003c/td>\n\u003ctd>\u003ca href=\"#/routes\">经过那么多网络，谁决定往哪走？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由器\u003c/td>\n\u003ctd>在网络之间转送信息的设备。\u003c/td>\n\u003ctd>\u003ca href=\"#/routes\">经过那么多网络，谁决定往哪走？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网关\u003c/td>\n\u003ctd>帮助当前网络向其他网络转送信息的设备或系统，家里常由路由器承担。\u003c/td>\n\u003ctd>\u003ca href=\"#/routes\">经过那么多网络，谁决定往哪走？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TCP\u003c/td>\n\u003ctd>在数据可能缺失或乱序时，帮助两端恢复并向应用交付可靠、有序数据的规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UDP\u003c/td>\n\u003ctd>提供数据报传送的规则，本身不保证可靠有序；应用或其他协议可以另外补上恢复等能力。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重传\u003c/td>\n\u003ctd>依据反馈或等待情况再次送出缺失信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时\u003c/td>\n\u003ctd>等待超过设定范围仍未取得期望结果。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP\u003c/td>\n\u003ctd>网页请求与响应的组织规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务器\u003c/td>\n\u003ctd>提供服务的计算机与正在运行的程序。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求\u003c/td>\n\u003ctd>向服务说明希望取得或执行什么。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>响应\u003c/td>\n\u003ctd>服务器针对请求发回的内容或结果，例如页面、图片或错误说明。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CDN\u003c/td>\n\u003ctd>在不同地点安排内容与接收服务器，按规则提供已有副本或继续转送请求。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路径\u003c/td>\n\u003ctd>网址中主机名后以斜线开头的部分，例如/products/42；网站据此选择内容。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>参数\u003c/td>\n\u003ctd>请求附带的条件或输入，例如颜色或搜索词；不能凭它自动获得权限。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锚点\u003c/td>\n\u003ctd>常指用于浏览器定位资源内部位置的片段。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求正文\u003c/td>\n\u003ctd>请求目标以外携带的操作或提交内容。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重定向\u003c/td>\n\u003ctd>把浏览器引向另一个访问位置的安排。\u003c/td>\n\u003ctd>\u003ca href=\"#/browsing\">从点击商品链接到看到页面，完整经历了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面路由\u003c/td>\n\u003ctd>页面程序依据地址或状态选择显示内容的规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/browsing\">从点击商品链接到看到页面，完整经历了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTPS\u003c/td>\n\u003ctd>使用TLS保护的网页通信。\u003c/td>\n\u003ctd>\u003ca href=\"#/security\">信息经过别人，哪些内容能被看见？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加密\u003c/td>\n\u003ctd>通过密钥等安排限制内容的可读性。\u003c/td>\n\u003ctd>\u003ca href=\"#/security\">信息经过别人，哪些内容能被看见？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>证书\u003c/td>\n\u003ctd>帮助核对连接对象身份的数字资料。\u003c/td>\n\u003ctd>\u003ca href=\"#/security\">信息经过别人，哪些内容能被看见？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cookie\u003c/td>\n\u003ctd>浏览器按范围规则保存并随适用请求发送的数据，网站常用它携带会话标记。\u003c/td>\n\u003ctd>\u003ca href=\"#/identity\">换了IP，网站为什么还认得你？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>会话\u003c/td>\n\u003ctd>网站保存的一段访问状态，例如某个浏览器当前登录了哪个账号。\u003c/td>\n\u003ctd>\u003ca href=\"#/identity\">换了IP，网站为什么还认得你？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设备指纹\u003c/td>\n\u003ctd>从多项设备或浏览器特征关联访问的线索组合。\u003c/td>\n\u003ctd>\u003ca href=\"#/identity\">换了IP，网站为什么还认得你？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务状态\u003c/td>\n\u003ctd>应用保存的实际结果，例如订单已创建、付款待确认。\u003c/td>\n\u003ctd>\u003ca href=\"#/transactions\">点了登录、提交订单，什么才算真的成功？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口\u003c/td>\n\u003ctd>程序之间约定的请求和回复方式，例如页面怎样请求查询订单。\u003c/td>\n\u003ctd>\u003ca href=\"#/transactions\">点了登录、提交订单，什么才算真的成功？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>供程序使用的接口，例如网页程序向服务器查询库存的约定方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/transactions\">点了登录、提交订单，什么才算真的成功？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>存储转发\u003c/td>\n\u003ctd>服务器先保存内容，等接收设备可以联系时再传过去。\u003c/td>\n\u003ctd>\u003ca href=\"#/messages\">朋友不在线，消息怎么还能送达？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>推送\u003c/td>\n\u003ctd>通过服务主动向设备交付通知或数据。\u003c/td>\n\u003ctd>\u003ca href=\"#/messages\">朋友不在线，消息怎么还能送达？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已读\u003c/td>\n\u003ctd>应用报告的阅读状态，含义以产品为准。\u003c/td>\n\u003ctd>\u003ca href=\"#/messages\">朋友不在线，消息怎么还能送达？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓冲\u003c/td>\n\u003ctd>先暂存少量内容再播放，吸收到达时间变化；存得更多也可能使播放更晚。\u003c/td>\n\u003ctd>\u003ca href=\"#/live\">视频通话为什么比看视频更怕卡？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中继\u003c/td>\n\u003ctd>不能或不选择直连时负责继续转送的节点。\u003c/td>\n\u003ctd>\u003ca href=\"#/live\">视频通话为什么比看视频更怕卡？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实时通信\u003c/td>\n\u003ctd>一边发生一边交付，重视及时性的通信。\u003c/td>\n\u003ctd>\u003ca href=\"#/live\">视频通话为什么比看视频更怕卡？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>带宽\u003c/td>\n\u003ctd>连接单位时间可以承载的信息容量。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>延迟\u003c/td>\n\u003ctd>信息抵达或往返需要的等待时间。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>抖动\u003c/td>\n\u003ctd>到达时间的变化程度。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>丢包\u003c/td>\n\u003ctd>部分传送单位未成功抵达。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP信誉\u003c/td>\n\u003ctd>对某来源历史观察形成的风险线索。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>风控\u003c/td>\n\u003ctd>用多项证据判断是否验证、限制或复核。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机房IP\u003c/td>\n\u003ctd>通常归属于云或托管网络的来源标签。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>住宅IP\u003c/td>\n\u003ctd>通常归属于普通家庭接入网络的来源标签。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VPN\u003c/td>\n\u003ctd>通过现有网络建立受保护连接，让指定请求经另一端访问公司系统或外部网站。\u003c/td>\n\u003ctd>\u003ca href=\"#/vpn\">VPN究竟改变了哪一段通信？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>隧道\u003c/td>\n\u003ctd>把数据包在另一层通信里传送；VPN常用它保护到另一端的数据。\u003c/td>\n\u003ctd>\u003ca href=\"#/vpn\">VPN究竟改变了哪一段通信？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>出口节点\u003c/td>\n\u003ctd>替选定访问联系公共互联网的节点。\u003c/td>\n\u003ctd>\u003ca href=\"#/vpn\">VPN究竟改变了哪一段通信？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代理\u003c/td>\n\u003ctd>替某些请求联系目标服务的中间服务。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分流\u003c/td>\n\u003ctd>按规则决定不同访问走哪里。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全局模式\u003c/td>\n\u003ctd>工具尽量让更多请求经过指定路径的模式，具体影响哪些应用要看设置。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>节点\u003c/td>\n\u003ctd>在相应工具中提供连接或转送的端点。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VPN配置\u003c/td>\n\u003ctd>建立连接与安排访问范围所需的设置。\u003c/td>\n\u003ctd>\u003ca href=\"#/setup\">怎样配置VPN，并确认它真的生效？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连接验证\u003c/td>\n\u003ctd>按原目标观察连接后实际可用的结果。\u003c/td>\n\u003ctd>\u003ca href=\"#/setup\">怎样配置VPN，并确认它真的生效？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>排障\u003c/td>\n\u003ctd>用证据与对照缩小故障范围。\u003c/td>\n\u003ctd>\u003ca href=\"#/troubleshoot\">连不上、打不开，怎样判断卡在哪一段？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>热点\u003c/td>\n\u003ctd>让附近设备先连手机等设备，再借用其联网能力访问外部网络，可能消耗移动流量。\u003c/td>\n\u003ctd>\u003ca href=\"#/access\">连上Wi-Fi，为什么不一定能上网？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>远程访问\u003c/td>\n\u003ctd>从另一个位置联系获准设备上的服务。\u003c/td>\n\u003ctd>\u003ca href=\"#/remote\">人在外面，怎样访问家里或公司的设备？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内网\u003c/td>\n\u003ctd>在组织或自有范围内安排访问的网络。\u003c/td>\n\u003ctd>\u003ca href=\"#/remote\">人在外面，怎样访问家里或公司的设备？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>localhost\u003c/td>\n\u003ctd>指向访问者自己设备的本机名称。\u003c/td>\n\u003ctd>\u003ca href=\"#/deploy\">电脑里的网页，怎样让别人也能打开？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>防火墙\u003c/td>\n\u003ctd>按规则允许或阻止网络访问的机制。\u003c/td>\n\u003ctd>\u003ca href=\"#/deploy\">电脑里的网页，怎样让别人也能打开？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部署\u003c/td>\n\u003ctd>把网页文件或程序放到合适的设备上，让程序运行并让用户能够访问。\u003c/td>\n\u003ctd>\u003ca href=\"#/deploy\">电脑里的网页，怎样让别人也能打开？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>","text":"遇到陌生名词，来这里查一句解释 索引供随时查找，不需要背。这里先回答名称在说什么；要理解为什么会出现某种结果，请沿最后一列进入完整过程。简短定义不能代替实际通信中的前后步骤。 看到家中网络设置，先查Wi-Fi、IP、网关；看到长链接，先查域名、端口、路径、参数；遇到验证码与换网后仍登录，先查会话、Cookie与风控。它们怎样在同一次访问里合作，可以从一条商品链接和完整访问读起。 名称 一句解释 继续阅读 --- --- --- 互联网 把许多网络互相连接起来，让不同网络中的设备可以交换信息。 从一次上网出发，建立完整的网络地图 通信 按约定把信息从一端交给另一端。 从一次上网出发，建立完整的网络地图 网络 连接设备并按规则传递信息的系统。 网络、互联网、网页和软件，分别是什么？ 网页 浏览器解释和显示的内容及操作界面。 网络、互联网、网页和软件，分别是什么？ 网站 供人访问的一组网页，以及提供查询、登录等功能的程序。 网络、互联网、网页和软件，分别是什么？ 浏览器 你用来打开网页的软件；它发出请求、读取网页内容，并显示文字、图片和按钮。 网络、互联网、网页和软件，分别是什么？ URL 网址的正式名称；它说明访问方式、网站名称，以及要查看的内容等信息。 一条网址里的域名、端口和参数，各有什么用？ 网址 用来指定要访问哪里的地址，例如一个商品页的链接。 一条网址里的域名、端口和参数，各有什么用？ 查询参数 网 es":[],"related":[],"html":"\u003cp>正文用日常语言说明通信过程；需要核对原理时，可以查下面的一手资料。图解与故事是教学示意，虚构案例不代表任何产品的真实内部设计或实际结果。基础资料最初于2026年10月7日核对；2026年10月15日补充核对了网页、登录、VPN设置及示例地址等相关说明。产品菜单与能力仍以链接中的当前正式文档为准。\u003c/p>\n\u003ch2 id=\"section-1\">阅读资料按用途查找\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work\" target=\"_blank\" rel=\"noopener noreferrer\">网络的网络\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持互联网把不同网络相互连接；网页是使用这种连接的服务。 本文简化基础设施；实际光纤、移动与卫星路径不全相同。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.cisco.com/site/us/en/learn/topics/networking/what-is-a-wi-fi-network.html\" target=\"_blank\" rel=\"noopener noreferrer\">近处的无线接入\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持Wi-Fi通过无线电在附近设备间传递信息。 无线连接成功并不证明上游互联网可用。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">网络寻址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持IP根据源地址与目的地址传送数据报，不提供端到端可靠送达保证。 IPv4历史规范，仅借其寻址与尽力交付概念；不宣称全部现代实现细节。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享地址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持多个设备或用户共享一个公网IPv4地址，因此仅凭IP判断是否同一人或限制访问，可能把多人一起算进去。 共享地址不能单独确定自然人；IPv6不必采用相同共享方式。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc1034.html\" target=\"_blank\" rel=\"noopener noreferrer\">名称与查询\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持分布式名称系统提供名称到资源记录的查询，并允许缓存。 名称查询和网页内容传输不同；更新受缓存寿命影响。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">有序传输\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持TCP为应用提供可靠有序的字节流，并用确认和重传处理丢失。 接收端取得数据，不等于网站保存了订单，也不等于朋友读了消息。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">网页请求\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持网页由客户端发出请求、服务端返回响应，常涉及多项资源与中间服务。 请求不只一种协议版本；页面显示不等于全部业务完成。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security\" target=\"_blank\" rel=\"noopener noreferrer\">传输保护\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持TLS保护通信内容并支持认证连接对端。 不证明网站经营者可信，也不使地址和所有元数据隐形。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies\" target=\"_blank\" rel=\"noopener noreferrer\">识别一次访问\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持浏览器可保存并在后续请求发送Cookie，网站可用它关联会话。 同一账号可跨IP，清Cookie不删除服务器账号记录。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API/Connectivity\" target=\"_blank\" rel=\"noopener noreferrer\">实时连接\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持实时通信需要协调候选路径，直接连接不可用时可采用中继。 视频通话不必总经过业务服务器，也不必总是点对点。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321.html\" target=\"_blank\" rel=\"noopener noreferrer\">异步送达\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持邮件可由服务器接收、存储和继续转发，接收确认不等于人已读。 用邮件支撑存储转发模型，不断言所有聊天产品内部相同。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.apple.com/documentation/usernotifications/setting-up-a-remote-notification-server\" target=\"_blank\" rel=\"noopener noreferrer\">通知入口\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持应用服务可经APNs向设备发送通知，由设备系统处理并交给应用。 通知和完整消息取用是不同工作；平台实现不同。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9111.html\" target=\"_blank\" rel=\"noopener noreferrer\">重复取用\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持缓存能复用已存响应，但需要按新鲜度与验证规则使用。 副本可能过期；个性化或敏感内容不能随意共享缓存。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">上网出口\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持普通覆盖网络只连接成员设备；选择出口节点才把公共上网流量经那个出口送出。 不是所有VPN连接都会改变全部应用的公网出口。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Mac配置入口\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持Mac可导入提供的VPN配置，或按提供者要求在网络设置手动建立连接。 专用客户端与内置VPN支持不完全相同，菜单因系统版本变化。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-geolocation-risk-data-maxmind\" target=\"_blank\" rel=\"noopener noreferrer\">地区线索\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持IP地理数据是有误差的区域估计，代理出口可能与实际用户位置不同。 不能定位个人家庭或用一次地区跳变证明账号被盗。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-anonymizer-risk-data-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">代理来源识别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持风控产品可以识别部分已知VPN或其他代理地址；合法隐私用途也存在。 识别不是全知，也不能把使用VPN等同作弊。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/device-inputs-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">多线索风险判断\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持风险判断可同时接收公网IP、浏览器和会话资料；读取到错误中间节点IP会影响判断。 厂商公开输入不代表任何特定平台完整规则。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developers.cloudflare.com/waf/rate-limiting-rules/parameters/\" target=\"_blank\" rel=\"noopener noreferrer\">按来源计数\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持按IP计数会聚合共享出口的请求，可以结合会话等特征降低识别歧义。 Cookie缺失也会形成合并计数；不提供通用安全阈值。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">出站与入站\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持NAT网关可允许内部实例访问外部，同时不允许外部主动建立连接到内部实例。 云端公开服务还需要路由、接收入口、权限和运行服务。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8200.html\" target=\"_blank\" rel=\"noopener noreferrer\">IPv6中的接口与地址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持地址关联接口的解释，未展开协议字段。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://tailscale.com/docs/how-to/quickstart\" target=\"_blank\" rel=\"noopener noreferrer\">Tailscale开始步骤\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持自有设备加入私有连接的示范，实际资格与设备结果需本人核对。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-2\">正文怎样处理不确定性\u003c/h2>\n\u003cp>基础协议只支持所解释的共同机制，不代表每种当前设备的全部参数。厂商文档说明厂商公开的能力，不证明其他平台使用相同风控规则。名称、模式和菜单可能随版本变化；实际配置以提供者说明为准。\u003c/p>\n\u003cp>IP地区是估计，网络与账号限制需要多条证据。没有统一的“纯净IP”信任保证，也没有完全匿名的VPN承诺。\u003c/p>\n\u003ch2 id=\"section-3\">网址与浏览器行为参考资料\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_URL\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：网址结构\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://www.rfc-editor.org/rfc/rfc3986.html\" target=\"_blank\" rel=\"noopener noreferrer\">URI语法\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：组件和相对引用。资源、参数的业务含义仍由具体应用决定。\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP语义\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：访问方式、主机与协议状态；不把协议回答等同业务成功。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：域名层级\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://publicsuffix.org/learn/\" target=\"_blank\" rel=\"noopener noreferrer\">公用后缀\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：名称树和可注册边界。同一父域名下的子域名，不保证使用同一服务器或同一登录系统。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Glossary/Origin\" target=\"_blank\" rel=\"noopener noreferrer\">浏览器来源定义\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>、\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy\" target=\"_blank\" rel=\"noopener noreferrer\">同源规则\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies\" target=\"_blank\" rel=\"noopener noreferrer\">Cookie\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：不同来源、安全边界和会话发送范围。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/URI/Reference/Fragment\" target=\"_blank\" rel=\"noopener noreferrer\">片段\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>、\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections\" target=\"_blank\" rel=\"noopener noreferrer\">跳转\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Host\" target=\"_blank\" rel=\"noopener noreferrer\">主机信息\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：浏览器定位、继续访问和多站点入口。\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9000.html\" target=\"_blank\" rel=\"noopener noreferrer\">QUIC规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：只用来解释UDP之上仍可安排恢复和保护，没有把旧TCP简化顺序说成所有网页唯一实现。\u003c/li>\n\u003c/ul>\n\u003cp>所有商品站、编号、订单状态与小林经历均为虚构教学场景。它们帮助把规范与日常现象连接，不是特定平台实测；参数名也不是可复制到任意网站的操作命令。\u003c/p>\n\u003ch2 id=\"section-4\">家庭场景与示例地址补充\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://support.apple.com/guide/mac-help/add-and-manage-printers-mh14004/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Apple：添加和管理打印机\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：帮助理解发现、添加和使用网络打印机；正文先限定为同一家庭可互访范围中的本地打印，云打印可能另依赖外部服务。\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5737.html\" target=\"_blank\" rel=\"noopener noreferrer\">文档用IPv4地址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：正文的198.51.100.40、203.0.113.10属于保留示例范围，不是可以实际访问的公共服务。\u003c/li>\n\u003c/ul>\n\u003cp>核对一条资料时，可以先看它支持哪一步：DNS资料解释查名称，HTTP资料解释请求与响应，Cookie资料解释保存和发送标记。它们分别支持机制，不替任何真实平台的具体故障下结论；教学场景中的先后结果也不是用户实测报告。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Formats/Audio_concepts\" target=\"_blank\" rel=\"noopener noreferrer\">数字音频怎样记录声音\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持采集、数字表示与音频压缩的解释，不把语音文件等同于原先那道声波。\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc2131.html\" target=\"_blank\" rel=\"noopener noreferrer\">自动地址分配\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持网络按安排为设备提供地址与配置的说明；不要求读者掌握字段，也不声称所有IPv6地址都由同一方式产生。\u003c/li>\n\u003c/ul>\n","text":"想核对原理，去哪里看？ 正文用日常语言说明通信过程；需要核对原理时，可以查下面的一手资料。图解与故事是教学示意，虚构案例不代表任何产品的真实内部设计或实际结果。基础资料最初于2026年10月7日核对；2026年10月15日补充核对了网页、登录、VPN设置及示例地址等相关说明。产品菜单与能力仍以链接中的当前正式文档为准。 阅读资料按用途查找 - 网络的网络：支持互联网把不同网络相互连接；网页是使用这种连接的服务。 本文简化基础设施；实际光纤、移动与卫星路径不全相同。 - 近处的无线接入：支持Wi-Fi通过无线电在附近设备间传递信息。 无线连接成功并不证明上游互联网可用。 - 网络寻址：支持IP根据源地址与目的地址传送数据报，不提供端到端可靠送达保证。 IPv4历史规范，仅借其寻址与尽力交付概念；不宣称全部现代实现细节。 - 共享地址：支持多个设备或用户共享一个公网IPv4地址，因此仅凭IP判断是否同一人或限制访问，可能把多人一起算进去。 共享地址不能单独确定自然人；IPv6不必采用相同共享方式。 - 名称与查询：支持分布式名称系统提供名称到资源记录的查询，并允许缓存。 名称查询和网页内容传输不同；更新受缓存寿命影响。 - 有序传输：支持TCP为应用提供可靠有序的字节流，并用确认和重传处理丢失。 接收端取得数据，不等于网站保存了订单，也不等于朋友读了消息。 - 网页请求：支持网页由客户端发出请求、服务端返回响应，常涉及多项资源与中间服务。 请求不只一种协议版本；页面显示不等于全部业务完成。 - 传输保护：支持TLS保护通信内容并支持认证连接对端。 不证明网站经营者可信，也不使地址和所有元数据隐形。 - 识别一次访问：支持浏览器可保存并在后续请求发送Cookie，网站可用它关联会话。 同一账号可跨IP，清Cookie不删除服务器账号记录。 - 实时连接：支持实时通信需要协调候选路径，直接连接不可用时可采用中继。 视频通话不必总经过业务服务器，也不必总是点对点。 - 异步送达：支持邮件可由服务器接收、存储和继续转发，接收确认不等于人已读。 用邮件支撑存储转发模型，不断言所有聊天产品内部相同。 - 通知入口：支持应用服务可经APNs向设备发送通知，由设备系统处理并交给应用。 通知和完整消息取用是不同工作；平台实现不同。 - 重复取用：支持缓存能复用已存响应，但需要按新鲜度与验证规则使用。 副本可能过期；个性化或敏感内容不能随意共享缓存。 - 上网出口：支持普通覆盖网络只连接成员设备；选择出口节点才把公共上网流量经那个出口送出。 不是所有VPN连接都会改变全部应用的公网出口。 - Mac配置入口：支持Mac可导入提供的VPN配置，或按提供者要求在网络设置手动建立连接。 专用客户端与内置VPN支持不完全相同，菜单因系统版本变化。 - 地区线索：支持IP地理数据是有误差的区域估计，代理出口可能与实际用户位置不同。 不能定位个人家庭或用一次地区跳变证明账号被盗。 - 代理来源识别：支持风控产品可以识别部分已知VPN或其他代理地址；合法隐私用途也存在。 识别不是全知，也不能把使用VPN等同作弊。 - 多线索风险判断：支持风险判断可同时接收公网IP、浏览器和会话资料；读取到错误中间节点IP会影响判断。 厂商公开输入不代表任何特定平台完整规则。 - 按来源计数：支持按IP计数会聚合共享出口的请求，可以结合会话等特征降低识别歧义。 Cookie缺失也会形成合并计数；不提供通用安全阈值。 - 出站与入站：支持NAT网关可允许内部实例访问外部，同时不允许外部主动建立连接到内部实例。 云端公开服务还需要路由、接收入口、权限和运行服务。 - IPv6中的接口与地址：支持地址关联接口的解释，未展开协议字段。 - Tailscale开始步骤：支持自有设备加入私有连接的示范，实际资格与设备结果需本人核对。 正文怎样处理不确定性 基础协议只支持所解释的共同机制，不代表每种当前设备的全部参数。厂商文档说明厂商公开的能力，不证明其他平台使用相同风控规则。名称、模式和菜单可能随版本变化；实际配置以提供者说明为准。 IP地区是估计，网络与账号限制需要多条证据。没有统一的“纯净IP”信任保证，也没有完全匿名的VPN承诺。 网址与浏览器行为参考资料 - MDN：网址结构与URI语法：组件和相对引用。资源、参数的业务含义仍由具体应用决定。 - HTTP语义：访问方式、主机与协议状态；不把协议回答等同业务成功。 - MDN：域名层级与公用后缀：名称树和可注册边界。同一父域名下的子域名，不保证使用同一服务器或同一登录系统。 - 浏览器来源定义、同源规则与Cookie：不同来源、安全边界和会话发送范围。 - 片段、跳转与主机信息：浏览器定位、继续访问和多站点入口。 - QUIC规范：只用来解释UDP之上仍可安排恢复和保护，没有把旧TCP简化顺序说成所有网页唯一实现。 所有商品站、编号、订单状态与小林经历均为虚构教学场景。它们帮助把规范与日常现象连接，不是特定平台实测；参数名也不是可复制到任意网站的操作命令。 家庭场景与示例地址补充 - Apple：添加和管理打印机：帮助理解发现、添加和使用网络打印机；正文先限定为同一家庭可互访范围中的本地打印，云打印可能另依赖外部服务。 - 文档用IPv4地址：正文的198.51.100.40、203.0.113.10属于保留示例范围，不是可以实际访问的公共服务。 核对一条资料时，可以先看它支持哪一步：DNS资料解释查名称，HTTP资料解释请求与响应，Cookie资料解释保存和发送标记。它们分别支持机制，不替任何真实平台的具体故障下结论；教学场景中的先后结果也不是用户实测报告。 - 数字音频怎样记录声音：支持采集、数字表示与音频压缩的解释，不把语音文件等同于原先那道声波。 - 自动地址分配：支持网络按安排为设备提供地址与配置的说明；不要求读者掌握字段，也不声称所有IPv6地址都由同一方式产生。","outline":[{"id":"section-1","title":"阅读资料按用途查找","depth":2},{"id":"section-2","title":"正文怎样处理不确定性","depth":2},{"id":"section-3","title":"网址与浏览器行为参考资料","depth":2},{"id":"section-4","title":"家庭场景与示例地址补充","depth":2}]}]}</script>
<script id="analytics-config" type="application/json">{"hostname":"zhongky1995.github.io","basePath":"/network-world-model/","project":"network-world-model","measurementId":"G-7KD14XQGPE"}</script>
<script>(() => {
  'use strict';
  let config = {};
  try { config = JSON.parse(document.getElementById('analytics-config').textContent); } catch {}
  const enabled = /^G-[A-Z0-9]+$/.test(config.measurementId || '') &&
    typeof config.basePath === 'string' && config.basePath.startsWith('/') &&
    location.protocol === 'https:' && location.hostname === config.hostname &&
    location.pathname.startsWith(config.basePath) && navigator.doNotTrack !== '1' &&
    navigator.globalPrivacyControl !== true;
  let ready = false, failed = false, view = null, lastUrl = null;
  const queue = [];
  // Strip query strings and fragments before sending traffic sources.
  let referrer = '';
  try {
    const source = new URL(document.referrer);
    if (/^https?:$/.test(source.protocol)) referrer = source.origin + source.pathname;
  } catch {}

  function send(payload) {
    if (!enabled || failed) return;
    if (!ready) {
      if (queue.length < 30) queue.push(payload);
      return;
    }
    try {
      const page = {
        page_location: 'https://' + config.hostname + payload.url,
        page_title: payload.title,
        page_referrer: payload.referrer
      };
      if (!payload.name) {
        // Keep automatic engagement attached to the current virtual article.
        window.gtag('config', config.measurementId, { ...page, send_page_view: false });
      }
      window.gtag('event', payload.name ? payload.name.replace(/-/g, '_') : 'page_view', {
        ...page, project: config.project, ...payload.data, send_to: config.measurementId
      });
    } catch {} // A blocked tracker must never interrupt reading or navigation.
  }

  window.readerAnalytics = {
    page(article, title) {
      const url = config.basePath + article;
      if (url === lastUrl) return;
      view = { url, title, referrer: lastUrl ? 'https://' + config.hostname + lastUrl : referrer };
      lastUrl = url;
      send({ ...view });
    },
    event(name, properties = {}) {
      if (!view) return;
      send({ ...view, name, data: { ...properties } });
    }
  };

  if (!enabled) return;

<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('knowledge-data').textContent),pages=data.pages,byId=new Map(pages.map(p=>[p.id,p])),groupById=new Map(data.groups.map(g=>[g.id,g]));
const main=document.getElementById('main'),nav=document.getElementById('navigation'),side=document.getElementById('sidebar'),dialog=document.getElementById('search-dialog'),input=document.getElementById('search-input'),results=document.getElementById('search-results');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=p=>p.title.split('：')[0],groupName=p=>groupById.get(p.group)?.name||(p.group==='orientation'?'整体地图':'概念与资料');
const store={get(key,fallback){try{return JSON.parse(localStorage.getItem('nwm.'+key))??fallback}catch{return fallback}},set(key,value){try{localStorage.setItem('nwm.'+key,JSON.stringify(value))}catch{}}};
const analytics=window.readerAnalytics;
let current='home',resumeTarget=null,scrollTimer=null,searchTimer=null,lastTrigger=null,restoring=false,menuPosition=0;
let fontSize=store.get('font',17);fontSize=Number.isFinite(fontSize)?Math.min(21,Math.max(15,fontSize)):17;
document.documentElement.style.setProperty('--article-size',fontSize+'px');
nav.innerHTML=`<a class="nav-home" href="#/home">知识地图</a><a class="nav-home" href="#/world-map">先看整张地图</a>`+data.groups.map((g,i)=>`<section class="nav-group"><h2><span class="mono">${String(i+1).padStart(2,'0')}</span>${esc(g.name)}</h2>${pages.filter(p=>p.group===g.id).map(p=>`<a href="#/${p.id}">${esc(short(p))}</a>`).join('')}</section>`).join('')+`<section class="nav-group"><h2>概念与资料</h2><a class="nav-reference" href="#/glossary">概念索引</a><a class="nav-reference" href="#/sources">阅读资料与知识边界</a></section>`;
function closeMenu(){const wasOpen=side.classList.contains('open');side.classList.remove('open');document.getElementById('backdrop').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');document.body.style.overflow='';if(innerWidth<=850){side.inert=true;side.setAttribute('aria-hidden','true')}if(wasOpen)scrollTo(0,menuPosition)}
function openMenu(){menuPosition=scrollY;savePosition();side.inert=false;side.removeAttribute('aria-hidden');side.classList.add('open');document.getElementById('backdrop').classList.add('open');document.getElementById('menu-button').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';document.getElementById('menu-close').focus({preventScroll:true})}
function sizeMenu(){if(innerWidth>850){side.inert=false;side.removeAttribute('aria-hidden');closeMenu()}else if(!side.classList.contains('open')){side.inert=true;side.setAttribute('aria-hidden','true')}}
sizeMenu();addEventListener('resize',sizeMenu);
document.getElementById('menu-button').addEventListener('click',openMenu);
document.getElementById('menu-close').addEventListener('click',()=>{closeMenu();document.getElementById('menu-button').focus()});
document.getElementById('backdrop').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch(e.target)}
 if(e.key==='Escape'&&side.classList.contains('open')){closeMenu();document.getElementById('menu-button').focus()}
 if(e.key==='Tab'&&side.classList.contains('open')){const items=[...side.querySelectorAll('a,button')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
function savePosition(){if(byId.has(current)&&!dialog.open&&!restoring&&!side.classList.contains('open')){const positions=store.get('positions',{});positions[current]=scrollY;store.set('positions',positions);store.set('last',current)}}
function authorCredit(){return `<footer class="author-credit" aria-label="作者与联系方式"><span>作者：钟坤颖</span><span>联系方式：<a href="mailto:zhongky1995@gmail.com">zhongky1995@gmail.com</a></span></footer>`;}
function home(){const last=byId.get(store.get('last',''));
 return `<div class="home"><section class="hero"><p class="eyebrow mono">A map for understanding networks</p><h1>网络世界模型</h1><p class="lead">点开链接、登录、换网络，<br>看清背后连起来的过程。</p><p class="sub">为第一次理解网络的人写。从打开一个网页开始，看浏览器怎样找网站、发请求、收回复，再理解登录、风控和VPN。</p><div class="hero-actions"><a class="primary" href="#/world-map">从这里开始 <span aria-hidden="true">↗</span></a><a class="secondary" href="#/glossary">按名词查找 <span aria-hidden="true">→</span></a></div>${last?`<a class="resume" href="#/${last.id}" data-resume>继续上次阅读：${esc(short(last))}<span aria-hidden="true">→</span></a>`:''}</section><section class="story-path" aria-label="连续阅读主线"><h2>先把一次上网串起来</h2><p>从点开链接到看到结果，看浏览器、网络和网站各做了什么。可以按顺序读，也可以直接进入。</p><div><a href="#/url">① 读网址</a><span aria-hidden="true">→</span><a href="#/ports">② 找服务</a><span aria-hidden="true">→</span><a href="#/browsing">③ 取页面</a><span aria-hidden="true">→</span><a href="#/transactions">④ 做操作</a><span aria-hidden="true">→</span><a href="#/identity">⑤ 认身份</a><span aria-hidden="true">→</span><a href="#/vpn">⑥ 改路径</a></div></section><section class="scene-shortcuts" aria-label="常用场景"><p>从你的问题出发</p><div><a href="#/url">读懂一条网址</a><a href="#/ports">IP与端口</a><a href="#/domains">域名与页面</a><a href="#/ip">IP是什么？</a><a href="#/setup">配置VPN</a><a href="#/risk">验证码与风控</a><a href="#/troubleshoot">打不开怎么办？</a><a href="#/remote">访问远程设备</a></div></section><div class="section-title"><h2>六段相互连接的工作</h2><p>完整目录，也可以随时跳读</p></div><div class="atlas">${data.groups.map((g,i)=>`<section class="map-card"><div class="map-card-head"><span class="map-number mono">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(g.name)}</h3><p class="map-question">${esc(g.question)}</p></div></div><div class="entries">${pages.filter(p=>p.group===g.id).map(p=>`<a href="#/${p.id}"><span>${esc(short(p))}</span><span aria-hidden="true">↗</span></a>`).join('')}</div></section>`).join('')}</div><p class="home-note">自由阅读，无需打卡或完成练习。阅读位置保存在本机。<br>在线使用 Google Analytics 统计浏览与搜索操作，用于改进内容；不上传搜索词。<br><a href="#/sources">阅读资料与知识边界</a></p>${authorCredit()}</div>`;
}
function article(p){const core=pages.filter(x=>x.group!=='reference'),i=core.findIndex(x=>x.id===p.id),prev=core[i-1],next=core[i+1];
return `<div class="reader"><article class="article" data-article="${p.id}"><header class="article-head"><p class="eyebrow">${esc(groupName(p))}</p><h1>${esc(p.title)}</h1></header><div class="article-body">${p.html}</div><section class="related"><h2>沿着关系继续读</h2><div class="related-links">${p.related.map(id=>byId.get(id)).filter(Boolean).map(x=>`<a href="#/${x.id}">${esc(short(x))}<span aria-hidden="true">→</span></a>`).join('')}</div></section><nav class="reader-footer" aria-label="建议阅读次序">${prev?`<a href="#/${prev.id}">← ${esc(short(prev))}</a>`:'<a href="#/home">← 回到知识地图</a>'}${next?`<a href="#/${next.id}">${esc(short(next))} →</a>`:'<a href="#/home">回到知识地图 →</a>'}</nav><p class="article-note">这些概念帮助理解系统；具体实现需要结合对应文档与运行证据。</p>${authorCredit()}</article><aside class="outline" aria-label="文章大纲"><h2>本篇内容</h2>${p.outline.filter(x=>x.title!=='相关概念').map(x=>`<a href="#/${p.id}" data-section="${x.id}">${esc(x.title)}</a>`).join('')}<a href="#/home" style="margin-top:26px">← 返回地图</a></aside></div>`;
}
function render(){clearTimeout(searchTimer);clearTimeout(scrollTimer);savePosition();restoring=true;closeMenu();let id='home';try{id=decodeURIComponent(location.hash.replace(/^#\//,'')||'home')}catch{}current=byId.has(id)?id:'home';const p=byId.get(current);
 main.innerHTML=p?article(p):home();document.title=p?short(p)+' · 网络世界模型':'网络世界模型';document.getElementById('breadcrumb').textContent=p?'知识地图 / '+groupName(p):'知识地图';
 nav.querySelectorAll('a').forEach(a=>a.getAttribute('href')===`#/${current}`?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 analytics.page(current,p?.title||data.title);
 const target=resumeTarget===current?store.get('positions',{})[current]||0:0;resumeTarget=null;requestAnimationFrame(()=>{scrollTo(0,target);main.focus({preventScroll:true});restoring=false});if(p)store.set('last',p.id);
}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;
 if(a.dataset.section){e.preventDefault();document.getElementById(a.dataset.section)?.scrollIntoView({block:'start'});return}
 if(a.hasAttribute('data-resume')){resumeTarget=a.hash.slice(2);analytics.event('resume-reading',{article:resumeTarget})}
 if(a.closest('#search-results')&&a.hash.startsWith('#/'))analytics.event('search-result-click',{article:a.hash.slice(2)});
 if(a.hostname==='github.com')analytics.event('github-click');
 if(a.hash.startsWith('#/')){if(dialog.open)dialog.close();if(a.hash===location.hash){closeMenu();if(a.hasAttribute('data-resume'))scrollTo(0,store.get('positions',{})[current]||0);else scrollTo(0,0)}}
});
addEventListener('hashchange',render);addEventListener('beforeunload',savePosition);
addEventListener('scroll',()=>{document.getElementById('top-button').style.display=scrollY>600?'block':'none';clearTimeout(scrollTimer);scrollTimer=setTimeout(savePosition,180)},{passive:true});
document.getElementById('top-button').addEventListener('click',()=>scrollTo(0,0));
document.getElementById('font-smaller').addEventListener('click',()=>{fontSize=Math.max(15,fontSize-1);document.documentElement.style.setProperty('--article-size',fontSize+'px');store.set('font',fontSize)});
document.getElementById('font-larger').addEventListener('click',()=>{fontSize=Math.min(21,fontSize+1);document.documentElement.style.setProperty('--article-size',fontSize+'px');store.set('font',fontSize)});
document.getElementById('print-button').addEventListener('click',()=>{analytics.event('print',{article:current});window.print()});
function openSearch(trigger){lastTrigger=trigger;closeMenu();if(!dialog.open){dialog.showModal();analytics.event('search-open',{article:current})}input.focus();search()}
document.querySelectorAll('[data-search]').forEach(b=>b.addEventListener('click',()=>openSearch(b)));
document.getElementById('search-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{if(lastTrigger&&!lastTrigger.closest('[inert]'))lastTrigger.focus()});
dialog.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();dialog.close()}});
dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
function highlight(text,q){if(!q)return esc(text);const i=text.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function search(){clearTimeout(searchTimer);const q=input.value.trim(),lower=q.toLowerCase();
 if(!q){document.getElementById('search-status').textContent=`搜索全部 ${pages.length} 篇内容、概念索引与英文别名`;results.innerHTML='<div class="empty">试试：端口、子域名、网址参数、验证码、VPN…<br>也可以输入正文里的问题或关键词。</div>';return}
 const found=pages.map(p=>{const title=p.title.toLowerCase(),alias=p.aliases.join(' ').toLowerCase(),body=p.text.toLowerCase();return {p,score:(title.includes(lower)?20:0)+(alias.includes(lower)?10:0)+(body.includes(lower)?1:0)}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||pages.indexOf(a.p)-pages.indexOf(b.p));
 document.getElementById('search-status').textContent=`全库搜索 · 找到 ${found.length} 篇相关内容`;
 searchTimer=setTimeout(()=>analytics.event('search',{query_length:q.length,result_count:found.length}),800);
 results.innerHTML=found.length?found.map(({p})=>{const i=p.text.toLowerCase().indexOf(lower);let snippet=p.text.slice(Math.max(0,i-35),Math.max(0,i-35)+145);return `<a class="result" href="#/${p.id}"><small>${esc(groupName(p))}</small><strong>${highlight(p.title,q)}</strong><p>${highlight(snippet,q)}${snippet.length>=145?'…':''}</p></a>`}).join(''):'<div class="empty">没有找到相关内容。可以缩短关键词，或使用概念的中文名。<br><a href="#/glossary" style="text-decoration:underline">打开概念索引 →</a></div>';
}
input.addEventListener('input',search);render();
})();
</script>
