<script id="knowledge-data" type="application/json">{"title":"网络世界模型","groups":[{"id":"connection","name":"先看全局，再连起来","question":"设备、网络与应用怎样分工？"},{"id":"address","name":"读懂地址，找到服务","question":"网址、域名、IP和端口各管什么？"},{"id":"services","name":"一次访问，怎样成为结果","question":"页面、消息、订单和通话如何连续工作？"},{"id":"trust","name":"保护、识别与风控","question":"谁能看见，谁在判断你？"},{"id":"vpn","name":"换一条路径：VPN与代理","question":"连接成功后，哪些访问真的改变了？"},{"id":"scenes","name":"把生活中的问题串起来","question":"排障、远程和发布如何回到完整流程？"}],"pages":[{"id":"world-map","group":"orientation","title":"从一次上网出发，建立完整的网络地图","question":"一次上网里，各环节怎样连接？","summary":"用点链接、登录、提交、换网和VPN串起整个网络世界。","terms":["互联网","通信"],"aliases":["互联网","","通信",""],"related":["boundaries","url","browsing","transactions","setup"],"html":"\u003cp>你点开朋友发来的商品链接，看到图片，登录账号，下单。出门后从家里的Wi-Fi切到手机流量，账号还在；到了公司，某个内部网页只有连VPN才能打开。\u003cstrong>打开网页、登录账号、切换网络和连接VPN，会影响这次上网的不同步骤。把这些步骤连起来，才能解释为什么某个功能能用，另一个却不能用。\u003c/strong>\u003c/p>\n\u003cp>这份知识库从你的动作出发，把过程展开。你不需要背设置参数。先看浏览器怎样请求页面、网络怎样把请求送到网站、网站怎样查资料并回复，再看切换网络或登录账号会改变什么。\u003c/p>\n\u003ch2 id=\"section-1\">先跟着一段日常经历走\u003c/h2>\n\u003cp>下面以一个\u003cstrong>虚构的购物网站\u003c/strong>为例，网址、商品编号与结果仅用于教学。它代表常见网页工作方式，不是某个平台的内部实现说明。\u003c/p>\n\u003cp>朋友发来 \u003ccode>https://shop.example.com/products/42?color=blue#reviews\u003c/code>。你看到的是一整串文字，浏览器却会把它拆开：按HTTPS方式访问shop.example.com这个网站，请求42号商品的蓝色款，收到页面后滚动到评价区。HTTPS的作用是保护浏览器与网站之间传送的内容。拆分过程见\u003ca href=\"#/url\">读懂一条网址\u003c/a>。\u003c/p>\n\u003cp>然后你的电脑必须能联系外面。电脑先通过Wi-Fi连接家里的路由器，路由器再把请求转送到运营商的网络。无线信号满格表示电脑收到的Wi-Fi信号强，不能证明网站已经回应；手机热点则换了一条接入路径。见\u003ca href=\"#/access\">Wi-Fi与手机网络\u003c/a>。\u003c/p>\n\u003cp>浏览器通过DNS查询网站的IP地址，再联系网站接收网页请求的端口。IP帮助沿途设备把信息送到目标；端口帮助目标设备把收到的信息交给相应程序。名字和地址并不一一对应。见\u003ca href=\"#/ip\">IP\u003c/a>、\u003ca href=\"#/ports\">端口\u003c/a>、\u003ca href=\"#/dns\">域名与名称查询\u003c/a>。\u003c/p>\n\u003cp>沿途许多设备接力转送小份信息。它们通常不理解你要买哪种颜色，而是按网络地址转发。你的浏览器与服务还要处理丢失、保护传输内容，才能交换完整的网页请求和回答。见\u003ca href=\"#/packets\">分包\u003c/a>、\u003ca href=\"#/routes\">路由\u003c/a>、\u003ca href=\"#/delivery\">交付\u003c/a>。\u003c/p>\n\u003cp>网站接收请求后，才解释“42号商品、蓝色”。网站发回页面的文字、结构说明等内容，浏览器继续下载图片，并按页面的排版要求显示出来。此时出现商品页面，登录和下单还没有自动完成。\u003ca href=\"#/browsing\">完整访问过程\u003c/a>会把这几段放在一起看。\u003c/p>\n\u003cp>登录成功后，网站给浏览器一个登录标记，用来识别后续请求来自哪个账号。你点下单时，浏览器另发请求，提交商品等信息。网站核对账号权限、库存等条件，创建订单后再发回结果。手机切换网络后IP可能变化，浏览器保存的登录标记仍可让网站找到同一个账号。见\u003ca href=\"#/identity\">网站怎样认得你\u003c/a>、\u003ca href=\"#/transactions\">操作何时完成\u003c/a>。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTI1IiB2aWV3Qm94PSIwIDAgNDIwIDUyNSI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjUiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPuS4gOadoeiuv+mXru+8jOe7j+i/h+iuuOWkmuautei/nuaOpTwvdGV4dD48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSg4Niw4OCkiPjxyZWN0IHg9Ii0yNCIgeT0iLTM1IiB3aWR0aD0iNDgiIGhlaWdodD0iNzAiIHJ4PSI5IiBmaWxsPSIjZTJlY2UyIiBzdHJva2U9IiMyNzY2NTUiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9Ii0xNiIgeT0iLTIyIiB3aWR0aD0iMzIiIGhlaWdodD0iNDAiIHJ4PSIzIiBmaWxsPSIjZmZmZWZhIi8+PHBhdGggZD0iTS03IDI2SDciIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9nPjx0ZXh0IHg9Ijg2IiB5PSIxNTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPuS9oOeahOiuvuWkhzwvdGV4dD48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgyOTYsODgpIj48cmVjdCB4PSItMzYiIHk9Ii0xMCIgd2lkdGg9IjcyIiBoZWlnaHQ9IjI0IiByeD0iNSIgZmlsbD0iI2UwZWFkYiIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNLTIyIC0xMEwtMjggLTM3TTIyIC0xMEwyOCAtMzciIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIzIi8+PGNpcmNsZSBjeD0iLTE1IiBje td>\n\u003ctd>浏览器与应用\u003c/td>\n\u003ctd>页面已经出现，图片或某个按钮却失效\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>一次上网要经过这些步骤。遇到“网页打不开”，先分清是完全收不到网站回复，还是网站回复了“请登录”或“没有权限”；不能一概归为网速，也不能一看登录失败就认为IP被封。\u003ca href=\"#/boundaries\">网络与软件的关系\u003c/a>专门解释这些界限。\u003c/p>\n\u003ch2 id=\"section-3\">为什么换网络、换VPN会改变结果\u003c/h2>\n\u003cp>换Wi-Fi或手机流量，主要改变你接入外面的路径及可能的出口地址；网址里的商品编号并不会随之改变。平台可能根据来源变化要求验证，但那是平台判断，不是IP自动控制账号。\u003c/p>\n\u003cp>VPN让指定的访问先传到VPN服务器，再由那里联系目标。它可能只让你进公司内网，也可能更换公共上网出口。不能从“已连接”推断所有软件都改了出口，更不能推断登录记录消失。\u003ca href=\"#/vpn\">VPN\u003c/a>、\u003ca href=\"#/setup\">配置与验证\u003c/a>把两种目的完整展开。\u003c/p>\n\u003cp>这里有三个可以同时成立的结果：商品页能打开，公司报销页打不开；VPN连接后报销页打开，普通上网IP没变；你换了公网IP，商品网站依然认得账号。公司VPN可能只转送内部系统的访问，购物网站仍通过浏览器保存的登录标记识别账号。因此这三个结果可以同时出现。\u003c/p>\n\u003ch2 id=\"section-4\">可以怎么读这份地图\u003c/h2>\n\u003cp>想先建立整体框架，可以从\u003ca href=\"#/boundaries\">浏览器、网络和网站的关系\u003c/a>读到\u003ca href=\"#/url\">网址拆分\u003c/a>，再沿“接入→地址→访问→业务→身份→改路径”展开。各篇末尾都有接回整条过程的线索。\u003c/p>\n\u003cp>最贴近日常网址的短路线是：\u003ca href=\"#/url\">网址整体\u003c/a> → \u003ca href=\"#/ip\">IP\u003c/a> → \u003ca href=\"#/ports\">端口\u003c/a> → \u003ca href=\"#/domains\">域名层级\u003c/a> → \u003ca href=\"#/url-pages\">路径与参数\u003c/a> → \u003ca href=\"#/browsing\">一次完整网页访问\u003c/a>。你可以跳读，目录始终完整可见。\u003c/p>\n\u003cp>如果眼前就有具体问题，从\u003ca href=\"#/troubleshoot\">访问失败\u003c/a>、\u003ca href=\"#/risk\">验证码与风控\u003c/a>、\u003ca href=\"#/setup\">VPN配置\u003c/a>、\u003ca href=\"#/remote\">远程访问\u003c/a>或\u003ca href=\"#/deploy\">分享自己的网页\u003c/a>进入，再回看对应机制。无需提交练习，也没有完成率。\u003c/p>\n\u003cp>随着阅读，你要逐渐能描述的是：“我做了什么，信息经过哪里，哪个服务作出判断，结果怎么回来。”这比单独记住每个名称更能帮你理解下一次遇到的新场景。\u003c/p>\n","text":"从一次上网出发，建立完整的网络地图 你点开朋友发来的商品链接，看到图片，登录账号，下单。出门后从家里的Wi-Fi切到手机流量，账号还在；到了公司，某个内部网页只有连VPN才能打开。 打开网页、登录账号、切换网络和连接VPN，会影响这次上网的不同步骤。把这些步骤连起来，才能解释为什么某个功能能用，另一个却不能用。 这份知识库从你的动作出发，把过程展开。你不需要背设置参数。先看浏览器怎样请求页面、网络怎样把请求送到网站、网站怎样查资料并回复，再看切换网络或登录账号会改变什么。 先跟着一段日常经历走 下面以一个 虚构的购物网站 为例，网址、商品编号与结果仅用于教学。它代表常见网页工作方式，不是某个平台的内部实现说明。 朋友发来 https://shop.example.com/products/42?color=blue reviews 。你看到的是一整串文字，浏览器却会把它拆开：按HTTPS方式访问shop.example.com这个网站，请求42号商品的蓝色款，收到页面后滚动到评价区。HTTPS的作用是保护浏览器与网站之间传送的内容。拆分过程见读懂一条网址。 然后你的电脑必须能联系外面。电脑先通过Wi-Fi连接家里的路由器，路由器再把请求转送到运营商的网络。无线信号满格表示电脑收到的Wi-Fi信号强，不能证明网站已经回应；手机热点则换了一条接入路径。见Wi-Fi与手机网络。 浏览器通过DNS查询网站的IP地址，再联系网站接收网页请求的端口。IP帮助沿途设备把信息送到目标；端口帮助目标设备把收到的信息交给相应程序。名字和地址并不一一对应。见IP、端口、域名与名称查询。 沿途许多设备接力转送小份信息。它们通常不理解你要买哪种颜色，而是按网络地址转发。你的浏览器与服务还要处理丢失、保护传输内容，才能交换完整的网页请求和回答。见分包、路由、交付。 网站接收请求后，才解释“42号商品、蓝色”。网站发回页面的文字、结构说明等内容，浏览器继续下载图片，并按页面的排版要求显示出来。此时出现商品页面，登录和下单还没有自动完成。完整访问过程会把这几段放在一起看。 登录成功后，网站给浏览器一个登录标记，用来识别后续请求来自哪个账号。你点下单时，浏览器另发请求，提交商品等信息。网站核对账号权限、库存等条件，创建订单后再发回结果。手机切换网络后IP可能变化，浏览器保存的登录标记仍可让网站找到同一个账号。见网站怎样认得你、操作何时完成。 设备经附近入口、相互连接的网络到达服务；回复也需要网络路径。 图示是常见访问旅程的简化，不包含所有通信安排；不同应用可以采用不同连接和服务组织。 把六个问题放回自己的位置 你想问的事 哪一段在负责 生活中会见到的现象 --- --- --- 设备有没有接上外面？ 电脑连接路由器，路由器连接外部网络 有Wi-Fi却无法上网；换热点后可用 信息往哪里送？ 名称查询、IP和路由 名称查不到；换网访问结果不同 接收设备的哪个服务回答？ 目标设备按端口把通信交给程序 IP一样，不同端口可能联系不同服务 想取哪个页面、提交什么？ 浏览器在请求中写明路径、参数等信息 路径、参数变化；页面按钮发起新操作 你是否有权、事情是否办成？ 网站核对账号并处理订单等操作 需要登录；订单失败；触发额外验证 屏幕显示成什么？ 浏览器与应用 页面已经出现，图片或某个按钮却失效 一次上网要经过这些步骤。遇到“网页打不开”，先分清是完全收不到网站回复，还是网站回复了“请登录”或“没有权限”；不能一概归为网速，也不能一看登录失败就认为IP被封。网络与软件的关系专门解释这些界限。 为什么换网络、换VPN会改变结果 换Wi-Fi或手机流量，主要改变你接入外面的路径及可能的出口地址；网址里的商品编号并不会随之改变。平台可能根据来源变化要求验证，但那是平台判断，不是IP自动控制账号。 VPN让指定的访问先传到VPN服务器，再由那里联系目标。它可能只让你进公司内网，也可能更换公共上网出口。不能从“已连接”推断所有软件都改了出口，更不能推断登录记录消失。VPN、配置与验证把两种目的完整展开。 这里有三个可以同时成立的结果：商品页能打开，公司报销页打不开；VPN连接后报销页打开，普通上网IP没变；你换了公网IP，商品网站依然认得账号。公司VPN可能只转送内部系统的访问，购物网站仍通过浏览器保存的登录标记识别账号。因此这三个结果可以同时出现。 可以怎么读这份地图 想先建立整体框架，可以从浏览器、网络和网站的关系读到网址拆分，再沿“接入→地址→访问→业务→身份→改路径”展开。各篇末尾都有接回整条过程的线索。 最贴近日常网址的短路线是：网址整体 → IP → 端口 → 域名层级 → 路径与参数 → 一次完整网页访问。你可以跳读，目录始终完整可见。 如果眼前就有具体问题，从访问失败、验证码与风控、VPN配置、远程访问或分享自己的网页进入，再回看对应机制。无需提交练习，也没有完成率。 随着阅读，你要逐渐能描述的是：“我做了什么，信息经过哪里，哪个服务作出判断，结果怎么回来。”这比单独记住每个名称更能帮你理解下一次遇到的新场景。","outline":[{"id":"section-1","title":"先跟着一段日常经历走","depth":2},{"id":"section-2","title":"把六个问题放回自己的位置","depth":2},{"id":"section-3","title":"为什么换网络、换VPN会改变结果","depth":2},{"id":"section-4","title":"可以怎么读这份地图","depth":2}]},{"id":"boundaries","group":"connection","title":"网络、互联网、网页和软件，分别是什么？","question":"网络、互联网、网页和软件，分别是什么？","summary":"从浏览器发请求、网络转送，到网站核对账号并回复，看清打开网页需要哪些部分。","terms":["网络","网页","网站","浏览器"],"aliases":["网络","","网页","","网站","","浏览器",""],"related":[],"html":"\u003cp>打开一个网页，要靠你电脑上的浏览器、连接两端的网络，以及网站的服务器一起工作。\u003cstrong>浏览器发出请求，网络把请求送到网站；网站处理后回复，浏览器再把收到的内容显示出来。\u003c/strong>\u003c/p>\n\u003cp>浏览器是软件，网站服务器上也运行着软件。网络则把这些设备连起来，让它们能够交换信息。你日常说的“上网”，就是在使用这几部分共同完成的功能。\u003c/p>\n\u003ch2 id=\"section-1\">先分出身边的东西与远处的服务\u003c/h2>\n\u003cp>你在手机或电脑上打开浏览器，输入网址。浏览器会查找网站的地址、请求页面，收到文字、图片和程序后，把它们显示成网页。聊天软件、网盘和会议软件也需要收发信息，只是你使用它们时，不一定经过浏览器。\u003c/p>\n\u003cp>这些请求通常先经过家里的路由器，或手机连接的移动网络，再由运营商和其他网络继续转送。网站的服务器收到请求后，才会查找商品、消息、账号或文件，把你要的结果发回来。\u003c/p>\n\u003cp>几个名称可以这样区分：\u003cstrong>浏览器是你用来打开网页的软件；网页是浏览器显示的内容；网站是向你提供这些页面和功能的一组服务；互联网把世界各地的网络连接起来。\u003c/strong> 因此，你用聊天软件收消息时，也可以使用互联网，却没有打开网页。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MjAgNjUwIiByb2xlPSJpbWciPjx0aXRsZT7mtY/op4jlmajjgIHnvZHnu5zlkoznvZHnq5nmgI7moLflrozmiJDkuIDmrKHorr/pl648L3RpdGxlPjxkZWZzPjxtYXJrZXIgaWQ9ImEiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjYiIHJlZlk9IjMiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEw2IDNMMCA2IiBmaWxsPSJub25lIiBzdHJva2U9IiM0Mjc2NjQiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI2NTAiIGZpbGw9IiNmYWY4ZjIiLz48c3R5bGU+dGV4dHtmb250LWZhbWlseTpQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZjtmaWxsOiMyOTRkNDA7Zm9udC1zaXplOjE1cHh9LnNtYWxse2ZvbnQtc2l6ZToxMnB4O2ZpbGw6IzY2NzQ2N30ubGluZXtmaWxsOm5vbmU7c3Ryb2tlOiM0Mjc2NjQ7c3Ryb2tlLXdpZHRoOjI7bWFya2VyLWVuZDp1cmwoI2EpfTwvc3R5bGU+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjIxIiBmb250LXdlaWdodD0iNjAwIj7miZPlvIDnvZHpobXml7bvvIzkuInpg6jliIbkuIDotbflt6XkvZw8L3RleHQ+PHJlY3QgeD0iNDgiIHk9Ijc0IiB3aWR0aD0iMzI0IiBoZWlnaHQ9IjEzMCIgcng9IjE0IiBmaWxsPSIjZGZlOWRmIiBzdHJva2U9IiM2ZDkyN2UiLz48cmVjdCB4PSI2MSIgeT0iODgiIHdpZH 单，并附上当前登录所需的标记。\u003c/li>\n\u003cli>你的设备通过Wi-Fi或手机网络，把请求送到网站的服务器。\u003c/li>\n\u003cli>网站核对登录标记，确认这笔订单是否属于你的账号。如果你有权查看，网站就查出订单状态。\u003c/li>\n\u003cli>网站把结果发回你的设备，浏览器将它显示成订单页面。\u003c/li>\n\u003c/ol>\n\u003cp>这几步分别解决不同问题：网络负责把请求和回复送过去；网站负责确认你能不能查看、应该返回什么；浏览器负责让你看见结果。\u003c/p>\n\u003cp>如果网站没有收到请求，你可能一直等不到页面。如果网站收到了，却发现你还没登录，它可能要求你先登录。两种情况都可能让你“看不到订单”，但需要处理的原因不同。\u003c/p>\n\u003cp>页面已经显示出来，也不代表后面的操作都能成功。有时浏览器保留着之前下载的页面，点击“查看订单”时才重新联系网站；这次联系失败，旧页面仍然可以留在屏幕上。\u003c/p>\n\u003ch2 id=\"section-3\">你日常碰到的名称，分别在回答什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>在一次访问中做什么\u003c/th>\n\u003cth>日常会遇到的例子\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Wi-Fi、手机流量\u003c/td>\n\u003ctd>让设备接入网络\u003c/td>\n\u003ctd>换成手机热点后，网页又能打开了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP地址\u003c/td>\n\u003ctd>告诉网络把信息送到哪里\u003c/td>\n\u003ctd>电脑、路由器和网站都有各自使用的地址\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由\u003c/td>\n\u003ctd>决定信息下一步往哪里送\u003c/td>\n\u003ctd>请求经过多个网络，逐段到达网站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口\u003c/td>\n\u003ctd>帮接收设备区分要联系哪个程序\u003c/td>\n\u003ctd>同一IP后写8080或9000，可能联系不同程序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>域名、DNS\u003c/td>\n\u003ctd>用网站名字查找可以联系的地址\u003c/td>\n\u003ctd>输入网站名称，浏览器先查地址，再联系网站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网址的路径和参数\u003c/td>\n\u003ctd>告诉网站要什么内容、带什么条件\u003c/td>\n\u003ctd>商品编号、搜索词、页码、颜色选项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP请求和响应\u003c/td>\n\u003ctd>按双方约定的格式，发送需求和结果\u003c/td>\n\u003ctd>浏览器请求商品资料，网站回复商品资料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号、会话\u003c/td>\n\u003ctd>帮网站确认这次操作属于哪个账号\u003c/td>\n\u003ctd>你登录后，网站能接着显示“我的订单”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>浏览器、页面程序\u003c/td>\n\u003ctd>显示内容，处理点击，并按需要继续请求数据\u003c/td>\n\u003ctd>点“查看运费”后，页面才向网站查询运费\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>这些名称不一定只参与一步。例如域名先用于查地址，后面还可用于区分网站、核对连接对象。因此，理解它们时，最好看它们在这次访问中做了什么，而不是只给它们贴上“网络”或“软件”的标签。\u003c/p>\n\u003ch2 id=\"section-4\">为什么“网络没问题”听起来有时不准确\u003c/h2>\n\u003cp>朋友说“我这里能打开新闻，所以网络没问题”，说明他能联系到那家新闻网站。你的订单系统可能在另一个地址，公司内部网页也可能需要VPN；能打开新闻，不能证明这些访问也都正常。\u003c/p>\n\u003cp>如果网站已经显示“请重新登录”，说明你至少收到了一条回复。此时应先按网站提示核对登录状态；反复重连Wi-Fi，通常不能替你完成账号验证。\u003c/p>\n\u003cp>如果网页文字正常、图片不出，文字和图片可能来自不同服务器，也可能是浏览器没有正确显示图片。排查时应说清楚“文字能显示，图片加载失败”，这样才能分别检查图片的下载和显示过程。\u003c/p>\n\u003ch2 id=\"section-5\">把这张地图用在下一次遇到的新东西上\u003c/h2>\n\u003cp>以后看到陌生名称，先把它放回具体操作。例如：你点了哪个链接，浏览器准备联系哪里，网站收到后处理什么，最后屏幕上出现了什么？找到它参与的步骤，再读定义会容易得多。\u003c/p>\n\u003cp>\u003ca href=\"#/url\">网址\u003c/a>解释一条链接怎样指定访问内容；\u003ca href=\"#/ip\">IP\u003c/a>和\u003ca href=\"#/ports\">端口\u003c/a>解释请求怎样找到接收它的设备和程序；\u003ca href=\"#/browsing\">完整访问\u003c/a>把这些步骤连起来；\u003ca href=\"#/transactions\">业务完成\u003c/a>解释为什么点了“提交”，事情还不一定办成。\u003c/p>\n\u003cp>互联网与网页的基础关系，可核对\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work\" target=\"_blank\" rel=\"noopener noreferrer\">MDN互联网说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"网络、互联网、网页和软件，分别是什么？ 打开一个网页，要靠你电脑上的浏览器、连接两端的网络，以及网站的服务器一起工作。 浏览器发出请求，网络把请求送到网站；网站处理后回复，浏览器再把收到的内容显示出来。 浏览器是软件，网站服务器上也运行着软件。网络则把这些设备连起来，让它们能够交换信息。你日常说的“上网”，就是在使用这几部分共同完成的功能。 先分出身边的东西与远处的服务 你在手机或电脑上打开浏览器，输入网址。浏览器会查找网站的地址、请求页面，收到文字、图片和程序后，把它们显示成网页。聊天软件、网盘和会议软件也需要收发信息，只是你使用它们时，不一定经过浏览器。 这些请求通常先经过家里的路由器，或手机连接的移动网络，再由运营商和其他网络继续转送。网站的服务器收到请求后，才会查找商品、消息、账号或文件，把你要的结果发回来。 几个名称可以这样区分： 浏览器是你用来打开网页的软件；网页是浏览器显示的内容；网站是向你提供这些页面和功能的一组服务；互联网把世界各地的网络连接起来。 因此，你用聊天软件收消息时，也可以使用互联网，却没有打开网页。 浏览器向网站发出请求，网络负责转送；网站处理请求并发回结果，浏览器显示收到的内容。 用一件事看清职责 下面用一个 虚构购物网站 说明。你已经登录，点开“我的订单”，想查看一笔订单的状态。 1. 浏览器向网站发送请求，告诉它你想查看订单，并附上当前登录所需的标记。 2. 你的设备通过Wi-Fi或手机网络，把请求送到网站的服务器。 3. 网站核对登录标记，确认这笔订单是否属于你的账号。如果你有权查看，网站就查出订单状态。 4. 网站把结果发回你的设备，浏览器将它显示成订单页面。 这几步分别解决不同问题：网络负责把请求和回复送过去；网站负责确认你能不能查看、应该返回什么；浏览器负责让你看见结果。 如果网站没有收到请求，你可能一直等不到页面。如果网站收到了，却发现你还没登录，它可能要求你先登录。两种情况都可能让你“看不到订单”，但需要处理的原因不同。 页面已经显示出来，也不代表后面的操作都能成功。有时浏览器保留着之前下载的页面，点击“查看订单”时才重新联系网站；这次联系失败，旧页面仍然可以留在屏幕上。 你日常碰到的名称，分别在回答什么 名称 在一次访问中做什么 日常会遇到的例子 --- --- --- Wi-Fi、手机流量 让设备接入网络 换成手机热点后，网页又能打开了 IP地址 告诉网络把信息送到哪里 电脑、路由器和网站都有各自使用的地址 路由 决定信息下一步往哪里送 请求经过多个网络，逐段到达网站 端口 帮接收设备区分要联系哪个程序 同一IP后写8080或9000，可能联系不同程序 域名、DNS 用网站名字查找可以联系的地址 输入网站名称，浏览器先查地址，再联系网站 网址的路径和参数 告诉网站要什么内容、带什么条件 商品编号、搜索词、页码、颜色选项 HTTP请求和响应 按双方约定的格式，发送需求和结果 浏览器请求商品资料，网站回复商品资料 账号、会话 帮网站确认这次操作属于哪个账号 你登录后，网站能接着显示“我的订单” 浏览器、页面程序 显示内容，处理点击，并按需要继续请求数据 点“查看运费”后，页面才向网站查询运费 这些名称不一定只参与一步。例如域名先用于查地址，后面还可用于区分网站、核对连接对象。因此，理解它们时，最好看它们在这次访问中做了什么，而不是只给它们贴上“网络”或“软件”的标签。 为什么“网络没问题”听起来有时不准确 朋友说“我这里能打开新闻，所以网络没问题”，说明他能联系到那家新闻网站。你的订单系统可能在另一个地址，公司内部网页也可能需要VPN；能打开新闻，不能证明这些访问也都正常。 如果网站已经显示“请重新登录”，说明你至少收到了一条回复。此时应先按网站提示核对登录状态；反复重连Wi-Fi，通常不能替你完成账号验证。 如果网页文字正常、图片不出，文字和图片可能来自不同服务器，也可能是浏览器没有正确显示图片。排查时应说清楚“文字能显示，图片加载失败”，这样才能分别检查图片的下载和显示过程。 把这张地图用在下一次遇到的新东西上 以后看到陌生名称，先把它放回具体操作。例如：你点了哪个链接，浏览器准备联系哪里，网站收到后处理什么，最后屏幕上出现了什么？找到它参与的步骤，再读定义会容易得多。 网址解释一条链接怎样指定访问内容；IP和端口解释请求怎样找到接收它的设备和程序；完整访问把这些步骤连起来；业务完成解释为什么点了“提交”，事情还不一定办成。 互联网与网页的基础关系，可核对MDN互联网说明。","outline":[{"id":"section-1","title":"先分出身边的东西与远处的服务","depth":2},{"id":"section-2","title":"用一件事看清职责","depth":2},{"id":"section-3","title":"你日常碰到的名称，分别在回答什么","depth":2},{"id":"section-4","title":"为什么“网络没问题”听起来有时不准确","depth":2},{"id":"section-5","title":"把这张地图用在下一次遇到的新东西上","depth":2}]},{"id":"url","group":"address","title":"一条网址里的域名、端口和参数，各有什么用？","question":"一条网址里的域名、端口和参数，各有什么用？","summary":"用一条商品链接看网站名称、端口、路径、问号和井号分别有什么用。","terms":["URL","网址","查询参数","片段"],"aliases":["URL","URI url address 网址 斜线 问号 井号","网址","","查询参数","query parameter querystring utm 参数","片段","fragment hash 锚点 井号"],"related":["boundaries"],"html":"\u003cp>朋友发来一个链接，点击后就打开商品的蓝色款，还跳到了评价区。浏览器从链接中读出网站名称、商品编号、颜色选项，以及评价区的位置。\u003cstrong>一条网址既说明去哪个网站，也可以说明要看什么内容。\u003c/strong>\u003c/p>\n\u003cp>日常所说的网址，常叫URL。先以这个\u003cstrong>虚构教学链接\u003c/strong>为例：\u003ccode>https://shop.example.com:8443/products/42?color=blue#reviews\u003c/code>。实际购物网站未必使用这样的字段或端口；这里把平常会省略的部分也写出来，方便看清分工。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" ion>\u003c/figure>\n\u003ch2 id=\"section-1\">浏览器先拆开，再分别使用\u003c/h2>\n\u003cp>开头的 \u003ccode>https://\u003c/code> 告诉浏览器按受保护的网页通信方式访问。它影响建立什么连接、怎样保护交换内容，不是网站公司名称。\u003c/p>\n\u003cp>\u003ccode>shop.example.com\u003c/code> 是主机名。浏览器通常先查询这个名称对应的IP地址，再尝试连接网站。这里的shop是子域名，详细层级见\u003ca href=\"#/domains\">域名\u003c/a>。主机也能直接写IP，不过实际网站可能还需要正确域名才能匹配证书与站点。\u003c/p>\n\u003cp>\u003ccode>:8443\u003c/code> 指定服务端口，也就是浏览器要联系的端口编号；网站程序需要在这个端口接收请求。普通HTTPS网址没写端口时，使用默认的443；省略数字是采用约定，并不是没有端口。不能给普通链接任意补一个数字，服务必须在那里接收。见\u003ca href=\"#/ports\">IP与端口\u003c/a>。\u003c/p>\n\u003cp>\u003ccode>/products/42\u003c/code> 是路径，告诉网站你要哪个资源。资源可以是商品页面，也可以是图片或供程序读取的数据；它不必是服务器硬盘上的同名文件夹。\u003c/p>\n\u003cp>\u003ccode>?color=blue\u003c/code> 是查询部分，给访问附上条件。在这家虚构网站，color表示颜色、blue表示蓝色。别的网站可能采用完全不同的含义；通用网络规则不负责解释“蓝色”。多个常见条件会用 \u003ccode>&amp;\u003c/code> 分隔，例如 \u003ccode>?color=blue&amp;size=m\u003c/code>。\u003c/p>\n\u003cp>\u003ccode>#reviews\u003c/code> 是片段。普通HTTP请求不会直接把这段作为请求目标送给服务；浏览器可以用它滚动到评价区，网页程序也可以拿它选择显示内容或另发请求。因此“片段不直接发送”不等于“网站永远无法知道它”。\u003c/p>\n\u003ch2 id=\"section-2\">如果只改变一段，通常发生什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变化\u003c/th>\n\u003cth>在虚构例子中的意义\u003c/th>\n\u003cth>不能据此断定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>shop改成help\u003c/td>\n\u003ctd>改用help.example.com这个主机名\u003c/td>\n\u003ctd>一定属于另一家公司\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8443改成9443\u003c/td>\n\u003ctd>尝试联系9443端口上的程序\u003c/td>\n\u003ctd>网站会自动理解你想换页面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>products/42改成products/43\u003c/td>\n\u003ctd>请求另一商品资源\u003c/td>\n\u003ctd>一定换了IP或服务器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>color=blue改成color=red\u003c/td>\n\u003ctd>换商品选择条件\u003c/td>\n\u003ctd>参数必然被接受或自动获得权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reviews改成details\u003c/td>\n\u003ctd>换浏览器定位或页面状态\u003c/td>\n\u003ctd>一定产生新的网络请求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>改变路径或颜色参数，通常仍是在联系同一网站。网站可以处理许多不同路径和条件，不需要每页都另用一个IP或端口。反过来，同一个域名也可以安排多个地址提供服务。网址组件的语法可以统一，背后的业务规则仍由服务决定。\u003c/p>\n\u003ch2 id=\"section-3\">地址栏里的网址，不是这次访问的全部信息\u003c/h2>\n\u003cp>你登录后打开同一商品链接，看到自己的收货地址；朋友打开同一链接，看不到你的地址。原因是访问还可能携带浏览器保存的登录标记，以及服务已保存的账号信息。网址虽然相同，浏览器附带的登录标记却可能不同，网站就会按不同账号回复。\u003c/p>\n\u003cp>搜索关键词常放在问号后，但上传文件、填写地址、提交密码等内容通常放在请求的其他部分；地址栏看不见不等于没有传送。参数如果包含分享凭证或个人资料，复制链接也可能把这些信息一起给别人。理解链接时，既要看它指向什么内容，也要看它是否带着分享凭证等信息。\u003c/p>\n\u003ch2 id=\"section-4\">你还会碰见省略写法与编码\u003c/h2>\n\u003cp>网页里的链接有时只写 \u003ccode>/products/42\u003c/code>。浏览器会用当前页面的网址补全，因而你仍可跳转。它不是一个能脱离所在页面、到处都正确工作的独立网站地址。\u003c/p>\n\u003cp>中文和空格有时会显示成 \u003ccode>%\u003c/code> 后接字符的串，这是网址中的编码表示。浏览器与服务按规则恢复相应文本；不能把它误认成加密保护。短链接则是另一个入口，它往往通过跳转把你引向更长网址，见\u003ca href=\"#/browsing\">完整访问过程\u003c/a>。\u003c/p>\n\u003cp>读一条陌生链接时，先找 \u003ccode>://\u003c/code> 后、第一个 \u003ccode>/\u003c/code> 前的网站名称与可选端口，再看路径、问号和井号后的内容。前面说明要联系哪里，后面说明要查看什么、附带什么条件，以及怎样在页面中定位。组件规则可核对\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_URL\" target=\"_blank\" rel=\"noopener noreferrer\">MDN网址说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://www.rfc-editor.org/rfc/rfc3986.html\" target=\"_blank\" rel=\"noopener noreferrer\">URI语法规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"一条网址里的域名、端口和参数，各有什么用？ 朋友发来一个链接，点击后就打开商品的蓝色款，还跳到了评价区。浏览器从链接中读出网站名称、商品编号、颜色选项，以及评价区的位置。 一条网址既说明去哪个网站，也可以说明要看什么内容。 日常所说的网址，常叫URL。先以这个 虚构教学链接 为例： https://shop.example.com:8443/products/42?color=blue reviews 。实际购物网站未必使用这样的字段或端口；这里把平常会省略的部分也写出来，方便看清分工。 浏览器用主机名和端口联系网站，在请求中写明路径和查询条件，并用井号后的部分定位页面或交给页面程序处理。 浏览器先拆开，再分别使用 开头的 https:// 告诉浏览器按受保护的网页通信方式访问。它影响建立什么连接、怎样保护交换内容，不是网站公司名称。 shop.example.com 是主机名。浏览器通常先查询这个名称对应的IP地址，再尝试连接网站。这里的shop是子域名，详细层级见域名。主机也能直接写IP，不过实际网站可能还需要正确域名才能匹配证书与站点。 :8443 指定服务端口，也就是浏览器要联系的端口编号；网站程序需要在这个端口接收请求。普通HTTPS网址没写端口时，使用默认的443；省略数字是采用约定，并不是没有端口。不能给普通链接任意补一个数字，服务必须在那里接收。见IP与端口。 /products/42 是路径，告诉网站你要哪个资源。资源可以是商品页面，也可以是图片或供程序读取的数据；它不必是服务器硬盘上的同名文件夹。 ?color=blue 是查询部分，给访问附上条件。在这家虚构网站，color表示颜色、blue表示蓝色。别的网站可能采用完全不同的含义；通用网络规则不负责解释“蓝色”。多个常见条件会用 & 分隔，例如 ?color=blue&size=m 。 reviews 是片段。普通HTTP请求不会直接把这段作为请求目标送给服务；浏览器可以用它滚动到评价区，网页程序也可以拿它选择显示内容或另发请求。因此“片段不直接发送”不等于“网站永远无法知道它”。 如果只改变一段，通常发生什么 变化 在虚构例子中的意义 不能据此断定 --- --- --- shop改成help 改用help.example.com这个主机名 一定属于另一家公司 8443改成9443 尝试联系9443端口上的程序 网站会自动理解你想换页面 products/42改成products/43 请求另一商品资源 一定换了IP或服务器 color=blue改成color=red 换商品选择条件 参数必然被接受或自动获得权限 reviews改成details 换浏览器定位或页面状态 一定产生新的网络请求 改变路径或颜色参数，通常仍是在联系同一网站。网站可以处理许多不同路径和条件，不需要每页都另用一个IP或端口。反过来，同一个域名也可以安排多个地址提供服务。网址组件的语法可以统一，背后的业务规则仍由服务决定。 地址栏里的网址，不是这次访问的全部信息 你登录后打开同一商品链接，看到自己的收货地址；朋友打开同一链接，看不到你的地址。原因是访问还可能携带浏览器保存的登录标记，以及服务已保存的账号信息。网址虽然相同，浏览器附带的登录标记却可能不同，网站就会按不同账号回复。 搜索关键词常放在问号后，但上传文件、填写地址、提交密码等内容通常放在请求的其他部分；地址栏看不见不等于没有传送。参数如果包含分享凭证或个人资料，复制链接也可能把这些信息一起给别人。理解链接时，既要看它指向什么内容，也要看它是否带着分享凭证等信息。 你还会碰见省略写法与编码 网页里的链接有时只写 /products/42 。浏览器会用当前页面的网址补全，因而你仍可跳转。它不是一个能脱离所在页面、到处都正确工作的独立网站地址。 中文和空格有时会显示成 % 后接字符的串，这是网址中的编码表示。浏览器与服务按规则恢复相应文本；不能把它误认成加密保护。短链接则是另一个入口，它往往通过跳转把你引向更长网址，见完整访问过程。 读一条陌生链接时，先找 :// 后、第一个 / 前的网站名称与可选端口，再看路径、问号和井号后的内容。前面说明要联系哪里，后面说明要查看什么、附带什么条件，以及怎样在页面中定位。组件规则可核对MDN网址说明与URI语法规范。","outline":[{"id":"section-1","title":"浏览器先拆开，再分别使用","depth":2},{"id":"section-2","title":"如果只改变一段，通常发生什么","depth":2},{"id":"section-3","title":"地址栏里的网址，不是这次访问的全部信息","depth":2},{"id":"section-4","title":"你还会碰见省略写法与编码","depth":2}]},{"id":"signals","group":"connection","title":"文字和声音，怎么进入电线与空气？","question":"文字和声音，怎么进入电线与空气？","summary":"内容先变成数字记录，再借电、光或无线电信号传递。","terms":["编码","信号","光纤"],"aliases":["编码","","信号","","光纤",""],"related":["ip","security","access","packets"],"html":"\u003cp>一张照片不会以“画面”的形态钻进网线。\u003cstrong>设备先把内容记成数字，再让物理信号携带这些数字，另一端按约定恢复。\u003c/strong> 发送文字、照片和声音，共同依靠这条转换链。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0 003c/h2>\n\u003cp>电线中的电信号、光纤中的光信号、空气中的无线电，都能通过可区分的变化传递信息。Wi-Fi就是用无线电连接附近设备的一种方式。\u003ca href=\"https://www.cisco.com/site/us/en/learn/topics/networking/what-is-a-wi-fi-network.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cisco对Wi-Fi的解释\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>并不是一个数字一定对应一次简单亮灭。实际系统可以用多种变化组合表示信息，还会帮助接收端发现某些错误。理解时先保留一件事：发送端按规则制造变化，接收端按同样规则识别变化。\u003c/p>\n\u003ch2 id=\"section-5\">换一种道路，内容可以继续前进\u003c/h2>\n\u003cp>手机到接入点可能走无线电，接入点之后可能接到网线和光纤。中间设备接收信息后，用下一段道路的方式继续发送。因此，一次访问可以经过多种物理载体。\u003c/p>\n\u003cp>电、光或无线电信号负责携带数据，并不理解一句话的意思。设备恢复数字后，应用才按格式把它显示为文字或播放成声音。网络还要额外知道把信息交给谁，这由\u003ca href=\"#/ip\">地址\u003c/a>和转送规则帮助完成。\u003c/p>\n\u003ch2 id=\"section-6\">为什么压缩和加密是两件事\u003c/h2>\n\u003cp>压缩通过表示方式减少需要传递的内容量，图片或声音还可能舍弃某些细节来减小体积。加密则让没有对应密钥的人难以读懂内容。较小不等于受到保护，受到保护也不等于文件更小。传输保护见\u003ca href=\"#/security\">哪些内容能被看见\u003c/a>。\u003c/p>\n\u003cp>这段过程可以按三步理解：设备记录内容，网络传送数据，接收软件把数据还原为可看的图片或可听的声音。这个模型能解释照片为何可走光纤，也能解释接收不完整时为什么显示失败。它不代表实际线路上只出现简单的0与1亮灭。\u003c/p>\n","text":"文字和声音，怎么进入电线与空气？ 一张照片不会以“画面”的形态钻进网线。 设备先把内容记成数字，再让物理信号携带这些数字，另一端按约定恢复。 发送文字、照片和声音，共同依靠这条转换链。 同一数字记录可由电、光或无线电变化承载；接收端依约恢复内容。 从录一段语音开始看转换 你按住聊天软件的录音按钮，麦克风先把声音变化交给设备记录。聊天软件把录下的声音保存为数据，可能先压缩，再交给手机的网络功能发送。手机通过无线电把数据传给附近的Wi-Fi接入点或移动网络设施，后面的设备再通过网线、光纤等继续转送。 朋友收到的不是空气中那一道相同声波，而是用于恢复声音的数据。应用按格式解码、交给扬声器播放，才形成他听到的新声音。这就是为什么同一段语音能存下来、隔一天再听，也能从手机无线连接转到有线电脑；声音已经被记录成数据，不必随着录音时那一道声波一起传播。 这里还有三种容易混在一起的处理：编码解决“怎样表示”，压缩解决“怎样少占体积”，加密解决“谁能读”。语音体积小，可能因为压缩；看不懂一串数据，可能因为格式未解释，不能直接判定已加密。 图片很清楚，为什么发出去以后变糊 在一个 虚构教学场景 中，你拍的原图很清楚，聊天软件的默认发送却选择压缩版。朋友收到完整文件，仍比原图模糊。这里变差发生在内容准备阶段，不一定是网络“路上把像素磨掉了”。 换成发送原文件，体积通常增大，传送可能更久；网络传送的是聊天软件选中的那个文件。若完整下载的原文件仍打不开，则还要看格式、文件是否正确或接收软件能否解释。不能把模糊、缺失与格式不支持当同一个故障。 这也解释了为什么“重新发送”未必改善画质：如果应用仍选择同样压缩规则，再传一次也没有恢复被丢掉的细节。你要先确定变化发生在准备内容、搬运内容，还是显示内容。 先把内容变成可以记录的东西 文字可以按约定转换为数字编号；图片可以记录各个位置的颜色；声音可以记录不同时刻的变化。这里的“编码”就是用某种约定表示内容。文件里的数字本身没有意义，两端要知道该怎样解释它们。 例如，接收端若把图片记录当作文字解释，读不出原来的画面。所以正确收到数字和正确理解格式，也是两项工作。 数字要借真实的载体移动 电线中的电信号、光纤中的光信号、空气中的无线电，都能通过可区分的变化传递信息。Wi-Fi就是用无线电连接附近设备的一种方式。Cisco对Wi-Fi的解释 并不是一个数字一定对应一次简单亮灭。实际系统可以用多种变化组合表示信息，还会帮助接收端发现某些错误。理解时先保留一件事：发送端按规则制造变化，接收端按同样规则识别变化。 换一种道路，内容可以继续前进 手机到接入点可能走无线电，接入点之后可能接到网线和光纤。中间设备接收信息后，用下一段道路的方式继续发送。因此，一次访问可以经过多种物理载体。 电、光或无线电信号负责携带数据，并不理解一句话的意思。设备恢复数字后，应用才按格式把它显示为文字或播放成声音。网络还要额外知道把信息交给谁，这由地址和转送规则帮助完成。 为什么压缩和加密是两件事 压缩通过表示方式减少需要传递的内容量，图片或声音还可能舍弃某些细节来减小体积。加密则让没有对应密钥的人难以读懂内容。较小不等于受到保护，受到保护也不等于文件更小。传输保护见哪些内容能被看见。 这段过程可以按三步理解：设备记录内容，网络传送数据，接收软件把数据还原为可看的图片或可听的声音。这个模型能解释照片为何可走光纤，也能解释接收不完整时为什么显示失败。它不代表实际线路上只出现简单的0与1亮灭。 相关概念 - 怎样接入网络 - 为什么分成小份","outline":[{"id":"section-1","title":"从录一段语音开始看转换","depth":2},{"id":"section-2","title":"图片很清楚，为什么发出去以后变糊","depth":2},{"id":"section-3","title":"先把内容变成可以记录的东西","depth":2},{"id":"section-4","title":"数字要借真实的载体移动","depth":2},{"id":"section-5","title":"换一种道路，内容可以继续前进","depth":2},{"id":"section-6","title":"为什么压缩和加密是两件事","depth":2}]},{"id":"access","group":"connection","title":"连上Wi-Fi，为什么不一定能上网？","question":"连上Wi-Fi，为什么不一定能上网？","summary":"附近连接与接入互联网是分开的几段。","terms":["Wi-Fi","基站","运营商"],"aliases":["Wi-Fi","","基站","","运营商",""],"related":["signals","troubleshoot","nat","identity"],"html":"\u003cp>手机显示满格Wi-Fi，网页却打不开，可能并不矛盾。\u003cstrong>连上Wi-Fi，表示手机连上了附近的无线网络。要打开网站，还得经过路由器、运营商等网络，并收到网站的回复。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">用家里的电脑与打印机看“连网”和“上网”\u003c/h2>\n\u003cp>假设一个\u003cstrong>虚构家庭网络\u003c/strong>中，电脑和打印机都连着家里的Wi-Fi。电脑找打印机时，访问可以只在家庭网络中完成；你打开外面的商品网站时，请求还要经过家里的路由器、运营商和其他网络，才能到达网站。\u003c/p>\n\u003cp>如果入户线路暂时中断，电脑仍可能与打印机通信，浏览器却取不到远方页面。这不是“Wi-Fi半坏了”，而是电脑与打印机之间的连接还在，家庭网络通往外面的那段连接却中断了。附近设备能否通信还受隔离规则影响，不能假定任何公共Wi-Fi上的设备都能互相访问。\u003c/p>\n\u003cp>日常俗称的路由器盒子可能同时分配内部地址、提供无线接入、转送外部信息；光纤接入设备又常被叫“光猫”。这些功能可能分在几个盒子里，也可能合在一台设备上。因此排查时，要看无线连接、地址分配或向外转送哪一步出了问题，不能只凭盒子的外观判断。\u003c/p>\n\u003ch2 id=\"section-2\">从酒店Wi-Fi切到手机热点，改变了哪些条件\u003c/h2>\n\u003cp>酒店可能允许手机先连上Wi-Fi，等你在弹出的网页中按要求确认后，才允许访问外面的互联网。因此能看到Wi-Fi标志但尚不能打开普通网站；按要求完成确认后，才允许访问外部网站。不应把手机套餐密码或账号密码当成酒店网络的确认资料。\u003c/p>\n\u003cp>手机热点让电脑先连手机，手机再使用自己的移动网络接入。这更换了外部路径，也可能改变DNS安排与公网来源。它不能保证远方网站永远正常，也不会替电脑上的应用补账号权限。\u003c/p>\n\u003cp>\u003cstrong>教学对照\u003c/strong>：同一电脑用酒店网络访问商品站失败，切热点后成功。你现在有证据说明两次条件的差异值得检查，但还不知道是酒店的联网确认、DNS查询、网络转送，还是网站自己的访问规则。另一台设备在酒店同样失败，是额外线索；不能从一次切换成功直接下“酒店封了我”的结论。\u003c/p>\n\u003ch2 id=\"section-3\">家里常见的几段路\u003c/h2>\n\u003cp>手机通过无线电联系接入点，家中的设备由家庭网络组织起来；路由功能再把去其他网络的信息交给上游。光纤入户时，接入设备在光信号与家中设备可用的连接之间衔接。运营商管理更大范围的网络，并与其他网络互联。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work\" target=\"_blank\" rel=\"noopener noreferrer\">互联网中的网络连接\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>“路由器”这个盒子经常同时提供Wi-Fi接入、内部转发和网络之间转发等能力。这些工作可能在一个盒子里，也可能分在不同设备上。同一台设备可以做几种工作，要分别看哪种功能出了问题。\u003c/p>\n\u003ch2 id=\"section-4\">基站把移动设备接到哪里\u003c/h2>\n\u003cp>使用手机流量时，手机先通过无线连接与附近的移动网络设施通信，再经运营商网络访问服务。走动时，网络需要协调设备接入的位置。打电话还需要运营商确认号码能否使用通话服务，并建立连接、传送声音。普通电话与聊天软件的视频通话，背后的系统可以不同。\u003c/p>\n\u003cp>因此，Wi-Fi与手机流量可以看作两种接入入口，后面都会涉及更大范围的网络。手机热点则把手机的接入能力分享给附近设备，不会凭空制造另一份互联网。\u003c/p>\n\u003ch2 id=\"section-5\">满格与可访问，各在证明什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察到的结果\u003c/th>\n\u003cth>能说明什么\u003c/th>\n\u003cth>还不能确定什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>搜到Wi-Fi名字\u003c/td>\n\u003ctd>接入点在附近广播\u003c/td>\n\u003ctd>是否获准连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连上Wi-Fi\u003c/td>\n\u003ctd>附近连接已建立\u003c/td>\n\u003ctd>上游是否可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>打开一个网页\u003c/td>\n\u003ctd>到这个服务的路径可用\u003c/td>\n\u003ctd>所有服务是否正常\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一个应用提示登录失败\u003c/td>\n\u003ctd>某次操作失败\u003c/td>\n\u003ctd>一定是网络断了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>酒店网络还可能要求先在弹出的页面中完成联网确认。你接上附近网络后，上游访问规则仍可能限制流量。某个网站故障时，别的网站仍可正常访问。\u003c/p>\n\u003ch2 id=\"section-6\">换网络，是在换哪一段\u003c/h2>\n\u003cp>从家庭Wi-Fi切到手机流量，手机连接的附近设备和后面的运营商网络通常都改变了；账号和电脑里的记录不会因此自动消失。若问题只在某个网络出现，这能帮助缩小范围，但不能单独判定是哪台设备或哪条规则出问题。具体对照见\u003ca href=\"#/troubleshoot\">访问排障\u003c/a>。\u003c/p>\n","text":"连上Wi-Fi，为什么不一定能上网？ 手机显示满格Wi-Fi，网页却打不开，可能并不矛盾。 连上Wi-Fi，表示手机连上了附近的无线网络。要打开网站，还得经过路由器、运营商等网络，并收到网站的回复。 用家里的电脑与打印机看“连网”和“上网” 假设一个 虚构家庭网络 中，电脑和打印机都连着家里的Wi-Fi。电脑找打印机时，访问可以只在家庭网络中完成；你打开外面的商品网站时，请求还要经过家里的路由器、运营商和其他网络，才能到达网站。 如果入户线路暂时中断，电脑仍可能与打印机通信，浏览器却取不到远方页面。这不是“Wi-Fi半坏了”，而是电脑与打印机之间的连接还在，家庭网络通往外面的那段连接却中断了。附近设备能否通信还受隔离规则影响，不能假定任何公共Wi-Fi上的设备都能互相访问。 日常俗称的路由器盒子可能同时分配内部地址、提供无线接入、转送外部信息；光纤接入设备又常被叫“光猫”。这些功能可能分在几个盒子里，也可能合在一台设备上。因此排查时，要看无线连接、地址分配或向外转送哪一步出了问题，不能只凭盒子的外观判断。 从酒店Wi-Fi切到手机热点，改变了哪些条件 酒店可能允许手机先连上Wi-Fi，等你在弹出的网页中按要求确认后，才允许访问外面的互联网。因此能看到Wi-Fi标志但尚不能打开普通网站；按要求完成确认后，才允许访问外部网站。不应把手机套餐密码或账号密码当成酒店网络的确认资料。 手机热点让电脑先连手机，手机再使用自己的移动网络接入。这更换了外部路径，也可能改变DNS安排与公网来源。它不能保证远方网站永远正常，也不会替电脑上的应用补账号权限。 教学对照 ：同一电脑用酒店网络访问商品站失败，切热点后成功。你现在有证据说明两次条件的差异值得检查，但还不知道是酒店的联网确认、DNS查询、网络转送，还是网站自己的访问规则。另一台设备在酒店同样失败，是额外线索；不能从一次切换成功直接下“酒店封了我”的结论。 家里常见的几段路 手机通过无线电联系接入点，家中的设备由家庭网络组织起来；路由功能再把去其他网络的信息交给上游。光纤入户时，接入设备在光信号与家中设备可用的连接之间衔接。运营商管理更大范围的网络，并与其他网络互联。互联网中的网络连接 “路由器”这个盒子经常同时提供Wi-Fi接入、内部转发和网络之间转发等能力。这些工作可能在一个盒子里，也可能分在不同设备上。同一台设备可以做几种工作，要分别看哪种功能出了问题。 基站把移动设备接到哪里 使用手机流量时，手机先通过无线连接与附近的移动网络设施通信，再经运营商网络访问服务。走动时，网络需要协调设备接入的位置。打电话还需要运营商确认号码能否使用通话服务，并建立连接、传送声音。普通电话与聊天软件的视频通话，背后的系统可以不同。 因此，Wi-Fi与手机流量可以看作两种接入入口，后面都会涉及更大范围的网络。手机热点则把手机的接入能力分享给附近设备，不会凭空制造另一份互联网。 满格与可访问，各在证明什么 观察到的结果 能说明什么 还不能确定什么 --- --- --- 搜到Wi-Fi名字 接入点在附近广播 是否获准连接 连上Wi-Fi 附近连接已建立 上游是否可用 打开一个网页 到这个服务的路径可用 所有服务是否正常 一个应用提示登录失败 某次操作失败 一定是网络断了 酒店网络还可能要求先在弹出的页面中完成联网确认。你接上附近网络后，上游访问规则仍可能限制流量。某个网站故障时，别的网站仍可正常访问。 换网络，是在换哪一段 从家庭Wi-Fi切到手机流量，手机连接的附近设备和后面的运营商网络通常都改变了；账号和电脑里的记录不会因此自动消失。若问题只在某个网络出现，这能帮助缩小范围，但不能单独判定是哪台设备或哪条规则出问题。具体对照见访问排障。 相关概念 - 共享上网出口 - IP怎样参与身份判断","outline":[{"id":"section-1","title":"用家里的电脑与打印机看“连网”和“上网”","depth":2},{"id":"section-2","title":"从酒店Wi-Fi切到手机热点，改变了哪些条件","depth":2},{"id":"section-3","title":"家里常见的几段路","depth":2},{"id":"section-4","title":"基站把移动设备接到哪里","depth":2},{"id":"section-5","title":"满格与可访问，各在证明什么","depth":2},{"id":"section-6","title":"换网络，是在换哪一段","depth":2}]},{"id":"packets","group":"connection","title":"一张照片为什么要分成许多小份？","question":"一张照片为什么要分成许多小份？","summary":"信息分成小份共享链路，接收端按规则恢复应用需要的内容。","terms":["数据包","协议"],"aliases":["数据包","","协议",""],"related":["signals","delivery","speed"],"html":"\u003cp>一条道路上有照片、消息和视频通话同时经过。如果任何一个大文件从开始到结束独占道路，其他访问就要等很久。\u003cstrong>网络把信息组织成较小的传送单位，让许多访问穿插使用连接。\u003c/strong> 这些单位通常称为数据包。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgNDIwIDUyMCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjAiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPuWkp+WGheWuueWIhuW8gO+8jOWSjOWwj+a2iOaBr+epv+aPkjwvdGV4dD48dGV4dCB4PSI5NSIgeT0iODMiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPueFp+eJhzwvdGV4dD48dGV4dCB4PSIzMTMiIHk9IjgzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjQzYjM2Ij7nn63mtojmga88L3RleHQ+PHJlY3QgeD0iNDgiIHk9Ijk5IiB3aWR0aD0iMTAyIiBoZWlnaHQ9IjcwIiByeD0iNyIgZmlsbD0iI2U5ZGNjNSIvPjxwYXRoIGQ9Ik01MyAxNjJMODYgMTIwTDExMiAxNDdMMTQyIDExN1YxNjRaIiBmaWxsPSIjYjM4YTUyIi8+PGNpcmNsZSBjeD0iMTI1IiBjeT0iMTE0IiByPSI4IiBmaWxsPSIjZmFmOGYyIi8+PHBhdGggZD0iTTI3OCAxMDJIMzQ4VjE0NkgzMDdMMjg3IDE2M1YxNDZIMjc4WiIgZmlsbD0iI2Q0ZTVkOCIvPjx0ZXh0IHg9IjMxMyIgeT0iMTMyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMjQzYjM2Ij7lpb08L3RleHQ+PHBhdGggZD0iTTk1IDE4MVYyMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIzIiBtYXJrZXItZW5kPSJ1cmwoI2EpIi8+PHBhdGggZD0iTTMxMyAxNzlWMjU3SDM2MlYyODMiIGZ 9IiMyNDNiMzYiPuaOpeaUtuerr+aBouWkjemcgOimgeeahOWGheWuuTwvdGV4dD48dGV4dCB4PSIyMTAiIHk9IjQ4NiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzI0M2IzNiI+5bCP5Lu95LiN5piv5a6M5pW06IGK5aSp5raI5oGvPC90ZXh0PjwvZz48L3N2Zz4=\" alt=\"照片分成小份后，短消息可穿插传送；接收端再恢复应用内容。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>照片分成小份后，短消息可穿插传送；接收端再恢复应用内容。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">上传照片时，同时发一句“稍等”\u003c/h2>\n\u003cp>你在聊天软件上传一组大照片，接着发一条短文字。设备可以把照片的数据分段发送，也可以在段与段之间发送文字或其他应用的数据。因此照片上传时，其他通信仍有机会使用同一条连接。\u003c/p>\n\u003cp>每个数据包带有目的地址等信息，沿途设备据此转送。接收设备还要判断它属于哪条连接。聊天软件则在自己的请求中写明朋友的账号；仅有聊天服务器的IP，还不能说明消息要发给哪位朋友。\u003ca href=\"#/ports\">端口与连接\u003c/a>解释交给哪个接收程序，\u003ca href=\"#/messages\">消息服务\u003c/a>解释交给哪个账号。\u003c/p>\n\u003ch2 id=\"section-2\">少一小份，不等于永远少照片的某一角\u003c/h2>\n\u003cp>一张图片文件的字节记录和屏幕像素不是“每个包固定装某块图”的简单对应。传输机制可能补回缺失的数据，再交给应用解析图片文件。显示结果取决于恢复后的文件和应用怎样读取它。成功恢复后，用户不必看见中间曾经缺的那一份。\u003c/p>\n\u003cp>\u003cstrong>虚构教学对照\u003c/strong>：上传过程中无线信号短暂变差，软件先停在某个百分比，恢复后继续完成。可能是部分数据正在等待补发，聊天软件仍保留着上传任务；百分比并不能告诉你具体哪个包丢了，更不能证明每次恢复都从原位置续传。应用是否支持续传有自己的设计。\u003c/p>\n\u003ch2 id=\"section-3\">分包并没有自动分出独立快车道\u003c/h2>\n\u003cp>多份信息仍可能共用同一窄出口。短消息虽然小，也可能在队列后等待，或者应用先排队处理其他任务；因此大文件上传时聊天和会议都慢，并不反驳分包机制。\u003c/p>\n\u003cp>分包让网络有机会轮流传送不同应用的数据，但不保证每个人都得到固定的速度。中间设备怎样调度、链路容量多大、应用如何等待，都继续影响结果。看到“同时下载”时，要想到共享与排队，而不是几条互不相干的无限线路。\u003c/p>\n\u003ch2 id=\"section-4\">每份都需要交付线索\u003c/h2>\n\u003cp>一个包不只装内容，还带着帮助转送的说明，例如目的地址。中间设备据此把它交到下一段连接。地址格式与交付规则属于“协议”——通信两边约定怎样组织和处理信息。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">IP的交付范围\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>包与照片不是一一对应关系。一张照片可以跨很多包，一个应用动作也可能产生多次通信。不要把“发送一条消息”想成沿途只送出一个完整信封。\u003c/p>\n\u003ch2 id=\"section-5\">小份可以交错，但道路仍有上限\u003c/h2>\n\u003cp>照片的几份内容之间，可以穿插别人的短消息。这样资源能被共享。但如果到达的份数长期超过某段道路能送出的份数，那里仍会排队，缓冲满时还可能丢弃。\u003c/p>\n\u003cp>分包只是组织传送的方法，不承诺不会拥堵，也不保证每份一定到达。不同包可能走同一路径，路径变化时也可能经过不同节点；不能从“分包”推断“必定分走多条路”。\u003c/p>\n\u003ch2 id=\"section-6\">分开传，不等于显示碎片\u003c/h2>\n\u003cp>应用最终要的是一张可打开的照片。接收端的传输与应用机制会按各自规则恢复连续数据、解析文件；有需要时还会处理丢失与顺序变化。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP提供有序字节流\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>下载文件时，接收端通常要等需要的数据补齐，才能交给应用使用。“分包”描述的是数据的组织方式；线上传播的仍是电、光或无线电信号，数据包不是在空气中飞行的实体小块。\u003c/p>\n","text":"一张照片为什么要分成许多小份？ 一条道路上有照片、消息和视频通话同时经过。如果任何一个大文件从开始到结束独占道路，其他访问就要等很久。 网络把信息组织成较小的传送单位，让许多访问穿插使用连接。 这些单位通常称为数据包。 照片分成小份后，短消息可穿插传送；接收端再恢复应用内容。 上传照片时，同时发一句“稍等” 你在聊天软件上传一组大照片，接着发一条短文字。设备可以把照片的数据分段发送，也可以在段与段之间发送文字或其他应用的数据。因此照片上传时，其他通信仍有机会使用同一条连接。 每个数据包带有目的地址等信息，沿途设备据此转送。接收设备还要判断它属于哪条连接。聊天软件则在自己的请求中写明朋友的账号；仅有聊天服务器的IP，还不能说明消息要发给哪位朋友。端口与连接解释交给哪个接收程序，消息服务解释交给哪个账号。 少一小份，不等于永远少照片的某一角 一张图片文件的字节记录和屏幕像素不是“每个包固定装某块图”的简单对应。传输机制可能补回缺失的数据，再交给应用解析图片文件。显示结果取决于恢复后的文件和应用怎样读取它。成功恢复后，用户不必看见中间曾经缺的那一份。 虚构教学对照 ：上传过程中无线信号短暂变差，软件先停在某个百分比，恢复后继续完成。可能是部分数据正在等待补发，聊天软件仍保留着上传任务；百分比并不能告诉你具体哪个包丢了，更不能证明每次恢复都从原位置续传。应用是否支持续传有自己的设计。 分包并没有自动分出独立快车道 多份信息仍可能共用同一窄出口。短消息虽然小，也可能在队列后等待，或者应用先排队处理其他任务；因此大文件上传时聊天和会议都慢，并不反驳分包机制。 分包让网络有机会轮流传送不同应用的数据，但不保证每个人都得到固定的速度。中间设备怎样调度、链路容量多大、应用如何等待，都继续影响结果。看到“同时下载”时，要想到共享与排队，而不是几条互不相干的无限线路。 每份都需要交付线索 一个包不只装内容，还带着帮助转送的说明，例如目的地址。中间设备据此把它交到下一段连接。地址格式与交付规则属于“协议”——通信两边约定怎样组织和处理信息。IP的交付范围 包与照片不是一一对应关系。一张照片可以跨很多包，一个应用动作也可能产生多次通信。不要把“发送一条消息”想成沿途只送出一个完整信封。 小份可以交错，但道路仍有上限 照片的几份内容之间，可以穿插别人的短消息。这样资源能被共享。但如果到达的份数长期超过某段道路能送出的份数，那里仍会排队，缓冲满时还可能丢弃。 分包只是组织传送的方法，不承诺不会拥堵，也不保证每份一定到达。不同包可能走同一路径，路径变化时也可能经过不同节点；不能从“分包”推断“必定分走多条路”。 分开传，不等于显示碎片 应用最终要的是一张可打开的照片。接收端的传输与应用机制会按各自规则恢复连续数据、解析文件；有需要时还会处理丢失与顺序变化。TCP提供有序字节流 下载文件时，接收端通常要等需要的数据补齐，才能交给应用使用。“分包”描述的是数据的组织方式；线上传播的仍是电、光或无线电信号，数据包不是在空气中飞行的实体小块。 相关概念 - 信息丢失怎样恢复 - 为什么带宽很高仍然慢","outline":[{"id":"section-1","title":"上传照片时，同时发一句“稍等”","depth":2},{"id":"section-2","title":"少一小份，不等于永远少照片的某一角","depth":2},{"id":"section-3","title":"分包并没有自动分出独立快车道","depth":2},{"id":"section-4","title":"每份都需要交付线索","depth":2},{"id":"section-5","title":"小份可以交错，但道路仍有上限","depth":2},{"id":"section-6","title":"分开传，不等于显示碎片","depth":2}]},{"id":"ip","group":"address","title":"IP是什么，为什么信息需要地址？","question":"IP是什么，为什么信息需要地址？","summary":"IP帮助网络转送请求和回复；电脑的内网IP、网站的IP和网站看到的来源IP各不相同。","terms":["IP","IPv4","IPv6","内网IP","公网IP"],"aliases":["IP","IP address 地址 公网 内网 IPv4 IPv6","IPv4","","IPv6","","内网IP","","公网IP","public IP 出口地址"],"related":["ports","nat","domains","identity","risk"],"html":"\u003cp>你想把消息交给远处的一台设备，沿途的网络首先要知道往哪里送。\u003cstrong>IP地址告诉网络要把数据包送到哪里，也让接收方知道回复送往哪个地址。\u003c/strong> 数据包带着目的地址向前走，回复也需要知道应该送往哪里。\u003c/p>\n\u003cp>打开商品链接时，IP帮助请求到达网站所在的网络位置。到达以后，还要用端口联系程序、用路径说明要看哪件商品。IP可能变化，也可能由多人共用，不能直接当作某个人或某户人家的永久编号。\u003c/p>\n\u003ch2 id=\"section-1\">商品网站为什么需要地址，却不拿地址决定商品\u003c/h2>\n\u003cp>浏览器想打开42号商品页，先要联系网站的服务器。发出的数据包带着目标IP，沿途设备按这个地址转送。当请求到达，网站才解释“商品42、蓝色”。沿途网络根据IP转送，网站程序根据商品编号查内容。这两步由不同部分完成。\u003c/p>\n\u003cp>发出的数据包还带着来源IP，接收方用它把回复送回来。如果家中有共享出口，外面看到的来源可能被换成出口地址。所以设备设置里某个IP、网站的IP、网站看到你的IP，是三个不同问题，不能把它们当同一串必须相同的数字。\u003c/p>\n\u003ch2 id=\"section-2\">看一次设置与IP查询，就能分出目标和来源\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构家庭示例\u003c/strong>：电脑设置里显示192.168.1.20，家庭出口对外使用一个公网地址，商品网站使用另一个公网地址接收请求。你打开IP查询页时，它报告本次访问的来源，并没有报告商品服务的地址，也不会自动列出你家电脑的内网地址。\u003c/p>\n\u003cp>切到手机热点后，电脑的接入安排和公共来源可能变化；商品网站的名称不需要因此变化。网站还是那个目标，你只是从另一条路径到它那里去。IP发生变化并不等于账号更换，也不保证既有连接立即无感继续。\u003c/p>\n\u003ch2 id=\"section-3\">为什么不同家里的电脑都能叫192.168.1.20\u003c/h2>\n\u003cp>内部地址只在相应范围使用，两个家庭分别管理自己的网络，可以重复使用相同内部编号。你需要知道这个地址在哪个网络里才有实际定位意义；单独给外地朋友一串内网地址，没有告诉他进入你家范围的方法。\u003c/p>\n\u003cp>公网IP可以用来在公共互联网中找到网络位置，但拥有公网IP不等于开放了网页、文件等服务。服务可能没有运行、只接受本机连接，或被防护规则限制。想“访问某个IP”，最终仍要说明使用HTTP还是其他方式、联系哪个\u003ca href=\"#/ports\">端口\u003c/a>，以及是否有权限。\u003c/p>\n\u003ch2 id=\"section-4\">别把冒号后的任何数字都认成端口\u003c/h2>\n\u003cp>IPv4网页地址常写成 \u003ccode>http://192.168.1.20:8080\u003c/code>，最后的8080是端口。IPv6地址本身就包含冒号，放进网址时通常用方括号包住地址，再在括号外写可选端口，例如 \u003ccode>http://[2001:db8::20]:8080\u003c/code>。这里只为帮你识别“地址本身”和“服务入口”，不要求记地址格式。\u003c/p>\n\u003cp>以后看到IP，可以先问“这是我设备的内部位置、这次公共来源，还是远方目标？”分类清楚后再谈身份或风控，能避免把三个角色混为一谈。\u003c/p>\n\u003ch2 id=\"section-5\">地址属于连接的位置\u003c/h2>\n\u003cp>一台电脑可以同时接入Wi-Fi、有线网络和VPN，因此可能有多个地址。更准确地说，地址关联的是设备接入网络的接口；“接口”就是设备与某个网络连接的那个入口。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8200.html\" target=\"_blank\" rel=\"noopener noreferrer\">IPv6规范对接口与地址的定义\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>你从家里带电脑去咖啡店，电脑还是同一台，接入的网络却变了。网络可能为新连接分配新的地址。这已经说明：地址和永久设备身份是两件事。\u003c/p>\n\u003ch2 id=\"section-6\">谁把地址给你\u003c/h2>\n\u003cp>家中设备通常由路由器自动安排内部地址；家庭网络的对外地址通常由运营商安排。公司网络可能由管理员统一安排。设备也可能按照网络规则自己生成某些地址。你日常使用网络时，一般不需要自己挑一串数字。\u003c/p>\n\u003cp>地址安排还需要避免在同一个范围中发生冲突。同一网络中两个设备的接口如果使用相同地址，网络就可能不知道该把信息交给谁。不同家庭内部出现相同的内网地址则很正常，因为它们属于分开的网络范围。\u003c/p>\n\u003ch2 id=\"section-7\">内网与公网，分别回答哪个问题\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你看到的地址\u003c/th>\n\u003cth>它主要在哪个范围中起作用\u003c/th>\n\u003cth>日常例子\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>内网IP\u003c/td>\n\u003ctd>家里、公司等内部范围\u003c/td>\n\u003ctd>路由器区分电脑和打印机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公网IP\u003c/td>\n\u003ctd>可在公共互联网中寻址的范围\u003c/td>\n\u003ctd>网站接收来自某个网络出口的访问\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>这里的“公网”表示公共网络可寻址，不表示机器上的每项服务都允许别人访问。有了地址以后，仍要看程序是否运行、是否接收外部请求，以及防火墙和账号权限是否允许这次访问。\u003c/p>\n\u003cp>公网地址也不总在路由器上。使用IPv6时，设备常能有自己的公网地址；使用共享出口时，网站看到的可能是出口地址。下一篇\u003ca href=\"#/nat\">共享出口\u003c/a>专门解释这种变化。\u003c/p>\n\u003ch2 id=\"section-8\">那两种长相不同的IP是什么\u003c/h2>\n\u003cp>IPv4常写成用点分开的几组数字，IPv6常写成带冒号的较长字符。它们是两代地址与传送规则，它们都用来标明数据包的来源和目的地。地址资源紧张推动了IPv6以及不同共享方案的发展；不需要通过背长度理解它们。\u003c/p>\n\u003cp>一个设备可能同时使用两代地址。因此，在查IP时看到两项结果，不一定是配置出错。\u003c/p>\n\u003ch2 id=\"section-9\">从地址到“身份”，还差一步推断\u003c/h2>\n\u003cp>网站观察到某个来源IP，可以把来自这个地址的访问放在一起分析。但是同一个公网地址可能被多人共用，同一个人也会随着网络改变使用不同地址。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享地址的影响\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>所以看到“这个IP访问很多次”，只能先说“很多访问使用了这个来源IP”。要进一步说“都是同一个人”，还需要账号、会话或其他证据。完整区别见\u003ca href=\"#/identity\">网络身份\u003c/a>。\u003c/p>\n","text":"IP是什么，为什么信息需要地址？ 你想把消息交给远处的一台设备，沿途的网络首先要知道往哪里送。 IP地址告诉网络要把数据包送到哪里，也让接收方知道回复送往哪个地址。 数据包带着目的地址向前走，回复也需要知道应该送往哪里。 打开商品链接时，IP帮助请求到达网站所在的网络位置。到达以后，还要用端口联系程序、用路径说明要看哪件商品。IP可能变化，也可能由多人共用，不能直接当作某个人或某户人家的永久编号。 商品网站为什么需要地址，却不拿地址决定商品 浏览器想打开42号商品页，先要联系网站的服务器。发出的数据包带着目标IP，沿途设备按这个地址转送。当请求到达，网站才解释“商品42、蓝色”。沿途网络根据IP转送，网站程序根据商品编号查内容。这两步由不同部分完成。 发出的数据包还带着来源IP，接收方用它把回复送回来。如果家中有共享出口，外面看到的来源可能被换成出口地址。所以设备设置里某个IP、网站的IP、网站看到你的IP，是三个不同问题，不能把它们当同一串必须相同的数字。 看一次设置与IP查询，就能分出目标和来源 以下是 虚构家庭示例 ：电脑设置里显示192.168.1.20，家庭出口对外使用一个公网地址，商品网站使用另一个公网地址接收请求。你打开IP查询页时，它报告本次访问的来源，并没有报告商品服务的地址，也不会自动列出你家电脑的内网地址。 切到手机热点后，电脑的接入安排和公共来源可能变化；商品网站的名称不需要因此变化。网站还是那个目标，你只是从另一条路径到它那里去。IP发生变化并不等于账号更换，也不保证既有连接立即无感继续。 为什么不同家里的电脑都能叫192.168.1.20 内部地址只在相应范围使用，两个家庭分别管理自己的网络，可以重复使用相同内部编号。你需要知道这个地址在哪个网络里才有实际定位意义；单独给外地朋友一串内网地址，没有告诉他进入你家范围的方法。 公网IP可以用来在公共互联网中找到网络位置，但拥有公网IP不等于开放了网页、文件等服务。服务可能没有运行、只接受本机连接，或被防护规则限制。想“访问某个IP”，最终仍要说明使用HTTP还是其他方式、联系哪个端口，以及是否有权限。 别把冒号后的任何数字都认成端口 IPv4网页地址常写成 http://192.168.1.20:8080 ，最后的8080是端口。IPv6地址本身就包含冒号，放进网址时通常用方括号包住地址，再在括号外写可选端口，例如 http://[2001:db8::20]:8080 。这里只为帮你识别“地址本身”和“服务入口”，不要求记地址格式。 以后看到IP，可以先问“这是我设备的内部位置、这次公共来源，还是远方目标？”分类清楚后再谈身份或风控，能避免把三个角色混为一谈。 地址属于连接的位置 一台电脑可以同时接入Wi-Fi、有线网络和VPN，因此可能有多个地址。更准确地说，地址关联的是设备接入网络的接口；“接口”就是设备与某个网络连接的那个入口。IPv6规范对接口与地址的定义 你从家里带电脑去咖啡店，电脑还是同一台，接入的网络却变了。网络可能为新连接分配新的地址。这已经说明：地址和永久设备身份是两件事。 谁把地址给你 家中设备通常由路由器自动安排内部地址；家庭网络的对外地址通常由运营商安排。公司网络可能由管理员统一安排。设备也可能按照网络规则自己生成某些地址。你日常使用网络时，一般不需要自己挑一串数字。 地址安排还需要避免在同一个范围中发生冲突。同一网络中两个设备的接口如果使用相同地址，网络就可能不知道该把信息交给谁。不同家庭内部出现相同的内网地址则很正常，因为它们属于分开的网络范围。 内网与公网，分别回答哪个问题 你看到的地址 它主要在哪个范围中起作用 日常例子 --- --- --- 内网IP 家里、公司等内部范围 路由器区分电脑和打印机 公网IP 可在公共互联网中寻址的范围 网站接收来自某个网络出口的访问 这里的“公网”表示公共网络可寻址，不表示机器上的每项服务都允许别人访问。有了地址以后，仍要看程序是否运行、是否接收外部请求，以及防火墙和账号权限是否允许这次访问。 公网地址也不总在路由器上。使用IPv6时，设备常能有自己的公网地址；使用共享出口时，网站看到的可能是出口地址。下一篇共享出口专门解释这种变化。 那两种长相不同的IP是什么 IPv4常写成用点分开的几组数字，IPv6常写成带冒号的较长字符。它们是两代地址与传送规则，它们都用来标明数据包的来源和目的地。地址资源紧张推动了IPv6以及不同共享方案的发展；不需要通过背长度理解它们。 一个设备可能同时使用两代地址。因此，在查IP时看到两项结果，不一定是配置出错。 从地址到“身份”，还差一步推断 网站观察到某个来源IP，可以把来自这个地址的访问放在一起分析。但是同一个公网地址可能被多人共用，同一个人也会随着网络改变使用不同地址。共享地址的影响 所以看到“这个IP访问很多次”，只能先说“很多访问使用了这个来源IP”。要进一步说“都是同一个人”，还需要账号、会话或其他证据。完整区别见网络身份。 相关概念 - 电脑与网站为什么看到不同IP - IP怎样参与风控 - 公网IP为什么不保证网页可访问","outline":[{"id":"section-1","title":"商品网站为什么需要地址，却不拿地址决定商品","depth":2},{"id":"section-2","title":"看一次设置与IP查询，就能分出目标和来源","depth":2},{"id":"section-3","title":"为什么不同家里的电脑都能叫192.168.1.20","depth":2},{"id":"section-4","title":"别把冒号后的任何数字都认成端口","depth":2},{"id":"section-5","title":"地址属于连接的位置","depth":2},{"id":"section-6","title":"谁把地址给你","depth":2},{"id":"section-7","title":"内网与公网，分别回答哪个问题","depth":2},{"id":"section-8","title":"那两种长相不同的IP是什么","depth":2},{"id":"section-9","title":"从地址到“身份”，还差一步推断","depth":2}]},{"id":"ports","group":"address","title":"知道IP后，为什么还要写端口？","question":"知道IP后，为什么还要写端口？","summary":"同一设备可以运行多个程序，端口帮助区分通信交给哪个程序或连接。","terms":["端口","监听","默认端口"],"aliases":["端口","port socket 冒号 3000 8080 443","监听","","默认端口",""],"related":["ip"],"html":"\u003cp>你在浏览器里见过 \u003ccode>http://192.168.1.20:8080\u003c/code>，也见过 \u003ccode>localhost:3000\u003c/code>。冒号后面的数字是端口。\u003cstrong>IP帮助数据到达目标设备的网络接口，端口帮助设备把数据交给相应程序或连接。\u003c/strong> 只有地址还不足以说明要联系哪项服务。\u003c/p>\n\u003cp>这些地址是教学示例，不要求你实际打开或修改。一个设备上可以同时运行网页、文件共享、远程控制等程序；它们需要分别接住属于自己的通信。\u003c/p>\n\u003ch2 id=\"section-1\">同一设备上，不同程序可以使用不同端口\u003c/h2>\n\u003cp>下面是一台\u003cstrong>虚构家用设备\u003c/strong>：管理网页在8080接收，照片展示服务在9000接收。你用同一个IP加不同端口，就可能进入不同服务。把8080改成9000不是“翻到同一网站第9000页”，而是在联系另一个接收入口。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MjAgNjAwIiByb2xlPSJpbWciPjx0aXRsZT5JUOS4juerr+WPo+WwhumAmuS/oeS6pOe7meiuvuWkh+S4iueahOacjeWKoTwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNiIgcmVmWT0iMyIgb3JpZW50PSJhdXRvIj48cGF0aCBkP CIgeT0iNTIxIiBjbGFzcz0iIj7mtY/op4jlmajor7fmsYIg4oaSIOWIsOi+vuiuvuWkhyDihpIg5Lqk57uZ5o6l5pS256iL5bqPPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSI1NTMiIGNsYXNzPSJzbWFsbCI+56uv5Y+j5LiN5piv6aG16Z2i57yW5Y+377yM5Lmf5LiN5piv5a6e5L2T5o+S5a2UPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSI1NzUiIGNsYXNzPSJzbWFsbCI+56iL5bqP6KaB6L+Q6KGM77yM572R57uc5ZKM5p2D6ZmQ5Lmf6KaB5YWB6K646K6/6ZeuPC90ZXh0Pjwvc3ZnPg==\" alt=\"到达同一设备IP的通信按端口进入不同接收程序；入口无人监听时，不会自动打开页面。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>到达同一设备IP的通信按端口进入不同接收程序；入口无人监听时，不会自动打开页面。\u003c/figcaption>\u003c/figure>\n\u003cp>程序在某个端口等待相应通信，叫“监听”。它是软件与操作系统建立的接收安排，不是电脑上新增一个实体插孔。网线接口与这里说的端口是两回事。\u003c/p>\n\u003cp>如果9000上根本没有程序接收，浏览器可能报连接拒绝；若防护规则或路径把信息丢掉，也可能表现为等待超时。端口数字本身没有“打开照片”的能力，必须有对应服务，且当前网络能连接它，而且访问规则允许这次请求。\u003c/p>\n\u003ch2 id=\"section-2\">普通网址看不到端口，为什么也能访问\u003c/h2>\n\u003cp>HTTP通常默认80，HTTPS通常默认443，因此普通网站省略它们。\u003ccode>https://shop.example.com\u003c/code> 常可理解为使用443这个入口，不需要用户填数字。这里的默认只决定尝试哪个入口，不保证那里真的有服务。\u003c/p>\n\u003cp>定制服务、本地开发或设备管理页可能使用其他端口，提供者就会把它写进地址。实际采用什么数字，由接收程序与部署安排决定；把别人的教程端口照搬到自己的服务，未必成立。\u003c/p>\n\u003cp>访问方式也必须匹配。某端口提供普通HTTP，另一个提供HTTPS；不是换成https字样就能让对方突然支持保护连接。你收到的完整地址同时包含这两类约定。\u003c/p>\n\u003ch2 id=\"section-3\">端口、路径、子域名怎样一起工作\u003c/h2>\n\u003cp>想象这家虚构网站在同一公共接收入口提供商品、订单和帮助：\u003ccode>/products/42\u003c/code>、\u003ccode>/orders/18\u003c/code>、\u003ccode>/help\u003c/code>。这些路径由已经接住请求的网站程序解释，不需要每个页面单独分配端口。\u003c/p>\n\u003cp>同一个接收入口也能为 \u003ccode>shop.example.com\u003c/code> 和 \u003ccode>help.example.com\u003c/code> 服务。网页请求里保留主机信息，入口可据此选择站点，再按路径选资源。因此关系不是“一个IP对应一个网站，一个端口对应一页”。\u003ca href=\"#/domains\">域名与多站点\u003c/a>会接着展开。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你改变的内容\u003c/th>\n\u003cth>哪个环节先要重新判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IP地址\u003c/td>\n\u003ctd>联系哪个网络目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口\u003c/td>\n\u003ctd>该目标上哪个接收入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主机名\u003c/td>\n\u003ctd>查询哪个名称；接收入口还需识别哪个站点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/后面的路径\u003c/td>\n\u003ctd>站点中的哪个资源或操作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>打开网页时，浏览器既要找到目标IP和端口，也要在请求中说明主机名、路径等信息。这些部分一起使用，各自影响不同步骤。\u003c/p>\n\u003ch2 id=\"section-4\">我的电脑同时开很多网页，回复怎么不混在一起\u003c/h2>\n\u003cp>浏览器发起连接时，你这端也会使用自己的通信端口。常见TCP连接可由两端地址、两端端口区分，设备才能把回复送回相应连接。若使用UDP等不同传输方式，识别还要考虑传输方式，不能只认一个数字。\u003c/p>\n\u003cp>一次连接还可能承载多个网页请求，现代浏览器会复用连接。因此“每个标签页固定拥有一个永久端口”也不是准确模型。这里需要理解的是两层分工：系统把信息归到连接，浏览器再把请求结果交给对应页面。\u003c/p>\n\u003cp>家中多人共用公网IP时，出口还会记录端口等信息，区分回复应返回哪台设备。这就是\u003ca href=\"#/nat\">共享出口\u003c/a>在地址之外必须保留通信记录的原因。\u003c/p>\n\u003ch2 id=\"section-5\">本机能开，为什么别人不能用同一地址打开\u003c/h2>\n\u003cp>\u003ccode>localhost\u003c/code>指访问者当前这台设备，\u003ccode>127.0.0.1\u003c/code>是常见本机回环地址。你把自己的localhost链接发给朋友，他的浏览器会去找他自己电脑上的那个端口，不会自动找你。\u003c/p>\n\u003cp>即使你给出局域网IP，服务也可能只接收本机访问；即使服务接受局域网访问，外地朋友仍可能没有进入你家网络的路径。要对外提供服务，还要同时有程序正在运行、愿意接收外部请求，网络能把请求送到，并且你有权使用。见\u003ca href=\"#/deploy\">自己的网页如何分享\u003c/a>。\u003c/p>\n\u003cp>所以拿到IP加端口时，可以依次问：目标在哪里，这个入口是什么服务，它是否在运行，我从当前网络能否到达，是否有权使用。传输端口与连接的规范依据见\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>，网页默认入口和主机信息见\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP语义规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"知道IP后，为什么还要写端口？ 你在浏览器里见过 http://192.168.1.20:8080 ，也见过 localhost:3000 。冒号后面的数字是端口。 IP帮助数据到达目标设备的网络接口，端口帮助设备把数据交给相应程序或连接。 只有地址还不足以说明要联系哪项服务。 这些地址是教学示例，不要求你实际打开或修改。一个设备上可以同时运行网页、文件共享、远程控制等程序；它们需要分别接住属于自己的通信。 同一设备上，不同程序可以使用不同端口 下面是一台 虚构家用设备 ：管理网页在8080接收，照片展示服务在9000接收。你用同一个IP加不同端口，就可能进入不同服务。把8080改成9000不是“翻到同一网站第9000页”，而是在联系另一个接收入口。 到达同一设备IP的通信按端口进入不同接收程序；入口无人监听时，不会自动打开页面。 程序在某个端口等待相应通信，叫“监听”。它是软件与操作系统建立的接收安排，不是电脑上新增一个实体插孔。网线接口与这里说的端口是两回事。 如果9000上根本没有程序接收，浏览器可能报连接拒绝；若防护规则或路径把信息丢掉，也可能表现为等待超时。端口数字本身没有“打开照片”的能力，必须有对应服务，且当前网络能连接它，而且访问规则允许这次请求。 普通网址看不到端口，为什么也能访问 HTTP通常默认80，HTTPS通常默认443，因此普通网站省略它们。 https://shop.example.com 常可理解为使用443这个入口，不需要用户填数字。这里的默认只决定尝试哪个入口，不保证那里真的有服务。 定制服务、本地开发或设备管理页可能使用其他端口，提供者就会把它写进地址。实际采用什么数字，由接收程序与部署安排决定；把别人的教程端口照搬到自己的服务，未必成立。 访问方式也必须匹配。某端口提供普通HTTP，另一个提供HTTPS；不是换成https字样就能让对方突然支持保护连接。你收到的完整地址同时包含这两类约定。 端口、路径、子域名怎样一起工作 想象这家虚构网站在同一公共接收入口提供商品、订单和帮助： /products/42 、 /orders/18 、 /help 。这些路径由已经接住请求的网站程序解释，不需要每个页面单独分配端口。 同一个接收入口也能为 shop.example.com 和 help.example.com 服务。网页请求里保留主机信息，入口可据此选择站点，再按路径选资源。因此关系不是“一个IP对应一个网站，一个端口对应一页”。域名与多站点会接着展开。 你改变的内容 哪个环节先要重新判断 --- --- IP地址 联系哪个网络目标 端口 该目标上哪个接收入口 主机名 查询哪个名称；接收入口还需识别哪个站点 /后面的路径 站点中的哪个资源或操作 打开网页时，浏览器既要找到目标IP和端口，也要在请求中说明主机名、路径等信息。这些部分一起使用，各自影响不同步骤。 我的电脑同时开很多网页，回复怎么不混在一起 浏览器发起连接时，你这端也会使用自己的通信端口。常见TCP连接可由两端地址、两端端口区分，设备才能把回复送回相应连接。若使用UDP等不同传输方式，识别还要考虑传输方式，不能只认一个数字。 一次连接还可能承载多个网页请求，现代浏览器会复用连接。因此“每个标签页固定拥有一个永久端口”也不是准确模型。这里需要理解的是两层分工：系统把信息归到连接，浏览器再把请求结果交给对应页面。 家中多人共用公网IP时，出口还会记录端口等信息，区分回复应返回哪台设备。这就是共享出口在地址之外必须保留通信记录的原因。 本机能开，为什么别人不能用同一地址打开 localhost 指访问者当前这台设备， 127.0.0.1 是常见本机回环地址。你把自己的localhost链接发给朋友，他的浏览器会去找他自己电脑上的那个端口，不会自动找你。 即使你给出局域网IP，服务也可能只接收本机访问；即使服务接受局域网访问，外地朋友仍可能没有进入你家网络的路径。要对外提供服务，还要同时有程序正在运行、愿意接收外部请求，网络能把请求送到，并且你有权使用。见自己的网页如何分享。 所以拿到IP加端口时，可以依次问：目标在哪里，这个入口是什么服务，它是否在运行，我从当前网络能否到达，是否有权使用。传输端口与连接的规范依据见TCP规范，网页默认入口和主机信息见HTTP语义规范。","outline":[{"id":"section-1","title":"同一设备上，不同程序可以使用不同端口","depth":2},{"id":"section-2","title":"普通网址看不到端口，为什么也能访问","depth":2},{"id":"section-3","title":"端口、路径、子域名怎样一起工作","depth":2},{"id":"section-4","title":"我的电脑同时开很多网页，回复怎么不混在一起","depth":2},{"id":"section-5","title":"本机能开，为什么别人不能用同一地址打开","depth":2}]},{"id":"nat","group":"address","title":"电脑的IP与网站看到的IP，为什么不一样？","question":"电脑的IP与网站看到的IP，为什么不一样？","summary":"路由器转换对外使用的地址，并记录哪台设备发出了请求，把回复送回去。","terms":["NAT","共享IP","动态IP","静态IP"],"aliases":["NAT","Network Address Translation 地址转换","共享IP","","动态IP","","静态IP",""],"related":["ip","remote","deploy","identity","risk"],"html":"\u003cp>你查看电脑网络设置，得到一个地址；打开IP查询网页，又看到另一个地址。\u003c cGF0aCBkPSJNMjQ5IDM5OEgzODFWMjU3SDI1NCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjMiIG1hcmtlci1lbmQ9InVybCgjYSkiIHN0cm9rZS1kYXNoYXJyYXk9IjcgNiIvPjxwYXRoIGQ9Ik0xNjcgMjUwSDU5VjE3NSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjMiIG1hcmtlci1lbmQ9InVybCgjYSkiIHN0cm9rZS1kYXNoYXJyYXk9IjcgNiIvPjxwYXRoIGQ9Ik0yNTMgMjUwSDM1MFYxNzUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIzIiBtYXJrZXItZW5kPSJ1cmwoI2EpIiBzdHJva2UtZGFzaGFycmF5PSI3IDYiLz48dGV4dCB4PSIyMTAiIHk9IjQ5MyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzI0M2IzNiI+5Ye65Y+j5oyJ6L+e5o6l5YWz57O75YiG6YCB5Zue5aSNPC90ZXh0PjwvZz48L3N2Zz4=\" alt=\"内网A与B通过出口X访问网站，网站可看到共同来源；出口按连接映射分送回复。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>内网A与B通过出口X访问网站，网站可看到共同来源；出口按连接映射分送回复。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">两个人同时购物，回复怎么回到正确电脑\u003c/h2>\n\u003cp>在一个\u003cstrong>虚构家庭示例\u003c/strong>里，电脑A和手机B同时打开同一商品站。两台设备有不同内部地址和连接信息，家中出口转送时记录对应关系，把它们的来源改为对外地址，并用端口等线索区分通信。\u003c/p>\n\u003cp>网站把回复送回家里的公网地址后，路由器根据保存的对应关系，把A的回复交给A，把B的回复交给B。它不是拆开网页看“这是小林的订单”再转发，而是按连接映射处理。路由器的记录用来转送回复。至于哪个账号拥有哪些订单，由购物网站根据浏览器发来的登录标记核对。\u003c/p>\n\u003cp>因此两个人查询公网IP可能相同，购物车却不同。反过来，你切热点后来源改变，账号和购物车也可能继续保留。共享出口与账号系统可以同时工作，不需要一人固定一个公网地址。\u003c/p>\n\u003ch2 id=\"section-2\">为什么我能出去，朋友却不能主动进来\u003c/h2>\n\u003cp>你先访问网站，出口就有返回通信所需的记录。朋友从外面主动访问家中某个服务，是新来的连接，出口并不自动知道把它交给谁，也未必允许这种访问。你主动访问网站后接收它的回复，不等于允许任何外部设备主动访问家里的服务。\u003c/p>\n\u003cp>“端口转发”是让路由器把发往某个公网端口的请求，转给家中指定设备的指定端口。公网一侧与内网一侧的端口可以不同。它并不是换一个数字就能消除所有边界：程序仍须运行、允许接收，上游也须把访问送到你的出口。\u003c/p>\n\u003cp>若运营商还在家庭出口前安排共享地址，仅修改家里路由器的端口转发，外部请求仍可能到不了家里，因为运营商还在前面做了一次共享地址转换。远程访问可以采用\u003ca href=\"#/remote\">获准的私有连接\u003c/a>，公共网页则可由\u003ca href=\"#/deploy\">托管入口\u003c/a>承担接收。\u003c/p>\n\u003ch2 id=\"section-3\">固定、共享和地域，是不同属性\u003c/h2>\n\u003cp>把内部地址固定为192.168.1.20，只是让家庭网络里的定位稳定；它不会自动把外部来源固定。购买某种公共出口服务时，也要分清地址是否固定、是否共用、由什么网络提供、访问范围是什么。\u003c/p>\n\u003cp>同IP的访问可能汇集全办公室或更多家庭，平台按IP计数时自然会一起看到。平台可以用IP统计访问量，却不能仅凭这个统计认定所有访问都来自同一个人。\u003ca href=\"#/risk\">风控\u003c/a>要在这一事实基础上解释，不能把“多人共用”写成所有网络都必然如此。\u003c/p>\n\u003ch2 id=\"section-4\">几台设备，怎样共用一个出口\u003c/h2>\n\u003cp>家中电脑、手机可以有不同内部地址，路由器把它们的访问转换成同一个公网来源。回复回来后，还要分清交给哪台设备、哪次连接。负责这种转换与映射的机制叫NAT。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享IPv4地址的机制\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>下面的教学示意把地址写成“电脑A、手机B、出口X”，避免数字遮住关系。关键是出口保存了连接的对应关系，回复不会因为共享一个公网地址就随机分给家中设备。\u003c/p>\n\u003ch2 id=\"section-5\">网站只看到门口，可能看不到屋内\u003c/h2>\n\u003cp>两台设备都通过X访问网站，网站便可能观察到同一来源X。IP查询页只能报告它接收到的访问来源，不能直接枚举你家里所有地址。\u003c/p>\n\u003cp>运营商也可能把更多家庭的连接汇集到共享出口；公司、校园和VPN服务同样可能让很多人共用来源。因此，来源IP相同，可能只是因为用了同一个出口，不能单独说明账号属于同一个人。\u003c/p>\n\u003ch2 id=\"section-6\">静态与动态，说的是会不会变化\u003c/h2>\n\u003cp>固定保留的地址常称静态IP，按接入安排可能改变的常称动态IP。动态不代表每次刷新网页都变，静态也不代表只给一个人用。地址是否固定与是否共享，是两项不同属性。\u003c/p>\n\u003cp>把电脑的内部地址设为固定，也不会自动把它变成公网地址。你只改变了内部地址安排，对外入口还取决于上游网络。\u003c/p>\n\u003ch2 id=\"section-7\">为什么外面的人不能照着内部地址找到你\u003c/h2>\n\u003cp>内部地址可以在不同家庭重复。朋友在自己的家里输入你家的内部地址，通常不会自动抵达你家。共享出口通常依照已建立的出站连接处理回复，也不会把所有外来的新连接转送进屋。\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">出站与主动入站的区别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>这解释了“我能打开别人的网站，别人却打不开我电脑里的服务”。要让指定设备远程访问，见\u003ca href=\"#/remote\">远程连接\u003c/a>；要发布公共网页，见\u003ca href=\"#/deploy\">部署与访问\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-8\">IPv6让这张图多了一种可能\u003c/h2>\n\u003cp>使用IPv6时，设备常能各自拥有公网地址，不必把所有设备都藏在同一个IPv4出口后面。不过，访问是否允许仍取决于防火墙、路由和程序。查到自己的公网IPv6，也不能直接判定自己的所有服务对外开放。\u003c/p>\n","text":"电脑的IP与网站看到的IP，为什么不一样？ 你查看电脑网络设置，得到一个地址；打开IP查询网页，又看到另一个地址。 在常见的共享IPv4网络里，前者是内部地址，后者是这次访问经过的对外出口。 内网A与B通过出口X访问网站，网站可看到共同来源；出口按连接映射分送回复。 两个人同时购物，回复怎么回到正确电脑 在一个 虚构家庭示例 里，电脑A和手机B同时打开同一商品站。两台设备有不同内部地址和连接信息，家中出口转送时记录对应关系，把它们的来源改为对外地址，并用端口等线索区分通信。 网站把回复送回家里的公网地址后，路由器根据保存的对应关系，把A的回复交给A，把B的回复交给B。它不是拆开网页看“这是小林的订单”再转发，而是按连接映射处理。路由器的记录用来转送回复。至于哪个账号拥有哪些订单，由购物网站根据浏览器发来的登录标记核对。 因此两个人查询公网IP可能相同，购物车却不同。反过来，你切热点后来源改变，账号和购物车也可能继续保留。共享出口与账号系统可以同时工作，不需要一人固定一个公网地址。 为什么我能出去，朋友却不能主动进来 你先访问网站，出口就有返回通信所需的记录。朋友从外面主动访问家中某个服务，是新来的连接，出口并不自动知道把它交给谁，也未必允许这种访问。你主动访问网站后接收它的回复，不等于允许任何外部设备主动访问家里的服务。 “端口转发”是让路由器把发往某个公网端口的请求，转给家中指定设备的指定端口。公网一侧与内网一侧的端口可以不同。它并不是换一个数字就能消除所有边界：程序仍须运行、允许接收，上游也须把访问送到你的出口。 若运营商还在家庭出口前安排共享地址，仅修改家里路由器的端口转发，外部请求仍可能到不了家里，因为运营商还在前面做了一次共享地址转换。远程访问可以采用获准的私有连接，公共网页则可由托管入口承担接收。 固定、共享和地域，是不同属性 把内部地址固定为192.168.1.20，只是让家庭网络里的定位稳定；它不会自动把外部来源固定。购买某种公共出口服务时，也要分清地址是否固定、是否共用、由什么网络提供、访问范围是什么。 同IP的访问可能汇集全办公室或更多家庭，平台按IP计数时自然会一起看到。平台可以用IP统计访问量，却不能仅凭这个统计认定所有访问都来自同一个人。风控要在这一事实基础上解释，不能把“多人共用”写成所有网络都必然如此。 几台设备，怎样共用一个出口 家中电脑、手机可以有不同内部地址，路由器把它们的访问转换成同一个公网来源。回复回来后，还要分清交给哪台设备、哪次连接。负责这种转换与映射的机制叫NAT。共享IPv4地址的机制 下面的教学示意把地址写成“电脑A、手机B、出口X”，避免数字遮住关系。关键是出口保存了连接的对应关系，回复不会因为共享一个公网地址就随机分给家中设备。 网站只看到门口，可能看不到屋内 两台设备都通过X访问网站，网站便可能观察到同一来源X。IP查询页只能报告它接收到的访问来源，不能直接枚举你家里所有地址。 运营商也可能把更多家庭的连接汇集到共享出口；公司、校园和VPN服务同样可能让很多人共用来源。因此，来源IP相同，可能只是因为用了同一个出口，不能单独说明账号属于同一个人。 静态与动态，说的是会不会变化 固定保留的地址常称静态IP，按接入安排可能改变的常称动态IP。动态不代表每次刷新网页都变，静态也不代表只给一个人用。地址是否固定与是否共享，是两项不同属性。 把电脑的内部地址设为固定，也不会自动把它变成公网地址。你只改变了内部地址安排，对外入口还取决于上游网络。 为什么外面的人不能照着内部地址找到你 内部地址可以在不同家庭重复。朋友在自己的家里输入你家的内部地址，通常不会自动抵达你家。共享出口通常依照已建立的出站连接处理回复，也不会把所有外来的新连接转送进屋。出站与主动入站的区别 这解释了“我能打开别人的网站，别人却打不开我电脑里的服务”。要让指定设备远程访问，见远程连接；要发布公共网页，见部署与访问。 IPv6让这张图多了一种可能 使用IPv6时，设备常能各自拥有公网地址，不必把所有设备都藏在同一个IPv4出口后面。不过，访问是否允许仍取决于防火墙、路由和程序。查到自己的公网IPv6，也不能直接判定自己的所有服务对外开放。 相关概念 - IP为什么不能独立证明是谁 - 共享出口与风控","outline":[{"id":"section-1","title":"两个人同时购物，回复怎么回到正确电脑","depth":2},{"id":"section-2","title":"为什么我能出去，朋友却不能主动进来","depth":2},{"id":"section-3","title":"固定、共享和地域，是不同属性","depth":2},{"id":"section-4","title":"几台设备，怎样共用一个出口","depth":2},{"id":"section-5","title":"网站只看到门口，可能看不到屋内","depth":2},{"id":"section-6","title":"静态与动态，说的是会不会变化","depth":2},{"id":"section-7","title":"为什么外面的人不能照着内部地址找到你","depth":2},{"id":"section-8","title":"IPv6让这张图多了一种可能","depth":2}]},{"id":"domains","group":"address","title":"www、shop、api：同一个网站为何有多个域名？","question":"www、shop、api：同一个网站为何有多个域名？","summary":"www、shop、img可以在同一域名下面，却使用不同服务器或登录系统。","terms":["子域名","二级域名","主域名","同源"],"aliases":["子域名","subdomain www shop api 二级域名 多级域名","二级域名","","主域名","","同源","origin same origin CORS 跨域"],"related":["url"],"html":"\u003cp>你打开一家网站，地址栏是 \u003ccode>www.example.com\u003c/code>，购物时变成 \u003ccode>shop.example.com\u003c/code>，图片又来自 \u003ccode>img.example.com\u003c/code>。\u003cstrong>它们都是example.com下面的子域名，但可以指向不同服务器、运行不同程序，也可能要求分别登录。\u003c/strong> 你眼中的同一家网站，可能用几个不同的主机名提供页面、图片和数据。\u003c/p>\n\u003cp>本篇用example.com这组保留示例域名说明，功能分配均为虚构教学设计。真实网站需要以实际链接和官方说明判断。\u003c/p>\n\u003ch2 id=\"section-1\">域名的层级要从右向左看\u003c/h2>\n\u003cp>\u003ccode>com\u003c/code>位于顶级，\u003ccode>example.com\u003c/code>是在它下面的名称，\u003ccode>shop.example.com\u003c/code>又在example.com下面，\u003ccode>m.shop.example.com\u003c/code>还多了一层。每一个点隔开的标签增加命名层次；左侧名称在右侧名称之下。\u003c/p>\n\u003cp>在这组例子里，example.com通常是可注册的域名；网站管理者可以安排shop、help等子域名。子域名不是另一个页面目录，名字里的shop也不会自动生成购物功能，只是人选的名称。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MjAgNTkwIiByb2xlPSJpbWciPjx0aXRsZT7ln5/lkI3moJHkuI7lrp7pmYXmjqXmlLblhaXlj6PnmoTljLrliKs8L3RpdGxlPjxkZWZzPjxtYXJrZXIgaWQ9ImEiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjYiIHJlZlk9IjMiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEw2IDNMMCA2IiBmaWxsPSJub25lIiBzdHJva2U9IiM0Mjc2NjQiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1OTAiIGZpbGw9IiNmYWY4ZjIiLz48c3R5bGU+dGV4dHtmb250LWZhbWlseTpQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZjtmaWxsOiMyOTRkNDA7Zm9udC1zaXplOjE1cHh9LnNtYWxse2ZvbnQtc2l6ZToxMnB4O2ZpbGw6IzY2NzQ2N30udGl0bGV7Zm9udC1zaXplOjIxcHg7Zm9udC13ZWlnaHQ6NjAwfS5saW5le2ZpbGw6bm9uZTtzdHJva2U6IzQyNzY2NDtzdHJva2Utd2lkdGg6MjttYXJrZXItZW5kOnVybCgjYSl9PC9zdHlsZT48dGV4dCB4PSIyNCIgeT0iMzgiIGNsYXNzPSJ0aXRsZSI+5a2Q5Z+f5ZCN5Y+v5Lul55So5LiN5ZCM5pyN5Yqh5ZmoPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSI2NiIgY2xhc3M9InNtYWxsIj7lkIzlsZ5leGFtcGxlLmNvbe+8jOacj ption>shop、help和img都是example.com的子域名。它们可以共用服务器，也可以使用不同服务器。\u003c/figcaption>\u003c/figure>\n\u003cp>“二级域名”有时按名称层级严格使用，有时在日常沟通中被拿来指子域名。听别人这样说时，最好拿到实际名称，而不是只凭叫法判断结构。对 \u003ccode>example.co.uk\u003c/code> 之类名称，可注册部分的边界不等于永远取最后两段；\u003ca href=\"https://publicsuffix.org/learn/\" target=\"_blank\" rel=\"noopener noreferrer\">公用后缀有自己的规则\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-2\">子域名和斜线后目录，是两种划分\u003c/h2>\n\u003cp>\u003ccode>shop.example.com\u003c/code> 改变了主机名；\u003ccode>example.com/shop\u003c/code> 保持主机名、改变路径。shop.example.com可以在DNS中单独设置地址；example.com/shop则仍先联系example.com，网站程序收到请求后再处理/shop这个路径。\u003c/p>\n\u003cp>网站可以把两种做法设计成相似界面，也可以让其中一个跳转到另一个。你看见相同品牌和导航，不能据此推断底层一定相同；看到不同子域名，也不能推断一定是不同公司。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>例子\u003c/th>\n\u003cth>改的是哪一部分\u003c/th>\n\u003cth>常见用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"http://www.example.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.example.com\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/td>\n\u003ctd>主机名\u003c/td>\n\u003ctd>主站入口；www可有可无，并非强制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>shop.example.com\u003c/td>\n\u003ctd>主机名\u003c/td>\n\u003ctd>购物入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>api.example.com\u003c/td>\n\u003ctd>主机名\u003c/td>\n\u003ctd>应用取数据或执行操作的入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>example.com/help\u003c/td>\n\u003ctd>路径\u003c/td>\n\u003ctd>同一名称下的帮助资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>example.com/help?page=2\u003c/td>\n\u003ctd>查询条件\u003c/td>\n\u003ctd>帮助资源的筛选或分页\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>api是常见的人为命名，不代表一种特殊的网络地址。它背后提供的是供程序调用的服务；普通页面也可以通过相同主机名的路径提供这些服务。\u003c/p>\n\u003ch2 id=\"section-3\">为什么两个域名能是同一个IP\u003c/h2>\n\u003cp>同一台服务器可以提供多个网站。浏览器虽然联系相同IP和端口，网页访问还带着想访问的主机名，服务据此分派到shop或help。保护连接的证书也需要适合所访问的名称。\u003c/p>\n\u003cp>因此直接把域名换成查到的IP，有时打不开，或者出现证书错误，或者打开了另一个站点。这不证明地址查询错了，而可能是没有提供服务器选择网站或浏览器核对证书所需要的主机名。IP把请求送到服务器；主机名继续告诉服务器，浏览器要访问它提供的哪一个网站。\u003c/p>\n\u003cp>反方向也成立：同一个主机名可以返回多个地址，用于不同地点或负载安排。你和朋友查到的地址不同，不必就是伪造；要结合实际服务和查询环境判断。\u003ca href=\"#/dns\">DNS过程\u003c/a>负责解释地址怎样查出。\u003c/p>\n\u003ch2 id=\"section-4\">同一品牌，为什么某个子域名还要登录\u003c/h2>\n\u003cp>几个子域名是否共用账号，需要网站专门安排。浏览器还限制不同网站页面之间的数据读取：访问方式、主机名、端口三项相同才通常算同源。\u003ccode>https://shop.example.com\u003c/code> 和 \u003ccode>https://help.example.com\u003c/code> 的主机名不同，就不是同源。\u003c/p>\n\u003cp>同源用于控制页面程序读取其他来源的数据；它不意味着跨来源请求绝对不能发出。登录标记又有自身的Cookie范围规则，有的仅发给某个主机，有的可以覆盖合适的父域名范围。登录标记是否发给另一个子域名，要看Cookie的发送规则；页面能否读取另一个来源的数据，要看同源等规则；账号是否通用，则要看网站是否共用登录系统。这三件事各有条件。\u003c/p>\n\u003cp>所以帮助站有时自动认得账号，有时需要再次登录；这是共享登录安排与浏览器规则的结果，不能只从“都在example.com下面”推出必然结论。细节见\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy\" target=\"_blank\" rel=\"noopener noreferrer\">浏览器同源规则\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"#/identity\">会话身份\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">怎样读一个看起来很像官方的域名\u003c/h2>\n\u003cp>\u003ccode>shop.example.com\u003c/code>和\u003ccode>example.com.other-site.net\u003c/code>不同。后一串的example.com在左侧名字里，整串却在other-site.net下面；不能因为开头出现熟悉名称就认成前一家网站。路径和参数也可以含某品牌的文字，仍不改变真正主机。\u003c/p>\n\u003cp>页面可以做得很像官方页面，但网站名称仍可能属于别的域名。确认真实服务时应核对完整主机名和已知官方入口，再考虑页面用途；HTTPS的保护不能替代这个核对。名称层级可核对\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name\" target=\"_blank\" rel=\"noopener noreferrer\">MDN域名说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>，来源定义见\u003ca href=\"https://developer.mozilla.org/en-US/docs/Glossary/Origin\" target=\"_blank\" rel=\"noopener noreferrer\">浏览器的origin\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"www、shop、api：同一个网站为何有多个域名？ 你打开一家网站，地址栏是 www.example.com ，购物时变成 shop.example.com ，图片又来自 img.example.com 。 它们都是example.com下面的子域名，但可以指向不同服务器、运行不同程序，也可能要求分别登录。 你眼中的同一家网站，可能用几个不同的主机名提供页面、图片和数据。 本篇用example.com这组保留示例域名说明，功能分配均为虚构教学设计。真实网站需要以实际链接和官方说明判断。 域名的层级要从右向左看 com 位于顶级， example.com 是在它下面的名称， shop.example.com 又在example.com下面， m.shop.example.com 还多了一层。每一个点隔开的标签增加命名层次；左侧名称在右侧名称之下。 在这组例子里，example.com通常是可注册的域名；网站管理者可以安排shop、help等子域名。子域名不是另一个页面目录，名字里的shop也不会自动生成购物功能，只是人选的名称。 shop、help和img都是example.com的子域名。它们可以共用服务器，也可以使用不同服务器。 “二级域名”有时按名称层级严格使用，有时在日常沟通中被拿来指子域名。听别人这样说时，最好拿到实际名称，而不是只凭叫法判断结构。对 example.co.uk 之类名称，可注册部分的边界不等于永远取最后两段；公用后缀有自己的规则。 子域名和斜线后目录，是两种划分 shop.example.com 改变了主机名； example.com/shop 保持主机名、改变路径。shop.example.com可以在DNS中单独设置地址；example.com/shop则仍先联系example.com，网站程序收到请求后再处理/shop这个路径。 网站可以把两种做法设计成相似界面，也可以让其中一个跳转到另一个。你看见相同品牌和导航，不能据此推断底层一定相同；看到不同子域名，也不能推断一定是不同公司。 例子 改的是哪一部分 常见用途 --- --- --- www.example.com 主机名 主站入口；www可有可无，并非强制 shop.example.com 主机名 购物入口 api.example.com 主机名 应用取数据或执行操作的入口 example.com/help 路径 同一名称下的帮助资源 example.com/help?page=2 查询条件 帮助资源的筛选或分页 api是常见的人为命名，不代表一种特殊的网络地址。它背后提供的是供程序调用的服务；普通页面也可以通过相同主机名的路径提供这些服务。 为什么两个域名能是同一个IP 同一台服务器可以提供多个网站。浏览器虽然联系相同IP和端口，网页访问还带着想访问的主机名，服务据此分派到shop或help。保护连接的证书也需要适合所访问的名称。 因此直接把域名换成查到的IP，有时打不开，或者出现证书错误，或者打开了另一个站点。这不证明地址查询错了，而可能是没有提供服务器选择网站或浏览器核对证书所需要的主机名。IP把请求送到服务器；主机名继续告诉服务器，浏览器要访问它提供的哪一个网站。 反方向也成立：同一个主机名可以返回多个地址，用于不同地点或负载安排。你和朋友查到的地址不同，不必就是伪造；要结合实际服务和查询环境判断。DNS过程负责解释地址怎样查出。 同一品牌，为什么某个子域名还要登录 几个子域名是否共用账号，需要网站专门安排。浏览器还限制不同网站页面之间的数据读取：访问方式、主机名、端口三项相同才通常算同源。 https://shop.example.com 和 https://help.example.com 的主机名不同，就不是同源。 同源用于控制页面程序读取其他来源的数据；它不意味着跨来源请求绝对不能发出。登录标记又有自身的Cookie范围规则，有的仅发给某个主机，有的可以覆盖合适的父域名范围。登录标记是否发给另一个子域名，要看Cookie的发送规则；页面能否读取另一个来源的数据，要看同源等规则；账号是否通用，则要看网站是否共用登录系统。这三件事各有条件。 所以帮助站有时自动认得账号，有时需要再次登录；这是共享登录安排与浏览器规则的结果，不能只从“都在example.com下面”推出必然结论。细节见浏览器同源规则与会话身份。 怎样读一个看起来很像官方的域名 shop.example.com 和 example.com.other-site.net 不同。后一串的example.com在左侧名字里，整串却在other-site.net下面；不能因为开头出现熟悉名称就认成前一家网站。路径和参数也可以含某品牌的文字，仍不改变真正主机。 页面可以做得很像官方页面，但网站名称仍可能属于别的域名。确认真实服务时应核对完整主机名和已知官方入口，再考虑页面用途；HTTPS的保护不能替代这个核对。名称层级可核对MDN域名说明，来源定义见浏览器的origin。","outline":[{"id":"section-1","title":"域名的层级要从右向左看","depth":2},{"id":"section-2","title":"子域名和斜线后目录，是两种划分","depth":2},{"id":"section-3","title":"为什么两个域名能是同一个IP","depth":2},{"id":"section-4","title":"同一品牌，为什么某个子域名还要登录","depth":2},{"id":"section-5","title":"怎样读一个看起来很像官方的域名","depth":2}]},{"id":"dns","group":"address","title":"输入网址后，电脑怎么找到网站？","question":"输入网址后，电脑怎么找到网站？","summary":"名称查询先找出可联系的地址，浏览器再与服务通信。","terms":["域名","DNS"],"aliases":["域名","","DNS","Domain Name System 域名解析"],"related":["domains","ip","browsing","troubleshoot"],"html":"\u003cp>人容易记住网站名字，网络转送数据包却需要IP地址。\u003cstrong>DNS帮助查询一个网站名称对应的IP地址等记录。浏览器取得地址后，才能尝试连接网站、请求网页。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">查询shop.example.com时，DNS做了什么\u003c/h2>\n\u003cp>你点开商品链接，浏览器已经识别出主机名；它通常先向系统或查询服务取得该名称的地址记录。假设这是一次没有可用旧记录的\u003cstrong>虚构教学访问\u003c/strong>：查询服务按名称层级找负责记录的一方，拿到答案后返回，浏览器才尝试连接那个地址的服务端口。\u003c/p>\n\u003cp>网址中的 \u003ccode>/products/42?color=blue\u003c/code> 不用拿给DNS解释。DNS不知道你的商品选择，也不负责把42号商品图片查出来。请求里的主机名、路径和其他内容会在后面的网页服务中继续发挥作用。\u003c/p>\n\u003ch2 id=\"section-2\">每一层可以由不同人维护\u003c/h2>\n\u003cp>DNS记录由许多机构分别管理。查询服务从名称的上级记录中找到下一步该询问谁，逐步找到负责这个名称的记录。网站管理者更新自己的记录，查询服务帮用户查到答案，并暂存查询结果。它不需要在一台机器上保存全世界的网站内容。\u003c/p>\n\u003cp>记录有不同用途，常见的A和AAAA分别表达IPv4、IPv6地址；别名记录可以指向另一个名称。这里不要求你配置，只需知道“查名称”可能经过多个记录，并不是一个名字永远对应一个数字。\u003c/p>\n\u003ch2 id=\"section-3\">同一网址在公司能开，回家为什么查不到\u003c/h2>\n\u003cp>公司可以让内部系统的名称只在公司网络中查得到。连接公司VPN后，电脑可能使用公司的DNS，才查到报销系统的地址。只更改普通公共DNS，并不会凭空创造公司内部记录或访问权限。\u003c/p>\n\u003cp>还有一种\u003cstrong>教学对照\u003c/strong>：网站迁移到新入口，旧缓存尚未过期。两个设备可能联系不同地址，其中一个暂时看到旧站。若两台已经联系相同入口、内容仍不同，还要考虑网页缓存、账号或服务发布，不该继续把所有差异归给DNS。\u003c/p>\n\u003ch2 id=\"section-4\">为什么换查询服务未必解决访问失败\u003c/h2>\n\u003cp>如果旧查询服务无法回答，新服务可能帮助取得记录；但取得相同地址后，仍联系不到那个地址上的程序，网页照样失败。改DNS改变“谁帮你找名称”，不是自动接管所有后续流量。\u003c/p>\n\u003cp>你可以把失败分成两个待核对问题：名称有没有得到适用记录；当前网络能否连接那个地址和端口上的程序。不要把“直接打开IP失败”当成必然的DNS反证，因为网站还可能需要名称进行证书和站点匹配，见\u003ca href=\"#/domains\">多个域名与入口\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">问名字与取内容，是两件事\u003c/h2>\n\u003cp>浏览器需要访问一个域名时，系统可能先使用已有记录；没有合适记录时，再向名称查询服务询问。DNS可以返回地址，也能返回其他用途的记录。浏览器取得地址后，才有条件沿网络联系对应服务。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc1034.html\" target=\"_blank\" rel=\"noopener noreferrer\">名称系统的组织方式\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>DNS不会替你把网页内容运回来，也不会替网站执行登录。名称查到了，后面的连接仍可能失败。\u003c/p>\n\u003ch2 id=\"section-6\">这本“通讯录”由很多地方维护\u003c/h2>\n\u003cp>可以暂时把DNS想成通讯录，但它不是所有人的名字塞在同一台电脑里。名称按层级管理，不同地方负责不同范围；查询服务可以跟随线索找到负责该名称的权威记录。\u003c/p>\n\u003cp>权威记录的管理者决定“这个名字目前指向哪些记录”。普通查询服务则帮你找答案，并可能暂时保存结果，避免每次从头查。\u003c/p>\n\u003ch2 id=\"section-7\">为什么改了地址，有人还看见旧网站\u003c/h2>\n\u003cp>查询记录会缓存一段时间。网站迁移后，已有缓存可能暂时继续使用旧结果，所以不同访问者并不一定同时切换。网站内容本身也可能有另外一层缓存，不能把所有旧内容都归因DNS。\u003c/p>\n\u003cp>一个名字还可能对应多个地址，让不同访问抵达不同服务入口。反过来，多个网站也可能由同一服务入口接收，网站服务器再根据请求中的主机名分辨要提供哪个站点。\u003c/p>\n\u003cp>DNS查询已知名称的记录；搜索引擎则根据关键词寻找内容和网页入口，这不是同一种查找。\u003c/p>\n\u003ch2 id=\"section-8\">改DNS，改变的是谁帮你查名字\u003c/h2>\n\u003cp>更换DNS服务可能改变查询成功率、速度或某些答案。它不等于把后续所有访问送到那个查询服务，也不自动改变公共上网出口。\u003c/p>\n\u003cp>若VPN安排了内部名称查询，公司系统的名字可能只有连接后才能查到。恢复时应保留原设置记录，避免把公司的内部解析规则随意替换。具体操作顺序见\u003ca href=\"#/setup\">VPN配置\u003c/a>。\u003c/p>\n\u003cp>“DNS查错”和“网站服务器不回答”会产生相似的打不开现象。需要对照证据才能区分，不能只凭一条错误提示断言原因。\u003c/p>\n","text":"输入网址后，电脑怎么找到网站？ 人容易记住网站名字，网络转送数据包却需要IP地址。 DNS帮助查询一个网站名称对应的IP地址等记录。浏览器取得地址后，才能尝试连接网站、请求网页。 查询shop.example.com时，DNS做了什么 你点开商品链接，浏览器已经识别出主机名；它通常先向系统或查询服务取得该名称的地址记录。假设这是一次没有可用旧记录的 虚构教学访问 ：查询服务按名称层级找负责记录的一方，拿到答案后返回，浏览器才尝试连接那个地址的服务端口。 网址中的 /products/42?color=blue 不用拿给DNS解释。DNS不知道你的商品选择，也不负责把42号商品图片查出来。请求里的主机名、路径和其他内容会在后面的网页服务中继续发挥作用。 每一层可以由不同人维护 DNS记录由许多机构分别管理。查询服务从名称的上级记录中找到下一步该询问谁，逐步找到负责这个名称的记录。网站管理者更新自己的记录，查询服务帮用户查到答案，并暂存查询结果。它不需要在一台机器上保存全世界的网站内容。 记录有不同用途，常见的A和AAAA分别表达IPv4、IPv6地址；别名记录可以指向另一个名称。这里不要求你配置，只需知道“查名称”可能经过多个记录，并不是一个名字永远对应一个数字。 同一网址在公司能开，回家为什么查不到 公司可以让内部系统的名称只在公司网络中查得到。连接公司VPN后，电脑可能使用公司的DNS，才查到报销系统的地址。只更改普通公共DNS，并不会凭空创造公司内部记录或访问权限。 还有一种 教学对照 ：网站迁移到新入口，旧缓存尚未过期。两个设备可能联系不同地址，其中一个暂时看到旧站。若两台已经联系相同入口、内容仍不同，还要考虑网页缓存、账号或服务发布，不该继续把所有差异归给DNS。 为什么换查询服务未必解决访问失败 如果旧查询服务无法回答，新服务可能帮助取得记录；但取得相同地址后，仍联系不到那个地址上的程序，网页照样失败。改DNS改变“谁帮你找名称”，不是自动接管所有后续流量。 你可以把失败分成两个待核对问题：名称有没有得到适用记录；当前网络能否连接那个地址和端口上的程序。不要把“直接打开IP失败”当成必然的DNS反证，因为网站还可能需要名称进行证书和站点匹配，见多个域名与入口。 问名字与取内容，是两件事 浏览器需要访问一个域名时，系统可能先使用已有记录；没有合适记录时，再向名称查询服务询问。DNS可以返回地址，也能返回其他用途的记录。浏览器取得地址后，才有条件沿网络联系对应服务。名称系统的组织方式 DNS不会替你把网页内容运回来，也不会替网站执行登录。名称查到了，后面的连接仍可能失败。 这本“通讯录”由很多地方维护 可以暂时把DNS想成通讯录，但它不是所有人的名字塞在同一台电脑里。名称按层级管理，不同地方负责不同范围；查询服务可以跟随线索找到负责该名称的权威记录。 权威记录的管理者决定“这个名字目前指向哪些记录”。普通查询服务则帮你找答案，并可能暂时保存结果，避免每次从头查。 为什么改了地址，有人还看见旧网站 查询记录会缓存一段时间。网站迁移后，已有缓存可能暂时继续使用旧结果，所以不同访问者并不一定同时切换。网站内容本身也可能有另外一层缓存，不能把所有旧内容都归因DNS。 一个名字还可能对应多个地址，让不同访问抵达不同服务入口。反过来，多个网站也可能由同一服务入口接收，网站服务器再根据请求中的主机名分辨要提供哪个站点。 DNS查询已知名称的记录；搜索引擎则根据关键词寻找内容和网页入口，这不是同一种查找。 改DNS，改变的是谁帮你查名字 更换DNS服务可能改变查询成功率、速度或某些答案。它不等于把后续所有访问送到那个查询服务，也不自动改变公共上网出口。 若VPN安排了内部名称查询，公司系统的名字可能只有连接后才能查到。恢复时应保留原设置记录，避免把公司的内部解析规则随意替换。具体操作顺序见VPN配置。 “DNS查错”和“网站服务器不回答”会产生相似的打不开现象。需要对照证据才能区分，不能只凭一条错误提示断言原因。 相关概念 - 浏览器怎样请求网页 - 逐跳转送怎样发生","outline":[{"id":"section-1","title":"查询shop.example.com时，DNS做了什么","depth":2},{"id":"section-2","title":"每一层可以由不同人维护","depth":2},{"id":"section-3","title":"同一网址在公司能开，回家为什么查不到","depth":2},{"id":"section-4","title":"为什么换查询服务未必解决访问失败","depth":2},{"id":"section-5","title":"问名字与取内容，是两件事","depth":2},{"id":"section-6","title":"这本“通讯录”由很多地方维护","depth":2},{"id":"section-7","title":"为什么改了地址，有人还看见旧网站","depth":2},{"id":"section-8","title":"改DNS，改变的是谁帮你查名字","depth":2}]},{"id":"routes","group":"address","title":"经过那么多网络，谁决定往哪走？","question":"经过那么多网络，谁决定往哪走？","summary":"中间设备根据自己掌握的转发规则决定下一跳。","terms":["路由","路由器","网关"],"aliases":["路由","","路由器","","网关",""],"related":["ip","vpn","speed"],"html":"\u003cp>互联网没有要求你的手机认识沿途每一台设备。\u003cstrong>每台负责转送的设备查看目的IP，再根据自己的转发表选择下一台设备或下一段连接。这个下一步就叫“下一跳”。\u003c/strong> 一跳接一跳，信息才有机会到达目的地。\u003c/p>\n\u003ch2 id=\"section-1\">家里的电脑是怎样决定第一步的\u003c/h2>\n\u003cp>你访问家庭打印机，目标可能在附近网络内；你访问远方商品站，设备通常需要把通信交给通向外部的网关。设备根据当前地址安排和路由规则选去向，不是浏览器亲自列出全国每一台转发设备。\u003c/p>\n\u003cp>出口再按自己知道的地址范围和下一跳继续送。不同网络互相连接，并交换哪些地址可以从哪里到达的信息。转送设备据此选择下一步，后面的设备继续转送。互联网并没有一台所有请求都必须经过的“总服务器”；商品网站、聊天服务器和VPN服务器可以在不同网络里。\u003c/p>\n\u003ch2 id=\"section-2\">原网站没变，路径为什么会变\u003c/h2>\n\u003cp>\u003cstrong>虚构教学对照\u003c/strong>：同一电脑在家里访问商品站很快，在另一处Wi-Fi等待很久。目标名称相同，但起点网络、互联安排、可能选到的服务入口及当前负载都可不同。地理上离网站更近，未必通信路线更短或更顺。\u003c/p>\n\u003cp>信息去程和回复回程也不需要严格经过同样节点。若某段中断，转送设备可能根据更新后的规则选择其他连接；更新需要时间，也不是任何地方都有备用通路。所以短暂连接中断并不一定代表网站停止运行。\u003c/p>\n\u003ch2 id=\"section-3\">连接VPN是在增加另一个路径选择\u003c/h2>\n\u003cp>你启用公司VPN后，电脑可能把发往公司地址的请求交给VPN，购物网站的请求仍交给家里的路由器。这里同一台电脑同时存在不同目的地的路径，不能用“电脑的网络路径”一条线概括全部访问。\u003c/p>\n\u003cp>若选用公共出口，更多访问会先联系VPN另一端，再从那边出去。设备仍通过原来的Wi-Fi或移动网络连接VPN服务器。这段连接中断后，VPN也无法继续转送请求。公司VPN通不了普通网站，有可能是范围或策略问题；具体需要验证，见\u003ca href=\"#/split\">分流\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-4\">路由器为何不决定我是否登录成功\u003c/h2>\n\u003cp>沿途路由器主要根据地址等网络信息转送。网站程序收到请求后，才处理42号商品、核对密码或检查订单。实际网络设备也可能执行过滤和安全策略，但它们转送成功仍不能代替远处服务完成业务。\u003c/p>\n\u003cp>所以，请求能够到达网站，不等于网站允许你登录或查看订单。网站返回拒绝页，至少有某段往返成功；一路没有回答则需要先核对连接与服务。用\u003ca href=\"#/troubleshoot\">排障\u003c/a>的对照顺序，比试图背下每一跳更有用。\u003c/p>\n\u003ch2 id=\"section-5\">下一跳，比完整路线更实用\u003c/h2>\n\u003cp>设备要把信息送往本地范围外，通常先交给一个出口，也叫默认网关。家里路由器常担任默认网关：电脑不知道某个外部地址该往哪里送时，先交给它转送。\u003c/p>\n\u003cp>负责网络之间转送的设备叫路由器。它读取目的地址，与自己的转发表比较，选择下一段连接；后面节点继续做自己的判断。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">IP中的转送与路由\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">不同网络为什么愿意替你继续送\u003c/h2>\n\u003cp>运营商、云服务、学校等管理各自网络。它们通过互联和约定交换流量，也需要传播“哪些地址范围可从哪里到达”的信息。转发表因此能把远方地址与下一步方向联系起来。\u003c/p>\n\u003cp>这像问路时知道“去那个区域先上这条干道”。它帮助理解逐段决定，不代表路由器按人类城市地图寻找最近街道。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work\" target=\"_blank\" rel=\"noopener noreferrer\">网络怎样互联\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-7\">为什么地图上近，访问却慢\u003c/h2>\n\u003cp>信息走的路径取决于网络互联、容量、管理规则和故障状态，未必是地理直线最短路径。跨网络的访问可能绕行；去程和回程也可以不同。\u003c/p>\n\u003cp>线路中断后，规则可能更新并改走其他连接，但这种调整需要时间，也可能没有可用替代路径。互联网有多条道路，不代表任何访问都永远不中断。\u003c/p>\n\u003ch2 id=\"section-8\">VPN也要先走现有道路\u003c/h2>\n\u003cp>建立VPN前，设备仍需通过现有网络联系VPN另一端。之后隧道内的信息也由真实链路搬运。远方出口可以改变后半段路径，却不能替代你本地已经断掉的接入。\u003c/p>\n\u003cp>所以先确认普通接入，再验证VPN连接，再验证目标服务，是有因果顺序的。你不需要记住沿途设备名单，只要能判断应该先检查本地连接、VPN，还是目标网站。\u003c/p>\n","text":"经过那么多网络，谁决定往哪走？ 互联网没有要求你的手机认识沿途每一台设备。 每台负责转送的设备查看目的IP，再根据自己的转发表选择下一台设备或下一段连接。这个下一步就叫“下一跳”。 一跳接一跳，信息才有机会到达目的地。 家里的电脑是怎样决定第一步的 你访问家庭打印机，目标可能在附近网络内；你访问远方商品站，设备通常需要把通信交给通向外部的网关。设备根据当前地址安排和路由规则选去向，不是浏览器亲自列出全国每一台转发设备。 出口再按自己知道的地址范围和下一跳继续送。不同网络互相连接，并交换哪些地址可以从哪里到达的信息。转送设备据此选择下一步，后面的设备继续转送。互联网并没有一台所有请求都必须经过的“总服务器”；商品网站、聊天服务器和VPN服务器可以在不同网络里。 原网站没变，路径为什么会变 虚构教学对照 ：同一电脑在家里访问商品站很快，在另一处Wi-Fi等待很久。目标名称相同，但起点网络、互联安排、可能选到的服务入口及当前负载都可不同。地理上离网站更近，未必通信路线更短或更顺。 信息去程和回复回程也不需要严格经过同样节点。若某段中断，转送设备可能根据更新后的规则选择其他连接；更新需要时间，也不是任何地方都有备用通路。所以短暂连接中断并不一定代表网站停止运行。 连接VPN是在增加另一个路径选择 你启用公司VPN后，电脑可能把发往公司地址的请求交给VPN，购物网站的请求仍交给家里的路由器。这里同一台电脑同时存在不同目的地的路径，不能用“电脑的网络路径”一条线概括全部访问。 若选用公共出口，更多访问会先联系VPN另一端，再从那边出去。设备仍通过原来的Wi-Fi或移动网络连接VPN服务器。这段连接中断后，VPN也无法继续转送请求。公司VPN通不了普通网站，有可能是范围或策略问题；具体需要验证，见分流。 路由器为何不决定我是否登录成功 沿途路由器主要根据地址等网络信息转送。网站程序收到请求后，才处理42号商品、核对密码或检查订单。实际网络设备也可能执行过滤和安全策略，但它们转送成功仍不能代替远处服务完成业务。 所以，请求能够到达网站，不等于网站允许你登录或查看订单。网站返回拒绝页，至少有某段往返成功；一路没有回答则需要先核对连接与服务。用排障的对照顺序，比试图背下每一跳更有用。 下一跳，比完整路线更实用 设备要把信息送往本地范围外，通常先交给一个出口，也叫默认网关。家里路由器常担任默认网关：电脑不知道某个外部地址该往哪里送时，先交给它转送。 负责网络之间转送的设备叫路由器。它读取目的地址，与自己的转发表比较，选择下一段连接；后面节点继续做自己的判断。IP中的转送与路由 不同网络为什么愿意替你继续送 运营商、云服务、学校等管理各自网络。它们通过互联和约定交换流量，也需要传播“哪些地址范围可从哪里到达”的信息。转发表因此能把远方地址与下一步方向联系起来。 这像问路时知道“去那个区域先上这条干道”。它帮助理解逐段决定，不代表路由器按人类城市地图寻找最近街道。网络怎样互联 为什么地图上近，访问却慢 信息走的路径取决于网络互联、容量、管理规则和故障状态，未必是地理直线最短路径。跨网络的访问可能绕行；去程和回程也可以不同。 线路中断后，规则可能更新并改走其他连接，但这种调整需要时间，也可能没有可用替代路径。互联网有多条道路，不代表任何访问都永远不中断。 VPN也要先走现有道路 建立VPN前，设备仍需通过现有网络联系VPN另一端。之后隧道内的信息也由真实链路搬运。远方出口可以改变后半段路径，却不能替代你本地已经断掉的接入。 所以先确认普通接入，再验证VPN连接，再验证目标服务，是有因果顺序的。你不需要记住沿途设备名单，只要能判断应该先检查本地连接、VPN，还是目标网站。 相关概念 - VPN改变哪段路径 - 延迟与容量","outline":[{"id":"section-1","title":"家里的电脑是怎样决定第一步的","depth":2},{"id":"section-2","title":"原网站没变，路径为什么会变","depth":2},{"id":"section-3","title":"连接VPN是在增加另一个路径选择","depth":2},{"id":"section-4","title":"路由器为何不决定我是否登录成功","depth":2},{"id":"section-5","title":"下一跳，比完整路线更实用","depth":2},{"id":"section-6","title":"不同网络为什么愿意替你继续送","depth":2},{"id":"section-7","title":"为什么地图上近，访问却慢","depth":2},{"id":"section-8","title":"VPN也要先走现有道路","depth":2}]},{"id":"delivery","group":"services","title":"信息丢了、乱序了，怎么还能完整收到？","question":"信息丢了、乱序了，怎么还能完整收到？","summary":"发送端与接收端补发丢失数据、处理顺序；收到数据还不等于网站完成操作。","terms":["TCP","UDP","重传","超时"],"aliases":["TCP","","UDP","","重传","","超时",""],"related":["packets","routes","messages","live"],"html":"\u003cp>网络会尽力把小份信息送向目的地，但某一份仍可能丢失或迟到。\u003cstrong>需要完整内容时，发送端和接收端会确认收到哪些数据、补发缺失部分，并按顺序把数据交给应用。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">下载资料时，中间缺一段会发生什么\u003c/h2>\n\u003cp>你下载一个PDF，接收程序需要取得能按顺序解释的完整数据。\u003cstrong>虚构教学过程\u003c/strong>：前后部分已经到达，中间一段缺失，传输机制根据接收反馈和等待时间补发缺失的数据；程序最终仍按顺序收到数据，不必把先到部分直接拼成错误文件。\u003c/p>\n\u003cp>这就是“网络中包的实际到达顺序”和“应用取得的数据顺序”可以不同的原因。接收设备还会识别重复传来的内容，不能因为补发就在PDF里多出同样一页。真正的文件格式也有自己的解析和检查工作，成功传送不证明原文件内容正确。\u003c/p>\n\u003ch2 id=\"section-2\">超时是在什么时候开始算失败\u003c/h2>\n\u003cp>应用不能无限等。当它在自己的等待时间内没有获得需要的结果，可能显示超时。但这个提示没有说明是哪一份包、哪一段路径或哪项业务卡住；有的等待还发生在服务处理阶段。\u003c/p>\n\u003cp>\u003cstrong>教学对照\u003c/strong>：网盘显示上传超时，实际服务可能未接到完整内容，也可能已经保存但回复没回到你。核对网盘中的正式文件与状态，比从超时字样猜“全部没传出去”更可靠。是否能续传、怎样去重和检查完整性，由应用设计承担。\u003c/p>\n\u003ch2 id=\"section-3\">TCP、UDP和网页新版本，怎样放进模型\u003c/h2>\n\u003cp>TCP适合向程序交付可靠有序的数据流。UDP提供另一种数据报传送方式，基础规则不自动提供同样的交付保证，但应用或使用UDP的其他协议仍可以补发丢失数据、保护内容，并根据网络拥堵调整发送速度。不能从“用了UDP”就推断既不可靠也不安全。\u003c/p>\n\u003cp>现代网页可能使用\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9000.html\" target=\"_blank\" rel=\"noopener noreferrer\">基于UDP的QUIC等安排\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>；你不用为理解一次访问先记版本。要抓住的是：IP负责尽力转送数据包；发送端和接收端再根据需要处理缺失、顺序和等待。下载文件希望完整，实时声音更在意及时，使用的恢复策略可以不同。\u003c/p>\n\u003ch2 id=\"section-4\">确认数据与确认事情，谁能作保证\u003c/h2>\n\u003cp>传输机制确认的是接收端收到了哪些数据；网站回复的是它怎样处理了请求；你在订单列表中查到的，是网站保存的订单状态。这些都不能替代另一个人的“已读”或“同意”。\u003c/p>\n\u003cp>这些不是同一种确认的不同叫法。如果传输已完成，账号验证仍可以失败；服务保存订单后，网络回复仍可能丢失。\u003ca href=\"#/transactions\">业务成功\u003c/a>把这条连续链展开，\u003ca href=\"#/messages\">聊天状态\u003c/a>则把它应用到发送与已读。\u003c/p>\n\u003ch2 id=\"section-5\">把“尽力送”与“完整交付”分开\u003c/h2>\n\u003cp>IP主要负责寻址与传送数据包，本身不保证端到端完整、有序。TCP则向应用提供可靠、有序的字节流，帮助应用取得连续数据。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">IP的范围\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>、\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP的职责\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>这里的“字节流”可以先理解成按顺序交给程序的一串数据，不必先记住计量单位。\u003c/p>\n\u003ch2 id=\"section-6\">一段没收到，双方怎样合作\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构教学示意\u003c/strong>。发送端要交付三段内容，接收端已经收到前两段，却缺后面的部分。接收端反馈已取得的范围，发送端结合确认和等待情况决定是否补发。晚到或重复的内容需要按规则处理，不能直接当成新内容多显示一次。\u003c/p>\n\u003cp>实际确认可能覆盖连续的一大段，不是每个包都必须单独得到一封回信。发送速度也要照顾接收方与路径承受能力，过快反而可能增加排队和丢失。\u003c/p>\n\u003ch2 id=\"section-7\">“可靠”也有结束失败的时候\u003c/h2>\n\u003cp>断网很久或对方不再响应，通信仍可能失败。可靠传输的含义是按规则处理问题、成功时交付正确顺序的数据，不是承诺任何条件下都能成功。\u003c/p>\n\u003cp>另一种常见方式UDP提供较轻的报文传送，应用可以自行决定怎样处理迟到与丢失。不能由“使用UDP”推断应用一定不补救；实时应用可能有自己的恢复、纠错或适应机制。\u003c/p>\n\u003ch2 id=\"section-8\">到了程序，不等于事情办完了\u003c/h2>\n\u003cp>传输层取得数据之后，程序还需要读懂请求、核对权限，并执行保存文件或创建订单等操作。聊天服务接收消息，也不等于朋友的设备收到，更不等于朋友已经阅读。\u003c/p>\n\u003cp>如果你发出保存请求，没有收到回复，可能是请求没送到，也可能是服务处理了但回复没回来。再次操作是否产生重复业务，需要应用自己设计识别规则。网络传输的重传与业务重复处理，是不同层次的问题。\u003c/p>\n","text":"信息丢了、乱序了，怎么还能完整收到？ 网络会尽力把小份信息送向目的地，但某一份仍可能丢失或迟到。 需要完整内容时，发送端和接收端会确认收到哪些数据、补发缺失部分，并按顺序把数据交给应用。 下载资料时，中间缺一段会发生什么 你下载一个PDF，接收程序需要取得能按顺序解释的完整数据。 虚构教学过程 ：前后部分已经到达，中间一段缺失，传输机制根据接收反馈和等待时间补发缺失的数据；程序最终仍按顺序收到数据，不必把先到部分直接拼成错误文件。 这就是“网络中包的实际到达顺序”和“应用取得的数据顺序”可以不同的原因。接收设备还会识别重复传来的内容，不能因为补发就在PDF里多出同样一页。真正的文件格式也有自己的解析和检查工作，成功传送不证明原文件内容正确。 超时是在什么时候开始算失败 应用不能无限等。当它在自己的等待时间内没有获得需要的结果，可能显示超时。但这个提示没有说明是哪一份包、哪一段路径或哪项业务卡住；有的等待还发生在服务处理阶段。 教学对照 ：网盘显示上传超时，实际服务可能未接到完整内容，也可能已经保存但回复没回到你。核对网盘中的正式文件与状态，比从超时字样猜“全部没传出去”更可靠。是否能续传、怎样去重和检查完整性，由应用设计承担。 TCP、UDP和网页新版本，怎样放进模型 TCP适合向程序交付可靠有序的数据流。UDP提供另一种数据报传送方式，基础规则不自动提供同样的交付保证，但应用或使用UDP的其他协议仍可以补发丢失数据、保护内容，并根据网络拥堵调整发送速度。不能从“用了UDP”就推断既不可靠也不安全。 现代网页可能使用基于UDP的QUIC等安排；你不用为理解一次访问先记版本。要抓住的是：IP负责尽力转送数据包；发送端和接收端再根据需要处理缺失、顺序和等待。下载文件希望完整，实时声音更在意及时，使用的恢复策略可以不同。 确认数据与确认事情，谁能作保证 传输机制确认的是接收端收到了哪些数据；网站回复的是它怎样处理了请求；你在订单列表中查到的，是网站保存的订单状态。这些都不能替代另一个人的“已读”或“同意”。 这些不是同一种确认的不同叫法。如果传输已完成，账号验证仍可以失败；服务保存订单后，网络回复仍可能丢失。业务成功把这条连续链展开，聊天状态则把它应用到发送与已读。 把“尽力送”与“完整交付”分开 IP主要负责寻址与传送数据包，本身不保证端到端完整、有序。TCP则向应用提供可靠、有序的字节流，帮助应用取得连续数据。IP的范围、TCP的职责 这里的“字节流”可以先理解成按顺序交给程序的一串数据，不必先记住计量单位。 一段没收到，双方怎样合作 以下是 虚构教学示意 。发送端要交付三段内容，接收端已经收到前两段，却缺后面的部分。接收端反馈已取得的范围，发送端结合确认和等待情况决定是否补发。晚到或重复的内容需要按规则处理，不能直接当成新内容多显示一次。 实际确认可能覆盖连续的一大段，不是每个包都必须单独得到一封回信。发送速度也要照顾接收方与路径承受能力，过快反而可能增加排队和丢失。 “可靠”也有结束失败的时候 断网很久或对方不再响应，通信仍可能失败。可靠传输的含义是按规则处理问题、成功时交付正确顺序的数据，不是承诺任何条件下都能成功。 另一种常见方式UDP提供较轻的报文传送，应用可以自行决定怎样处理迟到与丢失。不能由“使用UDP”推断应用一定不补救；实时应用可能有自己的恢复、纠错或适应机制。 到了程序，不等于事情办完了 传输层取得数据之后，程序还需要读懂请求、核对权限，并执行保存文件或创建订单等操作。聊天服务接收消息，也不等于朋友的设备收到，更不等于朋友已经阅读。 如果你发出保存请求，没有收到回复，可能是请求没送到，也可能是服务处理了但回复没回来。再次操作是否产生重复业务，需要应用自己设计识别规则。网络传输的重传与业务重复处理，是不同层次的问题。 相关概念 - 聊天送达与已读 - 实时通信怎样取舍","outline":[{"id":"section-1","title":"下载资料时，中间缺一段会发生什么","depth":2},{"id":"section-2","title":"超时是在什么时候开始算失败","depth":2},{"id":"section-3","title":"TCP、UDP和网页新版本，怎样放进模型","depth":2},{"id":"section-4","title":"确认数据与确认事情，谁能作保证","depth":2},{"id":"section-5","title":"把“尽力送”与“完整交付”分开","depth":2},{"id":"section-6","title":"一段没收到，双方怎样合作","depth":2},{"id":"section-7","title":"“可靠”也有结束失败的时候","depth":2},{"id":"section-8","title":"到了程序，不等于事情办完了","depth":2}]},{"id":"web","group":"services","title":"打开一个网页，背后是谁在回答？","question":"打开一个网页，背后是谁在回答？","summary":"网站传回文字、图片和页面程序，浏览器读取并显示；按钮还可能发出新请求。","terms":["HTTP","服务器","请求","响应","CDN"],"aliases":["HTTP","","服务器","","请求","","响应","","CDN",""],"related":["browsing","url-pages","transactions","identity"],"html":"\u003cp>你输入网址后，屏幕上的网页通常不是一次收到的完整图片。\u003cstrong>网站先发回页面的文字和结构说明。浏览器按说明继续下载图片、排版规则和页面程序，再在你的设备上显示网页。\u003c/stron
