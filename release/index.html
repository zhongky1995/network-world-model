<script id="knowledge-data" type="application/json">{"title":"网络世界模型","groups":[{"id":"connection","name":"先看全局，再连起来","question":"设备、网络与应用怎样分工？"},{"id":"address","name":"读懂地址，找到服务","question":"网址、域名、IP和端口各管什么？"},{"id":"services","name":"一次访问，怎样成为结果","question":"页面、消息、订单和通话如何连续工作？"},{"id":"trust","name":"保护、识别与风控","question":"谁能看见，谁在判断你？"},{"id":"vpn","name":"换一条路径：VPN与代理","question":"连接成功后，哪些访问真的改变了？"},{"id":"scenes","name":"把生活中的问题串起来","question":"排障、远程和发布如何回到完整流程？"}],"pages":[{"id":"world-map","group":"orientation","title":"从一次上网出发，建立完整的网络地图","question":"一次上网里，各环节怎样连接？","summary":"用点链接、登录、提交、换网和VPN串起整个网络世界。","terms":["互联网","通信"],"aliases":["互联网","","通信",""],"related":["boundaries","url","browsing","transactions","setup"],"html":"\u003cp>朋友发来商品链接，你点开、看图片、登录，再把商品加入购物车。一个熟悉的动作背后，至少有三方在合作：\u003cstrong>浏览器准备请求，网络把请求与回复送来送去，网站查找内容并处理操作。\u003c/strong> 页面和账号不会只靠一条“网线接通”就自动完成全部工作。\u003c/p>\n\u003cp>你不需要先背参数。沿着同一次访问，看清谁收到什么、接着做什么，再把IP、端口、域名、VPN放回它们参与的位置。\u003c/p>\n\u003ch2 id=\"section-1\">先跟着一段日常经历走\u003c/h2>\n\u003cp>下面使用一个\u003cstrong>虚构购物网站\u003c/strong>，名称、商品和结果均为教学设计，不对应任何平台的内部实现。链接是 \u003ccode>https://shop.example.com/products/42?color=blue#reviews\u003c/code>。\u003c/p>\n\u003ch3 id=\"section-2\">一、浏览器先读懂链接中的访问要求\u003c/h3>\n\u003cp>你点链接，浏览器读出网站名称shop.example.com，知道要请求42号商品、附带蓝色选择，并在适当时候定位到评价区。链接表达“准备去哪里、想看什么”，此时页面还没取到。\u003c/p>\n\u003cp>HTTPS表示采用受保护的网页通信方式；名称、路径、问号和井号后的内容各有用途。详细拆分见\u003ca href=\"#/url\">一条网址\u003c/a>。\u003c/p>\n\u003ch3 id=\"section-3\">二、设备要先接入网络，才能联系远处\u003c/h3>\n\u003cp>电脑通过家里的Wi-Fi联系接入设备，再由路由器和宽带接入连接运营商。运营商网络与其他网络相连，才让请求有机会继续到网站所在的网络。\u003c/p>\n\u003cp>Wi-Fi满格，只说明附近无线信号这一项条件；外部线路中断时，家中电脑和打印机仍可能通信，远处网页却取不到。见\u003ca href=\"#/access\">连网与上网\u003c/a>。\u003c/p>\n\u003ch3 id=\"section-4\">三、名称查成地址，再找到接收程序\u003c/h3>\n\u003cp>浏览器通常通过DNS这种名称查询系统，取得网站的IP地址。设备按目的地址转送数据，再用端口联系接收网页请求的程序。普通HTTPS没有写端口时，会采用默认443，不是没有端口。\u003c/p>\n\u003cp>IP帮助到达网络目标，端口帮助交给接收程序，网页请求还要保留主机名和具体路径。一个IP可以有多个网站，一个网站也可以有多个地址；并不是每件商品都另配一个端口。见\u003ca href=\"#/ip\">IP\u003c/a>、\u003ca href=\"#/ports\">端口\u003c/a>、\u003ca href=\"#/dns\">名称查询\u003c/a>。\u003c/p>\n\u003ch3 id=\"section-5\">四、小份数据逐段传送，网站才收到需求\u003c/h3>\n\u003cp>请求被组织成可以传送的数据，经不同设备接力。每一段连接可以使用电、光或无线电信号；沿途设备依据网络信息继续送，不需要理解你想买哪种颜色。\u003c/p>\n\u003cp>两端还要按需要处理丢失、顺序和传输保护，才有条件交换完整请求。家中多台设备可以共用公共出口，出口记录通信对应关系，把回复送回正确设备。见\u003ca href=\"#/signals\">信号\u003c/a>、\u003ca href=\"#/packets\">分包\u003c/a>、\u003ca href=\"#/routes\">路由\u003c/a>、\u003ca href=\"#/delivery\">交付\u003c/a>与\u003ca href=\"#/nat\">共享出口\u003c/a>。\u003c/p>\n\u003ch3 id=\"section-6\">五、网站找内容，浏览器把它显示出来\u003c/h3>\n\u003cp>商品程序收到请求，才读取42号商品和蓝色条件，查找相应资料，返回页面说明。浏览器继续取得图片、排版规则和页面程序，逐步显示标题、图片和按钮。它不是收到远处电脑的一整张截图。\u003c/p>\n\u003cp>图片可能来自另一个子域名，库存可能需要另外查询；因此文字正常、图片失败、某个按钮等待，都可能发生在同一页面。见\u003ca href=\"#/web\">网页怎样组成\u003c/a>与\u003ca href=\"#/domains\">多级域名\u003c/a>。完整连续轨迹在\u003ca href=\"#/browsing\">从点击到页面\u003c/a>。\u003c/p>\n\u003ch3 id=\"section-7\">六、登录和下单，还要网站处理新的请求\u003c/h3>\n\u003cp>登录时，网站验证凭据，给浏览器保存适用的登录标记。后面查看订单，浏览器附上标记，网站找到账号，再核对有权查看什么。\u003c/p>\n\u003cp>点提交则让网站核对资料和业务条件，创建相应记录，再返回结果。回复中断时，记录也可能已经保存；所以超时以后需要核对正式状态，不能只凭动画判断。见\u003ca href=\"#/identity\">网站怎样认得账号\u003c/a>与\u003ca href=\"#/transactions\">提交何时成功\u003c/a>。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTI1IiB2aWV3Qm94PSIwIDAgNDIwIDUyNSI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjUiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPuS4gOadoeiuv+mXru+8jOe7j+i/h+iuuOWkmuautei/nuaOpTwvdGV4dD48 u003c/th>\n\u003cth>这次访问里对应的工作\u003c/th>\n\u003cth>为什么要分开看\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>设备接上了吗？\u003c/td>\n\u003ctd>附近接入与上游连接\u003c/td>\n\u003ctd>接上Wi-Fi不保证外部网站回应\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信息往哪里送？\u003c/td>\n\u003ctd>名称查询、地址与路由\u003c/td>\n\u003ctd>找到地址还要继续联系目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>到达后谁接收？\u003c/td>\n\u003ctd>端口、连接与服务程序\u003c/td>\n\u003ctd>同设备上可以运行不同服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想看或提交什么？\u003c/td>\n\u003ctd>网页请求中的主机、路径、参数等\u003c/td>\n\u003ctd>同一网站可以处理许多内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有权吗，办成了吗？\u003c/td>\n\u003ctd>账号、权限与业务记录\u003c/td>\n\u003ctd>通信成功不等于业务获准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>屏幕显示什么？\u003c/td>\n\u003ctd>浏览器解释内容、运行页面程序\u003c/td>\n\u003ctd>已显示的内容不证明新操作完成\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>网络设备本身也运行软件。这里是帮助辨别职责，不是把现实设备分成互不相关的学科。关系见\u003ca href=\"#/boundaries\">网络、网页和软件\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-9\">换网络、连VPN，为什么会改变一部分结果\u003c/h2>\n\u003cp>出门后，你从家中Wi-Fi切到手机流量，接入和公共来源可能改变，浏览器保存的登录标记却仍在。因此，购物账号还可以保持，不需要网站根据新IP重新猜人。\u003c/p>\n\u003cp>公司报销页则可能只允许内部访问。公司VPN先在现有网络上联系另一端，再转送指定内部通信，普通购物仍走原出口。于是报销页恢复、公网IP查询没变，也可能符合目的。另一种VPN用途才是把公共访问经指定出口发出。见\u003ca href=\"#/vpn\">VPN\u003c/a>、\u003ca href=\"#/split\">分流\u003c/a>和\u003ca href=\"#/setup\">配置验证\u003c/a>。\u003c/p>\n\u003cp>IP因此既能帮助转送，也能成为平台观察来源、累计请求和比较地区的线索。多人可能共用来源，同一个人也会换来源；重要线索并不等于精确的个人身份证。见\u003ca href=\"#/risk\">IP与风控\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-10\">按眼前的问题继续读\u003c/h2>\n\u003cp>想先理解日常链接，可以沿\u003ca href=\"#/url\">网址\u003c/a> → \u003ca href=\"#/ip\">IP\u003c/a> → \u003ca href=\"#/ports\">端口\u003c/a> → \u003ca href=\"#/domains\">子域名\u003c/a> → \u003ca href=\"#/url-pages\">路径参数\u003c/a> → \u003ca href=\"#/browsing\">完整访问\u003c/a>阅读。\u003c/p>\n\u003cp>想解释通信体验，可以从\u003ca href=\"#/messages\">聊天送达\u003c/a>、\u003ca href=\"#/live\">视频会议\u003c/a>、\u003ca href=\"#/speed\">网速\u003c/a>或\u003ca href=\"#/security\">谁能看见内容\u003c/a>进入。正在配置或遇到故障，则看\u003ca href=\"#/setup\">VPN设置\u003c/a>、\u003ca href=\"#/troubleshoot\">访问排障\u003c/a>、\u003ca href=\"#/remote\">远程访问\u003c/a>与\u003ca href=\"#/deploy\">分享网页\u003c/a>。\u003c/p>\n\u003cp>目录始终可以自由选择，不要求按顺序完成。读到陌生名称时，\u003ca href=\"#/glossary\">名词索引\u003c/a>提供简短解释与对应正文，过程中的关键联系则会留在各篇文章里。\u003c/p>\n","text":"从一次上网出发，建立完整的网络地图 朋友发来商品链接，你点开、看图片、登录，再把商品加入购物车。一个熟悉的动作背后，至少有三方在合作： 浏览器准备请求，网络把请求与回复送来送去，网站查找内容并处理操作。 页面和账号不会只靠一条“网线接通”就自动完成全部工作。 你不需要先背参数。沿着同一次访问，看清谁收到什么、接着做什么，再把IP、端口、域名、VPN放回它们参与的位置。 先跟着一段日常经历走 下面使用一个 虚构购物网站 ，名称、商品和结果均为教学设计，不对应任何平台的内部实现。链接是 https://shop.example.com/products/42?color=blue reviews 。 一、浏览器先读懂链接中的访问要求 你点链接，浏览器读出网站名称shop.example.com，知道要请求42号商品、附带蓝色选择，并在适当时候定位到评价区。链接表达“准备去哪里、想看什么”，此时页面还没取到。 HTTPS表示采用受保护的网页通信方式；名称、路径、问号和井号后的内容各有用途。详细拆分见一条网址。 二、设备要先接入网络，才能联系远处 电脑通过家里的Wi-Fi联系接入设备，再由路由器和宽带接入连接运营商。运营商网络与其他网络相连，才让请求有机会继续到网站所在的网络。 Wi-Fi满格，只说明附近无线信号这一项条件；外部线路中断时，家中电脑和打印机仍可能通信，远处网页却取不到。见连网与上网。 三、名称查成地址，再找到接收程序 浏览器通常通过DNS这种名称查询系统，取得网站的IP地址。设备按目的地址转送数据，再用端口联系接收网页请求的程序。普通HTTPS没有写端口时，会采用默认443，不是没有端口。 IP帮助到达网络目标，端口帮助交给接收程序，网页请求还要保留主机名和具体路径。一个IP可以有多个网站，一个网站也可以有多个地址；并不是每件商品都另配一个端口。见IP、端口、名称查询。 四、小份数据逐段传送，网站才收到需求 请求被组织成可以传送的数据，经不同设备接力。每一段连接可以使用电、光或无线电信号；沿途设备依据网络信息继续送，不需要理解你想买哪种颜色。 两端还要按需要处理丢失、顺序和传输保护，才有条件交换完整请求。家中多台设备可以共用公共出口，出口记录通信对应关系，把回复送回正确设备。见信号、分包、路由、交付与共享出口。 五、网站找内容，浏览器把它显示出来 商品程序收到请求，才读取42号商品和蓝色条件，查找相应资料，返回页面说明。浏览器继续取得图片、排版规则和页面程序，逐步显示标题、图片和按钮。它不是收到远处电脑的一整张截图。 图片可能来自另一个子域名，库存可能需要另外查询；因此文字正常、图片失败、某个按钮等待，都可能发生在同一页面。见网页怎样组成与多级域名。完整连续轨迹在从点击到页面。 六、登录和下单，还要网站处理新的请求 登录时，网站验证凭据，给浏览器保存适用的登录标记。后面查看订单，浏览器附上标记，网站找到账号，再核对有权查看什么。 点提交则让网站核对资料和业务条件，创建相应记录，再返回结果。回复中断时，记录也可能已经保存；所以超时以后需要核对正式状态，不能只凭动画判断。见网站怎样认得账号与提交何时成功。 设备经附近入口、相互连接的网络到达服务；回复也需要网络路径。 这张图表示常见访问中的接力关系，并不包含所有设备与应用安排。不同服务可以采用不同的连接和部署方式。 把六个问题放回自己的位置 日常问题 这次访问里对应的工作 为什么要分开看 --- --- --- 设备接上了吗？ 附近接入与上游连接 接上Wi-Fi不保证外部网站回应 信息往哪里送？ 名称查询、地址与路由 找到地址还要继续联系目标 到达后谁接收？ 端口、连接与服务程序 同设备上可以运行不同服务 想看或提交什么？ 网页请求中的主机、路径、参数等 同一网站可以处理许多内容 有权吗，办成了吗？ 账号、权限与业务记录 通信成功不等于业务获准 屏幕显示什么？ 浏览器解释内容、运行页面程序 已显示的内容不证明新操作完成 网络设备本身也运行软件。这里是帮助辨别职责，不是把现实设备分成互不相关的学科。关系见网络、网页和软件。 换网络、连VPN，为什么会改变一部分结果 出门后，你从家中Wi-Fi切到手机流量，接入和公共来源可能改变，浏览器保存的登录标记却仍在。因此，购物账号还可以保持，不需要网站根据新IP重新猜人。 公司报销页则可能只允许内部访问。公司VPN先在现有网络上联系另一端，再转送指定内部通信，普通购物仍走原出口。于是报销页恢复、公网IP查询没变，也可能符合目的。另一种VPN用途才是把公共访问经指定出口发出。见VPN、分流和配置验证。 IP因此既能帮助转送，也能成为平台观察来源、累计请求和比较地区的线索。多人可能共用来源，同一个人也会换来源；重要线索并不等于精确的个人身份证。见IP与风控。 按眼前的问题继续读 想先理解日常链接，可以沿网址 → IP → 端口 → 子域名 → 路径参数 → 完整访问阅读。 想解释通信体验，可以从聊天送达、视频会议、网速或谁能看见内容进入。正在配置或遇到故障，则看VPN设置、访问排障、远程访问与分享网页。 目录始终可以自由选择，不要求按顺序完成。读到陌生名称时，名词索引提供简短解释与对应正文，过程中的关键联系则会留在各篇文章里。","outline":[{"id":"section-1","title":"先跟着一段日常经历走","depth":2},{"id":"section-2","title":"一、浏览器先读懂链接中的访问要求","depth":3},{"id":"section-3","title":"二、设备要先接入网络，才能联系远处","depth":3},{"id":"section-4","title":"三、名称查成地址，再找到接收程序","depth":3},{"id":"section-5","title":"四、小份数据逐段传送，网站才收到需求","depth":3},{"id":"section-6","title":"五、网站找内容，浏览器把它显示出来","depth":3},{"id":"section-7","title":"六、登录和下单，还要网站处理新的请求","depth":3},{"id":"section-8","title":"把六个问题放回自己的位置","depth":2},{"id":"section-9","title":"换网络、连VPN，为什么会改变一部分结果","depth":2},{"id":"section-10","title":"按眼前的问题继续读","depth":2}]},{"id":"boundaries","group":"connection","title":"网络、互联网、网页和软件，分别是什么？","question":"网络、互联网、网页和软件，分别是什么？","summary":"从浏览器发请求、网络转送，到网站核对账号并回复，看清打开网页需要哪些部分。","terms":["网络","网页","网站","浏览器"],"aliases":["网络","","网页","","网站","","浏览器",""],"related":[],"html":"\u003cp>打开一个网页，要靠你电脑上的浏览器、连接两端的网络，以及网站的服务器一起工作。\u003cstrong>浏览器发出请求，网络把请求送到网站；网站处理后回复，浏览器再把收到的内容显示出来。\u003c/strong>\u003c/p>\n\u003cp>浏览器是软件，网站服务器上也运行着软件。网络则把这些设备连起来，让它们能够交换信息。你日常说的“上网”，就是在使用这几部分共同完成的功能。\u003c/p>\n\u003ch2 id=\"section-1\">先分出身边的东西与远处的服务\u003c/h2>\n\u003cp>你在手机或电脑上打开浏览器，输入网址。浏览器会查找网站的地址、请求页面，收到文字、图片和程序后，把它们显示成网页。聊天软件、网盘和会议软件也需要收发信息，只是你使用它们时，不一定经过浏览器。\u003c/p>\n\u003cp>这些请求通常先经过家里的路由器，或手机连接的移动网络，再由运营商和其他网络继续转送。网站的服务器收到请求后，才会查找商品、消息、账号或文件，把你要的结果发回来。\u003c/p>\n\u003cp>几个名称可以这样区分：\u003cstrong>浏览器是你用来打开网页的软件；网页是浏览器显示的内容；网站是向你提供这些页面和功能的一组服务；互联网把世界各地的网络连接起来。\u003c/strong> 因此，你用聊天软件收消息时，也可以使用互联网，却没有打开网页。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex 道怎样读取这份请求，找到结果后，按约定返回页面或数据；浏览器再解释并显示。\u003c/p>\n\u003cp>双方约定怎样组织和处理信息，称为协议。HTTP是网页请求和响应的规则，IP是按地址转送数据包的规则，它们帮助完成不同工作。软件负责执行规则，网络设备也运行软件，因此这些名称是在区分职责，而不是把现实设备切成互不相干的学科。\u003c/p>\n\u003ch2 id=\"section-5\">你日常碰到的名称，分别在回答什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>在一次访问中做什么\u003c/th>\n\u003cth>日常会遇到的例子\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Wi-Fi、手机流量\u003c/td>\n\u003ctd>让设备接入网络\u003c/td>\n\u003ctd>换成手机热点后，网页又能打开了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP地址\u003c/td>\n\u003ctd>告诉网络把信息送到哪里\u003c/td>\n\u003ctd>电脑、路由器和网站都有各自使用的地址\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由\u003c/td>\n\u003ctd>决定信息下一步往哪里送\u003c/td>\n\u003ctd>请求经过多个网络，逐段到达网站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口\u003c/td>\n\u003ctd>帮接收设备区分要联系哪个程序\u003c/td>\n\u003ctd>同一IP后写8080或9000，可能联系不同程序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>域名、DNS\u003c/td>\n\u003ctd>用网站名字查找可以联系的地址\u003c/td>\n\u003ctd>输入网站名称，浏览器先查地址，再联系网站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网址的路径和参数\u003c/td>\n\u003ctd>告诉网站要什么内容、带什么条件\u003c/td>\n\u003ctd>商品编号、搜索词、页码、颜色选项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP请求和响应\u003c/td>\n\u003ctd>按双方约定的格式，发送需求和结果\u003c/td>\n\u003ctd>浏览器请求商品资料，网站回复商品资料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号、会话\u003c/td>\n\u003ctd>帮网站确认这次操作属于哪个账号\u003c/td>\n\u003ctd>你登录后，网站能接着显示“我的订单”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>浏览器、页面程序\u003c/td>\n\u003ctd>显示内容，处理点击，并按需要继续请求数据\u003c/td>\n\u003ctd>点“查看运费”后，页面才向网站查询运费\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>这些名称不一定只参与一步。例如域名先用于查地址，后面还可用于区分网站、核对连接对象。因此，理解它们时，最好看它们在这次访问中做了什么，而不是只给它们贴上“网络”或“软件”的标签。\u003c/p>\n\u003ch2 id=\"section-6\">为什么“网络没问题”听起来有时不准确\u003c/h2>\n\u003cp>朋友说“我这里能打开新闻，所以网络没问题”，说明他能联系到那家新闻网站。你的订单系统可能在另一个地址，公司内部网页也可能需要VPN；能打开新闻，不能证明这些访问也都正常。\u003c/p>\n\u003cp>如果网站已经显示“请重新登录”，说明你至少收到了一条回复。此时应先按网站提示核对登录状态；反复重连Wi-Fi，通常不能替你完成账号验证。\u003c/p>\n\u003cp>如果网页文字正常、图片不出，文字和图片可能来自不同服务器，也可能是浏览器没有正确显示图片。排查时应说清楚“文字能显示，图片加载失败”，这样才能分别检查图片的下载和显示过程。\u003c/p>\n\u003ch2 id=\"section-7\">把这张地图用在下一次遇到的新东西上\u003c/h2>\n\u003cp>以后看到陌生名称，先把它放回具体操作。例如：你点了哪个链接，浏览器准备联系哪里，网站收到后处理什么，最后屏幕上出现了什么？找到它参与的步骤，再读定义会容易得多。\u003c/p>\n\u003cp>\u003ca href=\"#/url\">网址\u003c/a>解释一条链接怎样指定访问内容；\u003ca href=\"#/ip\">IP\u003c/a>和\u003ca href=\"#/ports\">端口\u003c/a>解释请求怎样找到接收它的设备和程序；\u003ca href=\"#/browsing\">完整访问\u003c/a>把这些步骤连起来；\u003ca href=\"#/transactions\">业务完成\u003c/a>解释为什么点了“提交”，事情还不一定办成。\u003c/p>\n\u003cp>互联网与网页的基础关系，可核对\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work\" target=\"_blank\" rel=\"noopener noreferrer\">MDN互联网说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"网络、互联网、网页和软件，分别是什么？ 打开一个网页，要靠你电脑上的浏览器、连接两端的网络，以及网站的服务器一起工作。 浏览器发出请求，网络把请求送到网站；网站处理后回复，浏览器再把收到的内容显示出来。 浏览器是软件，网站服务器上也运行着软件。网络则把这些设备连起来，让它们能够交换信息。你日常说的“上网”，就是在使用这几部分共同完成的功能。 先分出身边的东西与远处的服务 你在手机或电脑上打开浏览器，输入网址。浏览器会查找网站的地址、请求页面，收到文字、图片和程序后，把它们显示成网页。聊天软件、网盘和会议软件也需要收发信息，只是你使用它们时，不一定经过浏览器。 这些请求通常先经过家里的路由器，或手机连接的移动网络，再由运营商和其他网络继续转送。网站的服务器收到请求后，才会查找商品、消息、账号或文件，把你要的结果发回来。 几个名称可以这样区分： 浏览器是你用来打开网页的软件；网页是浏览器显示的内容；网站是向你提供这些页面和功能的一组服务；互联网把世界各地的网络连接起来。 因此，你用聊天软件收消息时，也可以使用互联网，却没有打开网页。 浏览器向网站发出请求，网络负责转送；网站处理请求并发回结果，浏览器显示收到的内容。 “网络”为什么比“互联网”范围更广 家里的电脑与打印机能够相互传送打印任务，就已经构成网络通信；这次任务可以不去外面。家庭网络再通过运营商等与其他网络连接，才让你能够访问远处的公共网站。这种把许多网络连接起来的体系，是互联网。 网页是利用这些连接提供内容的一种方式。聊天、邮件、文件同步也能使用互联网，却不要求你都先打开浏览器。因此“没打开网页”不等于“没在使用互联网”，“公共网站打不开”也不等于附近所有设备都不能通信。完整家庭过程见Wi-Fi与外部接入。 用一件事看清职责 下面用一个 虚构购物网站 说明。你已经登录，点开“我的订单”，想查看一笔订单的状态。 1. 浏览器向网站发送请求，告诉它你想查看订单，并附上当前登录所需的标记。 2. 你的设备通过Wi-Fi或手机网络，把请求送到网站的服务器。 3. 网站核对登录标记，确认这笔订单是否属于你的账号。如果你有权查看，网站就查出订单状态。 4. 网站把结果发回你的设备，浏览器将它显示成订单页面。 这几步分别解决不同问题：网络负责把请求和回复送过去；网站负责确认你能不能查看、应该返回什么；浏览器负责让你看见结果。 如果网站没有收到请求，你可能一直等不到页面。如果网站收到了，却发现你还没登录，它可能要求你先登录。两种情况都可能让你“看不到订单”，但需要处理的原因不同。 页面已经显示出来，也不代表后面的操作都能成功。有时浏览器保留着之前下载的页面，点击“查看订单”时才重新联系网站；这次联系失败，旧页面仍然可以留在屏幕上。 一份信息怎样被两端理解 网站收到的不是你手指的点击本身，而是浏览器准备的一份请求，例如“查看我的订单”，再附上适用的登录标记。网站程序知道怎样读取这份请求，找到结果后，按约定返回页面或数据；浏览器再解释并显示。 双方约定怎样组织和处理信息，称为协议。HTTP是网页请求和响应的规则，IP是按地址转送数据包的规则，它们帮助完成不同工作。软件负责执行规则，网络设备也运行软件，因此这些名称是在区分职责，而不是把现实设备切成互不相干的学科。 你日常碰到的名称，分别在回答什么 名称 在一次访问中做什么 日常会遇到的例子 --- --- --- Wi-Fi、手机流量 让设备接入网络 换成手机热点后，网页又能打开了 IP地址 告诉网络把信息送到哪里 电脑、路由器和网站都有各自使用的地址 路由 决定信息下一步往哪里送 请求经过多个网络，逐段到达网站 端口 帮接收设备区分要联系哪个程序 同一IP后写8080或9000，可能联系不同程序 域名、DNS 用网站名字查找可以联系的地址 输入网站名称，浏览器先查地址，再联系网站 网址的路径和参数 告诉网站要什么内容、带什么条件 商品编号、搜索词、页码、颜色选项 HTTP请求和响应 按双方约定的格式，发送需求和结果 浏览器请求商品资料，网站回复商品资料 账号、会话 帮网站确认这次操作属于哪个账号 你登录后，网站能接着显示“我的订单” 浏览器、页面程序 显示内容，处理点击，并按需要继续请求数据 点“查看运费”后，页面才向网站查询运费 这些名称不一定只参与一步。例如域名先用于查地址，后面还可用于区分网站、核对连接对象。因此，理解它们时，最好看它们在这次访问中做了什么，而不是只给它们贴上“网络”或“软件”的标签。 为什么“网络没问题”听起来有时不准确 朋友说“我这里能打开新闻，所以网络没问题”，说明他能联系到那家新闻网站。你的订单系统可能在另一个地址，公司内部网页也可能需要VPN；能打开新闻，不能证明这些访问也都正常。 如果网站已经显示“请重新登录”，说明你至少收到了一条回复。此时应先按网站提示核对登录状态；反复重连Wi-Fi，通常不能替你完成账号验证。 如果网页文字正常、图片不出，文字和图片可能来自不同服务器，也可能是浏览器没有正确显示图片。排查时应说清楚“文字能显示，图片加载失败”，这样才能分别检查图片的下载和显示过程。 把这张地图用在下一次遇到的新东西上 以后看到陌生名称，先把它放回具体操作。例如：你点了哪个链接，浏览器准备联系哪里，网站收到后处理什么，最后屏幕上出现了什么？找到它参与的步骤，再读定义会容易得多。 网址解释一条链接怎样指定访问内容；IP和端口解释请求怎样找到接收它的设备和程序；完整访问把这些步骤连起来；业务完成解释为什么点了“提交”，事情还不一定办成。 互联网与网页的基础关系，可核对MDN互联网说明。","outline":[{"id":"section-1","title":"先分出身边的东西与远处的服务","depth":2},{"id":"section-2","title":"“网络”为什么比“互联网”范围更广","depth":2},{"id":"section-3","title":"用一件事看清职责","depth":2},{"id":"section-4","title":"一份信息怎样被两端理解","depth":2},{"id":"section-5","title":"你日常碰到的名称，分别在回答什么","depth":2},{"id":"section-6","title":"为什么“网络没问题”听起来有时不准确","depth":2},{"id":"section-7","title":"把这张地图用在下一次遇到的新东西上","depth":2}]},{"id":"url","group":"address","title":"一条网址里的域名、端口和参数，各有什么用？","question":"一条网址里的域名、端口和参数，各有什么用？","summary":"用一条商品链接看网站名称、端口、路径、问号和井号分别有什么用。","terms":["URL","网址","查询参数","片段"],"aliases":["URL","URI url address 网址 斜线 问号 井号","网址","","查询参数","query parameter querystring utm 参数","片段","fragment hash 锚点 井号"],"related":["boundaries"],"html":"\u003cp>朋友发来一个链接，点击后就打开商品的蓝色款，还跳到了评价区。浏览器从链接中读出网站名称、商品编号、颜色选项，以及评价区的位置。\u003cstrong>一条网址既说明去哪个网站，也可以说明要看什么内容。\u003c/strong>\u003c/p>\n\u003cp>日常所说的网址，常叫URL。先以这个\u003cstrong>虚构教学链接\u003c/strong>为例：\u003ccode>https://shop.example.com:8443/products/42?color=blue#reviews\u003c/code>。实际购物网站未必使用这样的字段或端口；这里把平常会省略的部分也写出来，方便看清分工。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MjAgNzEwIiByb2xlPSJpbWciPjx0aXRsZT7nvZHlnYDlkITmrrXnmoTliIblt6U8L3RpdGxlPjxkZWZzPjxtYXJrZXIgaWQ9ImEiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjYiIHJlZlk9IjMiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEw2IDNMMCA2IiBmaWxsPSJub25lIiBzdHJva2U9IiM0Mjc2NjQiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI3MTAiIGZpbGw9IiNmYWY4ZjIiLz48c3R5bGU+dGV4dHtmb250LWZhbWlseTpQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZjtmaWxsOiMyOTRkNDA7Zm9udC1zaXplOjE1cHh9LnNtYWxse2ZvbnQtc2l6ZToxMnB4O2ZpbGw6IzY2NzQ2N30udGl0bGV7Zm9udC1zaXplOjIxcHg7Zm9udC13ZWlnaHQ6NjAwfS5saW5le2ZpbGw6bm9uZTtzdHJva2U6IzQyNzY2NDtzdHJva2Utd2lkdGg6MjttYXJrZXItZW5kOnVybCgjYSl9PC9zdHlsZT48dGV4dCB4PSIyNCIgeT0iMzgiIGNsYXNzPSJ0aXRsZSI+5LiA5p2h572R5Z2A77yM5ZCE5q615ZCE5pyJ55So6YCUPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSI2NiIgY2xhc3M9InNtYWxsIj7lhYjmib7liLDnvZHnq5nvvIzlho3or7fmsYLlhbfkvZPlhoXlrrk8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjkyIiB3aWR0aD0iMzM0IiBoZWlnaHQ9Ijc1IiByeD0iOSIgZmlsbD0iI2RiZTllMCIvPjx0ZXh0IHg9IjQwIiB5PSIxMTkiIGNsYXNzPSIiPmh0dHBzOi8vPC90ZXh0Pjx0ZXh0IHg9IjQwIiB5PSIxNDYiIGNsYXNzPSJzbWFsbCI+5oyJ5Y+X5L+d5oqk55qE572R6aG15pa55byP6K6/6ZeuPC90ZXh0PjxyZWN0IHg9IjI0IiB5PSIxODIiIHdpZHRoPSIzMzQiIGhlaWdodD0iNzUiIHJ4PSI5IiBmaWxsPSIjZGJlOWUwIi8+PHRleHQgeD0iNDAiIHk9IjIwOSIgY2xhc3M9IiI+c2hvcC5leGFtcGxlLmNvbTwvdGV4dD48dGV4dCB4PSI0MCIgeT0iMjM2IiBjbGFzcz0ic21hbGwiPuafpeivoui/meS4quS4u+acuuWQjeWvueW6lOeahElQPC90ZXh0PjxyZWN0IHg9IjI0IiB5PSIyNzIiIHdpZHRoPSIzMzQiIGhlaWdodD0iNzUiIHJ4PSI5IiBmaWxsPSIjZGJlOWUwIi8+PHRleHQgeD0iNDAiIHk9IjI5OSIgY2xhc3M9IiI+Ojg0NDM8L3RleHQ+PHRleHQgeD0iNDAiIHk9IjMyNiIgY2xhc3M9InNtYWxsIj7 crDwvdGV4dD48dGV4dCB4PSIzODMiIHk9IjU5MSIgc3R5bGU9ImZvbnQtc2l6ZToxM3B4Ij7lnLA8L3RleHQ+PC9zdmc+\" alt=\"浏览器用主机名和端口联系网站，在请求中写明路径和查询条件，并用井号后的部分定位页面或交给页面程序处理。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>浏览器用主机名和端口联系网站，在请求中写明路径和查询条件，并用井号后的部分定位页面或交给页面程序处理。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">浏览器先拆开，再分别使用\u003c/h2>\n\u003cp>开头的 \u003ccode>https://\u003c/code> 告诉浏览器按受保护的网页通信方式访问。它影响建立什么连接、怎样保护交换内容，不是网站公司名称。\u003c/p>\n\u003cp>\u003ccode>shop.example.com\u003c/code> 是主机名。浏览器通常先查询这个名称对应的IP地址，再尝试连接网站。这里的shop是子域名，详细层级见\u003ca href=\"#/domains\">域名\u003c/a>。主机也能直接写IP，不过实际网站可能还需要正确域名才能匹配证书与站点。\u003c/p>\n\u003cp>\u003ccode>:8443\u003c/code> 指定服务端口，也就是浏览器要联系的端口编号；网站程序需要在这个端口接收请求。普通HTTPS网址没写端口时，使用默认的443；省略数字是采用约定，并不是没有端口。不能给普通链接任意补一个数字，服务必须在那里接收。见\u003ca href=\"#/ports\">IP与端口\u003c/a>。\u003c/p>\n\u003cp>\u003ccode>/products/42\u003c/code> 是路径，告诉网站你要哪个资源。资源可以是商品页面，也可以是图片或供程序读取的数据；它不必是服务器硬盘上的同名文件夹。\u003c/p>\n\u003cp>\u003ccode>?color=blue\u003c/code> 是查询部分，给访问附上条件。在这家虚构网站，color表示颜色、blue表示蓝色。别的网站可能采用完全不同的含义；通用网络规则不负责解释“蓝色”。多个常见条件会用 \u003ccode>&amp;\u003c/code> 分隔，例如 \u003ccode>?color=blue&amp;size=m\u003c/code>。\u003c/p>\n\u003cp>\u003ccode>#reviews\u003c/code> 是片段。普通HTTP请求不会直接把这段作为请求目标送给服务；浏览器可以用它滚动到评价区，网页程序也可以拿它选择显示内容或另发请求。因此“片段不直接发送”不等于“网站永远无法知道它”。\u003c/p>\n\u003ch2 id=\"section-2\">把这些部分放进同一次访问\u003c/h2>\n\u003cp>朋友发来上面的链接，你点击以后，浏览器先按shop.example.com查找地址，准备联系8443端口。连接成功并完成HTTPS校验后，它向网站表达：“我想看/products/42，附带条件color=blue。”网站读取这些内容，检查42号商品是否存在、是否有蓝色款，才返回相应页面。\u003c/p>\n\u003cp>浏览器收到页面，再按#reviews寻找评价区。评价区如果本来就在页面里，可以直接滚过去；若评价需要另取数据，页面程序也可能再发请求。地址串里写了reviews，不保证评价内容已经下载或一定存在。\u003c/p>\n\u003cp>若对方根本没有在8443提供适当服务，浏览器可能连第一张商品页面都拿不到；此时把/products/42改成43，通常不会补上接收服务。若已经收到“商品不存在”，则至少相关服务给出了回答，更应该检查资源和网站规则。这说明各部分不是可以互相替代的设置。\u003c/p>\n\u003ch2 id=\"section-3\">如果只改变一段，通常发生什么\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变化\u003c/th>\n\u003cth>在虚构例子中的意义\u003c/th>\n\u003cth>不能据此断定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>shop改成help\u003c/td>\n\u003ctd>改用help.example.com这个主机名\u003c/td>\n\u003ctd>一定属于另一家公司\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8443改成9443\u003c/td>\n\u003ctd>尝试联系9443端口上的程序\u003c/td>\n\u003ctd>网站会自动理解你想换页面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>products/42改成products/43\u003c/td>\n\u003ctd>请求另一商品资源\u003c/td>\n\u003ctd>一定换了IP或服务器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>color=blue改成color=red\u003c/td>\n\u003ctd>换商品选择条件\u003c/td>\n\u003ctd>参数必然被接受或自动获得权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reviews改成details\u003c/td>\n\u003ctd>换浏览器定位或页面状态\u003c/td>\n\u003ctd>一定产生新的网络请求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>改变路径或颜色参数，通常仍是在联系同一网站。网站可以处理许多不同路径和条件，不需要每页都另用一个IP或端口。反过来，同一个域名也可以安排多个地址提供服务。网址组件的语法可以统一，背后的业务规则仍由服务决定。\u003c/p>\n\u003ch2 id=\"section-4\">地址栏里的网址，不是这次访问的全部信息\u003c/h2>\n\u003cp>你登录后打开同一商品链接，看到自己的收货地址；朋友打开同一链接，看不到你的地址。原因是访问还可能携带浏览器保存的登录标记，以及服务已保存的账号信息。网址虽然相同，浏览器附带的登录标记却可能不同，网站就会按不同账号回复。\u003c/p>\n\u003cp>例如你与朋友都打开/orders/18，网站不能只看18就把同一份私密订单给两个人。它还要验证各自凭据，确认账号是否有权查看。URL负责表达选择，访问权限由服务核对。\u003c/p>\n\u003cp>搜索关键词常放在问号后，但上传文件、填写地址、提交密码等内容通常放在请求的其他部分；地址栏看不见不等于没有传送。参数如果包含分享凭证或个人资料，复制链接也可能把这些信息一起给别人。理解链接时，既要看它指向什么内容，也要看它是否带着分享凭证等信息。\u003c/p>\n\u003ch2 id=\"section-5\">你还会碰见省略写法与编码\u003c/h2>\n\u003cp>网页里的链接有时只写 \u003ccode>/products/42\u003c/code>。浏览器会用当前页面的网址补全，因而你仍可跳转。它不是一个能脱离所在页面、到处都正确工作的独立网站地址。\u003c/p>\n\u003cp>中文和空格有时会显示成 \u003ccode>%\u003c/code> 后接字符的串，这是网址中的编码表示。浏览器与服务按规则恢复相应文本；不能把它误认成加密保护。短链接则是另一个入口，它往往通过跳转把你引向更长网址，见\u003ca href=\"#/browsing\">完整访问过程\u003c/a>。\u003c/p>\n\u003cp>读一条陌生链接时，先找 \u003ccode>://\u003c/code> 后、第一个 \u003ccode>/\u003c/code> 前的网站名称与可选端口，再看路径、问号和井号后的内容。前面说明要联系哪里，后面说明要查看什么、附带什么条件，以及怎样在页面中定位。组件规则可核对\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_URL\" target=\"_blank\" rel=\"noopener noreferrer\">MDN网址说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://www.rfc-editor.org/rfc/rfc3986.html\" target=\"_blank\" rel=\"noopener noreferrer\">URI语法规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"一条网址里的域名、端口和参数，各有什么用？ 朋友发来一个链接，点击后就打开商品的蓝色款，还跳到了评价区。浏览器从链接中读出网站名称、商品编号、颜色选项，以及评价区的位置。 一条网址既说明去哪个网站，也可以说明要看什么内容。 日常所说的网址，常叫URL。先以这个 虚构教学链接 为例： https://shop.example.com:8443/products/42?color=blue reviews 。实际购物网站未必使用这样的字段或端口；这里把平常会省略的部分也写出来，方便看清分工。 浏览器用主机名和端口联系网站，在请求中写明路径和查询条件，并用井号后的部分定位页面或交给页面程序处理。 浏览器先拆开，再分别使用 开头的 https:// 告诉浏览器按受保护的网页通信方式访问。它影响建立什么连接、怎样保护交换内容，不是网站公司名称。 shop.example.com 是主机名。浏览器通常先查询这个名称对应的IP地址，再尝试连接网站。这里的shop是子域名，详细层级见域名。主机也能直接写IP，不过实际网站可能还需要正确域名才能匹配证书与站点。 :8443 指定服务端口，也就是浏览器要联系的端口编号；网站程序需要在这个端口接收请求。普通HTTPS网址没写端口时，使用默认的443；省略数字是采用约定，并不是没有端口。不能给普通链接任意补一个数字，服务必须在那里接收。见IP与端口。 /products/42 是路径，告诉网站你要哪个资源。资源可以是商品页面，也可以是图片或供程序读取的数据；它不必是服务器硬盘上的同名文件夹。 ?color=blue 是查询部分，给访问附上条件。在这家虚构网站，color表示颜色、blue表示蓝色。别的网站可能采用完全不同的含义；通用网络规则不负责解释“蓝色”。多个常见条件会用 & 分隔，例如 ?color=blue&size=m 。 reviews 是片段。普通HTTP请求不会直接把这段作为请求目标送给服务；浏览器可以用它滚动到评价区，网页程序也可以拿它选择显示内容或另发请求。因此“片段不直接发送”不等于“网站永远无法知道它”。 把这些部分放进同一次访问 朋友发来上面的链接，你点击以后，浏览器先按shop.example.com查找地址，准备联系8443端口。连接成功并完成HTTPS校验后，它向网站表达：“我想看/products/42，附带条件color=blue。”网站读取这些内容，检查42号商品是否存在、是否有蓝色款，才返回相应页面。 浏览器收到页面，再按 reviews寻找评价区。评价区如果本来就在页面里，可以直接滚过去；若评价需要另取数据，页面程序也可能再发请求。地址串里写了reviews，不保证评价内容已经下载或一定存在。 若对方根本没有在8443提供适当服务，浏览器可能连第一张商品页面都拿不到；此时把/products/42改成43，通常不会补上接收服务。若已经收到“商品不存在”，则至少相关服务给出了回答，更应该检查资源和网站规则。这说明各部分不是可以互相替代的设置。 如果只改变一段，通常发生什么 变化 在虚构例子中的意义 不能据此断定 --- --- --- shop改成help 改用help.example.com这个主机名 一定属于另一家公司 8443改成9443 尝试联系9443端口上的程序 网站会自动理解你想换页面 products/42改成products/43 请求另一商品资源 一定换了IP或服务器 color=blue改成color=red 换商品选择条件 参数必然被接受或自动获得权限 reviews改成details 换浏览器定位或页面状态 一定产生新的网络请求 改变路径或颜色参数，通常仍是在联系同一网站。网站可以处理许多不同路径和条件，不需要每页都另用一个IP或端口。反过来，同一个域名也可以安排多个地址提供服务。网址组件的语法可以统一，背后的业务规则仍由服务决定。 地址栏里的网址，不是这次访问的全部信息 你登录后打开同一商品链接，看到自己的收货地址；朋友打开同一链接，看不到你的地址。原因是访问还可能携带浏览器保存的登录标记，以及服务已保存的账号信息。网址虽然相同，浏览器附带的登录标记却可能不同，网站就会按不同账号回复。 例如你与朋友都打开/orders/18，网站不能只看18就把同一份私密订单给两个人。它还要验证各自凭据，确认账号是否有权查看。URL负责表达选择，访问权限由服务核对。 搜索关键词常放在问号后，但上传文件、填写地址、提交密码等内容通常放在请求的其他部分；地址栏看不见不等于没有传送。参数如果包含分享凭证或个人资料，复制链接也可能把这些信息一起给别人。理解链接时，既要看它指向什么内容，也要看它是否带着分享凭证等信息。 你还会碰见省略写法与编码 网页里的链接有时只写 /products/42 。浏览器会用当前页面的网址补全，因而你仍可跳转。它不是一个能脱离所在页面、到处都正确工作的独立网站地址。 中文和空格有时会显示成 % 后接字符的串，这是网址中的编码表示。浏览器与服务按规则恢复相应文本；不能把它误认成加密保护。短链接则是另一个入口，它往往通过跳转把你引向更长网址，见完整访问过程。 读一条陌生链接时，先找 :// 后、第一个 / 前的网站名称与可选端口，再看路径、问号和井号后的内容。前面说明要联系哪里，后面说明要查看什么、附带什么条件，以及怎样在页面中定位。组件规则可核对MDN网址说明与URI语法规范。","outline":[{"id":"section-1","title":"浏览器先拆开，再分别使用","depth":2},{"id":"section-2","title":"把这些部分放进同一次访问","depth":2},{"id":"section-3","title":"如果只改变一段，通常发生什么","depth":2},{"id":"section-4","title":"地址栏里的网址，不是这次访问的全部信息","depth":2},{"id":"section-5","title":"你还会碰见省略写法与编码","depth":2}]},{"id":"signals","group":"connection","title":"文字和声音，怎么进入电线与空气？","question":"文字和声音，怎么进入电线与空气？","summary":"内容先变成数字记录，再借电、光或无线电信号传递。","terms":["编码","信号","光纤"],"aliases":["编码","","信号","","光纤",""],"related":["ip","security","access","packets"],"html":"\u003cp>你在手机里说一句“到了吗”，朋友几秒后从耳机里听见。你的声音没有以原来的声波穿过城市。\u003cstrong>手机先把声音记成数据，网络把数据送过去，朋友的手机再把数据变成新的声音。\u003c/strong> 文字和照片也要先有一种设备能保存、处理和传送的表示方式。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgNDIwIDUyMCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjAiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPuWGheWuueaAjuagt+WAn+S/oeWPt+enu+WKqDwvdGV4dD48dGV4dCB4 eHQgeD0iMjEwIiB5PSI0ODMiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiMyNDNiMzYiPuWPiOiDveaYvuekuuKAnOS9oOWlveKAnTwvdGV4dD48L2c+PC9zdmc+\" alt=\"同一数字记录可由电、光或无线电变化承载；接收端依约恢复内容。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>同一数字记录可由电、光或无线电变化承载；接收端依约恢复内容。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">按住录音按钮后，手机先保存了什么\u003c/h2>\n\u003cp>以发送语音消息这个日常动作为例。你对麦克风说话，声音使空气振动，麦克风把这种变化变成设备能够处理的信号。设备反复记录声音在不同时刻的变化，把它们记成数字，再按音频格式组织起来。\u003c/p>\n\u003cp>这里的数字记录是可以保存的内容。松开录音按钮后，即使房间已经安静，手机仍能根据记录播放刚才那句话。语音文件也不需要一直“发着声音”才能存在：它可以躺在手机存储里，过几天再打开。\u003c/p>\n\u003cp>把内容按约定记成数据，叫作编码。文字也有编码规则，例如把“到”这个字与相应的数字记录对应起来。接收软件要知道使用了什么规则，才能把数字重新显示成那个字。图片则记录画面信息，音频记录声音信息；文件格式帮助软件知道该怎样解释这些数据。\u003c/p>\n\u003cp>所以，成功收到一串数字还不是最后一步。如果软件不支持某种音频格式，它可能拿到完整文件却无法播放。这与网络没有传完整，是两种问题。\u003c/p>\n\u003ch2 id=\"section-2\">点发送以后，数据怎样离开手机\u003c/h2>\n\u003cp>聊天软件把准备好的语音数据交给手机的通信功能。手机若使用家中Wi-Fi，就按无线通信规则让天线发出可识别的无线电变化，附近的接入设备据此恢复数据。你走到离路由器很远的位置时，这段无线通信可能变差，发送就可能变慢或失败。\u003c/p>\n\u003cp>接入设备收到后，再按下一段连接的方式发送。下一段可能用网线中的电信号，也可能在后面的光纤中用光信号。一段接一段，接收、恢复、继续发送，最终把数据交到聊天服务和朋友的设备。\u003c/p>\n\u003cp>不是同一道无线电波一路飞到朋友家，也不是把声音原样塞进光纤。\u003cstrong>内容以数据形式继续传递，每一段连接可以使用不同的物理信号。\u003c/strong> 正因为能够这样衔接，手机、光纤网络和有线电脑才可以相互通信。\u003ca href=\"https://www.cisco.com/site/us/en/learn/topics/networking/what-is-a-wi-fi-network.html\" target=\"_blank\" rel=\"noopener noreferrer\">Wi-Fi使用无线电传送信息\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>实际通信不会简单到“每亮一次就代表一个数字”。系统用双方能够区分的变化组合表示数据，也需要处理干扰和错误。你不用先掌握这些参数，先抓住“发送端制造变化，接收端按同样规则识别”即可。\u003c/p>\n\u003ch2 id=\"section-3\">朋友手机收到以后，为什么能播放出你的话\u003c/h2>\n\u003cp>朋友的手机从网络取得音频数据，聊天软件按相应格式读取它，恢复可播放的声音信号，再交给耳机或扬声器。扬声器制造新的空气振动，朋友才听见那句话。\u003c/p>\n\u003cp>这条过程可以分为三个阶段：你的手机记录声音，通信系统搬运记录，朋友的手机根据记录播放。语音可以离线保存、重复播放，也可以在不同设备上播放，就是因为中间传递的是能够复制的数据记录。\u003c/p>\n\u003cp>若数据尚未取得完整，应用可能等待、提示下载失败或采用自己的恢复办法；若记录已经完整，耳机没有声音，还可能是播放设备、音量或格式的问题。仅凭“听不见”不能确定在哪一段失败。\u003c/p>\n\u003ch2 id=\"section-4\">照片发出去变糊，是不是网络磨掉了细节\u003c/h2>\n\u003cp>下面是一个\u003cstrong>虚构教学对照\u003c/strong>。你拍了一张清楚的照片，在聊天软件里按默认方式发送。软件先制作体积更小的图片版本，再上传。朋友成功下载了这个版本，放大却觉得模糊。\u003c/p>\n\u003cp>减少需要保存或传送的数据量，叫作压缩。有些压缩可以完整恢复原记录；有些会舍弃图片或声音的一部分细节，用更少数据换更小体积。本例中，细节在发送前就已经被舍弃了，网络完整送到的也是这个较小版本。\u003c/p>\n\u003cp>因此，重新发送同一个压缩版本，通常不会凭空找回原图细节。若应用允许选择“原图”或发送原文件，发出的内容变了，体积与等待时间也可能增加。你看到的是应用选择和处理文件的结果，不能把画质变化都归为信号好坏。\u003c/p>\n\u003cp>若原文件已经完整下载却仍打不开，则还应检查文件本身和软件支持情况。照片模糊、文件未收全、软件不支持格式，分别发生在不同步骤。\u003c/p>\n\u003ch2 id=\"section-5\">编码、压缩和加密，为什么要分清\u003c/h2>\n\u003cp>同一段语音可以先编码成数据，再压缩，发送时再受到加密保护。这些处理可以同时存在，各自解决不同问题：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>处理\u003c/th>\n\u003cth>用这段语音来理解\u003c/th>\n\u003cth>不等于什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>编码\u003c/td>\n\u003ctd>按约定记录声音，使软件能保存和解释\u003c/td>\n\u003ctd>不代表别人一定无权读取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>压缩\u003c/td>\n\u003ctd>减少文件需要的数据量\u003c/td>\n\u003ctd>不代表内容受到保密保护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加密\u003c/td>\n\u003ctd>用密钥等安排，使未获准者难以读懂内容\u003c/td>\n\u003ctd>不代表文件一定更小\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>打开文件看到一串看不懂的字符，可能只是用了不合适的软件解释，并不能据此证明文件已加密。反过来，一张很小的图片也可能完全没有受到保密保护。加密保护哪一段、谁仍能读取，见\u003ca href=\"#/security\">信息能被谁看见\u003c/a>。\u003c/p>\n\u003cp>声音怎样变成可传的数据解决了“传什么”。接下来还要知道如何分享连接、送往谁、缺了一段怎么办。见\u003ca href=\"#/packets\">分包\u003c/a>、\u003ca href=\"#/ip\">IP地址\u003c/a>与\u003ca href=\"#/delivery\">丢失后的恢复\u003c/a>。\u003c/p>\n","text":"文字和声音，怎么进入电线与空气？ 你在手机里说一句“到了吗”，朋友几秒后从耳机里听见。你的声音没有以原来的声波穿过城市。 手机先把声音记成数据，网络把数据送过去，朋友的手机再把数据变成新的声音。 文字和照片也要先有一种设备能保存、处理和传送的表示方式。 同一数字记录可由电、光或无线电变化承载；接收端依约恢复内容。 按住录音按钮后，手机先保存了什么 以发送语音消息这个日常动作为例。你对麦克风说话，声音使空气振动，麦克风把这种变化变成设备能够处理的信号。设备反复记录声音在不同时刻的变化，把它们记成数字，再按音频格式组织起来。 这里的数字记录是可以保存的内容。松开录音按钮后，即使房间已经安静，手机仍能根据记录播放刚才那句话。语音文件也不需要一直“发着声音”才能存在：它可以躺在手机存储里，过几天再打开。 把内容按约定记成数据，叫作编码。文字也有编码规则，例如把“到”这个字与相应的数字记录对应起来。接收软件要知道使用了什么规则，才能把数字重新显示成那个字。图片则记录画面信息，音频记录声音信息；文件格式帮助软件知道该怎样解释这些数据。 所以，成功收到一串数字还不是最后一步。如果软件不支持某种音频格式，它可能拿到完整文件却无法播放。这与网络没有传完整，是两种问题。 点发送以后，数据怎样离开手机 聊天软件把准备好的语音数据交给手机的通信功能。手机若使用家中Wi-Fi，就按无线通信规则让天线发出可识别的无线电变化，附近的接入设备据此恢复数据。你走到离路由器很远的位置时，这段无线通信可能变差，发送就可能变慢或失败。 接入设备收到后，再按下一段连接的方式发送。下一段可能用网线中的电信号，也可能在后面的光纤中用光信号。一段接一段，接收、恢复、继续发送，最终把数据交到聊天服务和朋友的设备。 不是同一道无线电波一路飞到朋友家，也不是把声音原样塞进光纤。 内容以数据形式继续传递，每一段连接可以使用不同的物理信号。 正因为能够这样衔接，手机、光纤网络和有线电脑才可以相互通信。Wi-Fi使用无线电传送信息 实际通信不会简单到“每亮一次就代表一个数字”。系统用双方能够区分的变化组合表示数据，也需要处理干扰和错误。你不用先掌握这些参数，先抓住“发送端制造变化，接收端按同样规则识别”即可。 朋友手机收到以后，为什么能播放出你的话 朋友的手机从网络取得音频数据，聊天软件按相应格式读取它，恢复可播放的声音信号，再交给耳机或扬声器。扬声器制造新的空气振动，朋友才听见那句话。 这条过程可以分为三个阶段：你的手机记录声音，通信系统搬运记录，朋友的手机根据记录播放。语音可以离线保存、重复播放，也可以在不同设备上播放，就是因为中间传递的是能够复制的数据记录。 若数据尚未取得完整，应用可能等待、提示下载失败或采用自己的恢复办法；若记录已经完整，耳机没有声音，还可能是播放设备、音量或格式的问题。仅凭“听不见”不能确定在哪一段失败。 照片发出去变糊，是不是网络磨掉了细节 下面是一个 虚构教学对照 。你拍了一张清楚的照片，在聊天软件里按默认方式发送。软件先制作体积更小的图片版本，再上传。朋友成功下载了这个版本，放大却觉得模糊。 减少需要保存或传送的数据量，叫作压缩。有些压缩可以完整恢复原记录；有些会舍弃图片或声音的一部分细节，用更少数据换更小体积。本例中，细节在发送前就已经被舍弃了，网络完整送到的也是这个较小版本。 因此，重新发送同一个压缩版本，通常不会凭空找回原图细节。若应用允许选择“原图”或发送原文件，发出的内容变了，体积与等待时间也可能增加。你看到的是应用选择和处理文件的结果，不能把画质变化都归为信号好坏。 若原文件已经完整下载却仍打不开，则还应检查文件本身和软件支持情况。照片模糊、文件未收全、软件不支持格式，分别发生在不同步骤。 编码、压缩和加密，为什么要分清 同一段语音可以先编码成数据，再压缩，发送时再受到加密保护。这些处理可以同时存在，各自解决不同问题： 处理 用这段语音来理解 不等于什么 --- --- --- 编码 按约定记录声音，使软件能保存和解释 不代表别人一定无权读取 压缩 减少文件需要的数据量 不代表内容受到保密保护 加密 用密钥等安排，使未获准者难以读懂内容 不代表文件一定更小 打开文件看到一串看不懂的字符，可能只是用了不合适的软件解释，并不能据此证明文件已加密。反过来，一张很小的图片也可能完全没有受到保密保护。加密保护哪一段、谁仍能读取，见信息能被谁看见。 声音怎样变成可传的数据解决了“传什么”。接下来还要知道如何分享连接、送往谁、缺了一段怎么办。见分包、IP地址与丢失后的恢复。","outline":[{"id":"section-1","title":"按住录音按钮后，手机先保存了什么","depth":2},{"id":"section-2","title":"点发送以后，数据怎样离开手机","depth":2},{"id":"section-3","title":"朋友手机收到以后，为什么能播放出你的话","depth":2},{"id":"section-4","title":"照片发出去变糊，是不是网络磨掉了细节","depth":2},{"id":"section-5","title":"编码、压缩和加密，为什么要分清","depth":2}]},{"id":"access","group":"connection","title":"连上Wi-Fi，为什么不一定能上网？","question":"连上Wi-Fi，为什么不一定能上网？","summary":"附近连接与接入互联网是分开的几段。","terms":["Wi-Fi","基站","运营商"],"aliases":["Wi-Fi","","基站","","运营商",""],"related":["signals","troubleshoot","nat","identity"],"html":"\u003cp>手机显示已经连上家里的Wi-Fi，浏览器却一直打不开网页。这时先把两件事分开：\u003cstrong>Wi-Fi把手机接到家里的网络；家里的网络还需要接通运营商，才能继续访问远处的网站。\u003c/strong> 前一段正常，后一段仍可能中断。\u003c/p>\n\u003cp>家里几台设备相互联系，已经是在使用网络；访问互联网上的网站，则需要这张小网络继续与外面的网络通信。我们日常把两件事都叫“联网”，遇到问题时才容易混淆。\u003c/p>\n\u003ch2 id=\"section-1\">在家打印一份文件，信息实际经过哪里\u003c/h2>\n\u003cp>以下用一个\u003cstrong>虚构家庭\u003c/strong>说明：电脑和打印机都已连接家中主路由器的Wi-Fi，电脑已经添加过这台打印机，打印机也处于可以接收任务的状态。这里先讨论本地打印，不包含必须登录云服务的打印功能。\u003c/p>\n\u003cp>你在电脑上打开文件，点“打印”，选择那台打印机。电脑中的打印功能先把文件转换成打印机能够处理的任务，再向打印机发送数据。要发送给谁，来自此前添加打印机时保存的信息，或系统在附近网络中发现的服务信息；并不是你一按打印，网络就自己理解了这份文件该交给谁。\u003c/p>\n\u003cp>电脑通过无线连接把数据交给家里的接入设备，接入设备再把数据送到打印机。两端都在同一家庭网络中，且设备之间允许互访时，这段传送可以在家里完成。打印机收到任务后，还要检查纸张、墨水、是否暂停等状态，然后才把内容印出来。电脑能联系到打印机，与打印机能完成打印，也是两个步骤。\u003c/p>\n\u003cp>你通常不用亲自输入打印机的IP地址，因为系统可能已经发现或保存了它。地址仍在起作用，只是软件替你处理了。地址怎样定位设备，见\u003ca href=\"#/ip\">IP\u003c/a>；这里先记住，电脑需要找到家里那台打印机，而不是去互联网上寻找一台同名设备。\u003c/p>\n\u003ch2 id=\"section-2\">同一台电脑打开网站，要多走哪几段\u003c/h2>\n\u003cp>现在你停止打印，打开购物网站。目标从家里的打印机变成了远处的服务器，信息就不能只留在家庭网络里。\u003c/p>\n\u003cp>电脑先取得网站可以联系的地址，然后把发往外部的通信交给家里的路由器。路由器把它转给上游接入设备，经过运营商网络和其他相连网络，才到达网站。网站发回的数据也要经过网络回到家里，最后交给你的浏览器。浏览器收到页面和图片后，才有内容可以显示。\u003c/p>\n\u003cp>这条常见路径可以写成：\u003cstrong>电脑 → 家庭路由器 → 宽带接入与运营商网络 → 网站所在网络 → 网站服务器\u003c/strong>。各段还可能经过其他设备；它说明的是接力关系，不是每个家庭都必须摆着同样数量的盒子。\u003c/p>\n\u003cp>因此，Wi-Fi信号再强，也只能说明电脑与附近接入设备之间的无线条件。它不能替运营商确认宽带状态，不能保证网站服务器正在工作，更不能让网站跳过账号检查。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work\" target=\"_blank\" rel=\"noopener noreferrer\">互联网如何连接不同网络\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-3\">宽带断了，为什么打印可能还正常\u003c/h2>\n\u003cp>沿用这个家庭：路由器与打印机都开着，无线连接正常，只是通往运营商的入户线路中断了。\u003c/p>\n\u003cp>打印任务仍在家里的设备之间传送，不必经过那条入户线路，所以本地打印可能继续工作。购物请求却必须离开家，到中断的位置就无法继续；即使请求有机会出去，回复回不来，浏览器也不能完成这次访问。\u003c/p>\n\u003cp>如果此时路由器也断电，电脑和打印机可能连附近这段都无法继续使用。若打印依赖厂商云服务，外网中断也可能影响打印。结果取决于这次任务实际需要经过哪里，不能把“所有打印都不需要互联网”当成结论。\u003c/p>\n\u003cp>公共Wi-Fi还有另一种情况：酒店可能允许每台设备上网，却禁止住客设备相互访问。你和朋友连着同名Wi-Fi，也不代表能直接读取对方设备。是否属于同一可互访范围，要看网络的安排。\u003c/p>\n\u003ch2 id=\"section-4\">路由器、光猫、运营商，分别接哪一段\u003c/h2>\n\u003cp>家中常见的小盒子承担的工作可以这样看：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你接触的东西\u003c/th>\n\u003cth>在这次访问中做什么\u003c/th>\n\u003cth>哪种现象与它有关\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Wi-Fi接入功能\u003c/td>\n\u003ctd>让电脑、手机通过无线连接加入附近网络\u003c/td>\n\u003ctd>搜不到家中Wi-Fi，或离远以后信号变弱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>家庭路由功能\u003c/td>\n\u003ctd>把发往其他网络的数据交给上游，也把回复送回家中设备\u003c/td>\n\u003ctd>附近设备能联系，外部访问却失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>光猫等宽带接入设备\u003c/td>\n\u003ctd>衔接入户光纤与家中设备使用的连接\u003c/td>\n\u003ctd>入户接入异常，影响家庭网络通向运营商\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运营商网络\u003c/td>\n\u003ctd>把用户接入更大的互联网络，继续转送信息\u003c/td>\n\u003ctd>家中设备正常，仍可能无法联系远方服务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>你买的“无线路由器”通常把无线接入、内部转发、地址分配等功能放在一个盒子里；光猫也可能带路由和Wi-Fi。地址分配的意思，是替加入家庭网络的设备安排可用的内部地址，使设备能够参与通信。\u003cstrong>盒子可以合并，工作仍可分别出问题。\u003c/strong> 表中的现象只是检查方向，不能只凭某一个现象就认定某台设备损坏。\u003c/p>\n\u003ch2 id=\"section-5\">酒店Wi-Fi为什么要先开一个确认页\u003c/h2>\n\u003cp>你在酒店选择Wi-Fi名称，完成无线连接。酒店网络此时可能只允许你打开它的联网确认页，暂时不放行普通互联网访问。你按酒店提供的方式完成确认，网络才允许后续访问。这解释了“Wi-Fi已连接，新闻和聊天却都不能用”。\u003c/p>\n\u003cp>这个确认页解决酒店网络是否允许你向外访问，不是在替购物网站登录。完成酒店联网后，购物站仍可能要求自己的账号和密码。Wi-Fi密码、酒店联网确认与网站登录，各自验证不同的一件事；实际该填写什么，以酒店正式说明为准。\u003c/p>\n\u003cp>如果只有一个购物站打不开，而其他公共网站能正常使用，就不能直接归为“酒店没联网”。此时还要看那家网站的名称查询、连接和服务状态。\u003c/p>\n\u003ch2 id=\"section-6\">切到手机热点，为什么结果可能不同\u003c/h2>\n\u003cp>电脑连接手机热点后，第一段变成电脑通过Wi-Fi联系手机，后面由手机的移动网络接入运营商。手机自己用流量时，则通过附近基站等设施接入移动网络。热点分享的是手机已有的联网能力，也可能消耗手机套餐流量。\u003c/p>\n\u003cp>从酒店网络切到手机热点，电脑和浏览器可能没变，接入设备、上游路径、名称查询安排和网站看到的来源IP却可能一起变化。所以同一网页切换后恢复，可以提示你检查原网络相关条件；它还不能单独确定究竟是哪一项导致失败。\u003c/p>\n\u003cp>切换网络不会替你补网站账号权限，也不会清掉浏览器里的登录标记。这是为什么网页恢复后，原来的账号可能仍然在。见\u003ca href=\"#/identity\">网站怎样识别账号\u003c/a>。\u003c/p>\n\u003cp>使用手机号码打普通电话，还会涉及运营商确认号码的服务资格、建立呼叫并传送声音；聊天软件通话也会验证自己的账号。都使用无线接入，不代表后面的服务相同，详见\u003ca href=\"#/live\">实时通话\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-7\">眼前的结果，能把问题缩小到哪里\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你已经看到什么\u003c/th>\n\u003cth>已经知道什么\u003c/th>\n\u003cth>还需要继续确认什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>搜得到Wi-Fi名称\u003c/td>\n\u003ctd>附近有设备在提供这个无线网络\u003c/td>\n\u003ctd>能否加入、是否允许向外访问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已连上Wi-Fi\u003c/td>\n\u003ctd>无线接入已经建立\u003c/td>\n\u003ctd>地址安排、外部路径与目标服务是否正常\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能使用家中打印机\u003c/td>\n\u003ctd>这次本地任务所需的通信和服务可用\u003c/td>\n\u003ctd>是否能够访问互联网\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能打开购物站\u003c/td>\n\u003ctd>至少取得了这个网站的一部分内容\u003c/td>\n\u003ctd>登录、下单和其他网站是否可用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>遇到故障时，可以先说清“本地打印正常，公共网站都打不开”，或“公共网站正常，只有公司报销页失败”。这样的描述比一句“Wi-Fi坏了”更容易找到下一步。具体对照顺序见\u003ca href=\"#/troubleshoot\">访问排障\u003c/a>；家中多台设备怎样共用对外地址，见\u003ca href=\"#/nat\">共享出口\u003c/a>。\u003c/p>\n","text":"连上Wi-Fi，为什么不一定能上网？ 手机显示已经连上家里的Wi-Fi，浏览器却一直打不开网页。这时先把两件事分开： Wi-Fi把手机接到家里的网络；家里的网络还需要接通运营商，才能继续访问远处的网站。 前一段正常，后一段仍可能中断。 家里几台设备相互联系，已经是在使用网络；访问互联网上的网站，则需要这张小网络继续与外面的网络通信。我们日常把两件事都叫“联网”，遇到问题时才容易混淆。 在家打印一份文件，信息实际经过哪里 以下用一个 虚构家庭 说明：电脑和打印机都已连接家中主路由器的Wi-Fi，电脑已经添加过这台打印机，打印机也处于可以接收任务的状态。这里先讨论本地打印，不包含必须登录云服务的打印功能。 你在电脑上打开文件，点“打印”，选择那台打印机。电脑中的打印功能先把文件转换成打印机能够处理的任务，再向打印机发送数据。要发送给谁，来自此前添加打印机时保存的信息，或系统在附近网络中发现的服务信息；并不是你一按打印，网络就自己理解了这份文件该交给谁。 电脑通过无线连接把数据交给家里的接入设备，接入设备再把数据送到打印机。两端都在同一家庭网络中，且设备之间允许互访时，这段传送可以在家里完成。打印机收到任务后，还要检查纸张、墨水、是否暂停等状态，然后才把内容印出来。电脑能联系到打印机，与打印机能完成打印，也是两个步骤。 你通常不用亲自输入打印机的IP地址，因为系统可能已经发现或保存了它。地址仍在起作用，只是软件替你处理了。地址怎样定位设备，见IP；这里先记住，电脑需要找到家里那台打印机，而不是去互联网上寻找一台同名设备。 同一台电脑打开网站，要多走哪几段 现在你停止打印，打开购物网站。目标从家里的打印机变成了远处的服务器，信息就不能只留在家庭网络里。 电脑先取得网站可以联系的地址，然后把发往外部的通信交给家里的路由器。路由器把它转给上游接入设备，经过运营商网络和其他相连网络，才到达网站。网站发回的数据也要经过网络回到家里，最后交给你的浏览器。浏览器收到页面和图片后，才有内容可以显示。 这条常见路径可以写成： 电脑 → 家庭路由器 → 宽带接入与运营商网络 → 网站所在网络 → 网站服务器 。各段还可能经过其他设备；它说明的是接力关系，不是每个家庭都必须摆着同样数量的盒子。 因此，Wi-Fi信号再强，也只能说明电脑与附近接入设备之间的无线条件。它不能替运营商确认宽带状态，不能保证网站服务器正在工作，更不能让网站跳过账号检查。互联网如何连接不同网络 宽带断了，为什么打印可能还正常 沿用这个家庭：路由器与打印机都开着，无线连接正常，只是通往运营商的入户线路中断了。 打印任务仍在家里的设备之间传送，不必经过那条入户线路，所以本地打印可能继续工作。购物请求却必须离开家，到中断的位置就无法继续；即使请求有机会出去，回复回不来，浏览器也不能完成这次访问。 如果此时路由器也断电，电脑和打印机可能连附近这段都无法继续使用。若打印依赖厂商云服务，外网中断也可能影响打印。结果取决于这次任务实际需要经过哪里，不能把“所有打印都不需要互联网”当成结论。 公共Wi-Fi还有另一种情况：酒店可能允许每台设备上网，却禁止住客设备相互访问。你和朋友连着同名Wi-Fi，也不代表能直接读取对方设备。是否属于同一可互访范围，要看网络的安排。 路由器、光猫、运营商，分别接哪一段 家中常见的小盒子承担的工作可以这样看： 你接触的东西 在这次访问中做什么 哪种现象与它有关 --- --- --- Wi-Fi接入功能 让电脑、手机通过无线连接加入附近网络 搜不到家中Wi-Fi，或离远以后信号变弱 家庭路由功能 把发往其他网络的数据交给上游，也把回复送回家中设备 附近设备能联系，外部访问却失败 光猫等宽带接入设备 衔接入户光纤与家中设备使用的连接 入户接入异常，影响家庭网络通向运营商 运营商网络 把用户接入更大的互联网络，继续转送信息 家中设备正常，仍可能无法联系远方服务 你买的“无线路由器”通常把无线接入、内部转发、地址分配等功能放在一个盒子里；光猫也可能带路由和Wi-Fi。地址分配的意思，是替加入家庭网络的设备安排可用的内部地址，使设备能够参与通信。 盒子可以合并，工作仍可分别出问题。 表中的现象只是检查方向，不能只凭某一个现象就认定某台设备损坏。 酒店Wi-Fi为什么要先开一个确认页 你在酒店选择Wi-Fi名称，完成无线连接。酒店网络此时可能只允许你打开它的联网确认页，暂时不放行普通互联网访问。你按酒店提供的方式完成确认，网络才允许后续访问。这解释了“Wi-Fi已连接，新闻和聊天却都不能用”。 这个确认页解决酒店网络是否允许你向外访问，不是在替购物网站登录。完成酒店联网后，购物站仍可能要求自己的账号和密码。Wi-Fi密码、酒店联网确认与网站登录，各自验证不同的一件事；实际该填写什么，以酒店正式说明为准。 如果只有一个购物站打不开，而其他公共网站能正常使用，就不能直接归为“酒店没联网”。此时还要看那家网站的名称查询、连接和服务状态。 切到手机热点，为什么结果可能不同 电脑连接手机热点后，第一段变成电脑通过Wi-Fi联系手机，后面由手机的移动网络接入运营商。手机自己用流量时，则通过附近基站等设施接入移动网络。热点分享的是手机已有的联网能力，也可能消耗手机套餐流量。 从酒店网络切到手机热点，电脑和浏览器可能没变，接入设备、上游路径、名称查询安排和网站看到的来源IP却可能一起变化。所以同一网页切换后恢复，可以提示你检查原网络相关条件；它还不能单独确定究竟是哪一项导致失败。 切换网络不会替你补网站账号权限，也不会清掉浏览器里的登录标记。这是为什么网页恢复后，原来的账号可能仍然在。见网站怎样识别账号。 使用手机号码打普通电话，还会涉及运营商确认号码的服务资格、建立呼叫并传送声音；聊天软件通话也会验证自己的账号。都使用无线接入，不代表后面的服务相同，详见实时通话。 眼前的结果，能把问题缩小到哪里 你已经看到什么 已经知道什么 还需要继续确认什么 --- --- --- 搜得到Wi-Fi名称 附近有设备在提供这个无线网络 能否加入、是否允许向外访问 已连上Wi-Fi 无线接入已经建立 地址安排、外部路径与目标服务是否正常 能使用家中打印机 这次本地任务所需的通信和服务可用 是否能够访问互联网 能打开购物站 至少取得了这个网站的一部分内容 登录、下单和其他网站是否可用 遇到故障时，可以先说清“本地打印正常，公共网站都打不开”，或“公共网站正常，只有公司报销页失败”。这样的描述比一句“Wi-Fi坏了”更容易找到下一步。具体对照顺序见访问排障；家中多台设备怎样共用对外地址，见共享出口。","outline":[{"id":"section-1","title":"在家打印一份文件，信息实际经过哪里","depth":2},{"id":"section-2","title":"同一台电脑打开网站，要多走哪几段","depth":2},{"id":"section-3","title":"宽带断了，为什么打印可能还正常","depth":2},{"id":"section-4","title":"路由器、光猫、运营商，分别接哪一段","depth":2},{"id":"section-5","title":"酒店Wi-Fi为什么要先开一个确认页","depth":2},{"id":"section-6","title":"切到手机热点，为什么结果可能不同","depth":2},{"id":"section-7","title":"眼前的结果，能把问题缩小到哪里","depth":2}]},{"id":"packets","group":"connection","title":"一张照片为什么要分成许多小份？","question":"一张照片为什么要分成许多小份？","summary":"信息分成小份共享链路，接收端按规则恢复应用需要的内容。","terms":["数据包","协议"],"aliases":["数据包","","协议",""],"related":["signals","delivery","speed"],"html":"\u003cp>你上传一组照片时，旁边的人还能发消息、刷网页。网络需要让这些通信共享连接，而不是一张照片从头到尾占住所有传送机会。\u003cstrong>数据会被组织成许多较小的传送单位，各次访问可以穿插使用连接。\u003c/strong> 这些传送单位通常叫数据包。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgNDIwIDUyMCI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjAiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPuWkp+WGheWuueWIhuW8gO+8jOWSjOWwj+a2iOaBr+epv+aPkjwvdGV4dD48dGV4dCB4PSI5NSIgeT0iODMiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPueFp+eJhzwvdGV4dD48dGV4dCB4PSIzMTMiIHk9IjgzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjQzYjM2Ij7nn63mtojmga88L3RleHQ+PHJlY3QgeD0iNDgiIHk9Ijk5IiB3aWR0aD0iMTAyIiBoZWlnaHQ9IjcwIiByeD0iNyIgZmlsbD0iI2U5ZGNjNSIvPjxwYXRoIGQ9Ik01MyAxNjJMODYgMTIwTDExMiAxNDdMMTQyIDExN1YxNjRaIiBmaWxsPSIjYjM4YTUyIi8+PGNpcmNsZSBjeD0iMTI1IiBjeT0iMTE0IiByPSI4IiBmaWxsPSIjZmFmOGYyIi8+PHBhdGggZD0iTTI3OCAxMDJIMzQ4VjE0NkgzMDdMMjg3IDE2M1YxNDZIMjc4WiIgZmlsbD0iI2Q0ZTVkOCIvPjx0ZXh0IHg 9Im1pZGRsZSIgZm9udC1zaXplPSIxNSIgZmlsbD0iI2ZmZiI+MzwvdGV4dD48cGF0aCBkPSJNMjEwIDM3OVY0MTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIzIiBtYXJrZXItZW5kPSJ1cmwoI2EpIi8+PHRleHQgeD0iMjEwIiB5PSI0NDkiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTkiIGZpbGw9IiMyNDNiMzYiPuaOpeaUtuerr+aBouWkjemcgOimgeeahOWGheWuuTwvdGV4dD48dGV4dCB4PSIyMTAiIHk9IjQ4NiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzI0M2IzNiI+5bCP5Lu95LiN5piv5a6M5pW06IGK5aSp5raI5oGvPC90ZXh0PjwvZz48L3N2Zz4=\" alt=\"照片分成小份后，短消息可穿插传送；接收端再恢复应用内容。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>照片分成小份后，短消息可穿插传送；接收端再恢复应用内容。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">一边上传照片，一边发一句“稍等”\u003c/h2>\n\u003cp>以下是一段\u003cstrong>虚构教学过程\u003c/strong>。你在聊天软件里选了几张照片，按下发送。软件先决定上传哪些文件，再把文件数据交给设备的通信功能。设备不会要求沿途每台机器先空出一整张照片的容量，而是分批把数据送出去。\u003c/p>\n\u003cp>假设为方便示意，把正在传的照片数据写成甲、乙、丙三段。刚送完甲，你又发一句“稍等”。设备有机会在继续传照片段之前，先传文字消息或其他应用的数据。沿途共用连接的设备也会安排接下来传哪一份。\u003c/p>\n\u003cp>这里的三段只是教学标记，真实照片通常远不止三份；它也不是照片左边、中间、右边各装一包。照片文件有自己的记录格式，一份数据可能只是格式中的一小段，不能直接当作画面上的一块。\u003c/p>\n\u003ch2 id=\"section-2\">每一份上面，为什么还要带地址\u003c/h2>\n\u003cp>沿途设备收到一份数据，需要知道下一步往哪里转送，所以数据包不只装照片内容，还带有目的IP等交付信息。网络把数据送到聊天服务器以后，接收设备也要分清它属于哪个程序、哪次通信。\u003c/p>\n\u003cp>聊天软件另在自己的请求中写明收件账号。于是有三件相接的工作：目的地址帮助到达聊天服务，端口与连接信息帮助把数据交给接收程序，聊天服务再根据账号决定给哪位朋友。\u003c/p>\n\u003cp>这也是为什么“发给同一个朋友”不意味着每份数据上都写着朋友手机的当前位置。常见聊天安排是先交给服务，再由服务联系朋友。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">IP负责寻址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>；\u003ca href=\"#/ports\">端口\u003c/a>与\u003ca href=\"#/messages\">聊天账号\u003c/a>继续完成后面的分工。\u003c/p>\n\u003ch2 id=\"section-3\">甲、丙先到了，乙没到，接收端会怎样\u003c/h2>\n\u003cp>如果使用需要完整、有序交付的传输方式，接收端会记录已经取得的数据，并反馈接收情况。发送端依据反馈和等待情况补发缺失部分；接收端把补齐的数据按正确顺序交给应用。\u003c/p>\n\u003cp>应用最终获得的是可以按文件格式读取的数据，而不必把网络里的实际到达顺序原样展示出来。所以你可能只看见上传进度暂时停住，稍后继续，而不会在成品照片上看见“路上丢掉一包，所以永久缺了右上角”。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP的有序交付\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>这也不是说所有图片都必须完全收齐后才出现：某些格式或应用可以边取得边显示。关键在于显示方式由格式与程序决定，不能从“分包”直接推断成品一定变成马赛克。\u003c/p>\n\u003ch2 id=\"section-4\">可以穿插，为什么大上传仍会拖慢会议\u003c/h2>\n\u003cp>把大内容分小，并没有增加连接本身的容量。假设家中上行连接已经持续忙着发送照片，会议声音、网页请求和一些接收确认也要等待传送机会；若某处等待队列越来越长，用户就会感觉操作变慢，队列装不下时还可能丢弃数据。\u003c/p>\n\u003cp>因此，“可以共享”不等于“各自有一条保证畅通的独立线路”。短消息很小，也可能遇到排队；不同设备如何调度、应用是否先处理照片、上游哪里拥堵，都会影响实际结果。\u003c/p>\n\u003cp>若暂停照片备份后会议明显改善，可以把同时上传造成的压力列为检查方向；仅凭一次改善，仍不能确定所有等待都发生在家中路由器。速度与排队见\u003ca href=\"#/speed\">网速为什么不只看带宽\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">断网再恢复，是否必定从刚才的百分比继续\u003c/h2>\n\u003cp>要分清两个尺度。一次通信中缺了少量数据，传输机制可能补发；连接已经失败以后，照片应用是否还保存任务、是否允许从某个位置续传，是另一项产品能力。\u003c/p>\n\u003cp>有的应用可以恢复已有上传，有的会重新发送整个文件，也有的需要用户重试。进度条恢复不能证明底层一直保持同一连接，进度条归零也不能说明此前从未有数据到达。\u003c/p>\n\u003cp>同样，数据包可以经过同一路径，网络变化后也可能改走其他路径。“分成很多份”只说明怎样组织传送，不意味着每一份都故意分走一条不同道路。路径如何选择见\u003ca href=\"#/routes\">逐跳转送\u003c/a>，缺失怎样补回见\u003ca href=\"#/delivery\">信息交付\u003c/a>。\u003c/p>\n","text":"一张照片为什么要分成许多小份？ 你上传一组照片时，旁边的人还能发消息、刷网页。网络需要让这些通信共享连接，而不是一张照片从头到尾占住所有传送机会。 数据会被组织成许多较小的传送单位，各次访问可以穿插使用连接。 这些传送单位通常叫数据包。 照片分成小份后，短消息可穿插传送；接收端再恢复应用内容。 一边上传照片，一边发一句“稍等” 以下是一段 虚构教学过程 。你在聊天软件里选了几张照片，按下发送。软件先决定上传哪些文件，再把文件数据交给设备的通信功能。设备不会要求沿途每台机器先空出一整张照片的容量，而是分批把数据送出去。 假设为方便示意，把正在传的照片数据写成甲、乙、丙三段。刚送完甲，你又发一句“稍等”。设备有机会在继续传照片段之前，先传文字消息或其他应用的数据。沿途共用连接的设备也会安排接下来传哪一份。 这里的三段只是教学标记，真实照片通常远不止三份；它也不是照片左边、中间、右边各装一包。照片文件有自己的记录格式，一份数据可能只是格式中的一小段，不能直接当作画面上的一块。 每一份上面，为什么还要带地址 沿途设备收到一份数据，需要知道下一步往哪里转送，所以数据包不只装照片内容，还带有目的IP等交付信息。网络把数据送到聊天服务器以后，接收设备也要分清它属于哪个程序、哪次通信。 聊天软件另在自己的请求中写明收件账号。于是有三件相接的工作：目的地址帮助到达聊天服务，端口与连接信息帮助把数据交给接收程序，聊天服务再根据账号决定给哪位朋友。 这也是为什么“发给同一个朋友”不意味着每份数据上都写着朋友手机的当前位置。常见聊天安排是先交给服务，再由服务联系朋友。IP负责寻址；端口与聊天账号继续完成后面的分工。 甲、丙先到了，乙没到，接收端会怎样 如果使用需要完整、有序交付的传输方式，接收端会记录已经取得的数据，并反馈接收情况。发送端依据反馈和等待情况补发缺失部分；接收端把补齐的数据按正确顺序交给应用。 应用最终获得的是可以按文件格式读取的数据，而不必把网络里的实际到达顺序原样展示出来。所以你可能只看见上传进度暂时停住，稍后继续，而不会在成品照片上看见“路上丢掉一包，所以永久缺了右上角”。TCP的有序交付 这也不是说所有图片都必须完全收齐后才出现：某些格式或应用可以边取得边显示。关键在于显示方式由格式与程序决定，不能从“分包”直接推断成品一定变成马赛克。 可以穿插，为什么大上传仍会拖慢会议 把大内容分小，并没有增加连接本身的容量。假设家中上行连接已经持续忙着发送照片，会议声音、网页请求和一些接收确认也要等待传送机会；若某处等待队列越来越长，用户就会感觉操作变慢，队列装不下时还可能丢弃数据。 因此，“可以共享”不等于“各自有一条保证畅通的独立线路”。短消息很小，也可能遇到排队；不同设备如何调度、应用是否先处理照片、上游哪里拥堵，都会影响实际结果。 若暂停照片备份后会议明显改善，可以把同时上传造成的压力列为检查方向；仅凭一次改善，仍不能确定所有等待都发生在家中路由器。速度与排队见网速为什么不只看带宽。 断网再恢复，是否必定从刚才的百分比继续 要分清两个尺度。一次通信中缺了少量数据，传输机制可能补发；连接已经失败以后，照片应用是否还保存任务、是否允许从某个位置续传，是另一项产品能力。 有的应用可以恢复已有上传，有的会重新发送整个文件，也有的需要用户重试。进度条恢复不能证明底层一直保持同一连接，进度条归零也不能说明此前从未有数据到达。 同样，数据包可以经过同一路径，网络变化后也可能改走其他路径。“分成很多份”只说明怎样组织传送，不意味着每一份都故意分走一条不同道路。路径如何选择见逐跳转送，缺失怎样补回见信息交付。","outline":[{"id":"section-1","title":"一边上传照片，一边发一句“稍等”","depth":2},{"id":"section-2","title":"每一份上面，为什么还要带地址","depth":2},{"id":"section-3","title":"甲、丙先到了，乙没到，接收端会怎样","depth":2},{"id":"section-4","title":"可以穿插，为什么大上传仍会拖慢会议","depth":2},{"id":"section-5","title":"断网再恢复，是否必定从刚才的百分比继续","depth":2}]},{"id":"ip","group":"address","title":"IP是什么，为什么信息需要地址？","question":"IP是什么，为什么信息需要地址？","summary":"IP帮助网络转送请求和回复；电脑的内网IP、网站的IP和网站看到的来源IP各不相同。","terms":["IP","IPv4","IPv6","内网IP","公网IP"],"aliases":["IP","IP address 地址 公网 内网 IPv4 IPv6","IPv4","","IPv6","","内网IP","","公网IP","public IP 出口地址"],"related":["ports","nat","domains","identity","risk"],"html":"\u003cp>你在浏览器里选择一件商品，网络并不知道“这是一家购物网站”，也不理解“蓝色款”。它先需要一个可以用来转送数据的目标。\u003cstrong>IP地址标明数据包要送往哪个网络位置；来源地址则帮助对方把回复送回来。\u003c/strong> 商品和颜色，要等网站程序收到请求后再解释。\u003c/p>\n\u003cp>IP地址可能变化，一台设备也可能有多个地址。它与设备怎样接入网络有关，不能直接当成某个人的永久编号。\u003c/p>\n\u003ch2 id=\"section-1\">一次访问里，其实有不止一个IP\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构家庭示例\u003c/strong>。为看清关系，采用专供文档使用的公网示例地址，不对应实际可访问的网站；家中地址也是教学设定，不需要照着修改。公网示例范围见\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5737.html\" target=\"_blank\" rel=\"noopener noreferrer\">RFC 5737\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>位置\u003c/th>\n\u003cth>示例地址\u003c/th>\n\u003cth>在这次访问中的角色\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>你的电脑在家中网络里的连接\u003c/td>\n\u003ctd>192.168.1.20\u003c/td>\n\u003ctd>家中设备联系电脑时使用的内部地址\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>家庭上网出口\u003c/td>\n\u003ctd>203.0.113.10\u003c/td>\n\u003ctd>这次共享IPv4访问向外使用的来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>商品网站的接收入口\u003c/td>\n\u003ctd>198.51.100.40\u003c/td>\n\u003ctd>电脑准备联系的远方目标\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>你点开商品页，浏览器先通过名称查询取得网站地址。电脑发出的数据包，把网站地址作为目的地址，把自己的地址作为来源地址。家中路由器接到以后，把它继续转送出去。\u003c/p>\n\u003cp>在这个共享IPv4示例里，出口会改写对外使用的来源，并记住这次连接来自家中哪台设备。因此，网站看到请求来自203.0.113.10，不需要知道电脑在家中叫192.168.1.20，也能把回复发回出口。出口再按记录转回你的电脑。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享地址的机制与影响\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>浏览器中的IP查询页，通常报告的是“它收到的这次访问来自哪里”。它不会因为你打开它，就把家里每台设备的内部地址全部找出来。网络设置和查询页数字不同，首先应看它们分别在回答哪个问题。\u003c/p>\n\u003ch2 id=\"section-2\">目的地址为什么不能决定我看哪件商品\u003c/h2>\n\u003cp>商品站可以在同一个接收入口提供成千上万件商品。访问42号和43号商品时，目的IP完全可以一样；浏览器在请求里另外写明商品路径，网站才知道查哪件。\u003c/p>\n\u003cp>同一设备还可以运行不止一个接收程序。数据到达目标以后，需要用\u003ca href=\"#/ports\">端口\u003c/a>等信息区分交给谁；网页程序收到后，再读取主机名、路径和参数。\u003cstrong>IP帮助到达，端口帮助交给程序，网页请求再表达具体需求。\u003c/strong> 这些工作不能靠一个地址全部完成。\u003c/p>\n\u003cp>所以拿到一个IP，并没有拿到“这台设备的所有页面和文件”。相应服务可能没有运行、没有接收外部访问，或者需要账号权限。公网地址只表示地址在公共互联网中的用途，不代表访问许可。\u003c/p>\n\u003ch2 id=\"section-3\">为什么邻居电脑也可能叫192.168.1.20\u003c/h2>\n\u003cp>家中网络需要在自己的范围内区分电脑、手机和打印机。常见家庭路由器在设备加入时，自动安排内部IP，并告诉设备怎样联系外部网络。你通常不用自己挑一串数字。\u003c/p>\n\u003cp>另一个家庭也可以独立使用192.168.1.20。两个地址属于各自的内部范围，公共互联网不会只看这串内网数字，就知道你要去哪一家。你把自家打印机地址发给外地朋友，他在自己网络里输入它，并不会自动进入你家。\u003c/p>\n\u003cp>但在同一个普通网络范围内，若两台设备同时错误地占用了同一个地址，通信可能发生冲突。地址可以在分开的网络中重复，与在同一范围里需要区分设备，并不矛盾。\u003c/p>\n\u003ch2 id=\"section-4\">电脑还是那台，为什么换Wi-Fi后地址变了\u003c/h2>\n\u003cp>把电脑带到咖啡店，接入的是另一张网络，对方会按自己的安排提供地址。电脑的文件和浏览器没有因此更换，网络位置却变了。离开某个网络以后，原地址也不能保证永远只分给你。\u003c/p>\n\u003cp>更准确地说，地址关联设备接入网络的接口。“接口”可以先理解为设备与某个网络相接的入口。电脑同时使用有线、Wi-Fi和VPN时，可以同时有多套地址，系统再决定某次通信使用哪条路径。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8200.html\" target=\"_blank\" rel=\"noopener noreferrer\">地址与接口的关系\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>家庭对外地址通常由运营商安排，也可能经过运营商的共享出口。设备内部地址固定，不代表网站看到的来源固定；外部来源保持不变，也不能说明只有你一个人在使用它。这个区别在\u003ca href=\"#/nat\">共享出口\u003c/a>继续展开。\u003c/p>\n\u003ch2 id=\"section-5\">IPv4和IPv6为什么长得不一样\u003c/h2>\n\u003cp>IPv4常写成用点隔开的数字，IPv6常写成带冒号的较长字符。它们是两代地址与传送规则，都用来说明数据包来源和目的地。IPv6提供更大的地址空间，一台设备也可能同时使用两代地址。\u003c/p>\n\u003cp>看到查询页同时显示IPv4和IPv6，不必先判断配置错了：两次查询可能分别使用了不同类型的连接。使用共享IPv4时，网站可能看到共同出口；使用IPv6时，设备则可能拥有自己的公网地址。是否允许别人主动连接，仍要看程序、路由和防火墙，不能只看地址长相。\u003c/p>\n\u003cp>IPv6里的冒号属于地址本身。放进网址时，通常先用方括号包住地址，再在外面写可选端口，例如 \u003ccode>http://[2001:db8::20]:8080\u003c/code>。方括号里的部分是地址，最后的8080才是端口；这里也采用文档示例地址。\u003c/p>\n\u003ch2 id=\"section-6\">IP为什么常被称为“身份标识”\u003c/h2>\n\u003cp>网站收到连接时，通常就能观察来源IP。即使用户尚未登录，网站也可以先把同一来源的请求归在一起，统计次数或比较来源地区。这是IP容易被用于访问关联和风控的原因。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享IP的识别边界\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>但在前面的家庭示例中，你和家人都可能通过203.0.113.10访问；你改用手机流量后，又可能换一个来源。\u003cstrong>同IP不必是同一个人，同一个人也不必一直用同IP。\u003c/strong> “身份标识”在这里更适合解释为网络来源线索，不能直接替代账号、密码或人的真实身份。\u003c/p>\n\u003cp>日常看见IP时，可以先问：它是我在内部网络的位置、网站的目标地址，还是网站观察到的访问来源？分清角色，再读\u003ca href=\"#/identity\">账号身份\u003c/a>和\u003ca href=\"#/risk\">IP风控\u003c/a>，会更容易理解它能证明什么、不能证明什么。\u003c/p>\n","text":"IP是什么，为什么信息需要地址？ 你在浏览器里选择一件商品，网络并不知道“这是一家购物网站”，也不理解“蓝色款”。它先需要一个可以用来转送数据的目标。 IP地址标明数据包要送往哪个网络位置；来源地址则帮助对方把回复送回来。 商品和颜色，要等网站程序收到请求后再解释。 IP地址可能变化，一台设备也可能有多个地址。它与设备怎样接入网络有关，不能直接当成某个人的永久编号。 一次访问里，其实有不止一个IP 以下是 虚构家庭示例 。为看清关系，采用专供文档使用的公网示例地址，不对应实际可访问的网站；家中地址也是教学设定，不需要照着修改。公网示例范围见RFC 5737。 位置 示例地址 在这次访问中的角色 --- --- --- 你的电脑在家中网络里的连接 192.168.1.20 家中设备联系电脑时使用的内部地址 家庭上网出口 203.0.113.10 这次共享IPv4访问向外使用的来源 商品网站的接收入口 198.51.100.40 电脑准备联系的远方目标 你点开商品页，浏览器先通过名称查询取得网站地址。电脑发出的数据包，把网站地址作为目的地址，把自己的地址作为来源地址。家中路由器接到以后，把它继续转送出去。 在这个共享IPv4示例里，出口会改写对外使用的来源，并记住这次连接来自家中哪台设备。因此，网站看到请求来自203.0.113.10，不需要知道电脑在家中叫192.168.1.20，也能把回复发回出口。出口再按记录转回你的电脑。共享地址的机制与影响 浏览器中的IP查询页，通常报告的是“它收到的这次访问来自哪里”。它不会因为你打开它，就把家里每台设备的内部地址全部找出来。网络设置和查询页数字不同，首先应看它们分别在回答哪个问题。 目的地址为什么不能决定我看哪件商品 商品站可以在同一个接收入口提供成千上万件商品。访问42号和43号商品时，目的IP完全可以一样；浏览器在请求里另外写明商品路径，网站才知道查哪件。 同一设备还可以运行不止一个接收程序。数据到达目标以后，需要用端口等信息区分交给谁；网页程序收到后，再读取主机名、路径和参数。 IP帮助到达，端口帮助交给程序，网页请求再表达具体需求。 这些工作不能靠一个地址全部完成。 所以拿到一个IP，并没有拿到“这台设备的所有页面和文件”。相应服务可能没有运行、没有接收外部访问，或者需要账号权限。公网地址只表示地址在公共互联网中的用途，不代表访问许可。 为什么邻居电脑也可能叫192.168.1.20 家中网络需要在自己的范围内区分电脑、手机和打印机。常见家庭路由器在设备加入时，自动安排内部IP，并告诉设备怎样联系外部网络。你通常不用自己挑一串数字。 另一个家庭也可以独立使用192.168.1.20。两个地址属于各自的内部范围，公共互联网不会只看这串内网数字，就知道你要去哪一家。你把自家打印机地址发给外地朋友，他在自己网络里输入它，并不会自动进入你家。 但在同一个普通网络范围内，若两台设备同时错误地占用了同一个地址，通信可能发生冲突。地址可以在分开的网络中重复，与在同一范围里需要区分设备，并不矛盾。 电脑还是那台，为什么换Wi-Fi后地址变了 把电脑带到咖啡店，接入的是另一张网络，对方会按自己的安排提供地址。电脑的文件和浏览器没有因此更换，网络位置却变了。离开某个网络以后，原地址也不能保证永远只分给你。 更准确地说，地址关联设备接入网络的接口。“接口”可以先理解为设备与某个网络相接的入口。电脑同时使用有线、Wi-Fi和VPN时，可以同时有多套地址，系统再决定某次通信使用哪条路径。地址与接口的关系 家庭对外地址通常由运营商安排，也可能经过运营商的共享出口。设备内部地址固定，不代表网站看到的来源固定；外部来源保持不变，也不能说明只有你一个人在使用它。这个区别在共享出口继续展开。 IPv4和IPv6为什么长得不一样 IPv4常写成用点隔开的数字，IPv6常写成带冒号的较长字符。它们是两代地址与传送规则，都用来说明数据包来源和目的地。IPv6提供更大的地址空间，一台设备也可能同时使用两代地址。 看到查询页同时显示IPv4和IPv6，不必先判断配置错了：两次查询可能分别使用了不同类型的连接。使用共享IPv4时，网站可能看到共同出口；使用IPv6时，设备则可能拥有自己的公网地址。是否允许别人主动连接，仍要看程序、路由和防火墙，不能只看地址长相。 IPv6里的冒号属于地址本身。放进网址时，通常先用方括号包住地址，再在外面写可选端口，例如 http://[2001:db8::20]:8080 。方括号里的部分是地址，最后的8080才是端口；这里也采用文档示例地址。 IP为什么常被称为“身份标识” 网站收到连接时，通常就能观察来源IP。即使用户尚未登录，网站也可以先把同一来源的请求归在一起，统计次数或比较来源地区。这是IP容易被用于访问关联和风控的原因。共享IP的识别边界 但在前面的家庭示例中，你和家人都可能通过203.0.113.10访问；你改用手机流量后，又可能换一个来源。 同IP不必是同一个人，同一个人也不必一直用同IP。 “身份标识”在这里更适合解释为网络来源线索，不能直接替代账号、密码或人的真实身份。 日常看见IP时，可以先问：它是我在内部网络的位置、网站的目标地址，还是网站观察到的访问来源？分清角色，再读账号身份和IP风控，会更容易理解它能证明什么、不能证明什么。","outline":[{"id":"section-1","title":"一次访问里，其实有不止一个IP","depth":2},{"id":"section-2","title":"目的地址为什么不能决定我看哪件商品","depth":2},{"id":"section-3","title":"为什么邻居电脑也可能叫192.168.1.20","depth":2},{"id":"section-4","title":"电脑还是那台，为什么换Wi-Fi后地址变了","depth":2},{"id":"section-5","title":"IPv4和IPv6为什么长得不一样","depth":2},{"id":"section-6","title":"IP为什么常被称为“身份标识”","depth":2}]},{"id":"ports","group":"address","title":"知道IP后，为什么还要写端口？","question":"知道IP后，为什么还要写端口？","summary":"同一设备可以运行多个程序，端口帮助区分通信交给哪个程序或连接。","terms":["端口","监听","默认端口"],"aliases":["端口","port socket 冒号 3000 8080 443","监听","","默认端口",""],"related":["ip"],"html":"\u003cp>你在浏览器里见过 \u003ccode>http://192.168.1.20:8080\u003c/code>，也见过 \u003ccode>localhost:3000\u003c/code>。冒号后面的数字是端口。\u003cstrong>IP帮助数据到达目标设备的网络接口，端口帮助设备把数据交给相应程序或连接。\u003c/strong> 只有地址还不足以说明要联系哪项服务。\u003c/p>\n\u003cp>这些地址是教学示例，不要求你实际打开或修改。一个设备上可以同时运行网页、文件共享、远程控制等程序；它们需要分别接住属于自己的通信。\u003c/p>\n\u003ch2 id=\"section-1\">同一设备上，不同程序可以使用不同端口\u003c/h2>\n\u003cp>下面是一台\u003cstrong>虚构家用设备\u003c/strong>：管理网页在8080接收，照片展示服务在9000接收。你用同一个IP加不同端口，就可能进入不同服务。把8080改成9000不是“翻到同一网站第9000页”，而是在联系另一个接收入口。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MjAgNjAwIiByb2xlPSJpbWciPjx0aXRsZT5JUOS4juerr+WPo+WwhumAmuS/oeS6pOe7meiuvuWkh+S4iueahOacjeWKoTwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNiIgcmVmWT0iMyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDYgM0wwIDYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzQyNzY2NCIvPjwvbWFya2VyPjwvZGVmcz48cmVjdCB3aWR0aD0iNDIwIiBoZWlnaHQ9IjYwMCIgZmlsbD0iI2ZhZjhmMiIvPjxzdHlsZT50ZXh0e2ZvbnQtZmFtaWx5OlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmO2ZpbGw6IzI5NGQ0MDtmb250LXNpemU6MTVweH0uc21hbGx7Zm9udC1zaXplOjEycHg7ZmlsbDojNjY3NDY3fS50aXRsZXtmb250LXNpemU6MjFweDtmb250LXdlaWdodDo2MDB9LmxpbmV7ZmlsbDpub25lO3N0cm9rZTojNDI3NjY0O3N0cm9rZS13aWR0aDoyO21hcmtlci1lbmQ6dXJsKCNhKX08L3N0eWxlPjx0ZXh0IHg9IjI0IiB5PSIzOCIgY2xhc3M9InRpdGxlIj7lkIzkuIDorr7lpIfvvIzkuI3lkIzmnI3liqHlhaXlj6M8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjY0IiBjbGFzcz0ic21hbGwiPuiZmuaehOeFp+eJh+iuvuWkhyDCtyDnvZHnu5znm67moIdJUOS/neaMgeebuOWQjDwvdGV4dD48cmVjdCB4PSIxMTYiIHk9 ，必须有对应服务，且当前网络能连接它，而且访问规则允许这次请求。\u003c/p>\n\u003ch2 id=\"section-2\">输入IP加端口以后，谁先接到请求\u003c/h2>\n\u003cp>把上面的\u003cstrong>虚构家用设备\u003c/strong>继续展开。你输入\u003ca href=\"http://192.168.1.20:9000，浏览器按HTTP方式准备联系192.168.1.20的9000端口。网络先把数据送到设备，设备的通信功能再把这次通信交给在那里等待的照片程序。\" target=\"_blank\" rel=\"noopener noreferrer\">http://192.168.1.20:9000，浏览器按HTTP方式准备联系192.168.1.20的9000端口。网络先把数据送到设备，设备的通信功能再把这次通信交给在那里等待的照片程序。\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>照片程序收到网页请求，读取路径，决定返回照片列表还是要求登录。浏览器收到回复，才显示界面。因此“端口对应程序”不代表端口数字自己含有照片功能；程序换了、停止了，或改为在别处接收，结果都会改变。\u003c/p>\n\u003cp>若设备的9000运行的是另一种服务，不理解HTTP，浏览器也不能靠“数字正确”自动显示网页。完整地址中的访问方式、目标、端口必须与接收安排配合。你日常拿到服务提供者给的完整地址，比自己试数字更可靠。\u003c/p>\n\u003ch2 id=\"section-3\">普通网址看不到端口，为什么也能访问\u003c/h2>\n\u003cp>HTTP通常默认80，HTTPS通常默认443，因此普通网站省略它们。\u003ccode>https://shop.example.com\u003c/code> 常可理解为使用443这个入口，不需要用户填数字。这里的默认只决定尝试哪个入口，不保证那里真的有服务。\u003c/p>\n\u003cp>定制服务、本地开发或设备管理页可能使用其他端口，提供者就会把它写进地址。实际采用什么数字，由接收程序与部署安排决定；把别人的教程端口照搬到自己的服务，未必成立。\u003c/p>\n\u003cp>访问方式也必须匹配。某端口提供普通HTTP，另一个提供HTTPS；不是换成https字样就能让对方突然支持保护连接。你收到的完整地址同时包含这两类约定。\u003c/p>\n\u003ch2 id=\"section-4\">端口、路径、子域名怎样一起工作\u003c/h2>\n\u003cp>想象这家虚构网站在同一公共接收入口提供商品、订单和帮助：\u003ccode>/products/42\u003c/code>、\u003ccode>/orders/18\u003c/code>、\u003ccode>/help\u003c/code>。这些路径由已经接住请求的网站程序解释，不需要每个页面单独分配端口。\u003c/p>\n\u003cp>同一个接收入口也能为 \u003ccode>shop.example.com\u003c/code> 和 \u003ccode>help.example.com\u003c/code> 服务。网页请求里保留主机信息，入口可据此选择站点，再按路径选资源。因此关系不是“一个IP对应一个网站，一个端口对应一页”。\u003ca href=\"#/domains\">域名与多站点\u003c/a>会接着展开。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你改变的内容\u003c/th>\n\u003cth>哪个环节先要重新判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IP地址\u003c/td>\n\u003ctd>联系哪个网络目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口\u003c/td>\n\u003ctd>该目标上哪个接收入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主机名\u003c/td>\n\u003ctd>查询哪个名称；接收入口还需识别哪个站点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/后面的路径\u003c/td>\n\u003ctd>站点中的哪个资源或操作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>打开网页时，浏览器既要找到目标IP和端口，也要在请求中说明主机名、路径等信息。这些部分一起使用，各自影响不同步骤。\u003c/p>\n\u003ch2 id=\"section-5\">我的电脑同时开很多网页，回复怎么不混在一起\u003c/h2>\n\u003cp>浏览器发起连接时，你这端也会使用自己的通信端口。常见TCP连接可由两端地址、两端端口区分，设备才能把回复送回相应连接。若使用UDP等不同传输方式，识别还要考虑传输方式，不能只认一个数字。\u003c/p>\n\u003cp>例如本机同时向网站A和网站B发出请求，系统会保留各条通信的两端信息。回复回来先归入对应连接，再由浏览器把结果交到需要它的页面；不是所有443端口回来的内容都显示到最后点击的标签页。\u003c/p>\n\u003cp>一次连接还可能承载多个网页请求，现代浏览器会复用连接。因此“每个标签页固定拥有一个永久端口”也不是准确模型。这里需要理解的是两层分工：系统把信息归到连接，浏览器再把请求结果交给对应页面。\u003c/p>\n\u003cp>家中多人共用公网IP时，出口还会记录端口等信息，区分回复应返回哪台设备。这就是\u003ca href=\"#/nat\">共享出口\u003c/a>在地址之外必须保留通信记录的原因。\u003c/p>\n\u003ch2 id=\"section-6\">本机能开，为什么别人不能用同一地址打开\u003c/h2>\n\u003cp>\u003ccode>localhost\u003c/code>指访问者当前这台设备，\u003ccode>127.0.0.1\u003c/code>是常见本机回环地址。你把自己的localhost链接发给朋友，他的浏览器会去找他自己电脑上的那个端口，不会自动找你。\u003c/p>\n\u003cp>即使你给出局域网IP，服务也可能只接收本机访问；即使服务接受局域网访问，外地朋友仍可能没有进入你家网络的路径。要对外提供服务，还要同时有程序正在运行、愿意接收外部请求，网络能把请求送到，并且你有权使用。见\u003ca href=\"#/deploy\">自己的网页如何分享\u003c/a>。\u003c/p>\n\u003cp>所以拿到IP加端口时，可以依次问：目标在哪里，这个入口是什么服务，它是否在运行，我从当前网络能否到达，是否有权使用。传输端口与连接的规范依据见\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">TCP规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>，网页默认入口和主机信息见\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP语义规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>。\u003c/p>\n","text":"知道IP后，为什么还要写端口？ 你在浏览器里见过 http://192.168.1.20:8080 ，也见过 localhost:3000 。冒号后面的数字是端口。 IP帮助数据到达目标设备的网络接口，端口帮助设备把数据交给相应程序或连接。 只有地址还不足以说明要联系哪项服务。 这些地址是教学示例，不要求你实际打开或修改。一个设备上可以同时运行网页、文件共享、远程控制等程序；它们需要分别接住属于自己的通信。 同一设备上，不同程序可以使用不同端口 下面是一台 虚构家用设备 ：管理网页在8080接收，照片展示服务在9000接收。你用同一个IP加不同端口，就可能进入不同服务。把8080改成9000不是“翻到同一网站第9000页”，而是在联系另一个接收入口。 到达同一设备IP的通信按端口进入不同接收程序；入口无人监听时，不会自动打开页面。 程序在某个端口等待相应通信，叫“监听”。它是软件与操作系统建立的接收安排，不是电脑上新增一个实体插孔。网线接口与这里说的端口是两回事。 如果9000上根本没有程序接收，浏览器可能报连接拒绝；若防护规则或路径把信息丢掉，也可能表现为等待超时。端口数字本身没有“打开照片”的能力，必须有对应服务，且当前网络能连接它，而且访问规则允许这次请求。 输入IP加端口以后，谁先接到请求 把上面的 虚构家用设备 继续展开。你输入http://192.168.1.20:9000，浏览器按HTTP方式准备联系192.168.1.20的9000端口。网络先把数据送到设备，设备的通信功能再把这次通信交给在那里等待的照片程序。 照片程序收到网页请求，读取路径，决定返回照片列表还是要求登录。浏览器收到回复，才显示界面。因此“端口对应程序”不代表端口数字自己含有照片功能；程序换了、停止了，或改为在别处接收，结果都会改变。 若设备的9000运行的是另一种服务，不理解HTTP，浏览器也不能靠“数字正确”自动显示网页。完整地址中的访问方式、目标、端口必须与接收安排配合。你日常拿到服务提供者给的完整地址，比自己试数字更可靠。 普通网址看不到端口，为什么也能访问 HTTP通常默认80，HTTPS通常默认443，因此普通网站省略它们。 https://shop.example.com 常可理解为使用443这个入口，不需要用户填数字。这里的默认只决定尝试哪个入口，不保证那里真的有服务。 定制服务、本地开发或设备管理页可能使用其他端口，提供者就会把它写进地址。实际采用什么数字，由接收程序与部署安排决定；把别人的教程端口照搬到自己的服务，未必成立。 访问方式也必须匹配。某端口提供普通HTTP，另一个提供HTTPS；不是换成https字样就能让对方突然支持保护连接。你收到的完整地址同时包含这两类约定。 端口、路径、子域名怎样一起工作 想象这家虚构网站在同一公共接收入口提供商品、订单和帮助： /products/42 、 /orders/18 、 /help 。这些路径由已经接住请求的网站程序解释，不需要每个页面单独分配端口。 同一个接收入口也能为 shop.example.com 和 help.example.com 服务。网页请求里保留主机信息，入口可据此选择站点，再按路径选资源。因此关系不是“一个IP对应一个网站，一个端口对应一页”。域名与多站点会接着展开。 你改变的内容 哪个环节先要重新判断 --- --- IP地址 联系哪个网络目标 端口 该目标上哪个接收入口 主机名 查询哪个名称；接收入口还需识别哪个站点 /后面的路径 站点中的哪个资源或操作 打开网页时，浏览器既要找到目标IP和端口，也要在请求中说明主机名、路径等信息。这些部分一起使用，各自影响不同步骤。 我的电脑同时开很多网页，回复怎么不混在一起 浏览器发起连接时，你这端也会使用自己的通信端口。常见TCP连接可由两端地址、两端端口区分，设备才能把回复送回相应连接。若使用UDP等不同传输方式，识别还要考虑传输方式，不能只认一个数字。 例如本机同时向网站A和网站B发出请求，系统会保留各条通信的两端信息。回复回来先归入对应连接，再由浏览器把结果交到需要它的页面；不是所有443端口回来的内容都显示到最后点击的标签页。 一次连接还可能承载多个网页请求，现代浏览器会复用连接。因此“每个标签页固定拥有一个永久端口”也不是准确模型。这里需要理解的是两层分工：系统把信息归到连接，浏览器再把请求结果交给对应页面。 家中多人共用公网IP时，出口还会记录端口等信息，区分回复应返回哪台设备。这就是共享出口在地址之外必须保留通信记录的原因。 本机能开，为什么别人不能用同一地址打开 localhost 指访问者当前这台设备， 127.0.0.1 是常见本机回环地址。你把自己的localhost链接发给朋友，他的浏览器会去找他自己电脑上的那个端口，不会自动找你。 即使你给出局域网IP，服务也可能只接收本机访问；即使服务接受局域网访问，外地朋友仍可能没有进入你家网络的路径。要对外提供服务，还要同时有程序正在运行、愿意接收外部请求，网络能把请求送到，并且你有权使用。见自己的网页如何分享。 所以拿到IP加端口时，可以依次问：目标在哪里，这个入口是什么服务，它是否在运行，我从当前网络能否到达，是否有权使用。传输端口与连接的规范依据见TCP规范，网页默认入口和主机信息见HTTP语义规范。","outline":[{"id":"section-1","title":"同一设备上，不同程序可以使用不同端口","depth":2},{"id":"section-2","title":"输入IP加端口以后，谁先接到请求","depth":2},{"id":"section-3","title":"普通网址看不到端口，为什么也能访问","depth":2},{"id":"section-4","title":"端口、路径、子域名怎样一起工作","depth":2},{"id":"section-5","title":"我的电脑同时开很多网页，回复怎么不混在一起","depth":2},{"id":"section-6","title":"本机能开，为什么别人不能用同一地址打开","depth":2}]},{"id":"nat","group":"address","title":"电脑的IP与网站看到的IP，为什么不一样？","question":"电脑的IP与网站看到的IP，为什么不一样？","summary":"路由器转换对外使用的地址，并记录哪台设备发出了请求，把回复送回去。","terms":["NAT","共享IP","动态IP","静态IP"],"aliases":["NAT","Network Address Translation 地址转换","共享IP","","动态IP","","静态IP",""],"related":["ip","remote","deploy","identity","risk"],"html":"\u003cp>电脑网络设置里是一个地址，IP查询网页却显示另一个地址，这常常是正常现象。\u003cstrong>在常见的共享IPv4上网方式中，家中设备使用内部地址，对外访问经过共同出口；出口转换地址，并保存通信的对应关系。\u003c/strong> 网站因此可能看到相同的来源，回复却仍能回到正确设备。\u003c/p>\n\u003cp>这种转换与记录的机制叫NAT。它解释一种常见网络安排，不代表所有IPv6或所有VPN连接都采用同样方式。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNTI1IiB2aWV3Qm94PSIwIDAgNDIwIDUyNSI+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9IiMyNzY2NTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1MjUiIGZpbGw9IiNmYWY4ZjIiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPjx0ZXh0IHg9IjIxMCIgeT0iMzIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyNDNiMzYiPuS4jeWQjOiuvuWkh++8jOWFseeUqOWvueWkluadpea6kDwvdGV4dD48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSg5MSwxMDYpIj48cmVjdCB4PSItMzQiIHk9Ii0yNyIgd2lkdGg9IjY4IiBoZWlnaHQ9IjQ1IiByeD0iNCIgZmlsbD0iI2ZmZmVmYSIgc3Ryb2tlPSIjMjc2NjU1IiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNLTQxIDI1SDQxTDM0IDE4SC0zNFoiIGZpbGw9IiNjNmRhY2IiIHN0cm9rZT0iIzI3NjY1NSIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9nPjx0ZXh0IHg9IjkxIiB5PSIxNjIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyNDNiMzYiPuWGhee9kUE8L3RleHQ+PGcgdHJhbnNmb3JtP noreferrer\">共享地址与连接区分\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>家中路由器不是读完订单才决定“这是爸爸的、这是妈妈的”。它依据通信记录转送；购物网站则根据各浏览器携带的登录标记，查出不同账号的购物车和订单。地址转换与账号识别在同一次访问中各做各的工作。\u003c/p>\n\u003ch2 id=\"section-2\">IP查询页为什么不能列出家中所有设备\u003c/h2>\n\u003cp>查询页能报告的是它收到的访问来源。本例中，它看到的是共同出口，就报告出口的公网地址。它不需要、也不能仅凭这次访问直接枚举家中A和B的全部内部地址。\u003c/p>\n\u003cp>因此，你在电脑和手机上打开同一个查询页，可能看到相同IPv4；两台设备的网络设置里却各有不同的内网IP。两种观察分别在说“内部怎样联系”和“外面看到从哪里来”。\u003c/p>\n\u003cp>共享还可能发生在更上游。运营商可以让多个家庭共用公共出口，公司、校园和VPN服务也可能汇集许多人的访问。看到同IP，只能先把它理解为同一网络来源，不能直接下“同一个人在操作”的结论。\u003c/p>\n\u003ch2 id=\"section-3\">我能收到网站回复，为什么朋友不能主动连进来\u003c/h2>\n\u003cp>继续用电脑A的访问看：A主动发请求时，出口已经建立对应记录。网站的回复沿这条通信回来，出口知道应该转给A。\u003c/p>\n\u003cp>现在改一个条件：朋友从外面第一次联系你家的某个服务。对于这条新通信，出口可能既没有现成记录，也没有规则说明该交给家中哪台设备，而且防火墙可能不允许接收。它不会因为你曾经能上网，就把陌生请求随意转给某一台电脑。\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">主动出站与外部发起连接\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>所以，“我可以下载文件”与“外面的人可以访问我的文件服务”需要不同条件。前者接收既有访问的回复，后者要为新访问提供合适的入口和许可。\u003c/p>\n\u003ch2 id=\"section-4\">端口转发，是怎样把新访问交给家中设备\u003c/h2>\n\u003cp>假设你明确需要对外提供一项自有服务，并按设备和网络提供者的要求安排入口。端口转发规则可以表达：“发到我公共入口这个端口的新通信，转给家中指定设备的指定端口。”公网与内网两侧的端口编号可以不同。\u003c/p>\n\u003cp>它只补上这段转送关系。家中程序还要运行、接受相应网络的请求，设备防火墙要允许，服务账号也要有权限。改一个数字不会自动创建程序或取得权限。\u003c/p>\n\u003cp>如果运营商前面又做了一次地址共享，朋友的请求可能根本没有机会到达你家路由器。只改家中转发规则，不能替运营商建立上游入口。自有设备的远程访问可以采用\u003ca href=\"#/remote\">获准的私有连接\u003c/a>；公共网页也可以交由\u003ca href=\"#/deploy\">托管服务\u003c/a>提供入口。这些是不同方案，不需要为了理解原理就修改真实网络。\u003c/p>\n\u003ch2 id=\"section-5\">静态、动态、共享，为什么不能混着说\u003c/h2>\n\u003cp>“静态”或“固定”描述按安排地址是否保持；“动态”描述地址可能随接入安排变化。动态不表示每刷新一次就变，固定也不表示只给一个人用。\u003c/p>\n\u003cp>例如，把家中电脑内部IP固定，是让其他家中设备更容易一直找到它。运营商提供的对外地址仍可能变化。反过来，公司可以长期使用一个固定出口，却让很多员工共同上网。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>说法\u003c/th>\n\u003cth>它回答的问题\u003c/th>\n\u003cth>不自动意味着什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>固定内网IP\u003c/td>\n\u003ctd>在这个内部网络里，怎样稳定找到设备\u003c/td>\n\u003ctd>获得固定公网IP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定公网出口\u003c/td>\n\u003ctd>网站看到的来源是否按安排保持\u003c/td>\n\u003ctd>只有一个用户使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共享出口\u003c/td>\n\u003ctd>多人的访问是否汇在同一来源\u003c/td>\n\u003ctd>地址一定经常变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独享出口\u003c/td>\n\u003ctd>该服务承诺的地址使用范围是否只分给某个客户\u003c/td>\n\u003ctd>平台一定信任，或服务一定对外开放\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>购买服务时，“固定”和“独享”应分别问清楚。它们也不能代替\u003ca href=\"#/risk\">风控\u003c/a>对来源历史、账号和行为的判断。\u003c/p>\n\u003ch2 id=\"section-6\">换热点后IP变了，购物车为什么没清空\u003c/h2>\n\u003cp>从家庭出口换到手机热点，新的通信可能使用另一公共来源。浏览器里保存的登录标记却仍在；购物站读取这个标记，可以继续查到同一个账号的购物车。购物车存在网站的账号记录里，不是存放在公网IP这串数字中。\u003c/p>\n\u003cp>已有的某条网络连接可能在切换时中断，应用再建立新连接，重新请求资料。因此，你可能看见短暂转圈后恢复，不能把“账号还在”误解为“底层那条连接从未变化”。\u003ca href=\"#/identity\">账号与会话\u003c/a>继续解释网站怎样把前后操作关联起来。\u003c/p>\n\u003ch2 id=\"section-7\">IPv6为什么可能不需要共用这个IPv4出口\u003c/h2>\n\u003cp>使用IPv6时，设备可以各自拥有公网地址，不必为了解决IPv4地址共享而统一改成同一个来源。查询页看到设备自己的公网IPv6，也可能是正常结果。\u003c/p>\n\u003cp>但地址可以在公网使用，仍不等于允许任何人主动访问。程序是否接收、路由是否可达、防火墙是否放行、账号是否获准，依然需要分别满足。共享地址和访问保护有关联，却不能把“没有NAT”理解为“没有任何保护”。\u003c/p>\n","text":"电脑的IP与网站看到的IP，为什么不一样？ 电脑网络设置里是一个地址，IP查询网页却显示另一个地址，这常常是正常现象。 在常见的共享IPv4上网方式中，家中设备使用内部地址，对外访问经过共同出口；出口转换地址，并保存通信的对应关系。 网站因此可能看到相同的来源，回复却仍能回到正确设备。 这种转换与记录的机制叫NAT。它解释一种常见网络安排，不代表所有IPv6或所有VPN连接都采用同样方式。 内网A与B通过出口X访问网站，网站可看到共同来源；出口按连接映射分送回复。 家里两个人同时逛商品站，网站回复谁 以下是 虚构教学过程 ：电脑A和手机B连接同一家中网络，都在浏览同一购物站，但各自登录自己的账号。 电脑A先发出商品请求。家中出口收到后，记下“A的这条内部连接，对应哪一条向外通信”，再把来源转换成对外使用的地址。手机B随后发出请求，出口为B也保留一份对应关系。为了区分通信，记录不只看IP，也利用端口等信息。 网站现在看到两次请求使用共同的公网来源，但两条通信仍可区分。网站沿相应连接发回回复。出口接到以后，查自己的记录，把A的回复转给A，把B的回复转给B。 共用一个对外IP，并不等于所有回复混进同一个无法区分的袋子。 共享地址与连接区分 家中路由器不是读完订单才决定“这是爸爸的、这是妈妈的”。它依据通信记录转送；购物网站则根据各浏览器携带的登录标记，查出不同账号的购物车和订单。地址转换与账号识别在同一次访问中各做各的工作。 IP查询页为什么不能列出家中所有设备 查询页能报告的是它收到的访问来源。本例中，它看到的是共同出口，就报告出口的公网地址。它不需要、也不能仅凭这次访问直接枚举家中A和B的全部内部地址。 因此，你在电脑和手机上打开同一个查询页，可能看到相同IPv4；两台设备的网络设置里却各有不同的内网IP。两种观察分别在说“内部怎样联系”和“外面看到从哪里来”。 共享还可能发生在更上游。运营商可以让多个家庭共用公共出口，公司、校园和VPN服务也可能汇集许多人的访问。看到同IP，只能先把它理解为同一网络来源，不能直接下“同一个人在操作”的结论。 我能收到网站回复，为什么朋友不能主动连进来 继续用电脑A的访问看：A主动发请求时，出口已经建立对应记录。网站的回复沿这条通信回来，出口知道应该转给A。 现在改一个条件：朋友从外面第一次联系你家的某个服务。对于这条新通信，出口可能既没有现成记录，也没有规则说明该交给家中哪台设备，而且防火墙可能不允许接收。它不会因为你曾经能上网，就把陌生请求随意转给某一台电脑。主动出站与外部发起连接 所以，“我可以下载文件”与“外面的人可以访问我的文件服务”需要不同条件。前者接收既有访问的回复，后者要为新访问提供合适的入口和许可。 端口转发，是怎样把新访问交给家中设备 假设你明确需要对外提供一项自有服务，并按设备和网络提供者的要求安排入口。端口转发规则可以表达：“发到我公共入口这个端口的新通信，转给家中指定设备的指定端口。”公网与内网两侧的端口编号可以不同。 它只补上这段转送关系。家中程序还要运行、接受相应网络的请求，设备防火墙要允许，服务账号也要有权限。改一个数字不会自动创建程序或取得权限。 如果运营商前面又做了一次地址共享，朋友的请求可能根本没有机会到达你家路由器。只改家中转发规则，不能替运营商建立上游入口。自有设备的远程访问可以采用获准的私有连接；公共网页也可以交由托管服务提供入口。这些是不同方案，不需要为了理解原理就修改真实网络。 静态、动态、共享，为什么不能混着说 “静态”或“固定”描述按安排地址是否保持；“动态”描述地址可能随接入安排变化。动态不表示每刷新一次就变，固定也不表示只给一个人用。 例如，把家中电脑内部IP固定，是让其他家中设备更容易一直找到它。运营商提供的对外地址仍可能变化。反过来，公司可以长期使用一个固定出口，却让很多员工共同上网。 说法 它回答的问题 不自动意味着什么 --- --- --- 固定内网IP 在这个内部网络里，怎样稳定找到设备 获得固定公网IP 固定公网出口 网站看到的来源是否按安排保持 只有一个用户使用 共享出口 多人的访问是否汇在同一来源 地址一定经常变化 独享出口 该服务承诺的地址使用范围是否只分给某个客户 平台一定信任，或服务一定对外开放 购买服务时，“固定”和“独享”应分别问清楚。它们也不能代替风控对来源历史、账号和行为的判断。 换热点后IP变了，购物车为什么没清空 从家庭出口换到手机热点，新的通信可能使用另一公共来源。浏览器里保存的登录标记却仍在；购物站读取这个标记，可以继续查到同一个账号的购物车。购物车存在网站的账号记录里，不是存放在公网IP这串数字中。 已有的某条网络连接可能在切换时中断，应用再建立新连接，重新请求资料。因此，你可能看见短暂转圈后恢复，不能把“账号还在”误解为“底层那条连接从未变化”。账号与会话继续解释网站怎样把前后操作关联起来。 IPv6为什么可能不需要共用这个IPv4出口 使用IPv6时，设备可以各自拥有公网地址，不必为了解决IPv4地址共享而统一改成同一个来源。查询页看到设备自己的公网IPv6，也可能是正常结果。 但地址可以在公网使用，仍不等于允许任何人主动访问。程序是否接收、路由是否可达、防火墙是否放行、账号是否获准，依然需要分别满足。共享地址和访问保护有关联，却不能把“没有NAT”理解为“没有任何保护”。","outline":[{"id":"section-1","title":"家里两个人同时逛商品站，网站回复谁","depth":2},{"id":"section-2","title":"IP查询页为什么不能列出家中所有设备","depth":2},{"id":"section-3","title":"我能收到网站回复，为什么朋友不能主动连进来","depth":2},{"id":"section-4","title":"端口转发，是怎样把新访问交给家中设备","depth":2},{"id":"section-5","title":"静态、动态、共享，为什么不能混着说","depth":2},{"id":"section-6","title":"换热点后IP变了，购物车为什么没清空","depth":2},{"id":"section-7","title":"IPv6为什么可能不需要共用这个IPv4出口","depth":2}]},{"id":"domains","group":"address","title":"www、shop、api：同一个网站为何有多个域名？","question":"www、shop、api：同一个网站为何有多个域名？","summary":"www、shop、img可以在同一域名下面，却使用不同服务器或登录系统。","terms":["子域名","二级域名","主域名","同源"],"aliases":["子域名","subdomain www shop api 二级域名 多级域名","二级域名","","主域名","","同源","origin same origin CORS 跨域"],"related":["url"],"html":"\u003cp>你打开一家网站，地址栏是 \u003ccode>www.example.com\u003c/code>，购物时变成 \u003ccode>shop.example.com\u003c/code>，图片又来自 \u003ccode>img.example.com\u003c/code>。\u003cstrong>它们都是example.com下面的子域名，但可以指向不同服务器、运行不同程序，也可能要求分别登录。\u003c/strong> 你眼中的同一家网站，可能用几个不同的主机名提供页面、图片和数据。\u003c/p>\n\u003cp>本篇用example.com这组保留示例域名说明，功能分配均为虚构教学设计。真实网站需要以实际链接和官方说明判断。\u003c/p>\n\u003ch2 id=\"section-1\">域名的层级要从右向左看\u003c/h2>\n\u003cp>\u003ccode>com\u003c/code>位于顶级，\u003ccode>example.com\u003c/code>是在它下面的名称，\u003ccode>shop.example.com\u003c/code>又在example.com下面，\u003ccode>m.shop.example.com\u003c/code>还多了一层。每一个点隔开的标签增加命名层次；左侧名称在右侧名称之下。\u003c/p>\n\u003cp>在这组例子里，example.com通常是可注册的域名；网站管理者可以安排shop、help等子域名。子域名不是另一个页面目录，名字里的shop也不会自动生成购物功能，只是人选的名称。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MjAgNTkwIiByb2xlPSJpbWciPjx0aXRsZT7ln5/lkI3moJHkuI7lrp7pmYXmjqXmlLblhaXlj6PnmoTljLrliKs8L3RpdGxlPjxkZWZzPjxtYXJrZXIgaWQ9ImEiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjYiIHJlZlk9IjMiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEw2IDNMMCA2IiBmaWxsPSJub25lIiBzdHJva2U9IiM0Mjc2NjQiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQyMCIgaGVpZ2h0PSI1OTAiIGZpbGw9IiNmYWY4ZjIiLz48c3R5bGU+dGV4dHtmb250LWZhbWlseTpQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZjtmaWxsOiMyOTRkNDA7Zm9udC1zaXplOjE1cHh9LnNtYWxse2ZvbnQtc2l6ZToxMnB4O2ZpbGw6IzY2NzQ2N30udGl0bGV7Zm9udC1zaXplOjIxcHg7Zm9udC13ZWlnaHQ6NjAwfS5saW5le2ZpbGw6bm9uZTtzdHJva2U6IzQyNzY2NDtzdHJva2Utd2lkdGg6MjttYXJrZXItZW5kOnVybCgjYSl9PC9zdHlsZT48dGV4dCB4PSIyNCIgeT0iMzgiIGNsYXNzPSJ0aXRsZSI+5a2Q5Z+f5ZCN5Y+v5Lul55So5LiN5ZCM5pyN5Yqh5Zm
