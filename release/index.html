ading=\"eager\"/>\u003c/div>\u003cfigcaption>规则把部分访问直达、部分经代理或VPN出口，因此不同访问可能呈现不同公网来源。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-1\">浏览器好了，会议软件为什么还是原样\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构对照\u003c/strong>：你给浏览器设代理，商品页成功，会议软件的表现没变。浏览器把适用请求交给代理，会议软件却可能根本不读取这份设置；浏览器访问成功，不能证明会议软件也使用了代理。\u003c/p>\n\u003cp>系统代理让应用可以取得统一配置，但应用是否采用、哪些请求适用仍要看实现。VPN可以通过系统路由等规则，把指定的通信送入隧道。还有些工具把多种能力组合在一个界面，所以名字叫VPN的应用，其某个模式未必等于把全部流量都送入网络隧道。\u003c/p>\n\u003ch2 id=\"section-2\">“全局”模式也需要问具体范围\u003c/h2>\n\u003cp>规则可以按地址范围、名称、应用或其他条件分配。公司方案可能只送内部系统；公共出口方案可能尽量送公共访问，但保留本地打印机等例外。究竟哪些请求经过工具，要看产品、系统和设置。\u003c/p>\n\u003cp>所以全局不能只翻译为“所有电脑活动都已隐形”。你要看它指全局代理、网络出口还是某个应用范围，以及是否处理IPv4、IPv6和名称查询等实际路径。不覆盖某一类访问时，表面统一按钮也可能产生不同来源。\u003c/p>\n\u003ch2 id=\"section-3\">同时开几种工具，为什么更难解释\u003c/h2>\n\u003cp>浏览器代理与系统VPN可以同时作用：请求先交给代理，访问代理的底层通信再走VPN。也可能某一项把流量排除，或者两份规则互相冲突。增加工具并不自动增加效果，反而会让同一请求先后经过多个工具，更难判断它在哪里被阻断。\u003c/p>\n\u003cp>\u003cstrong>教学场景\u003c/strong>：内部报销页原来通过公司VPN可用，启用另一个公共代理后失败。要比较是否只有内部目标受影响、是否查得到内部名称、断开新加设置是否恢复。仅凭“两个都显示已连接”不能证明组合路径正确。\u003c/p>\n\u003ch2 id=\"section-4\">为什么同一查IP网页也有验证边界\u003c/h2>\n\u003cp>查IP报告的是它接收到的那次来源。如果下载软件用另一条连接、页面分别尝试IPv4和IPv6，或者内部访问本来不经公共出口，结果可能不同。应在真正目标应用中按实际任务验证，不能把浏览器的一次查询当整台设备的证明。\u003c/p>\n\u003cp>配置页面的“允许本地网络”“断线保护”等选项则决定例外或失败后行为。断开工具后仍无法上网，可能是保护策略仍在阻断；需要按该提供者说明恢复，不能任意删除公司受管设置。\u003c/p>\n\u003ch2 id=\"section-5\">先区分在什么位置转送\u003c/h2>\n\u003cp>应用代理是在特定应用或请求中安排转送。例如浏览器设置了一个代理，浏览器将相关请求交给代理处理。其他应用是否使用它，要看各自支持与设置。\u003c/p>\n\u003cp>系统代理为应用提供系统层面的代理配置，但应用可能有自己的连接方式。网络层VPN则可以依据系统路由把选定流量交入隧道。浏览器代理只影响使用该设置的请求；VPN可以影响系统选中的通信。两个按钮都写“开启”，实际经过的请求仍可能不同。\u003c/p>\n\u003cp>Mac原生VPN还提供相应的名称查询和代理设置，具体能力随连接类型变化。\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Apple对配置选项的说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">分流在做哪种决定\u003c/h2>\n\u003cp>分流就是按规则选择访问走哪里。可能只让公司内部地址进入VPN；也可能让指定应用或目标经过公共出口，其余直达。规则要与目标配合。\u003c/p>\n\u003cp>“全局”常被用来表达尽可能把流量交给指定路径，但不同客户端可能指全局代理、VPN全流量出口或其他范围。仍需查看实际覆盖与排除项。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">出口节点承载公共流量\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-7\">为什么不能只在浏览器查一次IP\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构教学对照\u003c/strong>：浏览器有自己的代理，查IP显示出口X；下载工具直接走系统网络，目标看到出口Y。浏览器结果只能证明这次浏览器访问的来源，不证明下载工具的路径。\u003c/p>\n\u003cp>设备还可能同时使用IPv4与IPv6。工具若只覆盖部分路径，查询页与目标应用使用的路径可能不同。出现不一致时核对产品覆盖说明，而不是把所有不同都归成“失效”。\u003c/p>\n\u003ch2 id=\"section-8\">看见几个常见选项时怎样理解\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>先把它翻译成什么问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>节点、出口\u003c/td>\n\u003ctd>请求先到哪台服务器，再由它联系目标？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分流规则\u003c/td>\n\u003ctd>哪些请求经过工具，哪些仍直接发送？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统代理\u003c/td>\n\u003ctd>哪些应用实际采用系统配置？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>允许本地网络\u003c/td>\n\u003ctd>连接后，附近设备是否仍可联系？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>断线保护\u003c/td>\n\u003ctd>连接断开后，相关流量是否被阻止？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>这些名字不保证跨应用行为一致。操作时先了解目标，记录原设置，一次改变一项，在真正要使用的应用中验证。恢复办法见\u003ca href=\"#/setup\">配置VPN\u003c/a>。\u003c/p>\n","text":"全局、分流、代理，为什么影响的应用不同？ 你开了一个连接工具，浏览器能访问，另一个软件却不行。 不同工具和设置接管的流量范围不同；显示“开启”不能证明所有应用都经过它。 规则把部分访问直达、部分经代理或VPN出口，因此不同访问可能呈现不同公网来源。 浏览器好了，会议软件为什么还是原样 以下是 虚构对照 ：你给浏览器设代理，商品页成功，会议软件的表现没变。浏览器把适用请求交给代理，会议软件却可能根本不读取这份设置；浏览器访问成功，不能证明会议软件也使用了代理。 系统代理让应用可以取得统一配置，但应用是否采用、哪些请求适用仍要看实现。VPN可以通过系统路由等规则，把指定的通信送入隧道。还有些工具把多种能力组合在一个界面，所以名字叫VPN的应用，其某个模式未必等于把全部流量都送入网络隧道。 “全局”模式也需要问具体范围 规则可以按地址范围、名称、应用或其他条件分配。公司方案可能只送内部系统；公共出口方案可能尽量送公共访问，但保留本地打印机等例外。究竟哪些请求经过工具，要看产品、系统和设置。 所以全局不能只翻译为“所有电脑活动都已隐形”。你要看它指全局代理、网络出口还是某个应用范围，以及是否处理IPv4、IPv6和名称查询等实际路径。不覆盖某一类访问时，表面统一按钮也可能产生不同来源。 同时开几种工具，为什么更难解释 浏览器代理与系统VPN可以同时作用：请求先交给代理，访问代理的底层通信再走VPN。也可能某一项把流量排除，或者两份规则互相冲突。增加工具并不自动增加效果，反而会让同一请求先后经过多个工具，更难判断它在哪里被阻断。 教学场景 ：内部报销页原来通过公司VPN可用，启用另一个公共代理后失败。要比较是否只有内部目标受影响、是否查得到内部名称、断开新加设置是否恢复。仅凭“两个都显示已连接”不能证明组合路径正确。 为什么同一查IP网页也有验证边界 查IP报告的是它接收到的那次来源。如果下载软件用另一条连接、页面分别尝试IPv4和IPv6，或者内部访问本来不经公共出口，结果可能不同。应在真正目标应用中按实际任务验证，不能把浏览器的一次查询当整台设备的证明。 配置页面的“允许本地网络”“断线保护”等选项则决定例外或失败后行为。断开工具后仍无法上网，可能是保护策略仍在阻断；需要按该提供者说明恢复，不能任意删除公司受管设置。 先区分在什么位置转送 应用代理是在特定应用或请求中安排转送。例如浏览器设置了一个代理，浏览器将相关请求交给代理处理。其他应用是否使用它，要看各自支持与设置。 系统代理为应用提供系统层面的代理配置，但应用可能有自己的连接方式。网络层VPN则可以依据系统路由把选定流量交入隧道。浏览器代理只影响使用该设置的请求；VPN可以影响系统选中的通信。两个按钮都写“开启”，实际经过的请求仍可能不同。 Mac原生VPN还提供相应的名称查询和代理设置，具体能力随连接类型变化。Apple对配置选项的说明 分流在做哪种决定 分流就是按规则选择访问走哪里。可能只让公司内部地址进入VPN；也可能让指定应用或目标经过公共出口，其余直达。规则要与目标配合。 “全局”常被用来表达尽可能把流量交给指定路径，但不同客户端可能指全局代理、VPN全流量出口或其他范围。仍需查看实际覆盖与排除项。出口节点承载公共流量 为什么不能只在浏览器查一次IP 以下是 虚构教学对照 ：浏览器有自己的代理，查IP显示出口X；下载工具直接走系统网络，目标看到出口Y。浏览器结果只能证明这次浏览器访问的来源，不证明下载工具的路径。 设备还可能同时使用IPv4与IPv6。工具若只覆盖部分路径，查询页与目标应用使用的路径可能不同。出现不一致时核对产品覆盖说明，而不是把所有不同都归成“失效”。 看见几个常见选项时怎样理解 名称 先把它翻译成什么问题 --- --- 节点、出口 请求先到哪台服务器，再由它联系目标？ 分流规则 哪些请求经过工具，哪些仍直接发送？ 系统代理 哪些应用实际采用系统配置？ 允许本地网络 连接后，附近设备是否仍可联系？ 断线保护 连接断开后，相关流量是否被阻止？ 这些名字不保证跨应用行为一致。操作时先了解目标，记录原设置，一次改变一项，在真正要使用的应用中验证。恢复办法见配置VPN。 相关概念 - 隧道与出口 - IP与会话","outline":[{"id":"section-1","title":"浏览器好了，会议软件为什么还是原样","depth":2},{"id":"section-2","title":"“全局”模式也需要问具体范围","depth":2},{"id":"section-3","title":"同时开几种工具，为什么更难解释","depth":2},{"id":"section-4","title":"为什么同一查IP网页也有验证边界","depth":2},{"id":"section-5","title":"先区分在什么位置转送","depth":2},{"id":"section-6","title":"分流在做哪种决定","depth":2},{"id":"section-7","title":"为什么不能只在浏览器查一次IP","depth":2},{"id":"section-8","title":"看见几个常见选项时怎样理解","depth":2}]},{"id":"setup","group":"vpn","title":"怎样配置VPN，并确认它真的生效？","question":"怎样配置VPN，并确认它真的生效？","summary":"先确认目的和提供者，再导入或填写配置，按目标验证并保留恢复路径。","terms":["VPN配置","连接验证"],"aliases":["VPN配置","","连接验证",""],"related":["split","dns","vpn","troubleshoot"],"html":"\u003cp>\u003cstrong>先确定你是要打开公司系统，还是更换上网出口；再按提供者的资料配置，最后检查这个目标是否实现。\u003c/strong> “已连接”只说明某种连接建立了；它不自动证明公司系统能打开，也不证明所有软件都换了上网出口。\u003c/p>\n\u003cp>这篇是可跟随的操作说明，你可以只阅读。示范以Mac为例，界面名称会随系统版本变化，具体位置以\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Apple官方说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>和提供者说明为准。\u003c/p>\n\u003ch2 id=\"section-1\">先弄清配置资料分别用来做什么\u003c/h2>\n\u003cp>配置资料通常说明三件事：连接哪台VPN服务器、怎样证明你有权连接，以及连接后哪些请求经过VPN。这三件事分别对应服务器地址、认证信息和分流等选项。\u003c/p>\n\u003cp>服务器地址可能是域名，也可能带端口；它是先要联系的VPN入口，不一定是你最后打开的公司系统。VPN账号用来验证连接资格，公司网页可能还要另行登录。DNS帮助电脑找到内部系统的地址，路由规则决定哪些请求走VPN。服务器地址填对了，其他几项仍可能需要核对。\u003c/p>\n\u003cp>\u003cstrong>虚构资料例子\u003c/strong>：管理员说使用指定客户端、登录企业账号、只访问内部资源。这时应该在指定客户端按流程登录，不是在Mac系统里猜一个连接类型；公共查IP不变也不能作为失败标准。若提供者明确给出系统支持的类型、入口与认证方法，才走下面原生设置分支。\u003c/p>\n\u003ch2 id=\"section-2\">连接前后分别保留什么观察\u003c/h2>\n\u003cp>记录原网络能否正常访问、目标原本是否可用；连接后记录认证状态、目标应用的实际结果和公共访问是否受影响。这样失败时知道在哪一步变化，而不是只留一个“已连接”截图。\u003c/p>\n\u003cp>更换公共出口时，可在同一浏览器同一查询服务前后比较来源；访问内部系统时，应核对授权目标。两种验证都不能替代所有应用范围的检查。如果打开的是登录页，说明已经收到网页回复；还要完成登录，并确认账号有权使用系统。\u003c/p>\n\u003cp>恢复步骤同样是配置的一部分：断开本次连接，撤销本次手动改动，查看原网络是否恢复；若保护模式仍阻断，按客户端官方说明处理。无需为了阅读示范改自己的真实网络。\u003c/p>\n\u003ch2 id=\"section-3\">开始前，先准备三件东西\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>目的\u003c/strong>：访问公司内部系统，访问自己的远程设备，还是让公共上网经过指定出口？这决定应该观察什么结果。\u003c/li>\n\u003cli>\u003cstrong>提供者的连接资料\u003c/strong>：公司管理员或服务提供者给出的客户端、配置文件、服务器地址和登录方式。不能从别人的教学截图猜这些值。\u003c/li>\n\u003cli>\u003cstrong>恢复办法\u003c/strong>：记住连接前可用的网络，记录本次改动；公司管理的设置先按管理员说明处理。\u003c/li>\n\u003c/ol>\n\u003cp>有些服务要求专用应用，有些支持系统内置VPN。连接方式必须由提供者确认。如果拿到的是某款应用的专属配置，应导入那款应用，系统VPN设置未必认识它。\u003c/p>\n\u003ch2 id=\"section-4\">常见字段，其实在问四个问题\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>设置里常见的名称\u003c/th>\n\u003cth>普通话解释\u003c/th>\n\u003cth>值从哪里来\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>服务器、节点、连接地址\u003c/td>\n\u003ctd>先去联系哪里\u003c/td>\n\u003ctd>提供者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号、密码、证书\u003c/td>\n\u003ctd>怎样证明你获准连接\u003c/td>\n\u003ctd>提供者或自己的账号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连接类型\u003c/td>\n\u003ctd>两边按哪套方式建立连接\u003c/td>\n\u003ctd>提供者，不靠猜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分流、出口、访问范围\u003c/td>\n\u003ctd>哪些访问经过连接后的另一端\u003c/td>\n\u003ctd>目标与提供者规则\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>DNS负责把名字查成地址；代理负责让某些访问经另一个服务转送。看到这些选项时先保留提供者要求，含义分别见\u003ca href=\"#/dns\">名称查询\u003c/a>与\u003ca href=\"#/split\">分流\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-5\">Mac：建立连接、观察结果、恢复\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>选对入口。\u003c/strong> 若提供者给配置文件或专用应用，按其官方说明导入或安装。若明确支持Mac内置VPN，打开“系统设置 → 网络”，在操作菜单选择“添加VPN配置”及指定类型。应看到新连接的设置窗口；若没有对应类型，停止填写并确认客户端要求。\u003c/li>\n\u003cli>\u003cstrong>按资料填写。\u003c/strong> 连接名称可取易识别的名字；服务器地址、账号与认证方式按提供者填写。保存后应看到这条连接。若保存失败，检查必填项与类型，保留原资料，不另找随机地址替换。\u003c/li>\n\u003cli>\u003cstrong>发起连接。\u003c/strong> 在VPN控制入口连接并按提示登录或验证。正常时显示连接状态。若显示认证失败，先核对账号、过期凭据与批准状态；若联系不到服务器，先确认普通上网可用，再联系提供者核对入口。\u003c/li>\n\u003cli>\u003cstrong>按目的验证。\u003c/strong> 访问内网的目标，打开被授权的具体内部网页或设备服务；更换公共出口的目标，比较连接前后同一浏览器、同一IP查询页显示的公网地址。前者成功时公网IP可能保持原样，后者成功应与所选出口一致。仅在一个浏览器中验证，不能代表所有应用。\u003c/li>\n\u003cli>\u003cstrong>检查实际使用与恢复。\u003c/strong> 在需要使用的应用里访问目标。若公共上网中断或目标不可用，先断开本次连接，确认原路径是否恢复；只撤销本次手动改动。若客户端设置了断线保护，VPN断开后可能仍阻止访问，按其说明关闭或恢复。公司受管配置按管理员流程处理。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"section-6\">完整示范：连接成功，却没换IP\u003c/h2>\n\u003cp>以下是\u003cstrong>虚构教学示例\u003c/strong>，用于展示判断过程。\u003c/p>\n\u003cp>小林拿到公司提供的配置，目标是访问内部报销页。首次连接后显示“已连接”，IP查询页显示的地址没变。小林的初步判断是“VPN没有生效”。\u003c/p>\n\u003cp>这个判断漏掉了目的：公司连接只需让内部报销访问走公司路径。修正动作是保持公司配置不变，打开被授权的内部报销页，再在VPN断开后对照是否仍可打开。假设示范结果是：连接时可打开，断开时不可打开。\u003c/p>\n\u003cp>修正后的结论是：这条连接对报销页访问有效；普通公共上网出口未改变。这符合分流目标。它还不能证明其他内部系统都有权限。\u003c/p>\n\u003cp>\u003cstrong>换一个条件\u003c/strong>：如果小林原本要让浏览器经远方公共出口上网，地址没变就不能满足该目标。应检查是否启用了出口、浏览器是否走了指定路径，以及查到的是哪种IP；不能凭“已连接”结束验证。公共出口机制见\u003ca href=\"#/vpn\">VPN\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-7\">什么才算这次配置完成\u003c/h2>\n\u003cp>配置完成后，应能打开被授权的公司系统，或在目标应用中确认使用了指定出口。同时，断开本次连接后原网络应能恢复，设置应符合提供者要求。配置过程改变的是路径与访问范围；登录账号和网站留下的记录仍可能存在。\u003c/p>\n","text":"怎样配置VPN，并确认它真的生效？ 先确定你是要打开公司系统，还是更换上网出口；再按提供者的资料配置，最后检查这个目标是否实现。 “已连接”只说明某种连接建立了；它不自动证明公司系统能打开，也不证明所有软件都换了上网出口。 这篇是可跟随的操作说明，你可以只阅读。示范以Mac为例，界面名称会随系统版本变化，具体位置以Apple官方说明和提供者说明为准。 先弄清配置资料分别用来做什么 配置资料通常说明三件事：连接哪台VPN服务器、怎样证明你有权连接，以及连接后哪些请求经过VPN。这三件事分别对应服务器地址、认证信息和分流等选项。 服务器地址可能是域名，也可能带端口；它是先要联系的VPN入口，不一定是你最后打开的公司系统。VPN账号用来验证连接资格，公司网页可能还要另行登录。DNS帮助电脑找到内部系统的地址，路由规则决定哪些请求走VPN。服务器地址填对了，其他几项仍可能需要核对。 虚构资料例子 ：管理员说使用指定客户端、登录企业账号、只访问内部资源。这时应该在指定客户端按流程登录，不是在Mac系统里猜一个连接类型；公共查IP不变也不能作为失败标准。若提供者明确给出系统支持的类型、入口与认证方法，才走下面原生设置分支。 连接前后分别保留什么观察 记录原网络能否正常访问、目标原本是否可用；连接后记录认证状态、目标应用的实际结果和公共访问是否受影响。这样失败时知道在哪一步变化，而不是只留一个“已连接”截图。 更换公共出口时，可在同一浏览器同一查询服务前后比较来源；访问内部系统时，应核对授权目标。两种验证都不能替代所有应用范围的检查。如果打开的是登录页，说明已经收到网页回复；还要完成登录，并确认账号有权使用系统。 恢复步骤同样是配置的一部分：断开本次连接，撤销本次手动改动，查看原网络是否恢复；若保护模式仍阻断，按客户端官方说明处理。无需为了阅读示范改自己的真实网络。 开始前，先准备三件东西 1. 目的 ：访问公司内部系统，访问自己的远程设备，还是让公共上网经过指定出口？这决定应该观察什么结果。 2. 提供者的连接资料 ：公司管理员或服务提供者给出的客户端、配置文件、服务器地址和登录方式。不能从别人的教学截图猜这些值。 3. 恢复办法 ：记住连接前可用的网络，记录本次改动；公司管理的设置先按管理员说明处理。 有些服务要求专用应用，有些支持系统内置VPN。连接方式必须由提供者确认。如果拿到的是某款应用的专属配置，应导入那款应用，系统VPN设置未必认识它。 常见字段，其实在问四个问题 设置里常见的名称 普通话解释 值从哪里来 --- --- --- 服务器、节点、连接地址 先去联系哪里 提供者 账号、密码、证书 怎样证明你获准连接 提供者或自己的账号 连接类型 两边按哪套方式建立连接 提供者，不靠猜 分流、出口、访问范围 哪些访问经过连接后的另一端 目标与提供者规则 DNS负责把名字查成地址；代理负责让某些访问经另一个服务转送。看到这些选项时先保留提供者要求，含义分别见名称查询与分流。 Mac：建立连接、观察结果、恢复 1. 选对入口。 若提供者给配置文件或专用应用，按其官方说明导入或安装。若明确支持Mac内置VPN，打开“系统设置 → 网络”，在操作菜单选择“添加VPN配置”及指定类型。应看到新连接的设置窗口；若没有对应类型，停止填写并确认客户端要求。 2. 按资料填写。 连接名称可取易识别的名字；服务器地址、账号与认证方式按提供者填写。保存后应看到这条连接。若保存失败，检查必填项与类型，保留原资料，不另找随机地址替换。 3. 发起连接。 在VPN控制入口连接并按提示登录或验证。正常时显示连接状态。若显示认证失败，先核对账号、过期凭据与批准状态；若联系不到服务器，先确认普通上网可用，再联系提供者核对入口。 4. 按目的验证。 访问内网的目标，打开被授权的具体内部网页或设备服务；更换公共出口的目标，比较连接前后同一浏览器、同一IP查询页显示的公网地址。前者成功时公网IP可能保持原样，后者成功应与所选出口一致。仅在一个浏览器中验证，不能代表所有应用。 5. 检查实际使用与恢复。 在需要使用的应用里访问目标。若公共上网中断或目标不可用，先断开本次连接，确认原路径是否恢复；只撤销本次手动改动。若客户端设置了断线保护，VPN断开后可能仍阻止访问，按其说明关闭或恢复。公司受管配置按管理员流程处理。 完整示范：连接成功，却没换IP 以下是 虚构教学示例 ，用于展示判断过程。 小林拿到公司提供的配置，目标是访问内部报销页。首次连接后显示“已连接”，IP查询页显示的地址没变。小林的初步判断是“VPN没有生效”。 这个判断漏掉了目的：公司连接只需让内部报销访问走公司路径。修正动作是保持公司配置不变，打开被授权的内部报销页，再在VPN断开后对照是否仍可打开。假设示范结果是：连接时可打开，断开时不可打开。 修正后的结论是：这条连接对报销页访问有效；普通公共上网出口未改变。这符合分流目标。它还不能证明其他内部系统都有权限。 换一个条件 ：如果小林原本要让浏览器经远方公共出口上网，地址没变就不能满足该目标。应检查是否启用了出口、浏览器是否走了指定路径，以及查到的是哪种IP；不能凭“已连接”结束验证。公共出口机制见VPN。 什么才算这次配置完成 配置完成后，应能打开被授权的公司系统，或在目标应用中确认使用了指定出口。同时，断开本次连接后原网络应能恢复，设置应符合提供者要求。配置过程改变的是路径与访问范围；登录账号和网站留下的记录仍可能存在。 相关概念 - VPN改变哪一段 - 全局与分流 - 有对照地排查访问失败","outline":[{"id":"section-1","title":"先弄清配置资料分别用来做什么","depth":2},{"id":"section-2","title":"连接前后分别保留什么观察","depth":2},{"id":"section-3","title":"开始前，先准备三件东西","depth":2},{"id":"section-4","title":"常见字段，其实在问四个问题","depth":2},{"id":"section-5","title":"Mac：建立连接、观察结果、恢复","depth":2},{"id":"section-6","title":"完整示范：连接成功，却没换IP","depth":2},{"id":"section-7","title":"什么才算这次配置完成","depth":2}]},{"id":"troubleshoot","group":"scenes","title":"连不上、打不开，怎样判断卡在哪一段？","question":"连不上、打不开，怎样判断卡在哪一段？","summary":"用少量对照缩小故障范围，一次只改变一个条件。","terms":["排障","热点"],"aliases":["排障","","热点",""],"related":["dns","split","setup","risk"],"html":"\u003cp>网页打不开，并没有告诉你到底哪一步失败。\u003cstrong>先记录现象，再用少量对照缩小范围；一次只改变一个条件。\u003c/strong> 这样既能留下线索，也更容易恢复。\u003c/p>\n\u003ch2 id=\"section-1\">先把“打不开”分成可以观察的现象\u003c/h2>\n\u003cp>浏览器说名称找不到，电脑可能还没查到网站地址；显示连接拒绝或超时，需要检查服务器是否接收请求、网络是否能送到，以及防火墙等是否拦截；出现证书警告，需要检查网站名称、证书等是否通过浏览器校验；出现登录页、403或验证码，则通常已有某个服务响应，接下来更应看登录权限、验证码或网站的访问规则。\u003c/p>\n\u003cp>404常表示请求资源未找到或不以该方式提供，不代表整个网络中断；网页200响应也可能包含业务失败文字。状态码说明这次网页请求的处理结果，还要结合页面正文判断操作是否成功。错误也可能由中间转送服务器返回，仅凭提示不能确定网站后台哪台机器出了问题。\u003c/p>\n\u003ch2 id=\"section-2\">完整对照：主站能开，商品图片不出\u003c/h2>\n\u003cp>下面是\u003cstrong>虚构教学场景\u003c/strong>。小林的商品页文字正常，图片空白，首次判断“网彻底断了”。这与已经取得页面的证据不符；图片可能从另一台服务器下载，也可能被本地显示或设置影响。\u003c/p>\n\u003cp>修正检查：保持同一设备和浏览器，先看是否所有图片失败，还是一个商品失败；随后在获准网络上换热点试同一页面；记录是否恢复。假设示范中换网后图片恢复，原网络与图片入口之间的条件值得核对，但尚不能确定是查询、路径还是访问策略。\u003c/p>\n\u003cp>改一个条件：若两条网络均只缺同一商品图片，其他图片正常，该图片文件不存在或网站提供的文件有问题更值得检查。把这个具体结果给服务支持，比“网络不好”更能帮助对方。恢复后保留原配置，一次只加一个变化。\u003c/p>\n\u003ch2 id=\"section-3\">有了回复以后，还要看回复具体说什么\u003c/h2>\n\u003cp>表单提示缺手机号，可能是本地检查，还没发请求；提示验证码错误，可能是网站已经核对验证码并返回结果；保存转圈超时，业务是否完成还未知，应去正式记录核对。IP变了只是网络来源变化，无法单独解释这些全部现象。\u003c/p>\n\u003cp>不要为了排障关闭证书校验、猜服务器入口或绕过权限。理解过程的作用是缩小范围、提交有效证据并恢复原状态，而不是靠大范围修改碰运气。订单保存与响应分离见\u003ca href=\"#/transactions\">业务状态\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-4\">开始前先把错误说具体\u003c/h2>\n\u003cp>记下目标应用、操作时间和完整提示。区分“附近网络连不上”“所有网页打不开”“只有一个服务打不开”“能打开但登录被拒绝”。这些现象指向的范围不同。\u003c/p>\n\u003cp>下面是\u003cstrong>虚构教学示范\u003c/strong>：小林连接公司VPN后，内部网页打不开。你可以只阅读这些步骤，不需要先操作自己的电脑。\u003c/p>\n\u003ch2 id=\"section-5\">从近处到目标做四个对照\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>确认原有接入。\u003c/strong> 暂时断开本次VPN，在同一设备打开两个平常可用的公共服务。若都打不开，先处理附近连接或上游接入；若可以，说明普通访问至少部分可用。记录结果后再重新连接，避免同时更换多个设置。\u003c/li>\n\u003cli>\u003cstrong>比较连接状态与目标。\u003c/strong> 重新连接VPN，查看连接提示，再打开被授权的内部网页。若认证失败，先核对凭据和批准状态；若已连接但网页失败，仍需核对内部名称、路由、权限或服务状态。保留配置，不反复猜地址。\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Mac的VPN设置说明\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>在许可范围内换一个条件。\u003c/strong> 同一设备尝试另一条获准网络，或由获准同事在原网络访问同一目标。若只在原网络失败，原路径值得进一步检查；若多处都失败，服务、账号或共同配置更值得检查。这个对照缩小范围，不直接证明原因。\u003c/li>\n\u003cli>\u003cstrong>恢复并提交线索。\u003c/strong> 断开本次连接，撤销本次手动修改，确认原访问恢复。向提供者报告时间、目标、错误、连接状态与对照结果。不要把密码、完整认证文件放进公开反馈；公司受管设置按管理员流程恢复。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"section-6\">根据观察决定下一步\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察\u003c/th>\n\u003cth>下一步更值得核对\u003c/th>\n\u003cth>暂时不要下的结论\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>普通服务也都失败\u003c/td>\n\u003ctd>接入与上游是否可用\u003c/td>\n\u003ctd>VPN一定损坏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VPN认证失败\u003c/td>\n\u003ctd>账号、凭据、批准状态\u003c/td>\n\u003ctd>网站封了IP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>域名查询失败\u003c/td>\n\u003ctd>名称记录或查询路径\u003c/td>\n\u003ctd>网站程序一定停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网页返回拒绝或验证页\u003c/td>\n\u003ctd>权限与服务规则\u003c/td>\n\u003ctd>数据从未抵达\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只有某个应用不行\u003c/td>\n\u003ctd>该应用的路径与设置\u003c/td>\n\u003ctd>所有软件都断网\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>名称查询与取得网页是不同工作。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc1034.html\" target=\"_blank\" rel=\"noopener noreferrer\">名称查询机制\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a> 服务返回错误，也意味着至少有一部分通信已经发生。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">请求与响应\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-7\">改变条件后，解释也要变\u003c/h2>\n\u003cp>示范中，如果另一条网络可以访问内部网页，原网络路径变得可疑；如果同事都能访问，只有小林在多处失败，应更多检查小林的账号、设备或配置。都只是判断顺序，不是未经证据的定论。\u003c/p>\n\u003cp>证书警告涉及对端校验，不能用关闭保护来验证“网页是否能打开”。排障目标是找出哪一段需要核对，并保持可恢复的状态。\u003c/p>\n","text":"连不上、打不开，怎样判断卡在哪一段？ 网页打不开，并没有告诉你到底哪一步失败。 先记录现象，再用少量对照缩小范围；一次只改变一个条件。 这样既能留下线索，也更容易恢复。 先把“打不开”分成可以观察的现象 浏览器说名称找不到，电脑可能还没查到网站地址；显示连接拒绝或超时，需要检查服务器是否接收请求、网络是否能送到，以及防火墙等是否拦截；出现证书警告，需要检查网站名称、证书等是否通过浏览器校验；出现登录页、403或验证码，则通常已有某个服务响应，接下来更应看登录权限、验证码或网站的访问规则。 404常表示请求资源未找到或不以该方式提供，不代表整个网络中断；网页200响应也可能包含业务失败文字。状态码说明这次网页请求的处理结果，还要结合页面正文判断操作是否成功。错误也可能由中间转送服务器返回，仅凭提示不能确定网站后台哪台机器出了问题。 完整对照：主站能开，商品图片不出 下面是 虚构教学场景 。小林的商品页文字正常，图片空白，首次判断“网彻底断了”。这与已经取得页面的证据不符；图片可能从另一台服务器下载，也可能被本地显示或设置影响。 修正检查：保持同一设备和浏览器，先看是否所有图片失败，还是一个商品失败；随后在获准网络上换热点试同一页面；记录是否恢复。假设示范中换网后图片恢复，原网络与图片入口之间的条件值得核对，但尚不能确定是查询、路径还是访问策略。 改一个条件：若两条网络均只缺同一商品图片，其他图片正常，该图片文件不存在或网站提供的文件有问题更值得检查。把这个具体结果给服务支持，比“网络不好”更能帮助对方。恢复后保留原配置，一次只加一个变化。 有了回复以后，还要看回复具体说什么 表单提示缺手机号，可能是本地检查，还没发请求；提示验证码错误，可能是网站已经核对验证码并返回结果；保存转圈超时，业务是否完成还未知，应去正式记录核对。IP变了只是网络来源变化，无法单独解释这些全部现象。 不要为了排障关闭证书校验、猜服务器入口或绕过权限。理解过程的作用是缩小范围、提交有效证据并恢复原状态，而不是靠大范围修改碰运气。订单保存与响应分离见业务状态。 开始前先把错误说具体 记下目标应用、操作时间和完整提示。区分“附近网络连不上”“所有网页打不开”“只有一个服务打不开”“能打开但登录被拒绝”。这些现象指向的范围不同。 下面是 虚构教学示范 ：小林连接公司VPN后，内部网页打不开。你可以只阅读这些步骤，不需要先操作自己的电脑。 从近处到目标做四个对照 1. 确认原有接入。 暂时断开本次VPN，在同一设备打开两个平常可用的公共服务。若都打不开，先处理附近连接或上游接入；若可以，说明普通访问至少部分可用。记录结果后再重新连接，避免同时更换多个设置。 2. 比较连接状态与目标。 重新连接VPN，查看连接提示，再打开被授权的内部网页。若认证失败，先核对凭据和批准状态；若已连接但网页失败，仍需核对内部名称、路由、权限或服务状态。保留配置，不反复猜地址。Mac的VPN设置说明 3. 在许可范围内换一个条件。 同一设备尝试另一条获准网络，或由获准同事在原网络访问同一目标。若只在原网络失败，原路径值得进一步检查；若多处都失败，服务、账号或共同配置更值得检查。这个对照缩小范围，不直接证明原因。 4. 恢复并提交线索。 断开本次连接，撤销本次手动修改，确认原访问恢复。向提供者报告时间、目标、错误、连接状态与对照结果。不要把密码、完整认证文件放进公开反馈；公司受管设置按管理员流程恢复。 根据观察决定下一步 观察 下一步更值得核对 暂时不要下的结论 --- --- --- 普通服务也都失败 接入与上游是否可用 VPN一定损坏 VPN认证失败 账号、凭据、批准状态 网站封了IP 域名查询失败 名称记录或查询路径 网站程序一定停止 网页返回拒绝或验证页 权限与服务规则 数据从未抵达 只有某个应用不行 该应用的路径与设置 所有软件都断网 名称查询与取得网页是不同工作。名称查询机制 服务返回错误，也意味着至少有一部分通信已经发生。请求与响应 改变条件后，解释也要变 示范中，如果另一条网络可以访问内部网页，原网络路径变得可疑；如果同事都能访问，只有小林在多处失败，应更多检查小林的账号、设备或配置。都只是判断顺序，不是未经证据的定论。 证书警告涉及对端校验，不能用关闭保护来验证“网页是否能打开”。排障目标是找出哪一段需要核对，并保持可恢复的状态。 相关概念 - 配置与目标验证 - 连接与风控提示的区别","outline":[{"id":"section-1","title":"先把“打不开”分成可以观察的现象","depth":2},{"id":"section-2","title":"完整对照：主站能开，商品图片不出","depth":2},{"id":"section-3","title":"有了回复以后，还要看回复具体说什么","depth":2},{"id":"section-4","title":"开始前先把错误说具体","depth":2},{"id":"section-5","title":"从近处到目标做四个对照","depth":2},{"id":"section-6","title":"根据观察决定下一步","depth":2},{"id":"section-7","title":"改变条件后，解释也要变","depth":2}]},{"id":"remote","group":"scenes","title":"人在外面，怎样访问家里或公司的设备？","question":"人在外面，怎样访问家里或公司的设备？","summary":"先让设备加入有身份控制的私有连接，再访问获准的服务。","terms":["远程访问","内网"],"aliases":["远程访问","","内网",""],"related":["vpn","identity","setup"],"html":"\u003cp>\u003cstrong>先用管理员或设备所有者认可的连接方式，让两台设备能够联系彼此，再访问家里或公司设备上的文件、网页或远程桌面服务。\u003c/strong> 目标程序要正在运行、能接收你的请求，并允许你的账号使用。仅显示“设备在线”还不够。\u003c/p>\n\u003ch2 id=\"section-1\">家里的设备在线，为什么还看不到文件\u003c/h2>\n\u003cp>以\u003cstrong>虚构家用照片设备\u003c/strong>为例：外出电脑已经可以通过私有连接联系家中设备，但家中设备的照片程序没有启动。这时网络工具显示设备在线，浏览器仍访问失败；路径不能替你运行服务。\u003c/p>\n\u003cp>照片服务运行后，还需要在适当地址和端口接收获准访问。若只监听localhost，外部成员设备也不能凭私有连接直接使用；若有登录与文件权限，达到入口后还要核对身份。加入私有网络、连接到照片程序、获得查看照片的权限，需要分别满足。\u003c/p>\n\u003ch2 id=\"section-2\">为什么不只给朋友家中IP和一个端口\u003c/h2>\n\u003cp>不同家庭可能使用相同的内网地址，公共出口还可能经过共享。即使有明确公共入口，开放接收也会让相应服务承担更多暴露与管理工作。自有设备远程连接通常需要选择明确的成员身份和授权范围；不是看到公网地址就能访问所有文件。\u003c/p>\n\u003cp>端口转发与私有覆盖连接是不同路径方案，前者安排公共入口到内部服务的映射，后者让获准成员按私有连接访问。具体方案要由设备所有者或管理员决定，本示范不操作真实开放设置。\u003c/p>\n\u003ch2 id=\"section-3\">在外验证，才覆盖“远程”这项目的\u003c/h2>\n\u003cp>两台设备都在家里时成功，只说明相应本地条件下能用。远程目标还需从你实际外出网络进行获准验证，看成员在线、目标服务响应、正确账号有权限；若只发现设备地址，不等于任务已完成。\u003c/p>\n\u003cp>\u003cstrong>教学对照\u003c/strong>：外出后看到家中设备离线，要先看家中设备是否休眠、断网、客户端退出；设备在线但登录拒绝，要看服务账号。把二者区分开，才能向对应人员提供有用线索。\u003c/p>\n\u003ch2 id=\"section-4\">远程桌面、网页和文件共享不是同一服务\u003c/h2>\n\u003cp>远程桌面传显示和输入，让你操作另一设备；文件服务提供文件访问；网页服务回答浏览器请求。它们可以在同一台设备运行，却可能使用不同端口、登录方式，并提供不同功能。\u003c/p>\n\u003cp>你能进入其中一种，不保证另外两种都开通。撤销成员、关闭服务或断开连接时，观察的也应是相应任务。下面的示范把加入、服务运行、访问、验证和恢复连起来，便于你用自己的目标替换“照片”。\u003c/p>\n\u003ch2 id=\"section-5\">为什么能上网，却不能从外面找到家里电脑\u003c/h2>\n\u003cp>家中设备可能使用内部地址，并通过共享出口主动访问互联网。出口知道怎样把既有连接的回复送回来，却不会自动把陌生人的新访问交给家中设备。云网络也常区分可出站与允许外部主动进入。\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">出站与入站的区别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>直接把服务暴露给公共互联网只是某种选择；访问自有设备，还可以使用带身份控制的私有连接。\u003c/p>\n\u003ch2 id=\"section-6\">自有设备示范：用私有连接联系家中电脑\u003c/h2>\n\u003cp>下面是\u003cstrong>虚构教学示范\u003c/strong>，以Tailscale这类覆盖网络为例。前提是两台设备都属于你或得到明确许可，目标设备联网、保持运行，允许安装官方客户端。公司设备应使用管理员指定方式。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>建立成员身份。\u003c/strong> 在两台设备安装官方客户端并按要求登录，完成必要批准。应在管理界面看到两台成员设备；若有一台未出现，先核对登录范围、批准与客户端状态，不继续开放公共服务。\u003ca href=\"https://tailscale.com/docs/how-to/quickstart\" target=\"_blank\" rel=\"noopener noreferrer\">官方开始步骤\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>确认目标服务。\u003c/strong> 在家中电脑先打开想访问的文件服务、网页或远程桌面，并检查该服务的账号权限。应能在本机使用；若本机都失败，先修复程序或权限，网络连接工具不会替你运行它。\u003c/li>\n\u003cli>\u003cstrong>从另一台设备访问。\u003c/strong> 使用私有网络提供的目标名称或地址，按照片程序或文件服务要求的地址、端口访问。正确时目标服务响应，再按服务要求登录；若设备在线而服务不响应，核对防火墙、服务接收范围与访问规则。服务若只接受本机连接，需要按官方说明调整为接受获准网络，不能直接开放全部入口。\u003c/li>\n\u003cli>\u003cstrong>验证范围并恢复。\u003c/strong> 从你实际要使用的外部网络再验证一次。完成后可以断开私有连接，或撤销不再需要的成员资格与本次规则；应观察到相应访问停止。恢复前确保没有其他获准用户依赖这项变更。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"section-7\">这与“换上网出口”有什么不同\u003c/h2>\n\u003cp>普通覆盖网络主要连接成员设备，访问家中电脑后，你浏览普通网站可能仍走原上网出口。需要经家中出口上网时，才涉及另外的出口节点设置与批准。\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">内部连接与公共出口\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003cp>一种目标是“访问家里的设备”，另一种是“让互联网访问从家里出去”。两者可能用同一个工具，但验证结果不同。\u003c/p>\n\u003ch2 id=\"section-8\">换成公司系统，什么要改变\u003c/h2>\n\u003cp>公司系统可能使用内部名称、专用连接和统一身份管理。你不应自行给受管设备加入个人网络，应取得管理员给的入口、权限与客户端说明。能够连到某台设备，也不意味着获准读取其中所有文件。\u003c/p>\n","text":"人在外面，怎样访问家里或公司的设备？ 先用管理员或设备所有者认可的连接方式，让两台设备能够联系彼此，再访问家里或公司设备上的文件、网页或远程桌面服务。 目标程序要正在运行、能接收你的请求，并允许你的账号使用。仅显示“设备在线”还不够。 家里的设备在线，为什么还看不到文件 以 虚构家用照片设备 为例：外出电脑已经可以通过私有连接联系家中设备，但家中设备的照片程序没有启动。这时网络工具显示设备在线，浏览器仍访问失败；路径不能替你运行服务。 照片服务运行后，还需要在适当地址和端口接收获准访问。若只监听localhost，外部成员设备也不能凭私有连接直接使用；若有登录与文件权限，达到入口后还要核对身份。加入私有网络、连接到照片程序、获得查看照片的权限，需要分别满足。 为什么不只给朋友家中IP和一个端口 不同家庭可能使用相同的内网地址，公共出口还可能经过共享。即使有明确公共入口，开放接收也会让相应服务承担更多暴露与管理工作。自有设备远程连接通常需要选择明确的成员身份和授权范围；不是看到公网地址就能访问所有文件。 端口转发与私有覆盖连接是不同路径方案，前者安排公共入口到内部服务的映射，后者让获准成员按私有连接访问。具体方案要由设备所有者或管理员决定，本示范不操作真实开放设置。 在外验证，才覆盖“远程”这项目的 两台设备都在家里时成功，只说明相应本地条件下能用。远程目标还需从你实际外出网络进行获准验证，看成员在线、目标服务响应、正确账号有权限；若只发现设备地址，不等于任务已完成。 教学对照 ：外出后看到家中设备离线，要先看家中设备是否休眠、断网、客户端退出；设备在线但登录拒绝，要看服务账号。把二者区分开，才能向对应人员提供有用线索。 远程桌面、网页和文件共享不是同一服务 远程桌面传显示和输入，让你操作另一设备；文件服务提供文件访问；网页服务回答浏览器请求。它们可以在同一台设备运行，却可能使用不同端口、登录方式，并提供不同功能。 你能进入其中一种，不保证另外两种都开通。撤销成员、关闭服务或断开连接时，观察的也应是相应任务。下面的示范把加入、服务运行、访问、验证和恢复连起来，便于你用自己的目标替换“照片”。 为什么能上网，却不能从外面找到家里电脑 家中设备可能使用内部地址，并通过共享出口主动访问互联网。出口知道怎样把既有连接的回复送回来，却不会自动把陌生人的新访问交给家中设备。云网络也常区分可出站与允许外部主动进入。出站与入站的区别 直接把服务暴露给公共互联网只是某种选择；访问自有设备，还可以使用带身份控制的私有连接。 自有设备示范：用私有连接联系家中电脑 下面是 虚构教学示范 ，以Tailscale这类覆盖网络为例。前提是两台设备都属于你或得到明确许可，目标设备联网、保持运行，允许安装官方客户端。公司设备应使用管理员指定方式。 1. 建立成员身份。 在两台设备安装官方客户端并按要求登录，完成必要批准。应在管理界面看到两台成员设备；若有一台未出现，先核对登录范围、批准与客户端状态，不继续开放公共服务。官方开始步骤 2. 确认目标服务。 在家中电脑先打开想访问的文件服务、网页或远程桌面，并检查该服务的账号权限。应能在本机使用；若本机都失败，先修复程序或权限，网络连接工具不会替你运行它。 3. 从另一台设备访问。 使用私有网络提供的目标名称或地址，按照片程序或文件服务要求的地址、端口访问。正确时目标服务响应，再按服务要求登录；若设备在线而服务不响应，核对防火墙、服务接收范围与访问规则。服务若只接受本机连接，需要按官方说明调整为接受获准网络，不能直接开放全部入口。 4. 验证范围并恢复。 从你实际要使用的外部网络再验证一次。完成后可以断开私有连接，或撤销不再需要的成员资格与本次规则；应观察到相应访问停止。恢复前确保没有其他获准用户依赖这项变更。 这与“换上网出口”有什么不同 普通覆盖网络主要连接成员设备，访问家中电脑后，你浏览普通网站可能仍走原上网出口。需要经家中出口上网时，才涉及另外的出口节点设置与批准。内部连接与公共出口 一种目标是“访问家里的设备”，另一种是“让互联网访问从家里出去”。两者可能用同一个工具，但验证结果不同。 换成公司系统，什么要改变 公司系统可能使用内部名称、专用连接和统一身份管理。你不应自行给受管设备加入个人网络，应取得管理员给的入口、权限与客户端说明。能够连到某台设备，也不意味着获准读取其中所有文件。 相关概念 - VPN两种用途 - 配置与恢复","outline":[{"id":"section-1","title":"家里的设备在线，为什么还看不到文件","depth":2},{"id":"section-2","title":"为什么不只给朋友家中IP和一个端口","depth":2},{"id":"section-3","title":"在外验证，才覆盖“远程”这项目的","depth":2},{"id":"section-4","title":"远程桌面、网页和文件共享不是同一服务","depth":2},{"id":"section-5","title":"为什么能上网，却不能从外面找到家里电脑","depth":2},{"id":"section-6","title":"自有设备示范：用私有连接联系家中电脑","depth":2},{"id":"section-7","title":"这与“换上网出口”有什么不同","depth":2},{"id":"section-8","title":"换成公司系统，什么要改变","depth":2}]},{"id":"deploy","group":"scenes","title":"电脑里的网页，怎样让别人也能打开？","question":"电脑里的网页，怎样让别人也能打开？","summary":"别人能打开网页，需要网络能够连接服务器，程序正在运行，并且允许外部请求。","terms":["localhost","端口","防火墙","部署"],"aliases":["localhost","127.0.0.1 本机","端口","port socket 冒号 3000 8080 443","防火墙","","部署",""],"related":["ports","domains","remote","web"],"html":"\u003cp>AI帮你做好的页面在电脑里能打开，朋友输入同样地址却失败。\u003cstrong>朋友的浏览器必须能通过他的网络联系到你的网页服务器。服务器还要正在运行，并允许接收他的请求。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">本地文件、附近服务和公共网站，是三种分享方式\u003c/h2>\n\u003cp>双击一个HTML文件，是浏览器读取自己设备中的文件；打开localhost加端口，是浏览器向自己设备的运行服务请求；给别人公共网址，则需要对方能联系到接收入口。三种方式可以显示相似画面，但地址含义和运行条件不同。\u003c/p>\n\u003cp>如果页面全部内容已经包含在单文件里，你可以把文件交给别人，他在自己的设备阅读；如果页面还会调用你的本地程序，只复制页面未必带走动态能力。这份知识库的离线包把正文和图解嵌入一个文件，在线业务应用则常有更多服务依赖。\u003c/p>\n\u003ch2 id=\"section-2\">用一次发布过程看域名、端口与程序\u003c/h2>\n\u003cp>\u003cstrong>虚构教学场景\u003c/strong>：小林完成一个公开作品页，把网页文件上传到托管服务。托管方保存文件，运行对外提供网页的服务器，并给出访问网址。小林再按说明设置自己的域名，让浏览器可以通过这个域名找到托管服务器。\u003c/p>\n\u003cp>别人的浏览器通过域名查到IP，联系相应端口，在请求中写明主机名和路径。服务器上的程序收到请求，再返回对应页面。上传文件、让程序运行、设置域名和HTTPS，分别保证内容存在、请求有人处理、浏览器找得到网站，以及传送内容受到保护。\u003c/p>\n\u003cp>如果只是静态作品页，主要只需提供页面文件；如果还做登录、提交留言或存用户数据，则需要相关后端和资料存储。入口能显示按钮，不代表登录或留言等功能的后台程序已经运行。\u003c/p>\n\u003ch2 id=\"section-3\">为什么公网IP仍可能只让自己打开\u003c/h2>\n\u003cp>服务可能只接受本机范围，请求从外面到不了；防护规则可能拒绝新接收；上游共享出口可能没有映射；程序或设备也可能随关闭电脑停止。拥有公网地址，与程序一直运行并接受外部请求，是不同条件。\u003c/p>\n\u003cp>不要把自己的本地3000端口看成朋友浏览器自动知道的公网入口。网站常通过HTTPS默认的443端口接收外部请求，再转给服务器内部其他端口上的程序；对外和内部编号可以不相同。\u003ca href=\"#/ports\">端口\u003c/a>解释这个分工。\u003c/p>\n\u003ch2 id=\"section-4\">验证公开页面，要覆盖别人真正要完成的事\u003c/h2>\n\u003cp>从另一台设备或另一条获准网络进入预期公共网址，看标题和图片，再尝试产品允许的完整任务。若主站显示，登录失败，就分别记录文字、图片是否显示，以及登录等功能是否成功；若新域名异常，默认托管入口正常，就更关注名称与证书配置。\u003c/p>\n\u003cp>发布后需要谁持续运行、谁保存资料、谁管理权限，是交付的一部分。理解这些步骤，可以区分“我这里能打开”和“别人从外面能正常使用”。\u003c/p>\n\u003ch2 id=\"section-5\">localhost为什么只指向各自的电脑\u003c/h2>\n\u003cp>localhost或常见的本机回环地址，表示访问者自己的设备。你用它访问自己的程序，朋友输入它，寻找的是朋友自己的程序。它不是你电脑在世界上的公开名字。\u003c/p>\n\u003cp>家中内部地址也通常只在自己的网络范围起作用。朋友能否联系你的电脑，还取决于出口、路由与访问规则。\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">内部实例与外部连接\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-6\">对外访问需要几件事一起成立\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工作\u003c/th>\n\u003cth>它解决的具体问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>程序持续运行\u003c/td>\n\u003ctd>请求到达时，服务器上有程序可以处理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适当的接收入口\u003c/td>\n\u003ctd>服务器通过哪个地址和端口接收请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可达的网络路径\u003c/td>\n\u003ctd>朋友的网络能把请求送到服务器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>防火墙与权限\u003c/td>\n\u003ctd>这类访问是否获准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>名称与证书\u003c/td>\n\u003ctd>人怎样找到并核对服务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>端口是设备在传输层区分服务入口的一种编号。你不用先背常用编号，只要知道同一台设备可以有多项服务，需要决定请求交给谁。实际接收者也可能先是转发入口，再把请求送给后面的程序。\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP服务与中间设施\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-7\">托管服务帮忙承担哪些工作\u003c/h2>\n\u003cp>托管静态页面时，服务替你持续保存文件、提供公开入口并处理部分网络与保护安排。需要运行后端程序时，还要有支持该程序的运行环境、资料存储与权限配置。上传了文件不代表所有动态功能都已经运行。\u003c/p>\n\u003cp>域名是便于记忆的名字，名称记录帮助访问者找到入口；域名本身不负责执行程序。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc1034.html\" target=\"_blank\" rel=\"noopener noreferrer\">名称记录的作用\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/p>\n\u003ch2 id=\"section-8\">用一次失败解释整条链\u003c/h2>\n\u003cp>以下为\u003cstrong>虚构教学对照\u003c/strong>：通过托管服务的网址能看到网页，但登录一直报错。可能是页面文件已经上传，账号服务尚未运行或请求配置错误。此时“页面能开”和“登录失败”可以同时成立。\u003c/p>\n\u003cp>另一个对照是：家中网页只有自己能开。即使家里拥有公网IP，若程序只接收本机请求，或入口规则没有允许外部访问，朋友仍打不开。公开地址只解决寻址的一部分。\u003c/p>\n\u003cp>对公共发布，应在另一台设备或另一条获准网络验证整项任务，并分别核对页面、功能与权限。离线阅读把文件交给读者，在线托管则由服务器持续提供网页；两种分享方式需要不同安排。\u003c/p>\n","text":"电脑里的网页，怎样让别人也能打开？ AI帮你做好的页面在电脑里能打开，朋友输入同样地址却失败。 朋友的浏览器必须能通过他的网络联系到你的网页服务器。服务器还要正在运行，并允许接收他的请求。 本地文件、附近服务和公共网站，是三种分享方式 双击一个HTML文件，是浏览器读取自己设备中的文件；打开localhost加端口，是浏览器向自己设备的运行服务请求；给别人公共网址，则需要对方能联系到接收入口。三种方式可以显示相似画面，但地址含义和运行条件不同。 如果页面全部内容已经包含在单文件里，你可以把文件交给别人，他在自己的设备阅读；如果页面还会调用你的本地程序，只复制页面未必带走动态能力。这份知识库的离线包把正文和图解嵌入一个文件，在线业务应用则常有更多服务依赖。 用一次发布过程看域名、端口与程序 虚构教学场景 ：小林完成一个公开作品页，把网页文件上传到托管服务。托管方保存文件，运行对外提供网页的服务器，并给出访问网址。小林再按说明设置自己的域名，让浏览器可以通过这个域名找到托管服务器。 别人的浏览器通过域名查到IP，联系相应端口，在请求中写明主机名和路径。服务器上的程序收到请求，再返回对应页面。上传文件、让程序运行、设置域名和HTTPS，分别保证内容存在、请求有人处理、浏览器找得到网站，以及传送内容受到保护。 如果只是静态作品页，主要只需提供页面文件；如果还做登录、提交留言或存用户数据，则需要相关后端和资料存储。入口能显示按钮，不代表登录或留言等功能的后台程序已经运行。 为什么公网IP仍可能只让自己打开 服务可能只接受本机范围，请求从外面到不了；防护规则可能拒绝新接收；上游共享出口可能没有映射；程序或设备也可能随关闭电脑停止。拥有公网地址，与程序一直运行并接受外部请求，是不同条件。 不要把自己的本地3000端口看成朋友浏览器自动知道的公网入口。网站常通过HTTPS默认的443端口接收外部请求，再转给服务器内部其他端口上的程序；对外和内部编号可以不相同。端口解释这个分工。 验证公开页面，要覆盖别人真正要完成的事 从另一台设备或另一条获准网络进入预期公共网址，看标题和图片，再尝试产品允许的完整任务。若主站显示，登录失败，就分别记录文字、图片是否显示，以及登录等功能是否成功；若新域名异常，默认托管入口正常，就更关注名称与证书配置。 发布后需要谁持续运行、谁保存资料、谁管理权限，是交付的一部分。理解这些步骤，可以区分“我这里能打开”和“别人从外面能正常使用”。 localhost为什么只指向各自的电脑 localhost或常见的本机回环地址，表示访问者自己的设备。你用它访问自己的程序，朋友输入它，寻找的是朋友自己的程序。它不是你电脑在世界上的公开名字。 家中内部地址也通常只在自己的网络范围起作用。朋友能否联系你的电脑，还取决于出口、路由与访问规则。内部实例与外部连接 对外访问需要几件事一起成立 工作 它解决的具体问题 --- --- 程序持续运行 请求到达时，服务器上有程序可以处理 适当的接收入口 服务器通过哪个地址和端口接收请求 可达的网络路径 朋友的网络能把请求送到服务器 防火墙与权限 这类访问是否获准 名称与证书 人怎样找到并核对服务 端口是设备在传输层区分服务入口的一种编号。你不用先背常用编号，只要知道同一台设备可以有多项服务，需要决定请求交给谁。实际接收者也可能先是转发入口，再把请求送给后面的程序。HTTP服务与中间设施 托管服务帮忙承担哪些工作 托管静态页面时，服务替你持续保存文件、提供公开入口并处理部分网络与保护安排。需要运行后端程序时，还要有支持该程序的运行环境、资料存储与权限配置。上传了文件不代表所有动态功能都已经运行。 域名是便于记忆的名字，名称记录帮助访问者找到入口；域名本身不负责执行程序。名称记录的作用 用一次失败解释整条链 以下为 虚构教学对照 ：通过托管服务的网址能看到网页，但登录一直报错。可能是页面文件已经上传，账号服务尚未运行或请求配置错误。此时“页面能开”和“登录失败”可以同时成立。 另一个对照是：家中网页只有自己能开。即使家里拥有公网IP，若程序只接收本机请求，或入口规则没有允许外部访问，朋友仍打不开。公开地址只解决寻址的一部分。 对公共发布，应在另一台设备或另一条获准网络验证整项任务，并分别核对页面、功能与权限。离线阅读把文件交给读者，在线托管则由服务器持续提供网页；两种分享方式需要不同安排。 相关概念 - IP与可访问范围 - 浏览器取网页的过程 - 远程连接自有设备","outline":[{"id":"section-1","title":"本地文件、附近服务和公共网站，是三种分享方式","depth":2},{"id":"section-2","title":"用一次发布过程看域名、端口与程序","depth":2},{"id":"section-3","title":"为什么公网IP仍可能只让自己打开","depth":2},{"id":"section-4","title":"验证公开页面，要覆盖别人真正要完成的事","depth":2},{"id":"section-5","title":"localhost为什么只指向各自的电脑","depth":2},{"id":"section-6","title":"对外访问需要几件事一起成立","depth":2},{"id":"section-7","title":"托管服务帮忙承担哪些工作","depth":2},{"id":"section-8","title":"用一次失败解释整条链","depth":2}]},{"id":"glossary","group":"reference","title":"遇到陌生名词，来这里查一句解释","question":"遇到陌生名词，来这里查一句解释","summary":"索引将常见名称连接到唯一的正文解释。","terms":[],"aliases":[],"related":["world-map","signals","access","packets","ip"],"html":"\u003cp>索引供随时查找，不需要背。先看一句解释，再进入正文里的实际过程。IP、端口、域名和网址各段，可以从\u003ca href=\"#/url\">同一条链接\u003c/a>连续理解。\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名称\u003c/th>\n\u003cth>一句解释\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>互联网\u003c/td>\n\u003ctd>把许多网络互相连接起来，让不同网络中的设备可以交换信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/world-map\">从一次上网出发，建立完整的网络地图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通信\u003c/td>\n\u003ctd>按约定把信息从一端交给另一端。\u003c/td>\n\u003ctd>\u003ca href=\"#/world-map\">从一次上网出发，建立完整的网络地图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网络\u003c/td>\n\u003ctd>连接设备并按规则传递信息的系统。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网页\u003c/td>\n\u003ctd>浏览器解释和显示的内容及操作界面。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网站\u003c/td>\n\u003ctd>供人访问的一组网页，以及提供查询、登录等功能的程序。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>浏览器\u003c/td>\n\u003ctd>你用来打开网页的软件；它发出请求、读取网页内容，并显示文字、图片和按钮。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">网络、互联网、网页和软件，分别是什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>URL\u003c/td>\n\u003ctd>网址的正式名称；它说明访问方式、网站名称，以及要查看的内容等信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网址\u003c/td>\n\u003ctd>用来指定要访问哪里的地址，例如一个商品页的链接。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查询参数\u003c/td>\n\u003ctd>网址问号后的信息，例如颜色、搜索词或页码；含义由网站规定。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>片段\u003c/td>\n\u003ctd>网址井号后的部分；浏览器可用它定位到页面某处，页面程序也可读取它。\u003c/td>\n\u003ctd>\u003ca href=\"#/url\">一条网址里的域名、端口和参数，各有什么用？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编码\u003c/td>\n\u003ctd>用约定的数字记录表示内容。\u003c/td>\n\u003ctd>\u003ca href=\"#/signals\">文字和声音，怎么进入电线与空气？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信号\u003c/td>\n\u003ctd>能携带信息的物理变化。\u003c/td>\n\u003ctd>\u003ca href=\"#/signals\">文字和声音，怎么进入电线与空气？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>光纤\u003c/td>\n\u003ctd>用光传递信息的线路。\u003c/td>\n\u003ctd>\u003ca href=\"#/signals\">文字和声音，怎么进入电线与空气？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wi-Fi\u003c/td>\n\u003ctd>用无线电联系附近设备的接入方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/access\">连上Wi-Fi，为什么不一定能上网？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>基站\u003c/td>\n\u003ctd>让附近移动设备接入移动网络的设施。\u003c/td>\n\u003ctd>\u003ca href=\"#/access\">连上Wi-Fi，为什么不一定能上网？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运营商\u003c/td>\n\u003ctd>提供接入并管理网络的组织。\u003c/td>\n\u003ctd>\u003ca href=\"#/access\">连上Wi-Fi，为什么不一定能上网？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据包\u003c/td>\n\u003ctd>传送数据时组织出的一小份信息，带有目的地址等转送需要的说明。\u003c/td>\n\u003ctd>\u003ca href=\"#/packets\">一张照片为什么要分成许多小份？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>协议\u003c/td>\n\u003ctd>通信双方组织和处理信息的约定。\u003c/td>\n\u003ctd>\u003ca href=\"#/packets\">一张照片为什么要分成许多小份？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP\u003c/td>\n\u003ctd>标明数据包来源和目的地的网络地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IPv4\u003c/td>\n\u003ctd>较早的一代IP地址与传送规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IPv6\u003c/td>\n\u003ctd>支持更大地址范围的一代IP规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内网IP\u003c/td>\n\u003ctd>在内部网络范围使用的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公网IP\u003c/td>\n\u003ctd>可在公共互联网中寻址的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/ip\">IP是什么，为什么信息需要地址？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口\u003c/td>\n\u003ctd>设备区分接收程序和通信连接所用的编号，例如网页服务接收请求的443。\u003c/td>\n\u003ctd>\u003ca href=\"#/ports\">知道IP后，为什么还要写端口？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>监听\u003c/td>\n\u003ctd>程序在指定地址和端口等待通信。\u003c/td>\n\u003ctd>\u003ca href=\"#/ports\">知道IP后，为什么还要写端口？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>默认端口\u003c/td>\n\u003ctd>网址没有写端口时，浏览器按访问方式采用的端口，例如HTTPS采用443。\u003c/td>\n\u003ctd>\u003ca href=\"#/ports\">知道IP后，为什么还要写端口？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NAT\u003c/td>\n\u003ctd>转送时转换地址，并记录对应关系，以便把回复送回原设备。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共享IP\u003c/td>\n\u003ctd>多台设备或多个人访问外部网站时，网站看到相同的来源IP。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动态IP\u003c/td>\n\u003ctd>随接入安排可能变化的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>静态IP\u003c/td>\n\u003ctd>按安排保持固定的地址。\u003c/td>\n\u003ctd>\u003ca href=\"#/nat\">电脑的IP与网站看到的IP，为什么不一样？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子域名\u003c/td>\n\u003ctd>位于另一个域名下面的名称，不等于网页目录。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>二级域名\u003c/td>\n\u003ctd>按严格层级或日常习惯使用的叫法，需看实际名称。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主域名\u003c/td>\n\u003ctd>日常常指管理者的主要或可注册域名，具体边界需确认。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同源\u003c/td>\n\u003ctd>访问方式、主机和端口组合相同的浏览器来源。\u003c/td>\n\u003ctd>\u003ca href=\"#/domains\">www、shop、api：同一个网站为何有多个域名？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>域名\u003c/td>\n\u003ctd>人便于记住的网络名称。\u003c/td>\n\u003ctd>\u003ca href=\"#/dns\">输入网址后，电脑怎么找到网站？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DNS\u003c/td>\n\u003ctd>按名称查询地址等记录的系统。\u003c/td>\n\u003ctd>\u003ca href=\"#/dns\">输入网址后，电脑怎么找到网站？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由\u003c/td>\n\u003ctd>选择向目的地转送的下一步方向。\u003c/td>\n\u003ctd>\u003ca href=\"#/routes\">经过那么多网络，谁决定往哪走？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由器\u003c/td>\n\u003ctd>在网络之间转送信息的设备。\u003c/td>\n\u003ctd>\u003ca href=\"#/routes\">经过那么多网络，谁决定往哪走？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>网关\u003c/td>\n\u003ctd>帮助当前网络向其他网络转送信息的设备或系统，家里常由路由器承担。\u003c/td>\n\u003ctd>\u003ca href=\"#/routes\">经过那么多网络，谁决定往哪走？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TCP\u003c/td>\n\u003ctd>为应用提供可靠有序数据流的传输规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UDP\u003c/td>\n\u003ctd>提供较轻报文传送、由应用安排额外处理的规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重传\u003c/td>\n\u003ctd>依据反馈或等待情况再次送出缺失信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时\u003c/td>\n\u003ctd>等待超过设定范围仍未取得期望结果。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">信息丢了、乱序了，怎么还能完整收到？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP\u003c/td>\n\u003ctd>网页请求与响应的组织规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务器\u003c/td>\n\u003ctd>提供服务的计算机与正在运行的程序。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求\u003c/td>\n\u003ctd>向服务说明希望取得或执行什么。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>响应\u003c/td>\n\u003ctd>服务器针对请求发回的内容或结果，例如页面、图片或错误说明。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CDN\u003c/td>\n\u003ctd>把内容与接收入口安排到不同节点的分发设施。\u003c/td>\n\u003ctd>\u003ca href=\"#/web\">打开一个网页，背后是谁在回答？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路径\u003c/td>\n\u003ctd>网址中主机名后以斜线开头的部分，例如/products/42；网站据此选择内容。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>参数\u003c/td>\n\u003ctd>请求附带的条件或输入，例如颜色或搜索词；不能凭它自动获得权限。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锚点\u003c/td>\n\u003ctd>常指用于浏览器定位资源内部位置的片段。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求正文\u003c/td>\n\u003ctd>请求目标以外携带的操作或提交内容。\u003c/td>\n\u003ctd>\u003ca href=\"#/url-pages\">路径、问号、井号：不同页面究竟怎么区分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重定向\u003c/td>\n\u003ctd>把浏览器引向另一个访问位置的安排。\u003c/td>\n\u003ctd>\u003ca href=\"#/browsing\">从点击商品链接到看到页面，完整经历了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面路由\u003c/td>\n\u003ctd>页面程序依据地址或状态选择显示内容的规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/browsing\">从点击商品链接到看到页面，完整经历了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTPS\u003c/td>\n\u003ctd>使用TLS保护的网页通信。\u003c/td>\n\u003ctd>\u003ca href=\"#/security\">信息经过别人，哪些内容能被看见？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加密\u003c/td>\n\u003ctd>通过密钥等安排限制内容的可读性。\u003c/td>\n\u003ctd>\u003ca href=\"#/security\">信息经过别人，哪些内容能被看见？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>证书\u003c/td>\n\u003ctd>帮助核对连接对象身份的数字资料。\u003c/td>\n\u003ctd>\u003ca href=\"#/security\">信息经过别人，哪些内容能被看见？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cookie\u003c/td>\n\u003ctd>浏览器按范围保存并随请求发送的数据。\u003c/td>\n\u003ctd>\u003ca href=\"#/identity\">换了IP，网站为什么还认得你？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>会话\u003c/td>\n\u003ctd>网站保存的一段访问状态，例如某个浏览器当前登录了哪个账号。\u003c/td>\n\u003ctd>\u003ca href=\"#/identity\">换了IP，网站为什么还认得你？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设备指纹\u003c/td>\n\u003ctd>从多项设备或浏览器特征关联访问的线索组合。\u003c/td>\n\u003ctd>\u003ca href=\"#/identity\">换了IP，网站为什么还认得你？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务状态\u003c/td>\n\u003ctd>应用保存的实际结果，例如订单已创建、付款待确认。\u003c/td>\n\u003ctd>\u003ca href=\"#/transactions\">点了登录、提交订单，什么才算真的成功？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口\u003c/td>\n\u003ctd>程序之间约定的请求和回复方式，例如页面怎样请求查询订单。\u003c/td>\n\u003ctd>\u003ca href=\"#/transactions\">点了登录、提交订单，什么才算真的成功？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>供程序使用的接口，例如网页程序向服务器查询库存的约定方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/transactions\">点了登录、提交订单，什么才算真的成功？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>存储转发\u003c/td>\n\u003ctd>服务器先保存内容，等接收设备可以联系时再传过去。\u003c/td>\n\u003ctd>\u003ca href=\"#/messages\">朋友不在线，消息怎么还能送达？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>推送\u003c/td>\n\u003ctd>通过服务主动向设备交付通知或数据。\u003c/td>\n\u003ctd>\u003ca href=\"#/messages\">朋友不在线，消息怎么还能送达？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已读\u003c/td>\n\u003ctd>应用报告的阅读状态，含义以产品为准。\u003c/td>\n\u003ctd>\u003ca href=\"#/messages\">朋友不在线，消息怎么还能送达？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓冲\u003c/td>\n\u003ctd>暂存内容以吸收到达时间变化。\u003c/td>\n\u003ctd>\u003ca href=\"#/live\">视频通话为什么比看视频更怕卡？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中继\u003c/td>\n\u003ctd>不能或不选择直连时负责继续转送的节点。\u003c/td>\n\u003ctd>\u003ca href=\"#/live\">视频通话为什么比看视频更怕卡？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实时通信\u003c/td>\n\u003ctd>一边发生一边交付，重视及时性的通信。\u003c/td>\n\u003ctd>\u003ca href=\"#/live\">视频通话为什么比看视频更怕卡？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>带宽\u003c/td>\n\u003ctd>连接单位时间可以承载的信息容量。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>延迟\u003c/td>\n\u003ctd>信息抵达或往返需要的等待时间。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>抖动\u003c/td>\n\u003ctd>到达时间的变化程度。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>丢包\u003c/td>\n\u003ctd>部分传送单位未成功抵达。\u003c/td>\n\u003ctd>\u003ca href=\"#/speed\">网速很高，为什么打开网页仍然慢？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP信誉\u003c/td>\n\u003ctd>对某来源历史观察形成的风险线索。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>风控\u003c/td>\n\u003ctd>用多项证据判断是否验证、限制或复核。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机房IP\u003c/td>\n\u003ctd>通常归属于云或托管网络的来源标签。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>住宅IP\u003c/td>\n\u003ctd>通常归属于普通家庭接入网络的来源标签。\u003c/td>\n\u003ctd>\u003ca href=\"#/risk\">IP为什么是风控的重要线索？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VPN\u003c/td>\n\u003ctd>通过现有网络建立受保护连接，让指定请求经另一端访问公司系统或外部网站。\u003c/td>\n\u003ctd>\u003ca href=\"#/vpn\">VPN究竟改变了哪一段通信？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>隧道\u003c/td>\n\u003ctd>把数据包在另一层通信里传送；VPN常用它保护到另一端的数据。\u003c/td>\n\u003ctd>\u003ca href=\"#/vpn\">VPN究竟改变了哪一段通信？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>出口节点\u003c/td>\n\u003ctd>替选定访问联系公共互联网的节点。\u003c/td>\n\u003ctd>\u003ca href=\"#/vpn\">VPN究竟改变了哪一段通信？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代理\u003c/td>\n\u003ctd>替某些请求联系目标服务的中间服务。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分流\u003c/td>\n\u003ctd>按规则决定不同访问走哪里。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全局模式\u003c/td>\n\u003ctd>工具尽量让更多请求经过指定路径的模式，具体影响哪些应用要看设置。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>节点\u003c/td>\n\u003ctd>在相应工具中提供连接或转送的端点。\u003c/td>\n\u003ctd>\u003ca href=\"#/split\">全局、分流、代理，为什么影响的应用不同？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VPN配置\u003c/td>\n\u003ctd>建立连接与安排访问范围所需的设置。\u003c/td>\n\u003ctd>\u003ca href=\"#/setup\">怎样配置VPN，并确认它真的生效？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连接验证\u003c/td>\n\u003ctd>按原目标观察连接后实际可用的结果。\u003c/td>\n\u003ctd>\u003ca href=\"#/setup\">怎样配置VPN，并确认它真的生效？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>排障\u003c/td>\n\u003ctd>用证据与对照缩小故障范围。\u003c/td>\n\u003ctd>\u003ca href=\"#/troubleshoot\">连不上、打不开，怎样判断卡在哪一段？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>热点\u003c/td>\n\u003ctd>把一台设备的接 " aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持Wi-Fi通过无线电在附近设备间传递信息。 无线连接成功并不证明上游互联网可用。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc791.html\" target=\"_blank\" rel=\"noopener noreferrer\">网络寻址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持IP根据源地址与目的地址传送数据报，不提供端到端可靠送达保证。 IPv4历史规范，仅借其寻址与尽力交付概念；不宣称全部现代实现细节。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6269.html\" target=\"_blank\" rel=\"noopener noreferrer\">共享地址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持多个设备或用户共享一个公网IPv4地址，因此仅凭IP判断是否同一人或限制访问，可能把多人一起算进去。 共享地址不能单独确定自然人；IPv6不必采用相同共享方式。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc1034.html\" target=\"_blank\" rel=\"noopener noreferrer\">名称与查询\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持分布式名称系统提供名称到资源记录的查询，并允许缓存。 名称查询和网页内容传输不同；更新受缓存寿命影响。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">有序传输\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持TCP为应用提供可靠有序的字节流，并用确认和重传处理丢失。 接收端取得数据，不等于网站保存了订单，也不等于朋友读了消息。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">网页请求\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持网页由客户端发出请求、服务端返回响应，常涉及多项资源与中间服务。 请求不只一种协议版本；页面显示不等于全部业务完成。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security\" target=\"_blank\" rel=\"noopener noreferrer\">传输保护\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持TLS保护通信内容并支持认证连接对端。 不证明网站经营者可信，也不使地址和所有元数据隐形。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies\" target=\"_blank\" rel=\"noopener noreferrer\">识别一次访问\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持浏览器可保存并在后续请求发送Cookie，网站可用它关联会话。 同一账号可跨IP，清Cookie不删除服务器账号记录。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API/Connectivity\" target=\"_blank\" rel=\"noopener noreferrer\">实时连接\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持实时通信需要协调候选路径，直接连接不可用时可采用中继。 视频通话不必总经过业务服务器，也不必总是点对点。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321.html\" target=\"_blank\" rel=\"noopener noreferrer\">异步送达\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持邮件可由服务器接收、存储和继续转发，接收确认不等于人已读。 用邮件支撑存储转发模型，不断言所有聊天产品内部相同。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developer.apple.com/documentation/usernotifications/setting-up-a-remote-notification-server\" target=\"_blank\" rel=\"noopener noreferrer\">通知入口\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持应用服务可经APNs向设备发送通知，由设备系统处理并交给应用。 通知和完整消息取用是不同工作；平台实现不同。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9111.html\" target=\"_blank\" rel=\"noopener noreferrer\">重复取用\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持缓存能复用已存响应，但需要按新鲜度与验证规则使用。 副本可能过期；个性化或敏感内容不能随意共享缓存。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://tailscale.com/docs/features/exit-nodes\" target=\"_blank\" rel=\"noopener noreferrer\">上网出口\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持普通覆盖网络只连接成员设备；选择出口节点才把公共上网流量经那个出口送出。 不是所有VPN连接都会改变全部应用的公网出口。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.apple.com/guide/mac-help/set-up-a-vpn-connection-on-mac-mchlp2963/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Mac配置入口\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持Mac可导入提供的VPN配置，或按提供者要求在网络设置手动建立连接。 专用客户端与内置VPN支持不完全相同，菜单因系统版本变化。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-geolocation-risk-data-maxmind\" target=\"_blank\" rel=\"noopener noreferrer\">地区线索\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持IP地理数据是有误差的区域估计，代理出口可能与实际用户位置不同。 不能定位个人家庭或用一次地区跳变证明账号被盗。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/ip-anonymizer-risk-data-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">代理来源识别\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持风控产品可以识别部分已知VPN或其他代理地址；合法隐私用途也存在。 识别不是全知，也不能把使用VPN等同作弊。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://support.maxmind.com/knowledge-base/articles/device-inputs-minfraud\" target=\"_blank\" rel=\"noopener noreferrer\">多线索风险判断\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持风险判断可同时接收公网IP、浏览器和会话资料；读取到错误中间节点IP会影响判断。 厂商公开输入不代表任何特定平台完整规则。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://developers.cloudflare.com/waf/rate-limiting-rules/parameters/\" target=\"_blank\" rel=\"noopener noreferrer\">按来源计数\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持按IP计数会聚合共享出口的请求，可以结合会话等特征降低识别歧义。 Cookie缺失也会形成合并计数；不提供通用安全阈值。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">出站与入站\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持NAT网关可允许内部实例访问外部，同时不允许外部主动建立连接到内部实例。 云端公开服务还需要路由、接收入口、权限和运行服务。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8200.html\" target=\"_blank\" rel=\"noopener noreferrer\">IPv6中的接口与地址\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持地址关联接口的解释，未展开协议字段。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"https://tailscale.com/docs/how-to/quickstart\" target=\"_blank\" rel=\"noopener noreferrer\">Tailscale开始步骤\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：支持自有设备加入私有连接的示范，实际资格与设备结果需本人核对。\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-2\">正文怎样处理不确定性\u003c/h2>\n\u003cp>基础协议只支持所解释的共同机制，不代表每种当前设备的全部参数。厂商文档说明厂商公开的能力，不证明其他平台使用相同风控规则。名称、模式和菜单可能随版本变化；实际配置以提供者说明为准。\u003c/p>\n\u003cp>IP地区是估计，网络与账号限制需要多条证据。没有统一的“纯净IP”信任保证，也没有完全匿名的VPN承诺。\u003c/p>\n\u003ch2 id=\"section-3\">网址与浏览器行为参考资料\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_URL\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：网址结构\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://www.rfc-editor.org/rfc/rfc3986.html\" target=\"_blank\" rel=\"noopener noreferrer\">URI语法\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：组件和相对引用。资源、参数的业务含义仍由具体应用决定。\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP语义\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：访问方式、主机与协议状态；不把协议回答等同业务成功。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：域名层级\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://publicsuffix.org/learn/\" target=\"_blank\" rel=\"noopener noreferrer\">公用后缀\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：名称树和可注册边界。同一父域名下的子域名，不保证使用同一服务器或同一登录系统。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Glossary/Origin\" target=\"_blank\" rel=\"noopener noreferrer\">浏览器来源定义\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>、\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy\" target=\"_blank\" rel=\"noopener noreferrer\">同源规则\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies\" target=\"_blank\" rel=\"noopener noreferrer\">Cookie\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：不同来源、安全边界和会话发送范围。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/URI/Reference/Fragment\" target=\"_blank\" rel=\"noopener noreferrer\">片段\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>、\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections\" target=\"_blank\" rel=\"noopener noreferrer\">跳转\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>与\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Host\" target=\"_blank\" rel=\"noopener noreferrer\">主机信息\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：浏览器定位、继续访问和多站点入口。\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9000.html\" target=\"_blank\" rel=\"noopener noreferrer\">QUIC规范\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：只用来解释UDP之上仍可安排恢复和保护，没有把旧TCP简化顺序说成所有网页唯一实现。\u003c/li>\n\u003c/ul>\n\u003cp>所有商品站、编号、订单状态与小林经历均为虚构教学场景。它们帮助把规范与日常现象连接，不是特定平台实测；参数名也不是可复制到任意网站的操作命令。\u003c/p>\n","text":"想核对原理，去哪里看？ 正文用日常语言说明通信过程；需要核对原理时，可以查下面的一手资料。图解与故事是教学示意，虚构案例不代表任何产品的真实内部设计或实际结果。资料核对日期为2026年10月7日。 阅读资料按用途查找 - 网络的网络：支持互联网把不同网络相互连接；网页是使用这种连接的服务。 本文简化基础设施；实际光纤、移动与卫星路径不全相同。 - 近处的无线接入：支持Wi-Fi通过无线电在附近设备间传递信息。 无线连接成功并不证明上游互联网可用。 - 网络寻址：支持IP根据源地址与目的地址传送数据报，不提供端到端可靠送达保证。 IPv4历史规范，仅借其寻址与尽力交付概念；不宣称全部现代实现细节。 - 共享地址：支持多个设备或用户共享一个公网IPv4地址，因此仅凭IP判断是否同一人或限制访问，可能把多人一起算进去。 共享地址不能单独确定自然人；IPv6不必采用相同共享方式。 - 名称与查询：支持分布式名称系统提供名称到资源记录的查询，并允许缓存。 名称查询和网页内容传输不同；更新受缓存寿命影响。 - 有序传输：支持TCP为应用提供可靠有序的字节流，并用确认和重传处理丢失。 接收端取得数据，不等于网站保存了订单，也不等于朋友读了消息。 - 网页请求：支持网页由客户端发出请求、服务端返回响应，常涉及多项资源与中间服务。 请求不只一种协议版本；页面显示不等于全部业务完成。 - 传输保护：支持TLS保护通信内容并支持认证连接对端。 不证明网站经营者可信，也不使地址和所有元数据隐形。 - 识别一次访问：支持浏览器可保存并在后续请求发送Cookie，网站可用它关联会话。 同一账号可跨IP，清Cookie不删除服务器账号记录。 - 实时连接：支持实时通信需要协调候选路径，直接连接不可用时可采用中继。 视频通话不必总经过业务服务器，也不必总是点对点。 - 异步送达：支持邮件可由服务器接收、存储和继续转发，接收确认不等于人已读。 用邮件支撑存储转发模型，不断言所有聊天产品内部相同。 - 通知入口：支持应用服务可经APNs向设备发送通知，由设备系统处理并交给应用。 通知和完整消息取用是不同工作；平台实现不同。 - 重复取用：支持缓存能复用已存响应，但需要按新鲜度与验证规则使用。 副本可能过期；个性化或敏感内容不能随意共享缓存。 - 上网出口：支持普通覆盖网络只连接成员设备；选择出口节点才把公共上网流量经那个出口送出。 不是所有VPN连接都会改变全部应用的公网出口。 - Mac配置入口：支持Mac可导入提供的VPN配置，或按提供者要求在网络设置手动建立连接。 专用客户端与内置VPN支持不完全相同，菜单因系统版本变化。 - 地区线索：支持IP地理数据是有误差的区域估计，代理出口可能与实际用户位置不同。 不能定位个人家庭或用一次地区跳变证明账号被盗。 - 代理来源识别：支持风控产品可以识别部分已知VPN或其他代理地址；合法隐私用途也存在。 识别不是全知，也不能把使用VPN等同作弊。 - 多线索风险判断：支持风险判断可同时接收公网IP、浏览器和会话资料；读取到错误中间节点IP会影响判断。 厂商公开输入不代表任何特定平台完整规则。 - 按来源计数：支持按IP计数会聚合共享出口的请求，可以结合会话等特征降低识别歧义。 Cookie缺失也会形成合并计数；不提供通用安全阈值。 - 出站与入站：支持NAT网关可允许内部实例访问外部，同时不允许外部主动建立连接到内部实例。 云端公开服务还需要路由、接收入口、权限和运行服务。 - IPv6中的接口与地址：支持地址关联接口的解释，未展开协议字段。 - Tailscale开始步骤：支持自有设备加入私有连接的示范，实际资格与设备结果需本人核对。 正文怎样处理不确定性 基础协议只支持所解释的共同机制，不代表每种当前设备的全部参数。厂商文档说明厂商公开的能力，不证明其他平台使用相同风控规则。名称、模式和菜单可能随版本变化；实际配置以提供者说明为准。 IP地区是估计，网络与账号限制需要多条证据。没有统一的“纯净IP”信任保证，也没有完全匿名的VPN承诺。 网址与浏览器行为参考资料 - MDN：网址结构与URI语法：组件和相对引用。资源、参数的业务含义仍由具体应用决定。 - HTTP语义：访问方式、主机与协议状态；不把协议回答等同业务成功。 - MDN：域名层级与公用后缀：名称树和可注册边界。同一父域名下的子域名，不保证使用同一服务器或同一登录系统。 - 浏览器来源定义、同源规则与Cookie：不同来源、安全边界和会话发送范围。 - 片段、跳转与主机信息：浏览器定位、继续访问和多站点入口。 - QUIC规范：只用来解释UDP之上仍可安排恢复和保护，没有把旧TCP简化顺序说成所有网页唯一实现。 所有商品站、编号、订单状态与小林经历均为虚构教学场景。它们帮助把规范与日常现象连接，不是特定平台实测；参数名也不是可复制到任意网站的操作命令。","outline":[{"id":"section-1","title":"阅读资料按用途查找","depth":2},{"id":"section-2","title":"正文怎样处理不确定性","depth":2},{"id":"section-3","title":"网址与浏览器行为参考资料","depth":2}]}]}</script>
<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('knowledge-data').textContent),pages=data.pages,byId=new Map(pages.map(p=>[p.id,p])),groupById=new Map(data.groups.map(g=>[g.id,g]));
const main=document.getElementById('main'),nav=document.getElementById('navigation'),side=document.getElementById('sidebar'),dialog=document.getElementById('search-dialog'),input=document.getElementById('search-input'),results=document.getElementById('search-results');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=p=>p.title.split('：')[0],groupName=p=>groupById.get(p.group)?.name||(p.group==='orientation'?'整体地图':'概念与资料');
const store={get(key,fallback){try{return JSON.parse(localStorage.getItem('nwm.'+key))??fallback}catch{return fallback}},set(key,value){try{localStorage.setItem('nwm.'+key,JSON.stringify(value))}catch{}}};
let current='home',resumeTarget=null,scrollTimer=null,lastTrigger=null,restoring=false,menuPosition=0;
let fontSize=store.get('font',17);fontSize=Number.isFinite(fontSize)?Math.min(21,Math.max(15,fontSize)):17;
document.documentElement.style.setProperty('--article-size',fontSize+'px');
nav.innerHTML=`<a class="nav-home" href="#/home">知识地图</a><a class="nav-home" href="#/world-map">先看整张地图</a>`+data.groups.map((g,i)=>`<section class="nav-group"><h2><span class="mono">${String(i+1).padStart(2,'0')}</span>${esc(g.name)}</h2>${pages.filter(p=>p.group===g.id).map(p=>`<a href="#/${p.id}">${esc(short(p))}</a>`).join('')}</section>`).join('')+`<section class="nav-group"><h2>概念与资料</h2><a class="nav-reference" href="#/glossary">概念索引</a><a class="nav-reference" href="#/sources">阅读资料与知识边界</a></section>`;
function closeMenu(){const wasOpen=side.classList.contains('open');side.classList.remove('open');document.getElementById('backdrop').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');document.body.style.overflow='';if(innerWidth<=850){side.inert=true;side.setAttribute('aria-hidden','true')}if(wasOpen)scrollTo(0,menuPosition)}
function openMenu(){menuPosition=scrollY;savePosition();side.inert=false;side.removeAttribute('aria-hidden');side.classList.add('open');document.getElementById('backdrop').classList.add('open');document.getElementById('menu-button').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';document.getElementById('menu-close').focus({preventScroll:true})}
function sizeMenu(){if(innerWidth>850){side.inert=false;side.removeAttribute('aria-hidden');closeMenu()}else if(!side.classList.contains('open')){side.inert=true;side.setAttribute('aria-hidden','true')}}
sizeMenu();addEventListener('resize',sizeMenu);
document.getElementById('menu-button').addEventListener('click',openMenu);
document.getElementById('menu-close').addEventListener('click',()=>{closeMenu();document.getElementById('menu-button').focus()});
document.getElementById('backdrop').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch(e.target)}
 if(e.key==='Escape'&&side.classList.contains('open')){closeMenu();document.getElementById('menu-button').focus()}
 if(e.key==='Tab'&&side.classList.contains('open')){const items=[...side.querySelectorAll('a,button')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
function savePosition(){if(byId.has(current)&&!dialog.open&&!restoring&&!side.classList.contains('open')){const positions=store.get('positions',{});positions[current]=scrollY;store.set('positions',positions);store.set('last',current)}}
function home(){const last=byId.get(store.get('last',''));
 return `<div class="home"><section class="hero"><p class="eyebrow mono">A map for understanding networks</p><h1>网络世界模型</h1><p class="lead">点开链接、登录、换网络，<br>看清背后连起来的过程。</p><p class="sub">为第一次理解网络的人写。从打开一个网页开始，看浏览器怎样找网站、发请求、收回复，再理解登录、风控和VPN。</p><div class="hero-actions"><a class="primary" href="#/world-map">从这里开始 <span aria-hidden="true">↗</span></a><a class="secondary" href="#/glossary">按名词查找 <span aria-hidden="true">→</span></a></div>${last?`<a class="resume" href="#/${last.id}" data-resume>继续上次阅读：${esc(short(last))}<span aria-hidden="true">→</span></a>`:''}</section><section class="story-path" aria-label="连续阅读主线"><h2>先把一次上网串起来</h2><p>从点开链接到看到结果，看浏览器、网络和网站各做了什么。可以按顺序读，也可以直接进入。</p><div><a href="#/url">① 读网址</a><span aria-hidden="true">→</span><a href="#/ports">② 找服务</a><span aria-hidden="true">→</span><a href="#/browsing">③ 取页面</a><span aria-hidden="true">→</span><a href="#/transactions">④ 做操作</a><span aria-hidden="true">→</span><a href="#/identity">⑤ 认身份</a><span aria-hidden="true">→</span><a href="#/vpn">⑥ 改路径</a></div></section><section class="scene-shortcuts" aria-label="常用场景"><p>从你的问题出发</p><div><a href="#/url">读懂一条网址</a><a href="#/ports">IP与端口</a><a href="#/domains">域名与页面</a><a href="#/ip">IP是什么？</a><a href="#/setup">配置VPN</a><a href="#/risk">验证码与风控</a><a href="#/troubleshoot">打不开怎么办？</a><a href="#/remote">访问远程设备</a></div></section><div class="section-title"><h2>六段相互连接的工作</h2><p>完整目录，也可以随时跳读</p></div><div class="atlas">${data.groups.map((g,i)=>`<section class="map-card"><div class="map-card-head"><span class="map-number mono">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(g.name)}</h3><p class="map-question">${esc(g.question)}</p></div></div><div class="entries">${pages.filter(p=>p.group===g.id).map(p=>`<a href="#/${p.id}"><span>${esc(short(p))}</span><span aria-hidden="true">↗</span></a>`).join('')}</div></section>`).join('')}</div><p class="home-note">自由阅读，无需打卡或完成练习。阅读位置仅用于继续阅读。<br><a href="#/sources">阅读资料与知识边界</a></p></div>`;
}
function article(p){const core=pages.filter(x=>x.group!=='reference'),i=core.findIndex(x=>x.id===p.id),prev=core[i-1],next=core[i+1];
return `<div class="reader"><article class="article" data-article="${p.id}"><header class="article-head"><p class="eyebrow">${esc(groupName(p))}</p><h1>${esc(p.title)}</h1></header><div class="article-body">${p.html}</div><section class="related"><h2>沿着关系继续读</h2><div class="related-links">${p.related.map(id=>byId.get(id)).filter(Boolean).map(x=>`<a href="#/${x.id}">${esc(short(x))}<span aria-hidden="true">→</span></a>`).join('')}</div></section><nav class="reader-footer" aria-label="建议阅读次序">${prev?`<a href="#/${prev.id}">← ${esc(short(prev))}</a>`:'<a href="#/home">← 回到知识地图</a>'}${next?`<a href="#/${next.id}">${esc(short(next))} →</a>`:'<a href="#/home">回到知识地图 →</a>'}</nav><p class="article-note">这些概念帮助理解系统；具体实现需要结合对应文档与运行证据。</p></article><aside class="outline" aria-label="文章大纲"><h2>本篇内容</h2>${p.outline.filter(x=>x.title!=='相关概念').map(x=>`<a href="#/${p.id}" data-section="${x.id}">${esc(x.title)}</a>`).join('')}<a href="#/home" style="margin-top:26px">← 返回地图</a></aside></div>`;
}
function render(){clearTimeout(scrollTimer);savePosition();restoring=true;closeMenu();let id='home';try{id=decodeURIComponent(location.hash.replace(/^#\//,'')||'home')}catch{}current=byId.has(id)?id:'home';const p=byId.get(current);
 main.innerHTML=p?article(p):home();document.title=p?short(p)+' · 网络世界模型':'网络世界模型';document.getElementById('breadcrumb').textContent=p?'知识地图 / '+groupName(p):'知识地图';
 nav.querySelectorAll('a').forEach(a=>a.getAttribute('href')===`#/${current}`?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 const target=resumeTarget===current?store.get('positions',{})[current]||0:0;resumeTarget=null;requestAnimationFrame(()=>{scrollTo(0,target);main.focus({preventScroll:true});restoring=false});if(p)store.set('last',p.id);
}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;
 if(a.dataset.section){e.preventDefault();document.getElementById(a.dataset.section)?.scrollIntoView({block:'start'});return}
 if(a.hasAttribute('data-resume'))resumeTarget=a.hash.slice(2);
 if(a.hash.startsWith('#/')){if(dialog.open)dialog.close();if(a.hash===location.hash){closeMenu();if(a.hasAttribute('data-resume'))scrollTo(0,store.get('positions',{})[current]||0);else scrollTo(0,0)}}
});
addEventListener('hashchange',render);addEventListener('beforeunload',savePosition);
addEventListener('scroll',()=>{document.getElementById('top-button').style.display=scrollY>600?'block':'none';clearTimeout(scrollTimer);scrollTimer=setTimeout(savePosition,180)},{passive:true});
document.getElementById('top-button').addEventListener('click',()=>scrollTo(0,0));
document.getElementById('font-smaller').addEventListener('click',()=>{fontSize=Math.max(15,fontSize-1);document.documentElement.style.setProperty('--article-size',fontSize+'px');store.set('font',fontSize)});
document.getElementById('font-larger').addEventListener('click',()=>{fontSize=Math.min(21,fontSize+1);document.documentElement.style.setProperty('--article-size',fontSize+'px');store.set('font',fontSize)});
document.getElementById('print-button').addEventListener('click',()=>window.print());
function openSearch(trigger){lastTrigger=trigger;closeMenu();if(!dialog.open)dialog.showModal();input.focus();search()}
document.querySelectorAll('[data-search]').forEach(b=>b.addEventListener('click',()=>openSearch(b)));
document.getElementById('search-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{if(lastTrigger&&!lastTrigger.closest('[inert]'))lastTrigger.focus()});
dialog.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();dialog.close()}});
dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
function highlight(text,q){if(!q)return esc(text);const i=text.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function search(){const q=input.value.trim(),lower=q.toLowerCase();
 if(!q){document.getElementById('search-status').textContent=`搜索全部 ${pages.length} 篇内容、概念索引与英文别名`;results.innerHTML='<div class="empty">试试：端口、子域名、网址参数、验证码、VPN…<br>也可以输入正文里的问题或关键词。</div>';return}
 const found=pages.map(p=>{const title=p.title.toLowerCase(),alias=p.aliases.join(' ').toLowerCase(),body=p.text.toLowerCase();return {p,score:(title.includes(lower)?20:0)+(alias.includes(lower)?10:0)+(body.includes(lower)?1:0)}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||pages.indexOf(a.p)-pages.indexOf(b.p));
 document.getElementById('search-status').textContent=`全库搜索 · 找到 ${found.length} 篇相关内容`;
 results.innerHTML=found.length?found.map(({p})=>{const i=p.text.toLowerCase().indexOf(lower);let snippet=p.text.slice(Math.max(0,i-35),Math.max(0,i-35)+145);return `<a class="result" href="#/${p.id}"><small>${esc(groupName(p))}</small><strong>${highlight(p.title,q)}</strong><p>${highlight(snippet,q)}${snippet.length>=145?'…':''}</p></a>`}).join(''):'<div class="empty">没有找到相关内容。可以缩短关键词，或使用概念的中文名。<br><a href="#/glossary" style="text-decoration:underline">打开概念索引 →</a></div>';
}
input.addEventListener('input',search);render();
})();
</script>
</body>
</html>
