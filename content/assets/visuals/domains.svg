<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 590" role="img"><title>域名树与实际接收入口的区别</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#427664"/></marker></defs><rect width="420" height="590" fill="#faf8f2"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#294d40;font-size:15px}.small{font-size:12px;fill:#667467}.title{font-size:21px;font-weight:600}.line{fill:none;stroke:#427664;stroke-width:2;marker-end:url(#a)}</style><text x="24" y="38" class="title">子域名可以用不同服务器</text><text x="24" y="66" class="small">同属example.com，服务器可以不同</text><circle cx="209" cy="103" r="24" fill="#dbe9de"/><text x="179" y="115" class="">com</text><circle cx="163" cy="177" r="24" fill="#dbe9de"/><text x="133" y="189" class="">example.com</text><circle cx="58" cy="277" r="24" fill="#dbe9de"/><text x="28" y="289" class="">shop</text><circle cx="195" cy="277" r="24" fill="#dbe9de"/><text x="165" y="289" class="">help</text><circle cx="344" cy="277" r="24" fill="#dbe9de"/><text x="314" y="289" class="">img</text><path class="line" d="M210 128V162"/><path d="M195 215V240H58V258M195 240V258M195 240H344V258" fill="none" stroke="#427664" stroke-width="2"/><text x="24" y="338" class="small">shop.example.com 等是不同主机名</text><path class="line" d="M58 354L148 400"/><path class="line" d="M194 354L172 400"/><path class="line" d="M344 354V400"/><rect x="99" y="410" width="116" height="88" rx="8" fill="#eee5cf" stroke="#b4aa82"/><path d="M117 454H197M117 470H197" stroke="#ac9f72"/><text x="107" y="441" class="small">共同服务入口</text><rect x="280" y="410" width="116" height="88" rx="8" fill="#eee5cf" stroke="#b4aa82"/><path d="M298 454H378M298 470H378" stroke="#ac9f72"/><text x="288" y="441" class="small">图片服务入口</text><text x="24" y="539" class="small">两个名字可共用入口，一个名字也可多地址</text><text x="24" y="563" class="small">example.com/shop 则是在同一主机下换路径</text></svg>