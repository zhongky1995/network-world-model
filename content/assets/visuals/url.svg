<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 710" role="img"><title>网址各段的分工</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#427664"/></marker></defs><rect width="420" height="710" fill="#faf8f2"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#294d40;font-size:15px}.small{font-size:12px;fill:#667467}.title{font-size:21px;font-weight:600}.line{fill:none;stroke:#427664;stroke-width:2;marker-end:url(#a)}</style><text x="24" y="38" class="title">一条网址，各段各有用途</text><text x="24" y="66" class="small">先找到网站，再请求具体内容</text><rect x="24" y="92" width="334" height="75" rx="9" fill="#dbe9e0"/><text x="40" y="119" class="">https://</text><text x="40" y="146" class="small">按受保护的网页方式访问</text><rect x="24" y="182" width="334" height="75" rx="9" fill="#dbe9e0"/><text x="40" y="209" class="">shop.example.com</text><text x="40" y="236" class="small">查询这个主机名对应的IP</text><rect x="24" y="272" width="334" height="75" rx="9" fill="#dbe9e0"/><text x="40" y="299" class="">:8443</text><text x="40" y="326" class="small">联系网站的8443端口</text><rect x="24" y="362" width="334" height="75" rx="9" fill="#f0e5cb"/><text x="40" y="389" class="">/products/42</text><text x="40" y="416" class="small">请求42号商品资源</text><rect x="24" y="452" width="334" height="75" rx="9" fill="#f0e5cb"/><text x="40" y="479" class="">?color=blue</text><text x="40" y="506" class="small">附上蓝色选择条件</text><rect x="24" y="542" width="334" height="75" rx="9" fill="#ebe3f0"/><text x="40" y="569" class="">#reviews</text><text x="40" y="596" class="small">浏览器滚动到评价区，或交给页面程序</text><text x="24" y="661" class="small">井号片段不直接作为HTTP请求目标发送</text><text x="24" y="683" class="small">页面程序仍可能读取它并另发请求</text><path d="M362 100H372V339H362" fill="none" stroke="#809986" stroke-width="2"/><text x="383" y="180" style="font-size:13px">联</text><text x="383" y="199" style="font-size:13px">系</text><text x="383" y="218" style="font-size:13px">入</text><text x="383" y="237" style="font-size:13px">口</text><path d="M362 370H372V519H362" fill="none" stroke="#809986" stroke-width="2"/><text x="383" y="417" style="font-size:13px">选</text><text x="383" y="436" style="font-size:13px">择</text><text x="383" y="455" style="font-size:13px">内</text><text x="383" y="474" style="font-size:13px">容</text><path d="M362 550H372V609H362" fill="none" stroke="#809986" stroke-width="2"/><text x="383" y="572" style="font-size:13px">本</text><text x="383" y="591" style="font-size:13px">地</text></svg>