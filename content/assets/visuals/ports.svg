<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" role="img"><title>IP与端口将通信交给设备上的服务</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#427664"/></marker></defs><rect width="420" height="600" fill="#faf8f2"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#294d40;font-size:15px}.small{font-size:12px;fill:#667467}.title{font-size:21px;font-weight:600}.line{fill:none;stroke:#427664;stroke-width:2;marker-end:url(#a)}</style><text x="24" y="38" class="title">同一设备，不同服务入口</text><text x="24" y="64" class="small">虚构照片设备 · 网络目标IP保持相同</text><rect x="116" y="111" width="280" height="369" rx="20" fill="#e4ebe2" stroke="#769784"/><circle cx="371" cy="135" r="5" fill="#61987f"/><text x="138" y="148" class="">192.168.1.20</text><path class="line" d="M24 215H143"/><rect x="146" y="188" width="75" height="54" rx="7" fill="#276655"/><text x="160" y="221" style="fill:white">8080</text><text x="238" y="208" class="">管理网页</text><text x="238" y="232" class="small">设置设备</text><path class="line" d="M24 307H143"/><rect x="146" y="280" width="75" height="54" rx="7" fill="#276655"/><text x="160" y="313" style="fill:white">9000</text><text x="238" y="300" class="">照片服务</text><text x="238" y="324" class="small">浏览照片</text><path class="line" d="M24 399H143"/><rect x="146" y="372" width="75" height="54" rx="7" fill="#276655"/><text x="160" y="405" style="fill:white">9200</text><text x="238" y="392" class="">无人接收</text><text x="238" y="416" class="small">不能自动打开内容</text><text x="24" y="521" class="">浏览器请求 → 到达设备 → 交给接收程序</text><text x="24" y="553" class="small">端口不是页面编号，也不是实体插孔</text><text x="24" y="575" class="small">程序要运行，网络和权限也要允许访问</text></svg>