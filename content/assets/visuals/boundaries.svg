<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" role="img"><title>浏览器、网络和网站怎样完成一次访问</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#427664"/></marker></defs><rect width="420" height="650" fill="#faf8f2"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#294d40;font-size:15px}.small{font-size:12px;fill:#667467}.line{fill:none;stroke:#427664;stroke-width:2;marker-end:url(#a)}</style><text x="24" y="38" font-size="21" font-weight="600">打开网页时，三部分一起工作</text><rect x="48" y="74" width="324" height="130" rx="14" fill="#dfe9df" stroke="#6d927e"/><rect x="61" y="88" width="298" height="90" fill="#fcfbf7"/><path d="M31 207H388L369 223H52Z" fill="#b5c8b8"/><text x="80" y="116">你的浏览器</text><text x="80" y="145" class="small">发请求 · 收回复 · 显示网页</text><path class="line" d="M140 232V290"/><path class="line" d="M279 290V232"/><path d="M70 315Q140 280 210 315T350 315" fill="none" stroke="#81a790" stroke-width="4"/><circle cx="105" cy="315" r="10" fill="#dce9de" stroke="#6b957d"/><circle cx="210" cy="315" r="10" fill="#dce9de" stroke="#6b957d"/><circle cx="315" cy="315" r="10" fill="#dce9de" stroke="#6b957d"/><text x="90" y="356">网络转送请求和回复</text><text x="62" y="381" class="small">按地址转送，不处理订单内容</text><path class="line" d="M140 400V450"/><path class="line" d="M279 450V400"/><rect x="62" y="468" width="296" height="103" rx="12" fill="#eee5cf" stroke="#b8ac81"/><text x="88" y="499">网站的服务器和程序</text><text x="88" y="527" class="small">核对账号 · 查询订单 · 发回结果</text><path d="M82 550H338" stroke="#c7bd9b"/><text x="24" y="608" class="small">浏览器请求订单，网站查出结果并回复</text><text x="24" y="631" class="small">能联系网站，不代表有权查看每笔订单</text></svg>